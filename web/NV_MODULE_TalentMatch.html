      '<div class="actions"><button type="button" class="danger" id="bSupprimer">' + esc(ST.sur.supprimer ? T('Toucher encore pour tout supprimer') : T('Tout supprimer')) + '</button></div></details>';

function rendrePied(){
  var h = '<label>' + esc(T('Langue')) + ' <select id="langue">' + Object.keys(LANGUES_UI).map(function(k){ return '<option value="' + k + '"' + (k === L ? ' selected' : '') + '>' + esc(LANGUES_UI[k].nom) + '</option>'; }).join('') + '</select></label>';

function rendre(){

/* ════════ LES GESTES ════════ */
function deuxTouchers(cle){ if(ST.sur[cle]){ delete ST.sur[cle]; return true; } ST.sur[cle] = true; rendre(); setTimeout(function(){ if(ST.sur[cle]){ delete ST.sur[cle]; rendre(); } }, 5000); return false; }
function geste(k, methode, chemin, corps, apercu, ok){
  if(ST.occupe[k]) return; ST.occupe[k] = true; rendre();
  var p = ST.apercu ? Promise.resolve(apercu()) : appeler(methode, chemin, corps, cleGeste(k));
  p.then(function(o){ delete ST.occupe[k]; finGeste(k); ok(o); }, function(e){ delete ST.occupe[k]; finGeste(k, e); toast(erreurTexte(e)); rendre(); });
}
function lireProfil(){
  var f = ST.form; if(!f || !$('fProfil')) return;
  ['competences', 'cherche', 'interets', 'langues', 'formats'].forEach(function(n){ f[n] = Array.prototype.map.call(document.querySelectorAll('#fProfil input[name="' + n + '"]:checked'), function(i){ return i.value; }); });
  f.autresPays = !!($('pAutres') && $('pAutres').checked); f.consent = !!($('pConsent') && $('pConsent').checked);
}
function enregistrer(){
  lireProfil(); var f = ST.form, m = (ST.cap && ST.cap.maxi) || {};
  if(!f.consent){ toast(T('Cochez votre accord pour continuer.')); var c = $('pConsent'); if(c) c.focus(); return; }
  if(!f.langues.length){ toast(T('Choisissez au moins une langue.')); return; }
  if(!f.competences.length && !f.cherche.length){ toast(T('Choisissez au moins un talent, ou ce que vous cherchez.')); return; }
  var trop = ['competences', 'cherche', 'interets', 'langues'].filter(function(n){ return m[n] && f[n].length > m[n]; })[0];
  if(trop){ toast(T('{0} choix au plus dans cette liste.', m[trop])); return; }
  var corps = {consentement:true, competences:f.competences, cherche:f.cherche, interets:f.interets, langues:f.langues, formats:f.formats, autresPays:f.autresPays, actif:ST.moi && ST.moi.profil ? ST.moi.profil.actif !== false : true};
  geste('profil', 'POST', RT + '/moi', corps, function(){ return {profil:Object.assign({}, corps)}; },
    function(o){ ST.moi = Object.assign({}, ST.moi || {}, {profil:o.profil}); ST.form = null; emit('tm_profil', {competences:f.competences.length}); toast(T('Votre profil de collaboration est enregistré.')); chargerSugg(); });
}
function trouverSugg(id){ return (ST.sugg || []).filter(function(s){ return s.personne && s.personne.id === id; })[0]; }
function demander(id){
  var s = trouverSugg(id); if(!s) return;
  var fmt = ($('dFormat') || {}).value, mot = String(($('dMot') || {}).value || '').trim();
  geste('d' + id, 'POST', RT + '/demandes', {personne:id, format:fmt, message:mot || undefined}, function(){ return {ok:true}; },
    function(){ emit('tm_demander', {format:fmt}); ST.demander = null; ST.dMot = ''; ST.sugg = (ST.sugg || []).filter(function(x){ return x !== s; });
      if(ST.apercu) ST.dem = Object.assign({}, demo().dem, {envoyees:[{id:'tm_apx', etat:'attente', format:fmt, personne:s.personne, expire:new Date(Date.now() + 14 * 864e5).toISOString()}].concat(demo().dem.envoyees)});
      toast(T('Votre demande est envoyée.')); rendre(); });
}
function masquer(id){
  geste('m' + id, 'POST', RT + '/masquer', {personne:id}, function(){ ST._masques = ST._masques || {}; ST._masques[id] = 1; return {ok:true}; },
    function(){ ST.sugg = (ST.sugg || []).filter(function(x){ return !(x.personne && x.personne.id === id); }); if(ST.moi) ST.moi.masques = (ST.moi.masques || 0) + 1; toast(T('Cette personne ne vous sera plus suggérée.')); rendre(); });
}
function bloquer(id){
  if(!deuxTouchers('b' + id)) return;
  geste('b' + id, 'POST', '/v1/users/' + encodeURIComponent(id) + '/block', {}, function(){ return {ok:true}; },
    function(){ emit('tm_bloquer', {}); ST.sugg = (ST.sugg || []).filter(function(x){ return !(x.personne && x.personne.id === id); }); toast(T('Cette personne est bloquée.')); rendre(); });
}
function repondre(id, oui){
  if(!oui && !deuxTouchers('n' + id)) return;                  /* un refus est définitif (90 jours) : deux touchers */
  geste('r' + id, 'POST', RT + '/demandes/' + encodeURIComponent(id) + '/repondre', {accepter:oui}, function(){
    var d = ST.dem, x = d.recues.filter(function(y){ return y.id === id; })[0]; d.recues = d.recues.filter(function(y){ return y.id !== id; }); if(oui && x) d.liens.unshift(Object.assign({}, x, {etat:'acceptee'})); return {ok:true}; },
    function(){ emit('tm_repondre', {accepter:oui}); toast(oui ? T('C’est une collaboration ! Vous pouvez commencer ensemble.') : T('C’est fait.')); if(ST.apercu) rendre(); else chargerDem(); });
}
function retirer(id){
  if(!deuxTouchers('r' + id)) return;
  geste('x' + id, 'POST', RT + '/demandes/' + encodeURIComponent(id) + '/retirer', {}, function(){ var d = ST.dem; d.liens = d.liens.filter(function(y){ return y.id !== id; }); d.envoyees = d.envoyees.filter(function(y){ return y.id !== id; }); return {ok:true}; },
    function(){ toast(T('C’est fait.')); if(ST.apercu) rendre(); else chargerDem(); });
}
function pause(){
  var p = ST.moi && ST.moi.profil; if(!p) return;
  geste('pause', 'POST', RT + '/moi/pause', {pause:!!p.actif}, function(){ return {profil:Object.assign({}, p, {actif:!p.actif})}; },
    function(o){ ST.moi.profil = o.profil; toast(o.profil.actif ? T('Votre profil est de nouveau visible.') : T('Votre profil est en pause.')); if(ST.vue === 'suggestions') chargerSugg(); else rendre(); });
}
function supprimer(){
  if(!deuxTouchers('supprimer')) return;

    function(){ emit('tm_supprimer', {}); ST.moi = {profil:null, demandesRecues:0, masques:0}; ST.form = null; ST.dem = {recues:[], envoyees:[], liens:[]}; toast(T('Votre profil de collaboration est supprimé.')); chargerSugg(); });
}

/* ════════ L'APERÇU (seulement sans serveur, ou serveur sans la fonction) ════════ */
function demo(){
  if(ST._demo) return ST._demo;
  var q = function(h, pays){ return {id:'u_' + h, handle:h, nom:'@' + h, pays:pays, drapeau:drapeau(pays)}; };

      {personne:q('ana.samba', 'BR'), competences:['danse'], langues:['pt', 'en'], formats:['chaine'], raisons:[{type:'il_sait', valeur:'danse'}, {type:'langue', valeur:'en'}, {type:'autre_pays', valeur:'BR'}]}],

      envoyees:[{id:'tm_ap2', sens:'envoyee', etat:'attente', format:'duo', personne:q('yuki_t', 'JP'), expire:j(9)}],

/* ════════ LE DÉMARRAGE ════════ */
function changerVue(v){ ST.sur = {}; ST.demander = null; if(v === 'demandes') return chargerDem(); if(v === 'profil') return chargerProfil(); return chargerSugg(); }
function demarrer(){
  poserLangue(langueDetectee());
  ST.apercu = !api();
  if(ST.apercu && !utilisateur()){ try{ window.NV_USER = {id:'demo', handle:'visiteur', prenom:'Aya', age:25, majeur:true, iso:'GN'}; }catch(e){} }
  var ctx = null;
  try{ ctx = JSON.parse(sessionStorage.getItem('nv_ctx_' + MOI) || 'null'); sessionStorage.removeItem('nv_ctx_' + MOI); }catch(e){}
  rendre();
  chargerCap().catch(function(e){ ST.cap = null; ST.etat = e && e.status && e.status < 500 ? 'indisponible' : navigator.onLine === false ? 'horsligne' : 'erreur'; })
    .then(function(){ if(!ST.cap) return rendre(); return chargerMoi().then(function(){
      if(ctx && (ctx.vue === 'demandes' || ctx.vue === 'profil')) return changerVue(ctx.vue);
      return chargerSugg(); }); });
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if(!b) return;
    var a = function(k){ return b.getAttribute(k); };
    if(a('data-vue')) changerVue(a('data-vue'));
    else if(a('data-demander')){ ST.demander = a('data-demander'); rendre(); var s = $('dFormat'); if(s) s.focus(); }
    else if(a('data-annuler')){ ST.demander = null; ST.dMot = ''; rendre(); }
    else if(a('data-masquer')) masquer(a('data-masquer'));
    else if(a('data-bloquer')) bloquer(a('data-bloquer'));
    else if(a('data-repondre')) repondre(a('data-repondre'), a('data-oui') === '1');
    else if(a('data-retirer')) retirer(a('data-retirer'));
    else if(a('data-chaine')){ emit('tm_ouvrir', {vers:'SansFrontieres'}); ouvrir('SansFrontieres', {vue:'commencer', inviter:a('data-chaine'), depuis:MOI}); }
    else if(a('data-duo')){ emit('tm_ouvrir', {vers:'Cote'}); ouvrir('Cote', {invite:a('data-duo'), depuis:MOI}); }
    else if(a('data-profil')){ var pp = a('data-profil').split('|'); ouvrir('Profile', {id:pp[0] || undefined, handle:pp[1] || undefined, depuis:MOI}); }
    else if(b.id === 'bReprendre' || b.id === 'bPause') pause();
    else if(b.id === 'bVider') geste('vider', 'POST', RT + '/masques/vider', {}, function(){ ST._masques = {}; return {ok:true}; }, function(){ ST.moi.masques = 0; toast(T('C’est fait.')); rendre(); });
    else if(b.id === 'bSupprimer') supprimer();
  });
  document.addEventListener('change', function(ev){
    var t = ev.target; if(!t) return;
    if(t.id === 'langue'){ var l = t.value; if(!LANGUES_UI[l]) return; ecrire('nv_ui_langue', l); poserLangue(l); lireProfil(); rendre(); var s = $('langue'); if(s) s.focus(); }
    else if(t.closest && t.closest('#fProfil')) lireProfil();
  });
  document.addEventListener('input', function(ev){ var t = ev.target; if(t && t.id === 'dMot') ST.dMot = t.value; });
  document.addEventListener('toggle', function(ev){ var d = ev.target; if(d && d.classList && d.classList.contains('danger-zone') && !d.open) delete ST.sur.supprimer; }, true);
  document.addEventListener('submit', function(ev){
    var f = ev.target; if(!f) return; ev.preventDefault();
    if(f.id === 'fProfil') enregistrer();
    else if(f.getAttribute('data-form-demande')) demander(f.getAttribute('data-form-demande'));
  });
  window.NVTalentMatch = {etat:function(){ return {etat:ST.etat, vue:ST.vue, apercu:ST.apercu, repli:ST.repli, suggestions:(ST.sugg || []).length, profil:!!(ST.moi && ST.moi.profil), langue:L}; }};
}

/* ════════ La présentation ════════ */
var _rendrePres = rendre;
rendre = function(){ var r = _rendrePres.apply(this, arguments); presenterNouveaute(); return r; };
function presenterNouveaute(){
  if(!window.NVPresente) return;
  var ferme = !ST.cap && !ST.apercu && (ST.etat === 'sansserveur' || ST.etat === 'indisponible');

  NVPresente.poser({cle:'talentmatch', scene:'talentmatch', couleurs:['#9b7bff', '#16e0d4'], ouvert:ferme, apres:$('etat'), titreFilm:T('Les rencontres de talents'),
    intro:ferme ? T('Bientôt ouvert ici. Voici ce qui vous attend.') : '', comment:T('Comment ça marche'), protege:T('Ce qui vous protège'),
    etapes:[T('Choisissez vos talents, vos langues et ce que vous cherchez.'), T('L’assistant vous suggère des partenaires et dit pourquoi.'), T('Proposez une collaboration, si vous le voulez.')],
    protections:[T('Rien sans votre accord : vous choisissez d’être suggéré.'), T('Jamais votre âge, votre genre ni votre origine pour choisir.'), T('Pas pour moi, bloquer, pause ou tout supprimer, à tout moment.')]});
}

/* ════════ L'aperçu en repli : serveur sans la fonction → aperçu marqué « Aperçu », rien n'est envoyé ════════ */
function repliApercu(){ if(ST.cap || ST.apercu) return false; ST.apercu = true; ST.repli = true;
  if(!utilisateur()){ try{ window.NV_USER = {id:'demo', handle:'visiteur', prenom:'Aya', age:25, majeur:true, iso:'GN'}; }catch(e){} }
  return true; }
(function(){ var cc0 = chargerCap;
  chargerCap = function(){ return cc0().then(function(){ if(repliApercu()) return cc0(); }, function(e){ if(repliApercu()) return cc0(); throw e; }); }; })();

demarrer();
})();

</script>

  }
  /* le module ouvre lui-même la vidéo s'il le sait ; sinon le bandeau */
  var debut = Date.now();
  /* « Relever le défi » (21 nov. 2026) : le module montre son défi (ou ses épreuves) avec ce qu'il faut pour participer ;
     chaque module qui sait mieux le faire range sa fonction dans window.NV_RELEVER_H (fonction(info) → true). */
  var RELEVER = {
    ChallengeUniverse:function(){ var a = window.NVUniversAPI; if(a && a.ouvrirDefi && info.defi){ a.ouvrirDefi(info.defi); return true; } },
    LoveUniverse:function(){ var a = window.NVLoveUniverse; if(a && a.defi && info.defi){ a.defi(info.defi); return true; } },
    ViralStorm:function(){ var a = window.NVViralStorm; if(a && a.ouvrirDefi && info.defi){ a.ouvrirDefi(info.defi); return true; } },
    Battle:function(){ var a = window.NVBattle; if(a && a.defier){ a.defier(); return true; } },
    MissMaster:function(){ var a = window.NVMissMaster; if(a && a.montrer){ a.montrer('epreuves'); return true; } },
    Artistes:function(){ var a = window.NVArtistes; if(a && a.montrer){ a.montrer('epreuves'); return true; } },
    CinemaWorld:function(){ var a = window.NVCinemaWorld; if(a && a.montrer){ a.montrer('defis'); return true; } },
    Arena:function(){ var a = window.NVArenaAPI; if(a && a.montrer){ a.montrer('arene'); return true; } },
    ArenaArts:function(){ var a = window.NVArenaArts; if(a && a.open){ a.open('arts'); return true; } }
  };
  function essayerRelever(){
    var h = window.NV_RELEVER_H || [];
    for(var i = 0; i < h.length; i++){ try{ if(h[i](info) === true) return true; }catch(e){} }
    try{ return RELEVER[MOD] ? RELEVER[MOD].call(null, info) === true : false; }catch(e){ return false; }
  }
  function essayer(){
    if(info.action === 'relever'){
      /* le bandeau dit toujours qu'on relève ce défi (avec « Revoir la vidéo ») ; le module montre en plus son défi s'il le sait */
      var fait = essayerRelever();
      if(!fait && Date.now() - debut < 6000){ setTimeout(essayer, 500); return; }
      if(document.body) bandeau(); return;
    }
    var h = window.NV_DEPUIS_IRIS_H || [];
    for(var i = 0; i < h.length; i++){ try{ var r = h[i](info); if(r === true){ info.ouvert = true; return; } }catch(e){} }
    var e = Date.now() - debut;
    if(e < 8000 && (h.length || e < 1500)){ setTimeout(essayer, 500); return; }     /* aucun module qui sait l'ouvrir : le bandeau tout de suite */
    if(document.body) bandeau();
  }
  function partir(){ setTimeout(essayer, 400); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', partir); else partir();
}catch(e){ /* rien */ } })();
</script><!--/NV_DEPUIS_IRIS-->
