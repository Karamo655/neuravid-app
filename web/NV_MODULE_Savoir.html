<title>Le Savoir-faire · NEURAVID</title>
<style>
/* Le Savoir-faire qui paie : tutoriels, fiche pratique, mercis (17 novembre 2026).
   Aucune ressource extérieure : les vidéos viennent des serveurs (univers et publication). */
:root{
  --nuit:#140b33; --nuit2:#1c1147; --alv:#241657; --craie:#f6f1ff; --brume:rgba(236,228,255,.74); --trait:rgba(255,255,255,.16);
  --or:#ffc531; --argent:#d7dbe6; --bronze:#e0995a; --cyan:#16e0d4; --rose:#ff4f9e; --rouge:#ff7a7a;
  --hex:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--nuit);color:var(--craie);font:16px/1.45 var(--sans);min-height:100vh}
main{max-width:768px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.hex{width:34px;height:30px;flex:0 0 auto;clip-path:var(--hex);background:linear-gradient(135deg,var(--cyan),#6c2bd9);display:grid;place-items:center}
.hex i{width:14px;height:14px;border-radius:50%;background:var(--nuit);box-shadow:inset 0 0 0 4px var(--craie)}
h1{font-size:1.2rem;margin:0;line-height:1.2}
h2{font-size:1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:12px;height:11px;clip-path:var(--hex);background:var(--cyan);flex:0 0 auto}
.sous{margin:0;color:var(--brume);font-size:.88rem}
.apercu{display:inline-block;margin-inline-start:6px;padding:1px 8px;border-radius:999px;background:var(--or);color:#2a1a00;font-size:.75rem;font-weight:800;vertical-align:middle}
#etat{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:var(--nuit2);border:1px solid var(--trait);font-size:.9rem}
#etat.hl{border-color:var(--or)}
#etat.ok{border-color:rgba(22,224,212,.5)}
section{background:var(--nuit2);border:1px solid var(--trait);border-radius:14px;padding:12px 14px;margin:0 0 12px}
ul{list-style:none;margin:0;padding:0}
li{padding:7px 0;border-top:1px solid var(--trait)}
li:first-child{border-top:0}
.l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.d{color:var(--brume);font-size:.86rem}

.puce.an{color:var(--rouge);border-color:var(--rouge)}
.puce.re{color:var(--or);border-color:var(--or)}
.puce.co{color:var(--cyan);border-color:var(--cyan)}
.chiffres{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.chiffres b{display:block;font-size:1.25rem}
.chiffres span{font-size:.75rem;color:var(--brume)}
.med{display:inline-flex;align-items:center;gap:3px;margin-inline-end:8px;white-space:nowrap}
.med i{width:12px;height:11px;clip-path:var(--hex);display:inline-block}
.or i{background:var(--or)} .ar i{background:var(--argent)} .br i{background:var(--bronze)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:5px 4px;text-align:center;border-top:1px solid var(--trait)}
td:first-child,th:first-child{text-align:start}
th{font-size:.75rem;color:var(--brume);font-weight:600;border-top:0}
button,select,.lien{font:inherit;color:inherit}
button{min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--trait);background:var(--alv);cursor:pointer}
button:focus-visible,select:focus-visible,.lien:focus-visible{outline:2px solid var(--or);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.actions button{flex:1 1 140px}
.lien{background:none;border:0;padding:6px 0;min-height:36px;color:var(--cyan);text-decoration:underline;cursor:pointer;font-size:.88rem}
.jours button{min-height:40px;margin-block:4px 0;margin-inline:0 6px;padding:6px 10px;font-size:.88rem}
.jours button[aria-current="true"]{border-color:var(--or)}
footer{color:var(--brume);font-size:.8rem;display:grid;gap:8px;margin-top:4px}
footer label{display:flex;gap:8px;align-items:center}
select{min-height:40px;border-radius:10px;background:var(--alv);border:1px solid var(--trait);padding:4px 8px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--craie);color:var(--nuit);padding:8px 14px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.vide{color:var(--brume);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[dir="rtl"] .l1{direction:rtl}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{min-height:40px;padding:4px 12px;font-size:.88rem;border-radius:999px}
.chips button[aria-pressed="true"]{border-color:var(--or);color:var(--or)}
.form{display:grid;gap:10px}

input,textarea{font:inherit;color:var(--craie);background:var(--alv);border:1px solid var(--trait);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.btn-or{background:linear-gradient(135deg,var(--or),#ff9f1c);color:#2a1a00;border:0;font-weight:800}

canvas.affiche{background:var(--alv)}

.materiel .q{color:var(--brume);font-size:.85rem;margin-inline-start:auto}

.prise{width:100%;max-width:220px;aspect-ratio:9/16;border-radius:12px;background:#000;display:block;margin:0 auto 10px}
.retour{margin:0 0 10px}
.nv-cree{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;color:var(--or)}
.nv-cree i{width:11px;height:10px;clip-path:var(--hex);background:var(--or);display:inline-block}
.vise{outline:2px solid var(--or);outline-offset:4px;border-radius:12px}

/* ══ Identité de la nouveauté (17 nov. 2026, étape 3 du plan des 8 nouveautés) : ses couleurs, son bandeau, ses cartes ══ */
:root{--id1:#16e0d4;--id2:#ffc531}
header{position:relative;padding-bottom:13px;margin-bottom:8px}
header::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--id1),var(--id2) 55%,transparent)}
[dir=rtl] header::after{background:linear-gradient(270deg,var(--id1),var(--id2) 55%,transparent)}
.hex{background:linear-gradient(135deg,var(--id1),var(--id2));box-shadow:0 0 18px color-mix(in srgb,var(--id1) 45%,transparent)}
h2::before{background:linear-gradient(135deg,var(--id1),var(--id2))}
section{background:linear-gradient(180deg,color-mix(in srgb,var(--id1) 8%,transparent),transparent 80px),var(--nuit2)}

/* le savoir-faire : l'image du tutoriel dans un hexagone, sa durée et son niveau */
.vign{position:relative;width:104px}
.vign .vd{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);padding:1px 8px;border-radius:999px;background:rgba(10,6,30,.82);color:var(--craie);font-size:.72rem;font-weight:800;white-space:nowrap;pointer-events:none}
.vign .niv{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:3px;pointer-events:none}
.vign .niv i{width:10px;height:9px;clip-path:var(--hex);background:rgba(255,255,255,.28)}
.vign .niv i.on{background:var(--id2)}
.affiche{box-shadow:none;background:linear-gradient(160deg,color-mix(in srgb,var(--id1) 40%,#000),#000)}
.cats button[aria-pressed="true"]{background:linear-gradient(135deg,var(--id1),var(--id2));color:#05302d}
</style>

   ── POURQUOI ─────────────────────────────────────────────────────────
   Chaque défi a son propre enregistreur. Il fonctionne, il grave les
   filtres et le logo dans l'image — mais il s'arrête là. La caméra du
   Studio sait faire beaucoup plus, et elle existe déjà :

       double caméra (médaillon, haut/bas, gauche/droite)

   moins d'outils que quelqu'un qui filme pour rien.

   ── LA DIFFICULTÉ RÉELLE ─────────────────────────────────────────────
   Le Studio est un AUTRE fichier. Changer de page perd tout : le
   contexte du défi, et surtout la vidéo elle-même — un Blob ne
   traverse pas une navigation.

   IndexedDB, si. C'est la seule voie, et Create s'en sert déjà pour
   son relais. On l'emprunte :

       1. le défi range son contexte et ouvre le Studio
       2. la personne filme avec tous les outils
       3. le Studio range la vidéo dans IndexedDB et revient au défi
       4. le défi la reprend et la présente comme sa propre prise

  var x = demoTutos().filter(function(y){ return y.id === id; })[0] || (ST.moi && (ST.moi.tutos || []).filter(function(y){ return y.id === id; })[0]) || {categorie:'autre'};
  var g = c.getContext('2d'); if(!g) return; var W = c.width, H = c.height, k = (String(x.categorie).charCodeAt(0) * 37) % 360;
  var gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, 'hsl(' + k + ',65%,40%)'); gr.addColorStop(1, 'hsl(' + ((k + 70) % 360) + ',70%,16%)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1;
  for(var i = 0; i < 9; i++){ var cx = (i % 3 + .5) * W / 3, cy = (Math.floor(i / 3) + .7) * H / 3.4, r = W / 9; g.beginPath(); for(var a = 0; a < 6; a++){ var t = Math.PI / 3 * a; g.lineTo(cx + r * Math.cos(t), cy + r * Math.sin(t)); } g.closePath(); g.stroke(); }
  if(ST.apercu){ g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, H - 22, W, 22); g.fillStyle = '#ffc531'; g.textAlign = 'center'; g.font = 'bold 12px sans-serif'; g.fillText(T('Aperçu'), W / 2, H - 7); }
}

/* ════════ LE DÉMARRAGE ════════ */
function changerVue(v){
  ST.sur = {};
  if(v === 'moi') return chargerMoi();
  ST.vue = v === 'creer' ? 'creer' : 'liste';
  if(v !== 'creer'){ ST.edition = null; if(!ST.items.length) return chargerListe(); }
  rendre(); var b = v === 'liste' ? $('hListe') : document.querySelector('[data-vue="' + v + '"]'); if(b) b.focus();
}
function demarrer(){
  poserLangue(langueDetectee());
  /* 17 nov. 2026 (Karamo) : sans serveur branché, la page montre son aperçu (repère « Aperçu »), aussi dans l'application,
     comme les autres modules ; dès qu'un serveur est branché, seul le vrai contenu est montré. */
  ST.apercu = !api();
  if(ST.apercu && !utilisateur()){ try{ window.NV_USER = {id:'demo', handle:'visiteur', prenom:'Aya', age:25, majeur:true, iso:'GN'}; }catch(e){} }
  reprendreCleMerci();
  var retour = null, ctx = null;
  try{ ctx = JSON.parse(sessionStorage.getItem('nv_ctx_' + MOI) || 'null'); if(ctx && ctx.module === MOI && ctx.defi === 'tuto') retour = 'tuto'; sessionStorage.removeItem('nv_ctx_' + MOI); }catch(e){}
  if(ctx && typeof ctx.categorie === 'string' && CATS[ctx.categorie]) ST.filtre.categorie = ctx.categorie;
  rendre();
  chargerCap().catch(function(e){ ST.cap = null; ST.etat = e && e.status && e.status < 500 ? 'indisponible' : navigator.onLine === false ? 'horsligne' : 'erreur'; ST.horsLigne = navigator.onLine === false; })
    .then(function(){ return reprendrePrise(retour).then(reprendrePriseLocale, reprendrePriseLocale); })
    .then(function(){ if(ctx && typeof ctx.tuto === 'string') return chargerTuto(ctx.tuto); if(ctx && ctx.vue === 'moi') return chargerMoi(); if(ST.prise){ ST.vue = 'creer'; rendre(); return; } return chargerListe(); });
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if(!b) return;
    var a = function(k){ return b.getAttribute(k); };
    if(a('data-vue')) changerVue(a('data-vue'));
    else if(a('data-cat') !== null){ ST.filtre.categorie = a('data-cat'); chargerListe(); }
    else if(a('data-ouvrir')) chargerTuto(a('data-ouvrir'));
    else if(b.id === 'bPlus') chargerListe(true);
    else if(b.id === 'bReussi') reussi();
    else if(b.id === 'bGarder') garder();
    else if(b.id === 'bTelecharger') telecharger();
    else if(b.id === 'bPartager') partager();
    else if(b.id === 'bSignaler' && ST.tuto) ouvrir('Report', ST.tuto.video && ST.tuto.video.id ? {video:ST.tuto.video.id, clip:ST.tuto.video.id, auteur:ST.tuto.auteur, module:MOI} : {type:'general', module:MOI});
    else if(a('data-montant')){ choisirMontant(+a('data-montant')); }
    else if(b.id === 'bMerci') merci();
    else if(b.id === 'bMasquer') masquer();
    else if(a('data-retablir')) retablir(a('data-retablir'));
    else if(a('data-aller')){ var v = $('vTuto'); if(v){ try{ v.currentTime = +a('data-aller'); v.play().catch(function(){}); v.focus(); }catch(e){} } }
    else if(b.id === 'bFilmer') filmer();
    else if(b.id === 'bRefilmer'){ if(deuxTouchers('refilmer')){ oublierPrise(); filmer(); } }
    else if(a('data-ajouter')){ var g = a('data-ajouter'); ST.form[g].push(g === 'materiel' ? {nom:'', quantite:''} : {texte:'', t:''}); rendre();
      var ins = document.querySelectorAll('[data-ed="' + g + '"]'); if(ins.length) ins[ins.length - (g === 'materiel' ? 2 : 2)].focus(); }
    else if(a('data-enlever')){ var g2 = a('data-enlever'); ST.form[g2].splice(+a('data-i'), 1); if(!ST.form[g2].length) ST.form[g2].push(g2 === 'materiel' ? {nom:'', quantite:''} : {texte:'', t:''}); rendre(); }
    else if(a('data-modifier')) modifier(a('data-modifier'));
    else if(a('data-retirer')) retirer(a('data-retirer'));
    else if(b.id === 'bAnnulerEd'){ ST.edition = null; ST.form = null; chargerMoi(); }
    else if(b.id === 'bRecolte') ouvrir('Recolte', {depuis:'savoir'});
  });
  document.addEventListener('keydown', function(ev){
    var t = ev.target; if(!t || !t.getAttribute || !t.getAttribute('data-montant')) return;
    var l = Array.prototype.slice.call(document.querySelectorAll('[data-montant]')), i = l.indexOf(t), d = {ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1}[ev.key];
    if(!d || i < 0) return; ev.preventDefault(); if(document.documentElement.dir === 'rtl' && /Left|Right/.test(ev.key)) d = -d;
    choisirMontant(+l[(i + d + l.length) % l.length].getAttribute('data-montant'));
  });
  document.addEventListener('input', function(ev){
    var t = ev.target; if(!t) return;
    if(t.id === 'iMot') ST.mot = t.value;
    else if(t.id === 'iCherche') ST.filtre.q = t.value;
    else if(t.getAttribute('data-ed') && ST.form){ var l = ST.form[t.getAttribute('data-ed')][+t.getAttribute('data-i')]; if(l) l[t.getAttribute('data-k')] = t.value; }
    else if(t.getAttribute('data-champ') && ST.form && t.type !== 'checkbox' && t.tagName !== 'SELECT') ST.form[t.getAttribute('data-champ')] = t.value;
  });
  document.addEventListener('change', function(ev){
    var t = ev.target; if(!t) return;
    if(t.id === 'langue'){ var l = t.value; if(!LANGUES_UI[l]) return; ecrire('nv_ui_langue', l); poserLangue(l); rendre(); var s = $('langue'); if(s) s.focus(); }
    else if(t.id === 'sTri'){ ST.filtre.tri = t.value === 'reussis' ? 'reussis' : 'recent'; chargerListe(); }
    else if(t.getAttribute('data-coche') !== null && ST.tuto){ var i = +t.getAttribute('data-coche'), c = coches(ST.tuto.id).filter(function(k){ return k !== i; }); if(t.checked) c.push(i); ecrire(cleCoche(ST.tuto.id), c); }
    else if(t.getAttribute('data-champ') && ST.form){ ST.form[t.getAttribute('data-champ')] = t.type === 'checkbox' ? t.checked : t.value; }
  });
  document.addEventListener('submit', function(ev){
    var f = ev.target; if(!f) return; ev.preventDefault();
    if(f.id === 'fCherche') chargerListe();
    else if(f.id === 'fFiche') publier();
  });
  window.NVSavoir = {etat:function(){ return {etat:ST.etat, vue:ST.vue, apercu:ST.apercu, items:ST.items.length, prise:!!ST.prise, langue:L}; }};
}

/* ════════ La présentation (17 nov. 2026, étape 2 du plan des 8 nouveautés) : un film dessiné, « Comment ça marche »,
   « Ce qui vous protège ». En grand quand la nouveauté n'est pas encore ouverte ; repliée sur la page principale sinon. ════════ */
var _rendrePres = rendre;
rendre = function(){ var r = _rendrePres.apply(this, arguments); presenter(); return r; };
function presenter(){
  if(!window.NVPresente) return;
  var ferme = !ST.cap && !ST.apercu && (ST.etat === 'sansserveur' || ST.etat === 'indisponible');
  if(!ferme && !((ST.cap || ST.apercu) && (ST.vue === 'liste'))){ NVPresente.poser(null); return; }
  NVPresente.poser({cle:'savoir', scene:'savoir', couleurs:['#16e0d4','#ffc531'], ouvert:ferme, apres:$('etat'), titreFilm:T('Le Savoir-faire'),
    intro:ferme ? T('Bientôt ouvert ici. Voici ce qui vous attend.') : '', comment:T('Comment ça marche'), protege:T('Ce qui vous protège'),
    etapes:[T('Filmez votre savoir-faire avec La Forge, jusqu’à 10 minutes.'), T('Ajoutez la fiche : le matériel, les étapes, les astuces.'), T('Les autres apprennent, disent « J’ai réussi » et peuvent vous dire merci.')],
    protections:[T('Les mercis en NVCoins seulement à partir de 18 ans, des deux côtés.'), T('Un merci n’est jamais un vote ni un classement.'), T('L’équipe peut masquer un tutoriel dangereux.')]});
}

/* ════════ L'aperçu en repli (17 nov. 2026, rappel de Karamo : « ne plus dépendre l'affichage des contenus ou fonctionnalités
   d'un module uniquement par la présence ou branchement d'un serveur ») ════════
   Un serveur branché qui ne propose pas (encore) cette fonction, ou qui ne répond pas : la page ne reste jamais fermée,
   elle montre son aperçu, toujours marqué « Aperçu » (rien n'est envoyé). Dès que le serveur l'annonce, seul le vrai contenu. */
function repliApercu(){ if(ST.cap || ST.apercu) return false; ST.apercu = true; ST.repli = true;
  if(!utilisateur()){ try{ window.NV_USER = {id:'demo', handle:'visiteur', prenom:'Aya', age:25, majeur:true, iso:'GN'}; }catch(e){} }
  return true; }
(function(){ var cc0 = chargerCap;
  chargerCap = function(){ return cc0().then(function(){ if(repliApercu()) return cc0(); }, function(e){ if(repliApercu()) return cc0(); throw e; }); }; })();

demarrer();
})();
