.mots{display:flex;flex-wrap:wrap;gap:4px}

.consent{border:1px solid var(--id1);border-radius:12px;padding:10px 12px;background:rgba(155,123,255,.08)}
.consent ul{list-style:disc;padding-inline-start:20px}
.consent li{border:0;padding:2px 0}
/* Les championnats */
.cal{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.cal li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;border:0!important;padding:4px 0!important;font-size:.88rem}
.cal li::before{content:"";width:14px;height:13px;clip-path:var(--hex);background:var(--trait)}
.cal li.fait::before{background:var(--id2)}
.cal li.en::before{background:var(--id1);box-shadow:0 0 0 2px var(--id1)}
.cal li span{color:var(--brume);font-size:.82rem;text-align:end}
.crit{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:0 0 8px}
.crit div{border:1px solid var(--trait);border-radius:10px;padding:6px 8px;font-size:.84rem;display:flex;justify-content:space-between;gap:6px}
.crit b{color:var(--id1)}
.garde{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;margin:0 0 6px}
.garde::before{content:"";width:12px;height:11px;clip-path:var(--hex);background:var(--id2);flex:none;margin-top:5px}
.podium{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:0 0 12px}
.podium .part h3{margin:0;font-size:.95rem}
.medaille{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:.82rem}
.medaille i{width:16px;height:15px;clip-path:var(--hex);display:inline-block}
.medaille.or i{background:var(--or)} .medaille.argent i{background:var(--argent)} .medaille.bronze i{background:var(--bronze)}
.tab{width:100%;border-collapse:collapse;font-size:.86rem}
.tab th,.tab td{padding:6px 4px;border-bottom:1px solid var(--trait);text-align:start}
.tab td.n,.tab th.n{text-align:end;font-variant-numeric:tabular-nums}
.defil{overflow-x:auto}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.notes label{font-size:.82rem}
.notes input{width:100%}
.audit{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;text-align:center}
.audit div{border:1px solid var(--trait);border-radius:10px;padding:6px}
.audit b{display:block;font-size:1.15rem}
.audit span{font-size:.76rem;color:var(--brume)}
</style>
</head>

  if(ST.apercu) t = ST.repli ? T('Aperçu : ce serveur ne propose pas encore cette fonction. Rien n’est envoyé.') : T('Aperçu : des championnats d’exemple, pour découvrir la page. Rien n’est envoyé.');
  else if(ST.etat === 'charge') t = T('Chargement…');
  else if(ST.etat === 'sansserveur' || ST.etat === 'indisponible') t = T('Les championnats ne sont pas encore ouverts.');
  else if(ST.etat === 'horsligne') t = T('Pas de connexion pour le moment.');
  else if(ST.etat === 'erreur') t = T('Impossible de joindre NEURAVID pour le moment.');
  el.textContent = t; el.hidden = !t;
}
function onglets(){

function calendrier(x){
