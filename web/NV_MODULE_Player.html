    var d = langue() === 'ar' ? ' dir="rtl"' : '', h = '<div class="voile" data-m="fermer"></div><div class="feuille" role="dialog" aria-modal="true" aria-labelledby="nvmT"' + d + ' lang="' + langue() + '">' +
      '<h2 id="nvmT"><i aria-hidden="true"></i>' + esc(t('Acheter des NVCoins')) + '</h2><p>' + esc(t('Les NVCoins s\'achètent ici avec votre compte Apple.')) + '</p>';
    if (F.manque > 0) h += '<p class="manque">' + esc(t('Il vous manque {0} NVCoins.', fmt(F.manque))) + '</p>';
    if (F.liste === null) h += '<p class="etat">…</p>';
    else if (!F.liste.length) h += '<p class="etat">' + esc(t('Les achats dans l\'App Store ne sont pas encore ouverts.')) + '</p>';
    else {
      h += '<div class="grille" role="group" aria-label="' + esc(t('Acheter des NVCoins')) + '">' + F.liste.map(function(x){
        var on = F.choix === x.id; return '<button class="pack" data-m="pack" data-id="' + esc(x.id) + '" aria-pressed="' + on + '"><b>' + esc(fmt(x.nvc)) + ' NVCoins</b><span>' + esc(x.prix) + '</span></button>'; }).join('') + '</div>' +
        '<button class="acheter" data-m="acheter"' + (F.choix && !F.occupe ? '' : ' disabled') + '>' + esc(F.occupe ? t('Achat en cours…') : t('Acheter')) + '</button>' +
        '<p class="note">' + esc(t('Prix de l\'App Store.')) + '</p>';
    }
    h += '<p class="etat" role="status">' + esc(F.msg) + '</p><button class="fermer" data-m="fermer">' + esc(t('Fermer')) + '</button></div>';
    var z = document.createElement('div'); z.innerHTML = h; while (z.firstChild) o.appendChild(z.firstChild);
    var f = o.querySelector('[aria-pressed=true]') || o.querySelector('.pack') || o.querySelector('.fermer'); if (f) try { f.focus({preventScroll:true}); } catch (e) {}
  }
  function finir(res){ var f = F.fin; F.fin = null; F.ouvert = false; F.occupe = false; rendre(); if (f) try { f(res); } catch (e) {} }
  function fermer(){ if (F.occupe) return; finir({success:false, annule:true, reason:t('Achat annulé. Rien n\'a été débité.')}); }
  function clic(e){
    var b = e.target.closest && e.target.closest('[data-m]'); if (!b) return;
    var m = b.getAttribute('data-m');
    if (m === 'fermer') fermer();
    else if (m === 'pack' && !F.occupe) { F.choix = b.getAttribute('data-id'); F.msg = ''; rendre(); }
    else if (m === 'acheter' && F.choix && !F.occupe) acheter();
  }
  var RAISONS = {annule:'Achat annulé. Rien n\'a été débité.', age_argent:'Réservé aux personnes de 18 ans et plus.'};
  function acheter(){
    var x = F.liste.filter(function(p){ return p.id === F.choix; })[0]; if (!x) return;
    F.occupe = true; F.msg = ''; rendre();
    json(api() + '/v1/recolte/recharges/magasin/jeton').then(function(j){
      return natif({action:'acheter', id:x.id, compte:j && j.appAccountToken || null});
    }).then(function(r){
      if (!r || !r.ok) {
        F.occupe = false;
        if (r && r.raison === 'attente') { F.msg = t('Votre achat est payé : vos NVCoins arrivent dès que NEURAVID le confirme.'); rendre(); return; }
        F.msg = t(RAISONS[r && r.raison] || 'L\'achat n\'a pas abouti. Rien n\'a été débité.'); rendre(); return;
      }
      return crediter(r).then(soldeEtFin).then(function(c){
        F.occupe = false;
        if (c.ok) { annonce(t('{0} NVCoins ajoutés à votre portefeuille', fmt(c.nvc || x.nvc))); finir({success:true, solde:c.solde, nvc:c.nvc || x.nvc}); return; }
        F.msg = t(c.code === 'age_argent' ? RAISONS.age_argent : 'Votre achat est payé : vos NVCoins arrivent dès que NEURAVID le confirme.'); rendre();
      });
    });
  }
  function ouvrir(o){
    o = o || {};
    return new Promise(function(res){
      if (!actif()) { res({success:false, reason:''}); return; }
      if (F.fin) { var a = F.fin; F.fin = null; try { a({success:false, annule:true}); } catch (e) {} }
      F.fin = res; F.ouvert = true; F.occupe = false; F.msg = ''; F.manque = Math.max(0, +o.manque || 0); F.liste = null;
      if (!api() || !jeton()) { F.liste = []; F.msg = t('Connectez-vous pour acheter des NVCoins.'); rendre(); return; }
      rendre();
      produits().then(function(l){
        F.liste = l || []; var voulu = +o.choix || F.manque || 0;
        var c = F.liste.filter(function(p){ return p.nvc >= voulu; })[0] || F.liste[F.liste.length - 1];
        F.choix = voulu && c ? c.id : (F.choix && F.liste.some(function(p){ return p.id === F.choix; }) ? F.choix : null); rendre();
      });
    });
  }

  /* ── aucune page de paiement de NEURAVID sur iPhone : chaque demande de dépôt ouvre l'App Store ── */
  if (vraiFetch) R.fetch = function(entree, init){
    try {
      if (actif()) {
        var url = typeof entree === 'string' ? entree : (entree && entree.url) || '', meth = String((init && init.method) || (entree && entree.method) || 'GET').toUpperCase();
        var ch = url.replace(/^https?:\/\/[^/]+/, '').split('?')[0];
        if (meth === 'POST' && (ch === '/v1/wallet/purchase' || ch === '/v1/recolte/recharges' || ch === '/v1/recolte/recharges/devis')) {
          var corps = {}; try { corps = JSON.parse(init && typeof init.body === 'string' ? init.body : '{}') || {}; } catch (e) {}
          var rep = function(o, s){ return new Response(JSON.stringify(o), {status:s || 200, headers:{'Content-Type':'application/json'}}); };
          if (ch !== '/v1/wallet/purchase') { ouvrir({}); return Promise.resolve(rep({ok:false, erreur:'magasin_seulement', raison:{code:'magasin_seulement'}}, 409)); }
          return ouvrir({choix:+corps.coins || 0}).then(function(x){
            return rep(x.success ? {success:true, solde:x.solde, idem:corps.idem} : {success:false, idem:corps.idem, reason:x.reason || t('Achat annulé. Rien n\'a été débité.')});
          });
        }
      }
    } catch (e) {}
    return vraiFetch(entree, init);
  };
  if (actif()) {
    try { document.documentElement.classList.add('nv-app-store'); } catch (e) {}
    var st = document.createElement('style');
    /* le panneau des cadeaux : ni prix indicatif ni mention d'un autre moyen de paiement ; seul le prix de l'App Store compte */
    st.textContent = 'html.nv-app-store .nvc-pack span,html.nv-app-store #nvc-pan .nvc-rep{display:none!important}';
    (document.head || document.documentElement).appendChild(st);
    var relabel = function(){ var b = document.querySelector('#nvc-pan [data-nvc="acheter"]'); if (b && b.getAttribute('data-nvm') !== langue()) { b.textContent = t('Acheter des NVCoins'); b.setAttribute('data-nvm', langue()); } };
    var rlT = 0; try { new MutationObserver(function(){ if (!rlT) rlT = setTimeout(function(){ rlT = 0; relabel(); }, 60); }).observe(document.documentElement, {childList:true, subtree:true}); } catch (e) {}
    setTimeout(reprendre, 2500);
  }
  R.NVMagasin = {actif:actif, ouvrir:ouvrir, produits:produits, _crediter:crediter};
