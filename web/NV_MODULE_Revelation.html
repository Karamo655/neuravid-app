<script>
/* ══ NV_CAMERA — EMBARQUÉ ════════════════════════════════════
   Embarqué, pas référencé : un module NEURAVID doit s'ouvrir
   seul depuis une URL file://, avec rien à côté. */
/* ═══════════════════════════════════════════════════════════════════
   NEURAVID — NV_CAMERA.js
   Le bouton « Filmer » d'un défi ouvre la caméra du Studio créatif.

   À embarquer dans les 16 modules de défi ET dans NV_MODULE_Create.html.

   ── POURQUOI ─────────────────────────────────────────────────────────
   Chaque défi a son propre enregistreur. Il fonctionne, il grave les
   filtres et le logo dans l'image — mais il s'arrête là. La caméra du
   Studio sait faire beaucoup plus, et elle existe déjà :

       double caméra (médaillon, haut/bas, gauche/droite)
       masques qui suivent le visage
       effets pluie, neige, étincelles
       filtres gravés dans l'image enregistrée
       photo, montage, galerie

   Une personne qui veut participer à un défi n'a aucune raison d'avoir
   moins d'outils que quelqu'un qui filme pour rien.

   ── LA DIFFICULTÉ RÉELLE ─────────────────────────────────────────────
   Le Studio est un AUTRE fichier. Changer de page perd tout : le
   contexte du défi, et surtout la vidéo elle-même — un Blob ne
   traverse pas une navigation.

   IndexedDB, si. C'est la seule voie, et Create s'en sert déjà pour
   son relais. On l'emprunte :

       1. le défi range son contexte et ouvre le Studio
       2. la personne filme avec tous les outils
       3. le Studio range la vidéo dans IndexedDB et revient au défi
       4. le défi la reprend et la présente comme sa propre prise

   ── CE QU'ON NE FAIT PAS ─────────────────────────────────────────────
   On ne copie pas la caméra du Studio dans les seize défis. Elle pèse
   plus de trois cents kilo-octets, et seize copies divergeraient au
   premier correctif — c'est exactement ce qui est arrivé à IA et Coach,
   qui affichaient deux scores différents pour la même vidéo.

   Et on ne supprime pas l'enregistreur existant : si le Studio est
   injoignable, il reprend la main. Une passerelle ne doit jamais
   devenir un point de rupture.
   ═══════════════════════════════════════════════════════════════════ */
(function (racine) {
  'use strict';
  if (racine.NVCamera) return;

  var BASE_DEFAUT = 'file:///android_asset/flutter_assets/assets/modules/';
  var CLE_CTX = 'nv_cam_ctx';
  var DB = 'nvcamera';
  var MAG = 'prises';

  function emit(type, charge) {
    try { if (typeof racine.NVemit === 'function') racine.NVemit(type, charge || {}); }
    catch (e) {}
  }
  function base() {
    var b = racine.NV_MODULES_BASE || BASE_DEFAUT;
    return b.slice(-1) === '/' ? b : b + '/';
  }

  /* ── LE COFFRE ────────────────────────────────────────────────────
     Une vidéo de quelques mégaoctets ne tient pas dans localStorage et
     ne survit pas à une navigation autrement. IndexedDB est le seul
     endroit où elle peut attendre. */
  function ouvrirBase() {
    return new Promise(function (res) {
      try { if (!racine.indexedDB) return res(null); } catch (e) { return res(null); }   /* stockage bloqué : l'accès lui-même peut lever une erreur */
      var r;
      try { r = racine.indexedDB.open(DB, 1); } catch (e) { return res(null); }
      r.onupgradeneeded = function () {
        try { r.result.createObjectStore(MAG); } catch (e) {}
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { res(null); };
      /* certains navigateurs ne répondent jamais (fichier ouvert en content://) */
      setTimeout(function () { res(null); }, 2000);
    });
  }
  function ranger(cle, valeur) {
    return ouvrirBase().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var t = db.transaction(MAG, 'readwrite');
          t.objectStore(MAG).put(valeur, cle);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { res(false); };
        } catch (e) { res(false); }
      });
    });
  }
  function reprendre(cle) {
    return ouvrirBase().then(function (db) {
      if (!db) return null;
      return new Promise(function (res) {
        try {
          var t = db.transaction(MAG, 'readonly');
          var q = t.objectStore(MAG).get(cle);
          q.onsuccess = function () { res(q.result || null); };
          q.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    });
  }
  function oublier(cle) {
    return ouvrirBase().then(function (db) {
      if (!db) return;
      try {
        var t = db.transaction(MAG, 'readwrite');
        t.objectStore(MAG).delete(cle);
      } catch (e) {}
    });
  }

  /* ── CÔTÉ DÉFI : partir vers le Studio ────────────────────────────── */
  function filmer(ctx) {
    ctx = ctx || {};
    ctx.module = ctx.module || racine.NV_MODULE_NAME || 'defi';
    ctx.quand = Date.now();
    /* La contrainte du défi voyage avec : le Studio doit savoir qu'une
       story flash s'arrête à sept secondes. Sans ça, la personne filme
       trente secondes et se fait refuser au retour. */
    try { racine.sessionStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    try { racine.localStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    emit('camera_open', ctx);

    /* Si le Studio est déjà dans cette page, on l'ouvre sans changer
       d'écran : c'est plus rapide et rien ne peut se perdre. */
    try {
      if (racine.NVStudio && typeof racine.NVStudio.open === 'function' &&
          typeof racine.NVStudio.tab === 'function') {
        racine.NVStudio.open(); racine.NVStudio.tab('video');
        return 'local';
      }
    } catch (e) {}
    try {
      if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') {
        racine.NVLien.ouvrir('NVCreate', ctx);
        return 'lien';
      }
    } catch (e) {}
    try {
      racine.location.href = base() + 'NV_MODULE_Create.html';
      return 'fichier';
    } catch (e) {}
    return 'aucun';   /* l'appelant reprend la main avec son propre enregistreur */
  }

  /* ── CÔTÉ STUDIO : d'où vient-on, et comment y retourner ──────────── */
  function contexte() {
    var t = null;
    try { t = racine.sessionStorage.getItem(CLE_CTX); } catch (e) {}
    if (!t) { try { t = racine.localStorage.getItem(CLE_CTX); } catch (e) {} }
    if (!t) return null;
    try {
      var c = JSON.parse(t);
      /* Un contexte vieux de plus d'une heure n'a plus de sens : la
         personne est passée à autre chose. On ne la renvoie pas dans un
         défi qu'elle a quitté. */
      if (!c || !c.quand || Date.now() - c.quand > 3600000) return null;
      return c;
    } catch (e) { return null; }
  }

  /* Le Studio appelle ceci quand la prise est terminée. */
  function rendre(blob, meta) {
    var c = contexte();
    if (!c) return Promise.resolve(false);
    var cle = 'prise_' + (c.module || 'defi') + '_' + (c.defi || 'x');
    return ranger(cle, {blob: blob, meta: meta || {}, ctx: c, at: Date.now()})
      .then(function (ok) {
        if (!ok) return false;
        emit('camera_done', {module: c.module, defi: c.defi || null,
                             secondes: (meta && meta.seconds) || null});
        try {
          if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') {
            racine.NVLien.ouvrir('NV' + c.module, c);
            return true;
          }
        } catch (e) {}
        try { racine.location.href = base() + 'NV_MODULE_' + c.module + '.html'; }
        catch (e) {}
        return true;
      });
  }

  /* ── CÔTÉ DÉFI : récupérer la prise au retour ─────────────────────── */
  function recuperer(module, defi) {
    var cle = 'prise_' + (module || racine.NV_MODULE_NAME || 'defi') + '_' + (defi || 'x');
    return reprendre(cle).then(function (p) {
      if (!p) return null;
      /* On efface tout de suite : une prise reprise deux fois se
         retrouverait envoyée deux fois. */
      oublier(cle);
      if (!p.at || Date.now() - p.at > 3600000) return null;
      return p;
    });
  }

  /* ══ LE MÉNAGE ════════════════════════════════════════════════════
     Une prise n'est effacée qu'à sa reprise. Si la personne filme puis
     ne revient jamais dans le défi, l'entrée reste — une vidéo de
     plusieurs mégaoctets par tentative abandonnée, sur un téléphone
     d'entrée de gamme.

     On balaie donc au chargement ce qui a plus d'une heure : c'est la
     même limite que le contexte, et au-delà la personne est passée à
     autre chose de toute façon. */
  function balayer() {
    return ouvrirBase().then(function (db) {
      if (!db) return 0;
      return new Promise(function (res) {
        var n = 0;
        try {
          var t = db.transaction(MAG, 'readwrite');
          var st = t.objectStore(MAG);
          var q = st.openCursor();
          q.onsuccess = function () {
            var c = q.result;
            if (!c) { res(n); return; }
            var v = c.value;
            if (!v || !v.at || Date.now() - v.at > 3600000) { c.delete(); n++; }
            c.continue();
          };
          q.onerror = function () { res(n); };
        } catch (e) { res(0); }
      });
    });
  }
  /* au chargement, sans bloquer quoi que ce soit */
  try { setTimeout(balayer, 3000); } catch (e) {}

  racine.NVCamera = {
    balayer: balayer,
    filmer: filmer,
    contexte: contexte,
    rendre: rendre,
    recuperer: recuperer,
    /* Pour savoir s'il faut proposer le Studio ou rester sur
       l'enregistreur local. On ne propose jamais une porte qui ne
       s'ouvre pas. */
    studioJoignable: function () {
      try {
        if (racine.NVStudio && typeof racine.NVStudio.open === 'function') return true;
        if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') return true;
        return !!racine.NV_MODULES_BASE;
      } catch (e) { return false; }
    }
  };
})(window);

</script>
