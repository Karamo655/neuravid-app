.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.fiche video{width:100%;max-height:70vh;border-radius:14px;background:#000;display:block}
.fiche .pv{font-size:1.4rem;font-weight:800;color:var(--id1);margin:6px 0}
.faits{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.86rem;margin:6px 0}
.faits dt{color:var(--brume)} .faits dd{margin:0;overflow-wrap:anywhere}
.etoiles{color:var(--or);letter-spacing:1px}
.direct{border:1px solid #ff4f6d;border-radius:14px;padding:10px 12px;background:linear-gradient(160deg,rgba(255,79,109,.14),var(--nuit2) 60%)}
.direct .pt{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:#ff8199;font-size:.82rem}
.direct .pt::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff4f6d}
@media (prefers-reduced-motion:no-preference){.direct .pt::before{animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.35}}}
.epingle{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;border:1px solid var(--id1);border-radius:12px;padding:8px;margin:8px 0}
.epingle .gl{width:96px;height:84px;clip-path:var(--hex);background:linear-gradient(135deg,var(--id1),var(--id2));display:grid;place-items:center;font-size:2rem;overflow:hidden;position:relative}
.epingle .gl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.carte-res{padding:10px 0;border-top:1px solid var(--trait);display:grid;gap:6px}
.carte-res:first-child{border-top:0}
.carte-res p{margin:0}
.etat-c{display:inline-block;padding:0 8px;border-radius:999px;font-size:.74rem;font-weight:700;border:1px solid var(--trait)}
.etat-c.ok{color:var(--cyan);border-color:var(--cyan)} .etat-c.att{color:var(--or);border-color:var(--or)} .etat-c.non{color:var(--rouge);border-color:var(--rouge)}
.file{padding:10px 0;border-top:1px solid var(--trait);display:grid;gap:6px}
.file:first-of-type{border-top:0}
.file p{margin:0}
.signal{border:1px solid var(--rouge);border-radius:12px;padding:8px 10px;display:grid;gap:8px}
.sortie{border:1px solid var(--or);border-radius:12px;padding:8px 10px;font-size:.86rem}
/* Identité de la nouveauté : l'ambre du marché et la menthe de la confiance */
:root{--id1:#ffb84d;--id2:#2ee6a8}
header{position:relative}
header::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--id1),var(--id2))}
.hex{background:linear-gradient(135deg,var(--id1),var(--id2))}
h2::before{background:linear-gradient(135deg,var(--id1),var(--id2))}
h2[tabindex="-1"]:focus{outline:none}
</style>
</head>

/* ═══════════════════════════════════════════════════════════════════
   NEURAVID — NV_CAMERA.js
   Le bouton « Filmer » d'un défi ouvre la caméra du Studio créatif.

   À embarquer dans les 16 modules de défi ET dans NV_MODULE_Create.html.

   ── POURQUOI ─────────────────────────────────────────────────────────
   Chaque défi a son propre enregistreur. Il fonctionne, il grave les
   filtres et le logo dans l'image — mais il s'arrête là. La caméra du
   Studio sait faire beaucoup plus, et elle existe déjà :

       double caméra (médaillon, haut/bas, gauche/droite)
       masques qui suivent le visage
       effets pluie, neige, étincelles
       filtres gravés dans l'image enregistrée
       photo, montage, galerie

   Une personne qui veut participer à un défi n'a aucune raison d'avoir
   moins d'outils que quelqu'un qui filme pour rien.

   ── LA DIFFICULTÉ RÉELLE ─────────────────────────────────────────────
   Le Studio est un AUTRE fichier. Changer de page perd tout : le
   contexte du défi, et surtout la vidéo elle-même — un Blob ne
   traverse pas une navigation.

   son relais. On l'emprunte :

       1. le défi range son contexte et ouvre le Studio
       2. la personne filme avec tous les outils
       3. le Studio range la vidéo dans IndexedDB et revient au défi
       4. le défi la reprend et la présente comme sa propre prise

   ── CE QU'ON NE FAIT PAS ─────────────────────────────────────────────

   plus de trois cents kilo-octets, et seize copies divergeraient au
   premier correctif — c'est exactement ce qui est arrivé à IA et Coach,
   qui affichaient deux scores différents pour la même vidéo.

       story flash s'arrête à sept secondes. Sans ça, la personne filme
       trente secondes et se fait refuser au retour. */
    try { racine.sessionStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    try { racine.localStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    emit('camera_open', ctx);

    /* Si le Studio est déjà dans cette page, on l'ouvre sans changer
       d'écran : c'est plus rapide et rien ne peut se perdre. */
    try {
      if (racine.NVStudio && typeof racine.NVStudio.open === 'function' &&
          typeof racine.NVStudio.tab === 'function') {
        racine.NVStudio.open(); racine.NVStudio.tab('video');
        return 'local';
      }
    } catch (e) {}

      if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') {
        racine.NVLien.ouvrir('NVCreate', ctx);
        return 'lien';
      }
    } catch (e) {}
    try {
      racine.location.href = base() + 'NV_MODULE_Create.html';
      return 'fichier';
    } catch (e) {}
    return 'aucun';   /* l'appelant reprend la main avec son propre enregistreur */
  }

  function contexte() {

         personne est passée à autre chose. On ne la renvoie pas dans un
         défi qu'elle a quitté. */
      if (!c || !c.quand || Date.now() - c.quand > 3600000) return null;

     Une prise n'est effacée qu'à sa reprise. Si la personne filme puis
     ne revient jamais dans le défi, l'entrée reste — une vidéo de
     plusieurs mégaoctets par tentative abandonnée, sur un téléphone

  function balayer() {

    studioJoignable: function () {

    }

  function essayerRelever(){
    var h = window.NV_RELEVER_H || [];
    for(var i = 0; i < h.length; i++){ try{ if(h[i](info) === true) return true; }catch(e){} }
    try{ return RELEVER[MOD] ? RELEVER[MOD].call(null, info) === true : false; }catch(e){ return false; }
  }
  function essayer(){
    if(info.action === 'relever'){
      /* le bandeau dit toujours qu'on relève ce défi (avec « Revoir la vidéo ») ; le module montre en plus son défi s'il le sait */
      var fait = essayerRelever();
      if(!fait && Date.now() - debut < 6000){ setTimeout(essayer, 500); return; }
      if(document.body) bandeau(); return;
    }
    var h = window.NV_DEPUIS_IRIS_H || [];
    for(var i = 0; i < h.length; i++){ try{ var r = h[i](info); if(r === true){ info.ouvert = true; return; } }catch(e){} }
    var e = Date.now() - debut;
    if(e < 8000 && (h.length || e < 1500)){ setTimeout(essayer, 500); return; }     /* aucun module qui sait l'ouvrir : le bandeau tout de suite */
    if(document.body) bandeau();
  }
  function partir(){ setTimeout(essayer, 400); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', partir); else partir();
