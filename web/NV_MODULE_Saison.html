<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140b33">
<title>La Saison en bref · NEURAVID</title>
<style>
/* La Saison en bref : la page légère de la Saison des Nations. Aucune image, aucune police téléchargée, aucune animation
   obligatoire : quelques kilo-octets, lisibles sur un petit téléphone et sans connexion. */
:root{
  --nuit:#140b33; --nuit2:#1c1147; --alv:#241657; --craie:#f6f1ff; --brume:rgba(236,228,255,.74); --trait:rgba(255,255,255,.16);
  --or:#ffc531; --argent:#d7dbe6; --bronze:#e0995a; --cyan:#16e0d4; --rose:#ff4f9e; --rouge:#ff7a7a;
  --hex:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--nuit);color:var(--craie);font:16px/1.45 var(--sans);min-height:100vh}
main{max-width:768px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.hex{width:34px;height:30px;flex:0 0 auto;clip-path:var(--hex);background:linear-gradient(135deg,var(--cyan),#6c2bd9);display:grid;place-items:center}
.hex i{width:14px;height:14px;border-radius:50%;background:var(--nuit);box-shadow:inset 0 0 0 4px var(--craie)}
h1{font-size:1.2rem;margin:0;line-height:1.2}
h2{font-size:1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:12px;height:11px;clip-path:var(--hex);background:var(--cyan);flex:0 0 auto}
.sous{margin:0;color:var(--brume);font-size:.88rem}
.apercu{display:inline-block;margin-inline-start:6px;padding:1px 8px;border-radius:999px;background:var(--or);color:#2a1a00;font-size:.75rem;font-weight:800;vertical-align:middle}
#etat{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:var(--nuit2);border:1px solid var(--trait);font-size:.9rem}
#etat.hl{border-color:var(--or)}
#etat.ok{border-color:rgba(22,224,212,.5)}
section{background:var(--nuit2);border:1px solid var(--trait);border-radius:14px;padding:12px 14px;margin:0 0 12px}
ul{list-style:none;margin:0;padding:0}
li{padding:7px 0;border-top:1px solid var(--trait)}
li:first-child{border-top:0}
.l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.d{color:var(--brume);font-size:.86rem}
.puce{display:inline-block;padding:0 7px;border-radius:999px;font-size:.75rem;font-weight:700;border:1px solid var(--trait);white-space:nowrap}
.puce.an{color:var(--rouge);border-color:var(--rouge)}
.puce.re{color:var(--or);border-color:var(--or)}
.puce.co{color:var(--cyan);border-color:var(--cyan)}
.chiffres{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.chiffres b{display:block;font-size:1.25rem}
.chiffres span{font-size:.75rem;color:var(--brume)}
.med{display:inline-flex;align-items:center;gap:3px;margin-inline-end:8px;white-space:nowrap}
.med i{width:12px;height:11px;clip-path:var(--hex);display:inline-block}
.or i{background:var(--or)} .ar i{background:var(--argent)} .br i{background:var(--bronze)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:5px 4px;text-align:center;border-top:1px solid var(--trait)}
td:first-child,th:first-child{text-align:start}
th{font-size:.75rem;color:var(--brume);font-weight:600;border-top:0}
button,select,.lien{font:inherit;color:inherit}
button{min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--trait);background:var(--alv);cursor:pointer}
button:focus-visible,select:focus-visible,.lien:focus-visible{outline:2px solid var(--or);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.actions button{flex:1 1 140px}
.lien{background:none;border:0;padding:6px 0;min-height:36px;color:var(--cyan);text-decoration:underline;cursor:pointer;font-size:.88rem}
.jours button{min-height:40px;margin-block:4px 0;margin-inline:0 6px;padding:6px 10px;font-size:.88rem}
.jours button[aria-current="true"]{border-color:var(--or)}
footer{color:var(--brume);font-size:.8rem;display:grid;gap:8px;margin-top:4px}
footer label{display:flex;gap:8px;align-items:center}
select{min-height:40px;border-radius:10px;background:var(--alv);border:1px solid var(--trait);padding:4px 8px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--craie);color:var(--nuit);padding:8px 14px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.vide{color:var(--brume);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[dir="rtl"] .l1{direction:rtl}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
@media (min-width:560px){h1{font-size:1.35rem}}
</style>
</head>

function jourTexte(j){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(j || ''); if(!m) return '—';
  try{ return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12)).toLocaleDateString(LOC, {weekday:'long', day:'numeric', month:'long', timeZone:'UTC'}); }catch(e){ return j; } }
function dateTexte(t){ if(!nombre(t)) return '—'; try{ return new Date(t * 1000).toLocaleDateString(LOC, {day:'numeric', month:'long'}); }catch(e){ return '—'; } }
function heureTexte(t){ if(!nombre(t)) return '—'; try{ return new Date(t * 1000).toLocaleTimeString(LOC, {hour:'2-digit', minute:'2-digit'}); }catch(e){ return '—'; } }
function quandTexte(t){ return dateTexte(t) + ', ' + heureTexte(t); }
function jourLocal(){ var d = new Date(); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }

/* ── les nations : drapeau + nom (le code seul si le téléphone ne connaît pas le nom) ── */
function drapeau(iso){ iso = String(iso || '').toUpperCase(); if(!/^[A-Z]{2}$/.test(iso)) return ''; return String.fromCodePoint(127397 + iso.charCodeAt(0), 127397 + iso.charCodeAt(1)); }
var NOMS = null;
function nomPays(iso){
  iso = String(iso || '').toUpperCase(); if(!/^[A-Z]{2}$/.test(iso)) return '—';
  if(NOMS === null){ NOMS = false; try{ NOMS = new Intl.DisplayNames([LOC, 'fr'], {type:'region'}); }catch(e){ NOMS = false; } }
  var n = null; try{ n = NOMS ? NOMS.of(iso) : null; }catch(e){ n = null; }
  return n && n !== iso ? n : iso;
}
function pays(iso){ if(iso == null) return esc(T('Une autre nation')); var f = drapeau(iso); return (f ? '<span aria-hidden="true">' + f + '</span> ' : '') + esc(nomPays(iso)); }
function paysTexte(iso){ if(iso == null) return T('Une autre nation'); var f = drapeau(iso); return (f ? f + ' ' : '') + nomPays(iso); }
function listePays(l){ return Array.isArray(l) && l.length ? l.map(pays).join(', ') : '—'; }

var DISC = {chant:'Chant', danse:'Danse', humour:'Humour', court_metrage:'Court-métrage', arts_visuels:'Arts visuels', musique:'Musique et création sonore',
  conte:'Conte et parole', gastronomie:'Gastronomie', elegance:'Élégance et culture'};
function discipline(d){ return DISC[d] ? T(DISC[d]) : '—'; }
function evTitre(e){
  if(e.type === 'inscriptions_ouverture') return T('Ouverture des inscriptions');
  if(e.type === 'inscriptions_cloture') return T('Clôture des inscriptions');
  if(e.type === 'echauffement') return T('Échauffement : {0}', discipline(e.discipline));
  if(e.type === 'vote_fin') return T('Fin du vote : {0}', discipline(e.discipline));
  if(e.type === 'nuit') return T('La Nuit des Nations') + (e.ville ? ' · ' + e.ville : '');
  if(e.type === 'ceremonie') return T("La cérémonie d'ouverture");
  return '—';
}

/* ── l'état ── */
var ST = {presse:false, apercu:false, jours:{}, vu:null, etat:'', dernier:0, enCours:false, serveurJours:null, cap:null};
function valide(r){ return r && typeof r === 'object' && r.v === 1 && typeof r.jour === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.jour); }
function chargerGardes(){
  var o = lire(CLE, {}), out = {};
  if(o && typeof o === 'object') Object.keys(o).forEach(function(j){ var x = o[j]; if(x && valide(x.r) && x.r.jour === j) out[j] = {r:x.r, e:typeof x.e === 'string' ? x.e : null, recu:nombre(x.recu) || 0}; });
  return out;
}
function tries(){ return Object.keys(ST.jours).sort().reverse(); }
function garder(){
  if(ST.apercu) return;
  var l = tries(), o = {};
  l.slice(0, GARDES).forEach(function(j){ o[j] = ST.jours[j]; });
  if(ST.vu && ST.jours[ST.vu] && !o[ST.vu]) o[ST.vu] = ST.jours[ST.vu];
  if(!ecrire(CLE, o)){ var k = Object.keys(o).sort(); while(k.length > 1){ delete o[k.shift()]; if(ecrire(CLE, o)) break; } }   /* téléphone plein : les plus anciens partent d'abord */
}

/* ── le réseau : un seul petit appel, avec l'empreinte du résumé gardé (« 304, rien de nouveau ») ── */
function appeler(chemin, entetesEnPlus){
  var ac = typeof AbortController === 'function' ? new AbortController() : null, t = setTimeout(function(){ if(ac) ac.abort(); }, 15000);
  return fetch(api() + chemin, {headers:entetes(entetesEnPlus), mode:'cors', cache:'no-cache', signal:ac ? ac.signal : undefined})
    .then(function(r){ clearTimeout(t); return r; }, function(e){ clearTimeout(t); throw e; });
}
function capacite(){
  var c = lire(CLE_CAP, null);
  if(c && typeof c.ok === 'boolean' && typeof c.presse === 'boolean' && Date.now() - (nombre(c.t) || 0) < CAP_DUREE){   /* un ancien cache sans « presse » est relu */ ST.presse = c.presse === true; return Promise.resolve(c.ok); }
  return appeler('/v1/arene/capacites').then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); }).then(function(j){
    var ok = !!(j && j.resume && j.resume.actif === true); ST.presse = !!(j && j.presse && j.presse.actif === true);   /* l'espace presse (9 nov. 2026) */
    ecrire(CLE_CAP, {ok:ok, presse:ST.presse, t:Date.now()}); return ok;
  });
}
function actualiser(manuel){
  if(ST.apercu || !api() || ST.enCours) return;
  ST.enCours = true; ST.etat = 'maj'; rendreEtat(); rendreActions();
  if(manuel) try{ localStorage.removeItem(CLE_CAP); }catch(e){}
  capacite().then(function(ok){
    ST.cap = ok;
    if(!ok){ ST.etat = 'indisponible'; return; }
    /* aucune en-tête posée à la main (elle demanderait une vérification CORS de plus) : avec « no-cache », le navigateur
       revalide lui-même avec l'empreinte (304 sur le réseau, rien de lourd) ; on compare ensuite l'empreinte reçue à la nôtre */
    var dernier = tries()[0], e = dernier && ST.jours[dernier].e;
    return appeler('/v1/arene/resume').then(function(r){
      if(r.status === 404) try{ localStorage.removeItem(CLE_CAP); }catch(x){}   /* la capacité retirée : elle sera relue */
      if(!r.ok && r.status !== 304) throw new Error('http ' + r.status);
      var et = String(r.headers.get('ETag') || '').replace(/^W\//, '').replace(/"/g, '') || null;
      if(dernier && et && et === e){ ST.jours[dernier].recu = Date.now(); ST.vu = dernier; ST.etat = 'ok'; garder(); return; }
      if(r.status === 304) throw new Error('304 sans résumé gardé');
      return r.json().then(function(j){
        var x = j && j.resume; if(!valide(x)) throw new Error('forme');
        ST.jours[x.jour] = {r:x, e:et, recu:Date.now()}; ST.vu = x.jour; ST.etat = 'ok'; garder();
      });
    });
  }).catch(function(){ ST.etat = navigator.onLine === false ? 'horsligne' : 'erreur'; })
    .then(function(){ ST.enCours = false; ST.dernier = Date.now(); rendre(); });
}
function chercherJours(){
  if(ST.apercu || !api() || ST.cap !== true) return;
  appeler('/v1/arene/resume/jours').then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); }).then(function(j){
    ST.serveurJours = (j && Array.isArray(j.jours) ? j.jours : []).map(function(x){ return x && x.jour; }).filter(function(x){ return /^\d{4}-\d{2}-\d{2}$/.test(x || ''); });
    rendreJours();
  }).catch(function(){ toast(T('Impossible de joindre NEURAVID pour le moment.')); });
}
function ouvrirJour(j){
  if(ST.jours[j]){ ST.vu = j; rendre(); return; }
  if(ST.apercu || !api()) return;
  appeler('/v1/arene/resume?jour=' + encodeURIComponent(j)).then(function(r){ if(!r.ok) throw new Error('http'); var et = String(r.headers.get('ETag') || '').replace(/^W\//, '').replace(/"/g, '') || null;
    return r.json().then(function(o){ var x = o && o.resume; if(!valide(x) || x.jour !== j) throw new Error('forme'); ST.jours[j] = {r:x, e:et, recu:Date.now()}; ST.vu = j; garder(); rendre(); }); })
    .catch(function(){ toast(T('Impossible de joindre NEURAVID pour le moment.')); });
}

/* ── ouvrir un autre module (registre des modules : contexte dans sessionStorage « nv_ctx_<id> ») ── */
function emit(type, payload){
  var msg = {source:'neuravid', module:MOI, type:type, payload:payload || {}};
  if(window.NVemit && !window.NVemit.__nvLocal){ try{ window.NVemit(type, msg.payload); }catch(e){} }
  try{ if(window.flutter_inappwebview) window.flutter_inappwebview.callHandler('nvEvent', msg); }catch(e){}
  try{ window.dispatchEvent(new CustomEvent('nv:' + type, {detail:msg.payload})); }catch(e){}
}
function ouvrir(id, ctx){
  var base = window.NV_MODULES_BASE ? String(window.NV_MODULES_BASE).replace(/\/?$/, '/') : '', url = base + 'NV_MODULE_' + id + '.html';
  emit('open_module', {target:'NV' + id, url:url, contexte:ctx || null});
  try{ if(ctx) sessionStorage.setItem('nv_ctx_' + id, JSON.stringify(ctx)); }catch(e){}
  if(window.flutter_inappwebview) return;
  if(window.NVLien && typeof window.NVLien.ouvrir === 'function'){ try{ window.NVLien.ouvrir('NV' + id, ctx); return; }catch(e){} }
  try{ location.href = url; }catch(e){}
}
var toastT = 0;
function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('on'); }, 3000); }

/* ── l'affichage ── */
function courant(){ var x = ST.vu && ST.jours[ST.vu]; return x ? x.r : null; }
function rendreEtat(){
  var el = $('etat'), r = courant(), t = '', cls = '';
  if(ST.apercu) t = T("Aperçu : un exemple de résumé, pour découvrir la page.") + (r ? ' ' + T('Résumé du {0}, calculé à {1}.', jourTexte(r.jour), heureTexte(r.genere)) : '');
  else if(ST.etat === 'maj') t = T('Mise à jour…');
  else if(ST.etat === 'indisponible') t = r ? T('Le résumé n’est plus annoncé par NEURAVID. Voici le dernier résumé gardé, du {0}.', jourTexte(r.jour)) : T('Le résumé de la Saison n’est pas encore disponible.');
  else if(!api()) t = r ? T('Résumé gardé sur ce téléphone, du {0}.', jourTexte(r.jour)) : T('Le résumé de la Saison n’est pas encore disponible.');
  else if(ST.etat === 'erreur'){ cls = 'hl'; t = T('Impossible de joindre NEURAVID pour le moment.') + (r ? ' ' + T('Résumé gardé sur ce téléphone, du {0}.', jourTexte(r.jour)) : ''); }
  else if(ST.etat === 'horsligne'){ cls = 'hl'; t = r ? T('Hors connexion : voici le résumé gardé du {0}.', jourTexte(r.jour)) : T('Aucun résumé gardé sur ce téléphone pour l’instant. Connectez-vous une fois pour le recevoir.'); }
  else if(ST.etat === 'ok' && r){ cls = 'ok'; t = r.jour === tries()[0] ? T('À jour : résumé du {0}, calculé à {1}.', jourTexte(r.jour), heureTexte(r.genere)) : T('Résumé du {0}, calculé à {1}.', jourTexte(r.jour), heureTexte(r.genere)); }
  else t = r ? T('Résumé du {0}, calculé à {1}.', jourTexte(r.jour), heureTexte(r.genere)) : '';
  el.className = cls; el.textContent = t; el.hidden = !t;
}
function rendreActions(){
  var h = '';
  if(!ST.apercu && api()) h += '<button type="button" id="bMaj"' + (ST.enCours ? ' disabled' : '') + '>' + esc(T('Actualiser')) + '</button>';
  if(courant()) h += '<button type="button" id="bPartager">' + esc(T('Partager le résumé')) + '</button>';
  if(ST.presse || ST.apercu) h += '<button type="button" id="bPresse">' + esc(T('Espace presse et radio')) + '</button>';   /* annoncé par le serveur (l'aperçu a le sien) */
  $('actions').innerHTML = h;
}
function puces(e){
  var s = '';
  if(e.annule) s += ' <span class="puce an">' + esc(T('Annulé')) + '</span>';
  else if(e.reporte) s += ' <span class="puce re">' + esc(T('Reporté')) + '</span>';
  else if(e.avance) s += ' <span class="puce re">' + esc(T('Avancé')) + '</span>';
  return s;
}
function lienArene(vue, texte){ return '<button type="button" class="lien" data-vue="' + esc(vue) + '">' + esc(texte || T('Voir dans l’Arène (version complète)')) + '</button>'; }
function phaseTexte(s){
  if(!s) return '—';
  if(s.phase === 'bientot') return T('Bientôt : les inscriptions ouvrent le {0}.', dateTexte(s.ouverture));
  if(s.phase === 'inscriptions') return T('Inscriptions ouvertes jusqu’au {0}.', dateTexte(s.cloture));
  if(s.phase === 'competition') return T('La compétition est en cours.');
  if(s.phase === 'nuit') return T('La Nuit des Nations est en direct.');
  if(s.phase === 'resultats') return T('Les résultats de la Nuit des Nations arrivent.');
  if(s.phase === 'proclamee') return T('La Nuit des Nations est proclamée.');
  if(s.phase === 'terminee') return T('La Saison est terminée.');
  return '—';
}
function podium(p){
  var h = '';
  [['or', 'Or', 'or'], ['argent', 'Argent', 'ar'], ['bronze', 'Bronze', 'br']].forEach(function(m){
    var l = p && Array.isArray(p[m[0]]) ? p[m[0]] : [];
    h += '<span class="med ' + m[2] + '"><i aria-hidden="true"></i><span class="sr">' + esc(T(m[1])) + ' : </span>' + (l.length ? l.map(pays).join(', ') : '—') + '</span>';
  });
  return h;
}
function rendreContenu(){
  var r = courant(), h = '';
  if(!r){ $('contenu').innerHTML = ''; return; }
  /* la Saison */
  h += '<section aria-labelledby="hSaison"><h2 id="hSaison">' + esc(T('La Saison des Nations')) + (ST.apercu ? ' <span class="apercu">' + esc(T('Aperçu')) + '</span>' : '') + '</h2>';
  if(!r.saison) h += '<p class="vide">' + esc(T('Aucune Saison n’est annoncée pour l’instant.')) + '</p>';
  else {
    var c = r.chiffres || {};
    h += '<p style="margin:0 0 10px">' + esc(phaseTexte(r.saison)) + '</p>';
    h += '<div class="chiffres"><div><b>' + n0(c.inscrits) + '</b><span>' + esc(T('Inscrits')) + '</span></div><div><b>' + n0(c.nations) + '</b><span>' + esc(T('Nations')) + '</span></div>' +
      '<div><b>' + n0(c.eveil) + '</b><span>' + esc(T('En éveil')) + '</span></div><div><b>' + n0(c.pretes) + '</b><span>' + esc(T('Prêtes')) + '</span></div></div>';
    h += '<p class="d" style="margin:8px 0 0">' + esc(T('Les nombres ne sont publiés qu’à partir de {0} inscrits par nation.', nombre(c.seuil) ? c.seuil : null)) + '</p>';
    if(r.eveils === null) h += '<p class="vide">—</p>';
    else if(Array.isArray(r.eveils) && r.eveils.length) h += '<ul style="margin-top:8px">' + r.eveils.map(function(x){ return '<li>' + (x.etat === 'prete' ? TH('{0} est prête.', pays(x.pays)) : TH('{0} s’éveille.', pays(x.pays))) + ' <span class="d">' + esc(dateTexte(x.at)) + '</span></li>'; }).join('') + '</ul>';
    h += lienArene('reveil');
  }
  h += '</section>';
  if(r.saison){
    /* les prochains rendez-vous */
    h += '<section aria-labelledby="hProchains"><h2 id="hProchains">' + esc(T('Prochains rendez-vous')) + '</h2>';
    var maint = Date.now() / 1000;
    if(!Array.isArray(r.prochains)) h += '<p class="vide">—</p>';
    else if(!r.prochains.length) h += '<p class="vide">' + esc(T('Aucun rendez-vous annoncé pour l’instant.')) + '</p>';
    else h += '<ul>' + r.prochains.map(function(e){ var fin = nombre(e.fin) || e.at, passe = Math.max(e.at, fin) < maint, enCours = !passe && nombre(e.fin) && e.at <= maint && maint < e.fin;
      return '<li><div class="l1"><span>' + esc(evTitre(e)) + puces(e) + (enCours && !e.annule ? ' <span class="puce co">' + esc(T('En cours')) + '</span>' : '') + (passe && !e.annule ? ' <span class="puce">' + esc(T('Passé')) + '</span>' : '') + '</span><span class="d">' + esc(quandTexte(e.at)) + '</span></div></li>'; }).join('') + '</ul>';
    h += lienArene('calendrier');
    h += '</section>';
    /* les derniers résultats */
    h += '<section aria-labelledby="hResultats"><h2 id="hResultats">' + esc(T('Derniers résultats')) + '</h2>';
    if(!Array.isArray(r.resultats)) h += '<p class="vide">—</p>';
    else if(!r.resultats.length) h += '<p class="vide">' + esc(T('Aucun résultat validé pour l’instant.')) + '</p>';
    else h += '<ul>' + r.resultats.map(function(x){
      var t = discipline(x.discipline) + (x.categorie === 'espoirs' ? ' · ' + T('Espoirs') : x.categorie === 'pont' ? ' · ' + T('Ponts entre nations') : '');
      var etat = x.corrige ? '<span class="puce re">' + esc(T('Résultat corrigé')) + '</span>' : x.definitif ? '<span class="puce co">' + esc(T('Définitif')) + '</span>' : '<span class="puce">' + esc(T('Peut encore être contesté')) + '</span>';
      var corps = x.categorie === 'pont' ? esc(T('Premier Pont :')) + ' ' + ((x.pont || []).map(function(p){ return listePays(p); }).join(' / ') || '—') : podium(x.podium);
      return '<li><div class="l1"><b>' + esc(t) + '</b>' + etat + '</div><div>' + corps + '</div><div class="d">' + esc(T('Validé le {0}', dateTexte(x.valideA))) + '</div></li>'; }).join('') + '</ul>';
    h += lienArene('vote');
    h += '</section>';
    /* la cérémonie */
    if(r.ceremonie){
      var ce = r.ceremonie, et = {programmee:'Programmée', figee:'Ordre du défilé tiré au sort', en_direct:'En direct', terminee:'Terminée', annulee:'Annulée'}[ce.etat];
      h += '<section aria-labelledby="hCe"><h2 id="hCe">' + esc(T("La cérémonie d'ouverture")) + '</h2><div class="l1"><span>' + esc(et ? T(et) : '—') + (ce.etat !== 'annulee' ? puces({reporte:ce.reporte, avance:ce.avance}) : '') +
        '</span><span class="d">' + esc(quandTexte(ce.debut)) + '</span></div><p class="d" style="margin:6px 0 0">' + esc(T('Gratuit pour tout le monde, en direct dans la Salle Baobab.')) + '</p>' + lienArene('ceremonie') + '</section>';
    }
    /* la Nuit */
    if(r.nuit){
      var n = r.nuit, en = {programmee:'Programmée', en_direct:'En direct', resultats:'Résultats en cours', proclamee:'Proclamée', annulee:'Annulée'}[n.etat];
      h += '<section aria-labelledby="hNuit"><h2 id="hNuit">' + esc(T('La Nuit des Nations')) + '</h2><div class="l1"><span>' + esc(en ? T(en) : '—') + (n.etat === 'programmee' ? puces({reporte:n.reporte, avance:n.avance}) : '') +
        (n.sousReserve ? ' <span class="puce">' + esc(T('Sous réserve d’une réclamation')) + '</span>' : '') + '</span><span class="d">' + esc(quandTexte(n.debut)) + '</span></div>';
      if(n.ville && n.ville.nom) h += '<p class="d" style="margin:4px 0 0">' + esc(T('À {0}', n.ville.nom)) + (n.ville.pays ? ' · ' + pays(n.ville.pays) : '') + '</p>';
      if(Array.isArray(n.nationAnnee) && n.nationAnnee.length) h += '<p style="margin:8px 0 0"><b>' + esc(T('Nation de l’année')) + ' :</b> ' + listePays(n.nationAnnee) + '</p>';
      if(Array.isArray(n.pontAnnee) && n.pontAnnee.length) h += '<p style="margin:4px 0 0"><b>' + esc(T('Pont de l’année')) + ' :</b> ' + n.pontAnnee.map(listePays).join(' / ') + '</p>';
      if(Array.isArray(n.tableau) && n.tableau.length){
        h += '<p class="d" style="margin:10px 0 4px">' + esc(n.provisoire ? T('Tableau provisoire') : T('Tableau des médailles')) + '</p><table><thead><tr><th scope="col">' + esc(T('Nation')) + '</th><th scope="col">' + esc(T('Or')) + '</th><th scope="col">' + esc(T('Argent')) + '</th><th scope="col">' + esc(T('Bronze')) + '</th></tr></thead><tbody>' +
          n.tableau.map(function(t){ return '<tr><td>' + pays(t.pays) + '</td><td>' + n0(t.or) + '</td><td>' + n0(t.argent) + '</td><td>' + n0(t.bronze) + '</td></tr>'; }).join('') + '</tbody></table>';
      }
      h += lienArene('nuit') + '</section>';
    }
  }
  if(r.tronque) h += '<p class="d">' + esc(T('Liste raccourcie pour que le résumé reste léger.')) + '</p>';
  if(r.incomplet) h += '<p class="d">' + esc(T('Une partie du résumé n’a pas pu être lue : « — » veut dire inconnu.')) + '</p>';
  /* les jours */
  h += '<section aria-labelledby="hJours"><h2 id="hJours">' + esc(T('Jours précédents')) + '</h2><div class="jours" id="jours"></div></section>';
  $('contenu').innerHTML = h;
  rendreJours();
}
function rendreJours(){
  var el = $('jours'); if(!el) return;
  var l = tries(), h = '';
  if(l.length) h += '<p class="d" style="margin:0">' + esc(T('Gardés sur ce téléphone, lisibles sans connexion :')) + '</p>' +
    l.map(function(j){ return '<button type="button" data-jour="' + j + '"' + (j === ST.vu ? ' aria-current="true"' : '') + '>' + esc(jourTexte(j)) + '</button>'; }).join('');
  if(ST.serveurJours){
    var autres = ST.serveurJours.filter(function(j){ return !ST.jours[j]; });
    h += autres.length ? '<p class="d" style="margin:10px 0 0">' + esc(T('Sur NEURAVID :')) + '</p>' + autres.map(function(j){ return '<button type="button" data-jour="' + j + '">' + esc(jourTexte(j)) + '</button>'; }).join('')
      : '<p class="d" style="margin:10px 0 0">' + esc(T('Aucun autre jour gardé par NEURAVID.')) + '</p>';
  } else if(!ST.apercu && api() && ST.cap === true) h += '<div><button type="button" class="lien" id="bJours">' + esc(T('Chercher d’autres jours')) + '</button></div>';
  el.innerHTML = h || '<p class="vide">—</p>';
}
function rendrePied(){
  var h = '<label>' + esc(T('Langue')) + ' <select id="langue">' + Object.keys(LANGUES_UI).map(function(k){ return '<option value="' + k + '"' + (k === L ? ' selected' : '') + '>' + esc(LANGUES_UI[k].nom) + '</option>'; }).join('') + '</select></label>';
  if(LANGUES_UI[L].relire) h += '<span>' + esc(T('Traduction en cours de relecture.')) + '</span>';
  h += '<span>' + esc(T('Page légère : elle garde les {0} derniers résumés pour les lire sans connexion, et ne montre aucun nom de personne.', GARDES)) + '</span>';
  $('pied').innerHTML = h;
}
function rendre(){
  document.title = T('La Saison en bref') + ' · NEURAVID';
  $('titre').textContent = T('La Saison en bref');
  $('soustitre').textContent = T('L’essentiel du jour de la Saison des Nations, en version légère.');
  rendreEtat(); rendreActions(); rendreContenu(); rendrePied();
}

/* ── le partage : un texte court, à envoyer par message ── */
function texteResume(r){
  var l = [T('La Saison en bref') + ' · ' + jourTexte(r.jour)];
  if(!r.saison) l.push(T('Aucune Saison n’est annoncée pour l’instant.'));
  else {
    var c = r.chiffres || {};
    l.push(phaseTexte(r.saison));
    l.push(T('Inscrits') + ' : ' + n0(c.inscrits) + ' · ' + T('Nations') + ' : ' + n0(c.nations) + ' · ' + T('En éveil') + ' : ' + n0(c.eveil) + ' · ' + T('Prêtes') + ' : ' + n0(c.pretes));
    var maint = Date.now() / 1000;    /* un résumé ancien relu hors connexion : jamais un rendez-vous passé présenté comme à venir */
    (r.prochains || []).filter(function(e){ return Math.max(e.at, nombre(e.fin) || e.at) >= maint; }).slice(0, 3).forEach(function(e){
      l.push('• ' + evTitre(e) + ' — ' + quandTexte(e.at) + (e.annule ? ' (' + T('Annulé') + ')' : e.reporte ? ' (' + T('Reporté') + ')' : e.avance ? ' (' + T('Avancé') + ')' : '')); });
    (r.resultats || []).slice(0, 3).forEach(function(x){
      if(x.categorie === 'pont') l.push('• ' + discipline(x.discipline) + ' — ' + T('Premier Pont :') + ' ' + ((x.pont || []).map(function(p){ return (p || []).map(paysTexte).join(' + '); }).join(' / ') || '—'));
      else l.push('• ' + discipline(x.discipline) + ' — ' + T('Or') + ' : ' + (((x.podium || {}).or || []).map(paysTexte).join(', ') || '—'));
    });
    if(r.nuit && Array.isArray(r.nuit.nationAnnee) && r.nuit.nationAnnee.length) l.push(T('Nation de l’année') + ' : ' + r.nuit.nationAnnee.map(paysTexte).join(', '));
  }
  l.push('https://www.neuravid.com/');
  return l.join('\n');
}
function partager(){
  var r = courant(); if(!r) return;
  var t = texteResume(r), copier = function(){
    var fait = function(){ toast(T('Résumé copié.')); };
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(fait, function(){ toast(T('Impossible de copier sur ce téléphone.')); }); return; } }catch(e){}
    toast(T('Impossible de copier sur ce téléphone.'));
  };
  emit('saison_resume_partage', {jour:r.jour});   /* une simple trace : le partage passe par navigator.share (le pont de l'application le prend) */
  if(navigator.share) navigator.share({title:T('La Saison en bref'), text:t}).catch(function(e){ if(e && e.name !== 'AbortError') copier(); });
  else copier();
}

/* ── l'aperçu (démonstration seulement) ── */
function demoJours(){
  var now = Math.floor(Date.now() / 1000), J = 86400, j0 = new Date(now * 1000), out = {};
  function jour(t){ var d = new Date(t * 1000); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
  var r = {v:1, jour:jour(now), genere:now - 1200, serveurMaintenant:now - 1200, saison:{id:'s2027', ouverture:now - 40 * J, cloture:now - 12 * J, phase:'competition'},
    chiffres:{inscrits:4826, nations:41, eveil:23, pretes:18, seuil:5}, eveils:[{pays:'CM', etat:'prete', at:now - 5 * 3600}, {pays:'KE', etat:'eveil', at:now - 30 * 3600}],
    prochains:[{id:'ep_a1', type:'vote_fin', at:now + 2 * J, fin:null, annule:false, discipline:'danse'}, {id:'ec_b2', type:'echauffement', at:now + 3 * J, fin:now + 6 * J, annule:false, discipline:'conte'},
      {id:'ce_c3', type:'ceremonie', at:now + 9 * J, fin:now + 9 * J + 7200, annule:false}, {id:'nu_d4', type:'nuit', at:now + 30 * J, fin:null, annule:false, ville:'Dakar', reporte:true}],
    resultats:[{id:'ep_e5', discipline:'chant', categorie:'generale', phase:'continentales', definitif:false, corrige:false, valideA:now - 8 * 3600, podium:{or:['SN'], argent:['GH'], bronze:['GN']}},
      {id:'ep_f6', discipline:'gastronomie', categorie:'espoirs', phase:'continentales', definitif:true, corrige:false, valideA:now - 2 * J, podium:{or:['CI'], argent:['ML'], bronze:['BF']}},
      {id:'ep_g7', discipline:'danse', categorie:'generale', phase:'continentales', definitif:true, corrige:true, valideA:now - 3 * J, podium:{or:['NG'], argent:['CD'], bronze:['TZ']}}],
    nuit:{id:'nu_d4', etat:'programmee', debut:now + 30 * J, ville:{nom:'Dakar', pays:'SN'}, reporte:true, sousReserve:false, tableau:null, nationAnnee:null, pontAnnee:null},
    ceremonie:{id:'ce_c3', etat:'programmee', debut:now + 9 * J, reporte:false}};
  out[r.jour] = {r:r, e:'apercu-1', recu:Date.now()};
  var r2 = JSON.parse(JSON.stringify(r)); r2.jour = jour(now - J); r2.genere = now - J - 3600; r2.chiffres = {inscrits:4790, nations:40, eveil:23, pretes:17, seuil:5}; r2.eveils = [{pays:'KE', etat:'eveil', at:now - 30 * 3600}]; r2.resultats = r2.resultats.slice(1);
  out[r2.jour] = {r:r2, e:'apercu-2', recu:Date.now()};
  return out;
}

/* ── le démarrage ── */
function demarrer(){
  poserLangue(langueDetectee());
  ST.apercu = !!window.NV_DEMO && !api(); posercles();
  ST.jours = ST.apercu ? demoJours() : chargerGardes();
  ST.vu = tries()[0] || null;
  rendre();
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if(!b) return;
    if(b.id === 'bMaj') actualiser(true);
    else if(b.id === 'bPartager') partager();
    else if(b.id === 'bJours') chercherJours();
    else if(b.id === 'bPresse') ouvrir('Presse', {depuis:'saison_en_bref'});
    else if(b.getAttribute('data-jour')) ouvrirJour(b.getAttribute('data-jour'));
    else if(b.getAttribute('data-vue')) ouvrir('Arena', {vue:b.getAttribute('data-vue'), depuis:'saison_en_bref'});
  });
  document.addEventListener('change', function(ev){
    if(ev.target && ev.target.id === 'langue'){ var l = ev.target.value; if(!LANGUES_UI[l]) return; ecrire('nv_ui_langue', l); NOMS = null; poserLangue(l); rendre(); var s = $('langue'); if(s) s.focus(); }
  });
  window.addEventListener('online', function(){ actualiser(false); });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible' && Date.now() - ST.dernier > RELIRE_APRES) actualiser(false); });
  /* la page elle-même reste dans le téléphone (réseau d'abord, la copie gardée sans réseau) : le même service que l'accueil */
  try{ if('serviceWorker' in navigator && location.protocol === 'https:' && !ST.apercu) navigator.serviceWorker.register(typeof window.NV_SW_URL === 'string' && window.NV_SW_URL ? window.NV_SW_URL : 'sw-tamtam.js').catch(function(){}); }catch(e){}
  if(!ST.apercu && api()) actualiser(false);
  window.NVSaison = {etat:function(){ return {etat:ST.etat, vu:ST.vu, jours:tries(), apercu:ST.apercu, langue:L}; }, texte:function(){ var r = courant(); return r ? texteResume(r) : null; }};
}

demarrer();
})();

</script>
