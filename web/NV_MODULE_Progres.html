/* ══ NV_CAMERA — EMBARQUÉ ════════════════════════════════════

/* ═══════════════════════════════════════════════════════════════════
   NEURAVID — NV_CAMERA.js
   Le bouton « Filmer » d'un défi ouvre la caméra du Studio créatif.

   À embarquer dans les 16 modules de défi ET dans NV_MODULE_Create.html.

   ── POURQUOI ─────────────────────────────────────────────────────────
   Chaque défi a son propre enregistreur. Il fonctionne, il grave les
   filtres et le logo dans l'image — mais il s'arrête là. La caméra du
   Studio sait faire beaucoup plus, et elle existe déjà :

       double caméra (médaillon, haut/bas, gauche/droite)
       masques qui suivent le visage
       effets pluie, neige, étincelles
       filtres gravés dans l'image enregistrée
       photo, montage, galerie

   Une personne qui veut participer à un défi n'a aucune raison d'avoir
   moins d'outils que quelqu'un qui filme pour rien.

   ── LA DIFFICULTÉ RÉELLE ─────────────────────────────────────────────
   Le Studio est un AUTRE fichier. Changer de page perd tout : le
   contexte du défi, et surtout la vidéo elle-même — un Blob ne
   traverse pas une navigation.

   IndexedDB, si. C'est la seule voie, et Create s'en sert déjà pour
   son relais. On l'emprunte :

       1. le défi range son contexte et ouvre le Studio
       2. la personne filme avec tous les outils
       3. le Studio range la vidéo dans IndexedDB et revient au défi
       4. le défi la reprend et la présente comme sa propre prise

   ── CE QU'ON NE FAIT PAS ─────────────────────────────────────────────
   On ne copie pas la caméra du Studio dans les seize défis. Elle pèse
   plus de trois cents kilo-octets, et seize copies divergeraient au

function heureTexte(h){ var n = nombre(h); if(n == null) return '—'; var d = new Date(2026, 0, 1, n, 0); try{ return d.toLocaleTimeString(LOC, {hour:'2-digit', minute:'2-digit'}); }catch(e){ return n + ':00'; } }
function domaine(k){ var c = DOMAINES[k]; return c ? T(c[0]) : '—'; }
function glyphe(k){ var c = DOMAINES[k]; return c ? c[1] : '✨'; }

var ST = {apercu:false, repli:false, cap:null, etat:'', vue:'moi', liste:null, parcours:null, moiSrv:null, prise:null, form:{note:''},
  nouveau:null, envoi:false, sur:{}, occupe:{}, focusVers:null, cles:{}};
function cleFilm(){ return 'nv_progres_film|' + compte(); }

function appeler(methode, chemin, corps, cle){
  var h = {Accept:'application/json'}; if(jeton()) h.Authorization = 'Bearer ' + jeton();
  if(methode !== 'GET') h['Idempotency-Key'] = cle || ('jp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
  var o = {method:methode, headers:h, mode:'cors', cache:'no-cache'};
  if(corps instanceof FormData) o.body = corps; else if(corps){ h['Content-Type'] = 'application/json'; o.body = JSON.stringify(corps); }
  return fetch(api() + chemin, o).then(function(r){
    return r.text().then(function(t){ var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){ j = null; }
      if(!r.ok){ var err = new Error('http ' + r.status); err.status = r.status; err.code = j && (j.erreur || j.code); err.params = j && j.params || {}; throw err; } return j; });
  });
}
/* une clé par geste, gardée jusqu'à une réponse sûre : un nouvel essai après une réponse perdue ne refait rien */
function cleGeste(k){ return ST.cles[k] || (ST.cles[k] = 'jp-' + k.replace(/[^\w-]/g, '').slice(0, 40) + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)); }
function finGeste(k, e){ if(!e || (e.status && e.status < 500 && e.status !== 408 && e.status !== 429)) delete ST.cles[k]; }
function emit(type, payload){
  var msg = {source:'neuravid', module:MOI, type:type, payload:payload || {}};
  if(window.NVemit && !window.NVemit.__nvLocal){ try{ window.NVemit(type, msg.payload); }catch(e){} }
  try{ if(window.flutter_inappwebview) window.flutter_inappwebview.callHandler('nvEvent', msg); }catch(e){}
  try{ window.dispatchEvent(new CustomEvent('nv:' + type, {detail:msg.payload})); }catch(e){}
}
var toastT = 0;
function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('on'); }, 3400); }
var ERREURS = {age_minimum:N('Cette action n’est pas ouverte à votre âge.'), moderation:N('Un texte n’a pas été accepté. Changez-le.'),
  trop_long:N('Une vidéo d’une minute au plus.'), fichier_trop_grand:N('Cette vidéo est trop lourde.'), video_manquante:N('Ajoutez une vidéo.'),
  trop_de_parcours:N('Vous avez déjà 3 parcours en cours. Terminez-en un ou arrêtez-le.'), deja_aujourdhui:N('La vidéo d’aujourd’hui est déjà dans votre journal.'),
  parcours_fini:N('Ce parcours est terminé.'), parcours_inconnu:N('Ce parcours n’est plus disponible.'), chemin_inconnu:N('Ce chemin n’est plus disponible.'),
  entree_inconnue:N('Cette vidéo n’est plus dans le journal.'), jamais_pour_soi:N('Pas pour votre propre parcours.'),
  trop_de_demandes:N('Trop de demandes. Réessayez plus tard.'),
  corps_interdit:N('Ici, on fait progresser une compétence : jamais un corps ni un poids. Changez votre texte.'),
  prise_jour_passe:N('Cette vidéo a été filmée un jour déjà passé. Filmez celle d’aujourd’hui.'),
  moderation_indisponible:N('Votre texte ne peut pas être vérifié pour le moment. Réessayez dans un instant.'),
  video_retiree:N('Cette vidéo n’est plus disponible.'),
  cle_reutilisee:N('Cette action a déjà été envoyée. Rechargez la page.'),
  publication_injoignable:N('Le service est momentanément indisponible. Réessayez dans un instant.'),
  publication_indisponible:N('Le service est momentanément indisponible. Réessayez dans un instant.')};
function erreurTexte(e){
  var c = e && e.code;
  if(c === 'champ_invalide') return T('Vérifiez le formulaire : un champ n’est pas rempli comme il faut.');
  if(c === 'deja_aujourdhui' && e.params && e.params.prochainJour) return T('La vidéo d’aujourd’hui est déjà dans votre journal.') + ' ' + T('Prochaine vidéo à partir du {0}.', momentTexte(e.params.prochainJour));
  if(c && ERREURS[c]) return T(ERREURS[c]);
  if(e && e.status === 401) return T('Connectez-vous pour continuer.');
  return navigator.onLine === false ? T('Pas de connexion pour le moment.') : T('Impossible de joindre NEURAVID pour le moment.');
}
function ouvrir(id, ctx){
  var base = window.NV_MODULES_BASE ? String(window.NV_MODULES_BASE).replace(/\/?$/, '/') : '', url = base + 'NV_MODULE_' + id + '.html';
  emit('open_module', {target:'NV' + id, url:url, contexte:ctx || null});
  try{ if(ctx) sessionStorage.setItem('nv_ctx_' + id, JSON.stringify(ctx)); }catch(e){}
  if(window.flutter_inappwebview) return;
  if(window.NVLien && typeof window.NVLien.ouvrir === 'function'){ try{ window.NVLien.ouvrir('NV' + id, ctx); return; }catch(e){} }
  try{ location.href = url; }catch(e){}
}

function chargerCap(){
  if(ST.apercu){ ST.cap = {progres:true, secondesMax:60, parcoursMax:3, participer:true, rappels:true}; return Promise.resolve(); }
  if(!api()){ ST.cap = null; ST.etat = 'sansserveur'; return Promise.resolve(); }
  return appeler('GET', '/v1/progres/capacites').then(function(c){ ST.cap = c && c.progres === true ? c : null; if(!ST.cap) ST.etat = 'indisponible'; });
}
function chargerMoi(){
  ST.vue = 'moi'; ST.parcours = null;
  if(ST.apercu){ if(!ST.moiSrv) ST.moiSrv = demo().moi; ST.etat = 'ok'; ST.focusVers = 'hMoi'; rendre(); return Promise.resolve(); }
  if(!jeton()){ ST.etat = 'ok'; rendre(); return Promise.resolve(); }
  ST.etat = 'charge'; rendre();
  return appeler('GET', '/v1/progres/moi').then(function(o){ ST.moiSrv = o; ST.etat = 'ok'; suivreFuseau(); }, function(e){ ST.etat = 'ok'; toast(erreurTexte(e)); }).then(function(){ ST.focusVers = 'hMoi'; rendre(); });
}
/* le rappel suit le téléphone : un voyage ou l'heure d'été → le nouveau fuseau est envoyé, sans bruit (même heure choisie) */
function suivreFuseau(){
  var fz = fuseauIci(), dec = -new Date().getTimezoneOffset(); if(ST.apercu || !fz) return;
  ((ST.moiSrv && ST.moiSrv.parcours) || []).forEach(function(x){
    if(x.etat !== 'actif' || !x.rappel || nombre(x.heure) == null || x.fuseau === fz) return;
    var corps = {actif:true, heure:x.heure, decalage:dec, fuseau:fz};
    appeler('POST', '/v1/progres/parcours/' + encodeURIComponent(x.id) + '/rappel', corps, 'jpf-' + x.id + '-' + empreinte(corps)).then(function(){ x.fuseau = fz; }, function(){});
  });
}
function chargerListe(){
  ST.vue = 'decouvrir'; ST.parcours = null;
  if(ST.apercu){ ST.liste = demo().liste; ST.etat = 'ok'; ST.focusVers = 'hChemins'; rendre(); return Promise.resolve(); }
  ST.etat = 'charge'; rendre();
  return appeler('GET', '/v1/progres').then(function(o){ ST.liste = o; ST.etat = 'ok'; }, function(){ ST.etat = navigator.onLine === false ? 'horsligne' : 'erreur'; })
    .then(function(){ ST.focusVers = 'hChemins'; rendre(); });
}
function chargerParcours(id){
  ST.vue = 'parcours'; ST.parcours = null; ST.sur = {};
  if(ST.apercu){ ST.parcours = demo().details[id] || ((ST.moiSrv && ST.moiSrv.parcours) || []).filter(function(x){ return x.id === id; })[0] || null; ST.focusVers = 'hParcours'; rendre(); return Promise.resolve(); }
  ST.etat = 'charge'; rendre();
  return appeler('GET', '/v1/progres/parcours/' + encodeURIComponent(id)).then(function(x){ ST.parcours = x; ST.etat = 'ok'; emit('progres_voir', {parcours:id}); },
    function(e){ ST.etat = 'ok'; toast(erreurTexte(e)); ST.vue = 'moi'; }).then(function(){ ST.focusVers = ST.parcours ? 'hParcours' : 'hMoi'; rendre(); });
}

function rendreEtat(){
  var el = $('etat'), t = '';
  if(ST.apercu) t = ST.repli ? T('Aperçu : ce serveur ne propose pas encore cette fonction. Rien n’est envoyé.') : T('Aperçu : des parcours d’exemple, pour découvrir la page.');
  else if(ST.etat === 'charge') t = T('Chargement…');
  else if(ST.etat === 'sansserveur' || ST.etat === 'indisponible') t = T('Le Chemin du progrès n’est pas encore ouvert.');
  else if(ST.etat === 'horsligne') t = T('Pas de connexion pour le moment.');
  else if(ST.etat === 'erreur') t = T('Impossible de joindre NEURAVID pour le moment.');
  el.textContent = t; el.hidden = !t;
}

}
function apercuPuce(){ return ST.apercu ? '<span class="apercu">' + esc(T('Aperçu')) + '</span>' : ''; }
function joursHex(x, grand){
  /* les jours vraiment tenus, donnés par le serveur (jamais devinés à partir du nombre) */
  var n = nombre(x.jours) || 0, faits = {}, j = nombre(x.jour);
  (Array.isArray(x.joursTenus) ? x.joursTenus : (x.entrees || []).map(function(e){ return e.jour; })).forEach(function(d){ faits[d] = true; });
  var h = '<div class="jours-hex' + (grand ? ' grand' : '') + '" role="img" aria-label="' + esc(T('{0} jours sur {1}', nb(x.tenus), nb(x.jours))) + '">';
  for(var i = 1; i <= Math.min(n, 30); i++) h += '<i class="' + (faits[i] ? 't' : (i === j && x.etat === 'actif' ? 'a' : '')) + '"></i>';
  return h + '</div>';
}
function jourTexte(x){
  if(x.etat === 'termine') return x.reussi ? T('Parcours tenu : {0} jours sur {1}', nb(x.tenus), nb(x.jours)) : T('Terminé : {0} jours sur {1}', nb(x.tenus), nb(x.jours));
  if(x.etat === 'arrete') return T('Arrêté : {0} jours sur {1}', nb(x.tenus), nb(x.jours));
  return T('Jour {0} sur {1}', nb(x.jour), nb(x.jours));
}
