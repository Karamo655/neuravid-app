.chips button{min-height:40px;padding:4px 12px;font-size:.88rem;border-radius:999px}
.chips button[aria-pressed="true"]{border-color:var(--or);color:var(--or)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:.88rem;color:var(--brume)}
input,textarea{font:inherit;color:var(--craie);background:var(--alv);border:1px solid var(--trait);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.btn-or{background:linear-gradient(135deg,var(--or),#ff9f1c);color:#2a1a00;border:0;font-weight:800}
.regle{font-size:.82rem;color:var(--brume);margin:6px 0 0}
.retour{margin:0 0 10px}
select.plein{width:100%;min-height:44px}
h3{font-size:.95rem;margin:12px 0 6px}
.case{display:flex!important;flex-direction:row!important;align-items:flex-start;gap:8px;color:var(--craie)!important;font-size:.88rem}
.case input{width:22px;height:22px;min-height:0;flex:none;margin-top:2px}
.choix{display:flex;flex-wrap:wrap;gap:6px}
.choix label{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:6px;min-height:44px;padding:4px 12px;border:1px solid var(--trait);border-radius:999px;color:var(--craie)!important;cursor:pointer}
.choix input{width:18px;height:18px;min-height:0}
.choix label:has(input:checked){border-color:var(--id1);color:var(--id1)!important}
fieldset{border:1px solid var(--trait);border-radius:10px;padding:6px 10px;min-width:0;margin:0}
fieldset legend{font-size:.88rem;color:var(--brume);padding:0 4px}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-size:.88rem;color:var(--id1);font-weight:700}
.danger{color:var(--rouge)!important;border-color:var(--rouge)!important}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:.72rem;font-weight:800;border:1px solid var(--trait);color:var(--brume)}
.badge::before{content:"";width:10px;height:9px;clip-path:var(--hex);background:currentColor}
.badge.femmes{color:var(--id1);border-color:var(--id1)} .badge.jeunes{color:var(--cyan);border-color:var(--cyan)} .badge.anim{color:var(--or);border-color:var(--or)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
/* Les communautés : chaque thème est un hexagone, les membres se rassemblent autour */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:0 0 12px}
.themes button{display:grid;justify-items:center;gap:4px;padding:8px 4px;min-height:84px;border-radius:14px;font-size:.8rem;line-height:1.15;text-align:center}
.themes button span{width:40px;height:36px;clip-path:var(--hex);background:var(--alv);display:grid;place-items:center;font-size:1.2rem}
.themes button[aria-pressed="true"]{border-color:var(--id1);color:var(--id1)}
.themes button[aria-pressed="true"] span{background:linear-gradient(135deg,var(--id1),var(--id2))}
.cartes{display:grid;gap:10px}
.cmc{background:var(--alv);border:1px solid var(--trait);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;min-width:0}
.cmc .hx{width:52px;height:46px;clip-path:var(--hex);background:linear-gradient(135deg,var(--id1),var(--id2));display:grid;place-items:center;font-size:1.35rem}
.cmc.membre{border-color:var(--id1)}
.cmc h3{margin:0;font-size:.98rem;line-height:1.25}
.cmc h3 button{all:unset;cursor:pointer;color:var(--craie);font-weight:700;min-height:44px;display:inline-flex;align-items:center;overflow-wrap:anywhere}
.cmc h3 button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.cmc p{margin:0;font-size:.84rem}
.charte{white-space:pre-wrap;font-size:.86rem;border-inline-start:3px solid var(--id1);padding:4px 10px;margin:6px 0;background:rgba(255,111,177,.06);border-radius:0 8px 8px 0}
.msgs{display:grid;gap:8px;margin-top:10px}
.msg{background:var(--alv);border:1px solid var(--trait);border-radius:14px;padding:8px 10px;display:grid;gap:4px;min-width:0}
.msg.mien{border-color:rgba(255,111,177,.55)}
.msg.cote{border-style:dashed;opacity:.85}
.msg .t{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .q{font-size:.8rem;color:var(--brume);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.msg .q b{color:var(--craie)}
.msg .actions{margin:2px 0 0;gap:6px}
.msg .actions button{flex:0 1 auto;min-height:40px;padding:4px 10px;font-size:.84rem}
.reps{display:grid;gap:6px;margin-inline-start:14px;padding-inline-start:10px;border-inline-start:2px solid var(--trait)}
.defi{background:var(--alv);border:1px solid var(--trait);border-radius:14px;padding:10px 12px;display:grid;gap:6px;margin:0 0 8px}
.defi h3{margin:0}
.defi.reussi{border-color:var(--or)}
.barre{height:14px;border-radius:999px;background:var(--nuit2);overflow:hidden}
.barre i{display:block;height:100%;background:linear-gradient(90deg,var(--id1),var(--id2))}
.salon{border:1px solid var(--id2);border-radius:12px;padding:10px 12px;background:linear-gradient(160deg,rgba(185,140,255,.14),var(--nuit2) 60%)}
.signal{border:1px solid var(--rouge);border-radius:12px;padding:8px 10px;display:grid;gap:8px}
.etat-c{display:inline-block;padding:0 8px;border-radius:999px;font-size:.74rem;font-weight:700;border:1px solid var(--trait)}
.etat-c.revue,.etat-c.masque{color:var(--rouge);border-color:var(--rouge)}
.file{padding:10px 0;border-top:1px solid var(--trait);display:grid;gap:6px}
.file:first-of-type{border-top:0}
.file p{margin:0}
.compteur{font-size:.78rem;color:var(--brume);text-align:end;margin:-4px 0 0}
/* Identité de la nouveauté : le rose des créatrices et le violet de la sororité */
:root{--id1:#ff6fb1;--id2:#b98cff}
header{position:relative}
header::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--id1),var(--id2))}
.hex{background:linear-gradient(135deg,var(--id1),var(--id2))}
h2::before{background:linear-gradient(135deg,var(--id1),var(--id2))}
h2[tabindex="-1"]:focus{outline:none}
.cmc h2::before{display:none}
.cmc h2{margin:0}
</style>
</head>

ngola ndako mpo na bato ya lisanga","Toucher encore pour ouvrir":"Simba lisusu mpo na kofungola","Les salons sont privés aux membres et jamais en tête-à-tête : il faut au moins 3 membres.":"Bandako ezali kaka mpo na bato ya lisanga mpe bato mibale kaka te ata moke: esengeli bato ya lisanga 3 to koleka.","Chez les jeunes, une personne ne reste jamais seule avec moins de 2 autres membres : le salon se ferme.":"Epai ya bilenge, moto moko te atikalaka na bato ya lisanga mosusu na nse ya 2: ndako ekangamaka.","Le salon est ouvert. Les membres sont prévenus.":"Ndako efungwami. Bato ya lisanga bayebisami.","Le salon est fermé.":"Ndako ekangami.","Aperçu : le salon s’ouvrirait dans la Salle Baobab.":"Emoniseli: ndako elingaki kofungwama na Salle Baobab.","Il faut au moins {0} autres membres pour ouvrir un salon : jamais en tête-à-tête.":"Esengeli bato mosusu ya lisanga {0} to koleka mpo na kofungola ndako: bato mibale kaka te ata moke.","Les salons en direct ne sont pas encore ouverts.":"Bandako ya mbala moko efungwami naino te.","Le mentorat":"Bokambami","Apprendre avec des personnes expérimentées, en groupe et en toute sécurité.":"Koyekola epai ya bato ya mayele, na etuluku mpe na kimya.","Le Cercle des aînées":"Lisanga ya bamama ya mayele","L’Académie des talents":"Eteyelo ya makoki","Les animatrices":"Bakambi","Merci ! Vous animez maintenant cette communauté.":"Matondi! Sikoyo ozali kokamba lisanga oyo.","Un compte vérifié est nécessaire.":"Esengeli kɔnti oyo endimami.","Créer une communauté":"Kokela lisanga","Créer la communauté":"Kokela lisanga oyo","La communauté est créée.":"Lisanga ekelami.","Messages signalés":"Bansango oyo eyebisami","Aucun message signalé.":"Nsango moko te eyebisami.","Vous avez signalé ce message : une autre personne de l’équipe décide.":"Oyebisaki nsango oyo: moto mosusu ya etuluku nde akozwa mokano.","Ce message a déjà été traité.":"Nsango oyo esili kotalelama.","Signalé":"Eyebisami","Personne exclue":"Moto abimisami","Écarts répétés":"Mabunga oyo ezongelami","Animatrices : {0}":"Bakambi: {0}","Nommer une animatrice (@pseudo)":"Pona mokambi (@nkombo)","C’est fait. Elle doit accepter elle-même.":"Esili. Ye moko asengeli kondima.","Exclure une personne (@pseudo)":"Kobimisa moto (@nkombo)","Exclure":"Kobimisa","Toucher encore pour exclure":"Simba lisusu mpo na kobimisa","La personne est exclue de cette communauté.":"Moto abimisami na lisanga oyo.","Fermer la communauté":"Kanga lisanga","La communauté est fermée.":"Lisanga ekangami.","Aucune communauté pour le moment.":"Lisanga moko te naino.","Une animatrice doit avoir 18 ans.":"Mokambi asengeli kozala na mbula 18.","Cette communauté a déjà 8 animatrices.":"Lisanga oyo esili kozala na bakambi 8.","Cette personne est introuvable.":"Moto oyo azwami te.","Écrivez un @pseudo.":"Komá @nkombo moko.","Dès 13 ans. Gratuit, sans argent ni vote.":"Kobanda mbula 13. Ofele, mbongo te mpe kopona te.","Ce message est en cours de relecture par l’équipe : il ne peut plus être retiré.":"Etuluku ezali kotala nsango oyo: ekoki lisusu kolongolama te.","Vous ne pouvez pas entrer dans ce salon.":"Okoki kokɔta na ndako oyo te.","Comment ça marche":"Ndenge esalaka","Ce qui vous protège":"Oyo ebatelaka yo","Bientôt ouvert ici. Voici ce qui vous attend.":"Ekofungwama awa mosika te. Tala oyo ezali kozela yo.","Rejoignez une communauté qui vous ressemble, en acceptant sa charte.":"Kɔtá na lisangá oyo ekokani na yo na kondima mobeko na yango.","Parlez, apprenez et relevez des défis ensemble.":"Solola, yekola mpe bósala mitako elongo.","Retrouvez-vous en direct dans un salon privé de la Salle Baobab.":"Bókutana na mbala moko na ndako ya sekele ya Ndako ya Baobab.","L’adhésion est facultative : vous partez quand vous voulez.":"Kokɔta ezali na bonsomi : okoki kobima ntango nyonso olingi.","Pas de numéro, pas de courriel, des messages relus et un rythme lent.":"Nimero te, imeli te, nsango etalami mpe ezali malɛmbɛ.","Signaler, bloquer et protéger en un geste ; une équipe veille.":"Kolakis function deuxTouchers(cle){ if(ST.sur[cle]){ delete ST.sur[cle]; return true; } ST.sur[cle] = true; rendre(); setTimeout(function(){ if(ST.sur[cle]){ delete ST.sur[cle]; rendre(); } }, 5000); return false; }
function geste(k, methode, chemin, corps, apercu, ok){
  if(ST.occupe[k]) return; ST.occupe[k] = true; rendre();
  var kc = k + '-' + empreinte(JSON.stringify(corps || {}));       /* une clé par geste ET par contenu : un autre texte n'est jamais « déjà envoyé » */
  var p = ST.apercu ? Promise.resolve(apercu()) : appeler(methode, chemin, corps, cleGeste(kc));
  p.then(function(o){ delete ST.occupe[k]; finGeste(kc); ok(o || {}); }, function(e){ delete ST.occupe[k]; finGeste(kc, e); toast(erreurTexte(e)); rendre(); });
}
function empreinte(t){ var h = 5381; for(var i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h.toString(36); }

var relire = 0;
function changerVue(v){ ST.sur = {}; if(v === 'equipe') return chargerEquipe(); return chargerListe(); }
function demarrer(){
  poserLangue(langueDetectee());
  ST.apercu = !api();
  if(ST.apercu && !utilisateur()){ try{ window.NV_USER = {id:'demo', handle:'visiteur', prenom:'Aya', age:25, majeur:true, iso:'GN'}; }catch(e){} }
  var ctx = null;
  try{ ctx = JSON.parse(sessionStorage.getItem('nv_ctx_' + MOI) || 'null'); sessionStorage.removeItem('nv_ctx_' + MOI); }catch(e){}
  if(ctx && typeof ctx.theme === 'string' && THEMES[ctx.theme]) ST.theme = ctx.theme;
  rendre();
  chargerCap().catch(function(e){ ST.cap = null; ST.etat = e && e.status && e.status < 500 ? 'indisponible' : navigator.onLine === false ? 'horsligne' : 'erreur'; })
    .then(function(){ if(!ST.cap) return rendre(); return chargerMoi().then(function(){
      if(ctx && typeof ctx.communaute === 'string' && /^[\w-]{1,64}$/.test(ctx.communaute)) return chargerUn(ctx.communaute, ctx.defi ? 'defis' : ctx.vue === 'salon' ? 'salon' : 'discussion');
      if(ctx && ctx.vue === 'equipe' && equipeVisible()) return chargerEquipe();
      return chargerListe(); }); });
  /* la discussion se relit toute seule toutes les 30 s, page visible et rien en cours d'écriture */
  relire = setInterval(function(){ if(document.hidden || ST.apercu || ST.vue !== 'un' || ST.onglet !== 'discussion' || ST.signaler || ST.masquer) return; chargerMsgs(); }, 30000);
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if(!b) return;
    var a = function(k){ return b.getAttribute(k); };
    if(a('data-vue')) changerVue(a('data-vue'));
    else if(a('data-theme') !== null && b.closest('.themes')){ ST.theme = a('data-theme'); chargerListe(); }
    else if(a('data-ouvrir')) chargerUn(a('data-ouvrir'), 'discussion');
    else if(a('data-onglet')){ ST.onglet = a('data-onglet'); ST.sur = {}; ST.signaler = null; ST.masquer = null; rendre(); if(ST.onglet === 'discussion') chargerMsgs(); }
    else if(a('data-repondre')){ ST.repondre = a('data-repondre'); rendre(); var t = $('mTexte'); if(t) t.focus(); }
    else if(a('data-retirer-msg')) retirerMsg(a('data-retirer-msg'));
    else if(a('data-signaler')){ ST.signaler = a('data-signaler'); ST.masquer = null; ST.sig = {motif:'', detail:'', proteger:false}; rendre(); var r = document.querySelector('input[name="sMotif"]'); if(r) r.focus(); }
    else if(a('data-masquer')){ ST.masquer = a('data-masquer'); ST.signaler = null; rendre(); var k = $('kMotif'); if(k) k.focus(); }
    else if(a('data-fermer')){ ST.signaler = null; ST.masquer = null; rendre(); }
    else if(a('data-participer')) participer(a('data-participer'), a('data-etat'));
    else if(a('data-aller')) allerDefi(a('data-aller'));
    else if(a('data-annuler-defi')) annulerDefi(a('data-annuler-defi'));
    else if(a('data-quitter-grandi')) quitterGrandi(a('data-quitter-grandi'));
    else if(a('data-decider')) decider(a('data-decider'), a('data-action'));
    else if(a('data-fermer-cm')) fermerCm(a('data-fermer-cm'));
    else if(b.id === 'bSansRep'){ ST.repondre = null; rendre(); }
    else if(b.id === 'bPlus') chargerMsgs(true);
    else if(b.id === 'bCharte') accepterCharte();
    else if(b.id === 'bQuitter') quitter();
    else if(b.id === 'bSalonOuvrir') salonOuvrir();
    else if(b.id === 'bSalonRejoindre') salonRejoindre();
    else if(b.id === 'bSalonFermer') salonFermer();
    else if(b.id === 'bAines'){ emit('communautes_mentorat', {vers:'Aines'}); ouvrir('Aines', {domaine:ST.un.mentorat.aines, depuis:MOI}); }
    else if(b.id === 'bAcademie'){ emit('communautes_mentorat', {vers:'Academie'}); ouvrir('Academie', {categorie:ST.un.mentorat.academie, depuis:MOI}); }
  });
  document.addEventListener('change', function(ev){
    var t = ev.target; if(!t) return;
    if(t.id === 'langue'){ var l = t.value; if(!LANGUES_UI[l]) return; ecrire('nv_ui_langue', l); poserLangue(l); lireDefi(); lireCreer(); rendre(); var s = $('langue'); if(s) s.focus(); }
    else if(t.id === 'rCharte') ST.rejoindre.charte = t.checked;
    else if(t.id === 'rFemme') ST.rejoindre.femme = t.checked;
    else if(t.name === 'sMotif' && ST.sig) ST.sig.motif = t.value;
    else if(t.id === 'sProteger' && ST.sig) ST.sig.proteger = t.checked;
    else if(/^exm-/.test(t.id)) (ST.gestion[t.id.slice(4)] = ST.gestion[t.id.slice(4)] || {}).exm = t.value;
    else if(t.closest && t.closest('#fDefi')) lireDefi();
    else if(t.closest && t.closest('#fCreer')) lireCreer();
  });
  document.addEventListener('input', function(ev){
    var t = ev.target; if(!t) return;
    if(t.id === 'mTexte'){ ST.texte = t.value; var c = $('mCompte'); if(c) c.textContent = t.value.length + ' / ' + ((ST.cap && ST.cap.messageMax) || 800); }
    else if(t.id === 'sDetail' && ST.sig) ST.sig.detail = t.value;
    else if(/^an-/.test(t.id)) (ST.gestion[t.id.slice(3)] = ST.gestion[t.id.slice(3)] || {}).anim = t.value;
    else if(/^ex-/.test(t.id)) (ST.gestion[t.id.slice(3)] = ST.gestion[t.id.slice(3)] || {}).excl = t.value;
    else if(t.closest && t.closest('#fDefi')) lireDefi();
    else if(t.closest && t.closest('#fCreer')) lireCreer();
  });
  document.addEventListener('toggle', function(ev){ var d = ev.target; if(d && d.id === 'dDefi') ST.defiOuvert = d.open; }, true);
  document.addEventListener('submit', function(ev){
    var f = ev.target; if(!f) return; ev.preventDefault();
    if(f.id === 'fRejoindre') rejoindre();
    else if(f.id === 'fMessage') ecrireMessage();

    else if(f.id === 'fCreer') creer();
    else if(f.getAttribute('data-form-signaler')) envoyerSignalement(f.getAttribute('data-form-signaler'));
    else if(f.getAttribute('data-form-masquer')) masquerMsg(f.getAttribute('data-form-masquer'));
    else if(f.getAttribute('data-form-anim')) nommer(f.getAttribute('data-form-anim'));
    else if(f.getAttribute('data-form-exclure')) exclure(f.getAttribute('data-form-exclure'));
  });
  window.NVCommunautes = {etat:function(){ return {etat:ST.etat, vue:ST.vue, onglet:ST.onglet, apercu:ST.apercu, repli:ST.repli, communautes:(ST.liste || []).length, membre:membre(ST.un), langue:L}; }};
}

/* ════════ La présentation ════════ */
var _rendrePres = rendre;
rendre = function(){ var r = _rendrePres.apply(this, arguments); presenterNouveaute(); return r; };
function presenterNouveaute(){
  if(!window.NVPresente) return;

    etapes:[T('Rejoignez une communauté qui vous ressemble, en acceptant sa charte.'), T('Parlez, apprenez et relevez des défis ensemble.'), T('Retrouvez-vous en direct dans un salon privé de la Salle Baobab.')],
    protections:[T('L’adhésion est facultative : vous partez quand vous voulez.'), T('Pas de numéro, pas de courriel, des messages relus et un rythme lent.'), T('Signaler, bloquer et protéger en un geste ; une équipe veille.')]});
}

/* ════════ L'aperçu en repli : serveur sans la fonction → aperçu marqué « Aperçu », rien n'est envoyé ════════ */
function repliApercu(){ if(ST.cap || ST.apercu) return false; ST.apercu = true; ST.repli = true;
  if(!utilisateur()){ try{ window.NV_USER = {id:'demo', handle:'visiteur', prenom:'Aya', age:25, majeur:true, iso:'GN'}; }catch(e){} }
  return true; }
(function(){ var cc0 = chargerCap;
  chargerCap = function(){ return cc0().then(function(){ if(repliApercu()) return cc0(); }, function(e){ if(repliApercu()) return cc0(); throw e; }); }; })();

demarrer();
})();

</script>

  function versIris(){ ouvrirModule('Player', {clip:info.clip, depuis:MOD}); }
  function revoir(){
    if(info.src && window.NVLecteur && typeof window.NVLecteur.ouvrir === 'function'){
      try{ var ok = window.NVLecteur.ouvrir({items:[{id:'iris-' + info.clip, clip:info.clip, url:info.src, poster:info.poster || null,
        auteur:info.auteur || TX[langue()][2], titre:info.titre || ''}], index:0, titre:info.titre || '', module:MOD});
        if(ok !== false) return; }catch(e){}
    }
    versIris();
  }
  window.NVDepuisIris = {info:function(){ return info; }, revoir:revoir, retour:versIris};

  function bandeau(){
    if(document.getElementById('nvDepuisIris')) return;
    var l = langue(), T = TX[l], d = document.createElement('div');
    d.id = 'nvDepuisIris'; d.setAttribute('role', 'region'); d.setAttribute('aria-label', T[0]); d.dir = l === 'ar' ? 'rtl' : 'ltr';
    d.style.cssText = 'position:fixed;z-index:2147482990;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;' +
      'background:rgba(10,12,22,.94);color:#fff;border:1px solid rgba(232,184,74,.7);border-radius:16px;padding:10px 12px;box-shadow:0 8px 26px rgba(0,0,0,.45);' +
      'font:13px/1.35 system-ui,-apple-system,Roboto,sans-serif';
    var qui = info.auteur ? T[1].replace('{0}', info.auteur) : T[1].replace('{0}', T[2]);
    var b = 'border:0;border-radius:12px;padding:8px 12px;font:700 13px system-ui,-apple-system,Roboto,sans-serif;cursor:pointer;min-height:36px';
    d.innerHTML = '<div style="display:flex;align-items:center;gap:8px"><i aria-hidden="true" style="flex:none;width:16px;height:18px;background:linear-gradient(135deg,#F3D27A,#21C8B8);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)"></i>' +
      '<b style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b><button type="button" data-x style="' + b + ';background:transparent;color:#ccd;padding:6px 8px" aria-label=""></button></div>' +
      '<p style="margin:4px 0 8px;color:#cfd3e6"></p><div style="display:flex;gap:8px;flex-wrap:wrap"></div>';
    var rel = info.action === 'relever';
    d.querySelector('b').textContent = (rel ? T[7] : T[0]) + ' · ' + qui;
    d.querySelector('[data-x]').textContent = '×'; d.querySelector('[data-x]').setAttribute('aria-label', T[5]);
    d.querySelector('p').textContent = rel ? T[8] : T[6];
    var zone = d.querySelector('div:last-child');
    function bouton(txt, plein, fn){ var x = document.createElement('button'); x.type = 'button'; x.textContent = txt;
      x.style.cssText = b + (plein ? ';background:linear-gradient(135deg,#F3D27A,#E8B84A);color:#231800' : ';background:rgba(255,255,255,.1);color:#fff');
      x.addEventListener('click', fn); zone.appendChild(x); }
    if(info.src) bouton(T[3], true, function(){ revoir(); });
    bouton(T[4], !info.src, versIris);
    d.querySelector('[data-x]').addEventListener('click', function(){ d.remove(); });
    document.body.appendChild(d);
  }
  /* le module ouvre lui-même la vidéo s'il le sait ; sinon le bandeau */
  var debut = Date.now();
  /* « Relever le défi » (21 nov. 2026) : le module montre son défi (ou ses épreuves) avec ce qu'il faut pour participer ;
     chaque module qui sait mieux le faire range sa fonction dans window.NV_RELEVER_H (fonction(info) → true). */
  var RELEVER = {
    ChallengeUniverse:function(){ var a = window.NVUniversAPI; if(a && a.ouvrirDefi && info.defi){ a.ouvrirDefi(info.defi); return true; } },
    LoveUniverse:function(){ var a = window.NVLoveUniverse; if(a && a.defi && info.defi){ a.defi(info.defi); return true; } },
    ViralStorm:function(){ var a = window.NVViralStorm; if(a && a.ouvrirDefi && info.defi){ a.ouvrirDefi(info.defi); return true; } },
    Battle:function(){ var a = window.NVBattle; if(a && a.defier){ a.defier(); return true; } },
    MissMaster:function(){ var a = window.NVMissMaster; if(a && a.montrer){ a.montrer('epreuves'); return true; } },
    Artistes:function(){ var a = window.NVArtistes; if(a && a.montrer){ a.montrer('epreuves'); return true; } },
    CinemaWorld:function(){ var a = window.NVCinemaWorld; if(a && a.montrer){ a.montrer('defis'); return true; } },
    Arena:function(){ var a = window.NVArenaAPI; if(a && a.montrer){ a.montrer('arene'); return true; } },
    ArenaArts:function(){ var a = window.NVArenaArts; if(a && a.open){ a.open('arts'); return true; } }
  };
  function essayerRelever(){
    var h = window.NV_RELEVER_H || [];
    for(var i = 0; i < h.length; i++){ try{ if(h[i](info) === true) return true; }catch(e){} }
    try{ return RELEVER[MOD] ? RELEVER[MOD].call(null, info) === true : false; }catch(e){ return false; }
  }
  function essayer(){
    if(info.action === 'relever'){
      /* le bandeau dit toujours qu'on relève ce défi (avec « Revoir la vidéo ») ; le module montre en plus son défi s'il le sait */
      var fait = essayerRelever();
      if(!fait && Date.now() - debut < 6000){ setTimeout(essayer, 500); return; }
      if(document.body) bandeau(); return;
    }
    var h = window.NV_DEPUIS_IRIS_H || [];
    for(var i = 0; i < h.length; i++){ try{ var r = h[i](info); if(r === true){ info.ouvert = true; return; } }catch(e){} }
    var e = Date.now() - debut;
    if(e < 8000 && (h.length || e < 1500)){ setTimeout(essayer, 500); return; }     /* aucun module qui sait l'ouvrir : le bandeau tout de suite */
    if(document.body) bandeau();
  }
  function partir(){ setTimeout(essayer, 400); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', partir); else partir();
}catch(e){ /* rien */ } })();
</script><!--/NV_DEPUIS_IRIS-->
