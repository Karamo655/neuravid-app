:root{
  --fond:#120B24; --fond2:#1A1033; --surface:rgba(255,255,255,.055); --surface2:rgba(255,255,255,.09); --surface3:rgba(255,255,255,.14); --fil:rgba(255,255,255,.1);
  --encre:#F6F2FF; --brume:#C8D0E8; --gris:#A39BC2; --or:#FFC857; --corail:#FF7A59; --rose:#E2408F; --violet:#8B6CFF; --sarcelle:#2FD3C2;
  --battement:linear-gradient(100deg,#FFC857 0%,#FF7A59 50%,#E2408F 100%);
  --feuille:#1C1236; --carte-lue:rgba(255,255,255,.04); --carte-neuve:rgba(255,255,255,.085);
  --hx:polygon(50% 0,93.3% 25%,93.3% 75%,50% 100%,6.7% 75%,6.7% 25%);
  --haut:env(safe-area-inset-top,0px); --bas:env(safe-area-inset-bottom,0px);
  --police:"Inter NV",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
html[data-theme=jour]{--fond:#F6F2FF; --fond2:#EDE6FF; --surface:rgba(27,20,51,.045); --surface2:rgba(27,20,51,.07); --surface3:rgba(27,20,51,.12); --fil:rgba(27,20,51,.12);
  --encre:#1B1433; --brume:#4E4670; --gris:#655D86; --or:#A86300; --corail:#C2410C; --rose:#B4236E; --violet:#5B3FD6; --sarcelle:#0F7F75; --feuille:#FFFFFF; --carte-lue:rgba(255,255,255,.6); --carte-neuve:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font:15px/1.45 var(--police);font-optical-sizing:auto;font-variant-numeric:tabular-nums;color:var(--encre);background:var(--fond)}
body{background:radial-gradient(120% 60% at 50% -10%,rgba(139,108,255,.22),transparent 60%),radial-gradient(90% 40% at 100% 100%,rgba(226,64,143,.12),transparent 60%),var(--fond)}
html[data-theme=jour] body{background:radial-gradient(120% 60% at 50% -10%,rgba(139,108,255,.16),transparent 60%),radial-gradient(90% 40% at 100% 100%,rgba(255,122,89,.10),transparent 60%),var(--fond)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .i-retour{transform:scaleX(-1)}
.nko,[lang=nqo]{font-family:"NKo","Noto Sans NKo",var(--police)}
h2,h3{margin:0}
p{margin:6px 0}
.petit{font-size:12.5px;color:var(--gris)}

/* ════ le haut : le tambour, le titre, les filtres ════ */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.haut{z-index:5;padding:calc(6px + var(--haut)) 0 0;background:linear-gradient(180deg,var(--fond) 70%,transparent);backdrop-filter:blur(12px)}
.barre{display:flex;align-items:center;gap:10px;padding:4px 14px 6px;max-width:760px;margin:0 auto}
.rond{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--fil);flex:none}
.titre{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.titre b{display:block;font-size:20px;font-weight:850;letter-spacing:-.02em;line-height:1.1}
.titre>div{min-width:0}.titre b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titre small{display:block;font-size:12.5px;color:var(--brume)}
.tambour{width:38px;height:38px;flex:none;overflow:visible}
.tambour .onde{transform-origin:20px 20px;opacity:.55}
.haut.bat .tambour .o1{animation:onde 1.1s ease-out}
.haut.bat .tambour .o2{animation:onde 1.1s .18s ease-out}
@keyframes onde{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
.filtres{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 14px 10px;max-width:760px;margin:0 auto}
.filtres::-webkit-scrollbar{display:none}
.filtres button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--fil);font-size:13.5px;font-weight:650;color:var(--brume);white-space:nowrap}
.filtres button[aria-selected=true]{background:var(--battement);color:#24101F;box-shadow:0 6px 18px rgba(255,122,89,.3)}
.filtres i{font-style:normal;font-size:11px;font-weight:800;min-width:20px;height:20px;padding:0 5px;border-radius:10px;display:inline-grid;place-items:center;background:var(--rose);color:#fff}
.filtres button[aria-selected=true] i{background:#24101F;color:#FFC857}

/* ════ le fleuve ════ */
.corps{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(90px + var(--bas));max-width:760px;width:100%;margin:0 auto;outline:none}
.rive{margin:8px 0 6px}
.rive-titre{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:750;color:var(--brume);margin:16px 0 4px}
.rive-titre small{font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:9px;background:rgba(139,108,255,.22);color:var(--encre)}
.rive-titre::after{content:"";flex:1;height:1px;background:var(--fil)}
.jour{font-size:12.5px;font-weight:700;color:var(--gris);margin:14px 0 2px 46px}
[dir=rtl] .jour{margin:14px 46px 2px 0}
.calme{font-size:13.5px;color:var(--gris);margin:6px 0 10px 46px}
[dir=rtl] .calme{margin:6px 46px 10px 0}
.fleuve{list-style:none;margin:0;padding:0 0 0 46px;position:relative}
[dir=rtl] .fleuve{padding:0 46px 0 0}
/* la rive : une ligne de temps ; pointillée pour l'avenir, pleine pour le passé */
.fleuve::before{content:"";position:absolute;top:0;bottom:0;left:20.75px;width:2.5px;border-radius:1.25px;background:var(--fil)}
[dir=rtl] .fleuve::before{left:auto;right:21px}
.futur .fleuve::before{background:repeating-linear-gradient(180deg,rgba(139,108,255,.65) 0 6px,transparent 6px 12px)}
.nv{position:relative;margin:8px 0}
.noeud{position:absolute;left:-45px;top:8px;width:40px;height:44px;display:grid;place-items:center}
[dir=rtl] .noeud{left:auto;right:-45px}
.noeud svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.noeud path{fill:color-mix(in srgb,var(--c) 18%,var(--fond));stroke:color-mix(in srgb,var(--c) 70%,transparent);stroke-width:1.5}
.noeud span{position:relative;font-size:15px;line-height:1}
.non-lu .noeud path{fill:var(--c);stroke:var(--c)}
.non-lu .noeud{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 70%,transparent))}
.carte{display:flex;align-items:flex-start;gap:4px;border-radius:16px;background:var(--carte-lue);box-shadow:inset 0 0 0 1px var(--fil)}
.non-lu .carte{background:var(--carte-neuve);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 6px 22px color-mix(in srgb,var(--c) 14%,transparent)}
.fort.non-lu .carte{box-shadow:inset 0 0 0 1.5px var(--c),0 8px 26px color-mix(in srgb,var(--c) 26%,transparent)}
.ouvrir{flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;padding:11px 4px 11px 12px;text-align:start;border-radius:16px}
[dir=rtl] .ouvrir{padding:11px 12px 11px 4px}
.avs{display:flex;flex:none;padding-top:2px}
.av{width:34px;height:38px;clip-path:var(--hx);display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff 10%),color-mix(in srgb,var(--c) 45%,#120B24));color:#fff;font-weight:800;font-size:14px;overflow:hidden}
.av:nth-child(2){transform:translateX(-12px)}.av:nth-child(3){transform:translateX(-24px)}[dir=rtl] .av:nth-child(2){transform:translateX(12px)}[dir=rtl] .av:nth-child(3){transform:translateX(24px)}.avs[data-k="2"]{margin-inline-end:-12px}.avs[data-k="3"]{margin-inline-end:-24px}
.av img{width:100%;height:100%;object-fit:cover}
.emo{width:34px;height:38px;flex:none;display:grid;place-items:center;font-size:20px}
.txt{flex:1;min-width:0}
.phrase{display:block;font-size:14.5px;line-height:1.42;overflow-wrap:anywhere}
.phrase b{font-weight:780}
.lu .phrase{color:color-mix(in srgb,var(--encre) 82%,transparent)}
q{display:block;margin:5px 0 0;padding:2px 0 2px 10px;border-inline-start:2px solid var(--c);color:var(--brume);font-size:13.5px;font-style:italic;quotes:none;overflow-wrap:anywhere}
.texte{display:block;margin-top:4px;font-size:13.5px;color:var(--brume);white-space:pre-line;overflow-wrap:anywhere}
.txt small{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin-top:5px;font-size:12px;color:var(--gris)}
.mod{font-weight:700;color:color-mix(in srgb,var(--c) 85%,var(--encre))}
html[data-theme=jour] .mod{color:color-mix(in srgb,var(--c) 60%,#1B1433)}
.vign{width:44px;height:58px;flex:none;border-radius:9px;overflow:hidden;background:var(--surface2)}
.vign img{width:100%;height:100%;object-fit:cover}
.carte>.rond{width:36px;height:36px;margin:8px 8px 0 0;background:none;box-shadow:none;color:var(--gris)}
[dir=rtl] .carte>.rond{margin:8px 0 0 8px}
.cloche.on{color:var(--or)}
.vivant .noeud{animation:vivant 1.6s ease-in-out infinite}
@keyframes vivant{50%{transform:scale(1.08);filter:drop-shadow(0 0 12px var(--c))}}
.arrive .carte{animation:arrive .9s cubic-bezier(.2,.8,.2,1)}
@keyframes arrive{0%{opacity:0;transform:translateY(-12px) scale(.98);box-shadow:0 0 0 2px var(--or),0 0 40px rgba(255,200,87,.6)}100%{opacity:1;transform:none}}

/* ════ « Maintenant » : la ligne du tambour ════ */
.maintenant{position:relative;margin:18px -14px 6px;padding:10px 14px 8px;background:radial-gradient(70% 120% at 50% 0%,rgba(255,200,87,.16),transparent 70%)}
.vers-avenir{display:flex;align-items:center;gap:6px;margin:0 auto 8px;padding:4px 12px;border-radius:14px;font-size:12.5px;font-weight:700;color:var(--brume);background:rgba(139,108,255,.16);box-shadow:inset 0 0 0 1px rgba(139,108,255,.4)}
.vers-avenir .ico{width:16px;height:16px}
.ligne{display:flex;align-items:center;gap:10px}
.ligne::before,.ligne::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--battement);box-shadow:0 0 14px rgba(255,122,89,.6)}
.ligne::before{flex:0 0 28px}

/* ════ le résumé de l'absence, le bandeau hors réseau ════ */
.resume{position:relative;margin:12px 0 4px;padding:12px 44px 12px 14px;border-radius:16px;background:linear-gradient(var(--fond2),var(--fond2)) padding-box,var(--battement) border-box;border:1.5px solid transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:13px;background:var(--battement);color:#24101F;font-weight:800}

.interrupteur b{display:block;font-size:15px}
.interrupteur small{display:block;font-size:12.5px;color:var(--brume)}
.interrupteur i{width:46px;height:28px;border-radius:14px;background:var(--surface3);position:relative;flex:none;transition:background .2s}

[dir=rtl] .interrupteur[aria-checked=true] i::after{transform:translateX(-18px)}
.ligne-h{display:flex;gap:14px;margin:8px 0}
.ligne-h input{background:var(--surface2);border:1px solid var(--fil);border-radius:10px;padding:6px 8px;color:var(--encre)}
.puces{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}

.puces>button.on,.puces>button[aria-pressed=true]{background:var(--battement);color:#24101F;font-weight:700}
.long{white-space:pre-line;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:calc(74px + var(--bas));transform:translate(-50%,20px);width:max-content;max-width:min(92vw,520px);padding:10px 16px;border-radius:14px;background:var(--encre);color:var(--fond);font-size:14px;font-weight:650;opacity:0;pointer-events:none;transition:all .2s;z-index:40;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#occupe{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,2,14,.7)}
#occupe .boite{width:min(86vw,340px);padding:18px;border-radius:18px;background:var(--feuille);text-align:center}
#occupe .barre{height:6px;border-radius:3px;background:var(--surface3);overflow:hidden;margin:12px 0 6px;display:block;padding:0}

html[data-theme=jour]{--battement:linear-gradient(100deg,#D98A00 0%,#E0532F 50%,#C42F78 100%)}
html[data-theme=jour] .filtres button[aria-selected=true],html[data-theme=jour] .segment button[aria-checked=true],html[data-theme=jour] #flottant,html[data-theme=jour] .btn:not(.leger){color:#fff}
@media (max-width:350px){.titre b{font-size:18px}.phrase{font-size:14px}.fleuve{padding-left:44px}.noeud{left:-44px;width:40px;height:44px}.fleuve::before{left:18.75px}.jour,.calme{margin-left:44px}.vivant-l{width:calc(100% - 44px);margin-left:44px}.titre .tambour{width:30px;height:30px}.barre{gap:7px;padding:4px 10px 6px}.rond{width:40px;height:40px}.titre{gap:7px}[dir=rtl] .fleuve{padding:0 44px 0 0}[dir=rtl] .noeud{left:auto;right:-44px}[dir=rtl] .fleuve::before{left:auto;right:18.75px}[dir=rtl] .jour,[dir=rtl] .calme,[dir=rtl] .vivant-l{margin-left:0;margin-right:44px}}
@media (prefers-reduced-motion:reduce){.sk,.vivant .noeud,.arrive .carte,.haut.bat .tambour .onde{animation:none!important}}

/* ════ v2 — le Tam-tam qui décide, attend, se tait, se souvient ════ */
/* l'ouverture : deux battements, puis le Top 3 se dessine, puis le fleuve */
@media (prefers-reduced-motion:no-preference){
  .ouvre .recit{animation:recitVient .7s .8s both cubic-bezier(.2,.8,.2,1)}

  .ouvre .recit .top3 li:nth-child(1){animation-delay:1.0s}.ouvre .recit .top3 li:nth-child(2){animation-delay:1.15s}.ouvre .recit .top3 li:nth-child(3){animation-delay:1.3s}.ouvre .recit .top3 li:nth-child(4){animation-delay:1.45s}
  .ouvre .fleuve{animation:fondu .6s 1.6s both}

@keyframes recitVient{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fondu{from{opacity:.35}to{opacity:1}}
/* l'arrivée : trois crêtes de votre empreinte passent sur le tambour */
.haut{position:relative}
.arrivee{position:fixed;width:64px;height:64px;pointer-events:none;z-index:40}
.arrivee svg{width:100%;height:100%;overflow:visible}
.arrivee path{fill:none;stroke:url(#ttG);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:creteTrace 1.1s ease-out forwards,creteFin .5s 1.2s forwards}
@keyframes creteTrace{to{stroke-dashoffset:0}}@keyframes creteFin{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.arrivee path{animation:none;stroke-dashoffset:0;opacity:.6}}
/* la carte qui décide : Top 3 + résumé de l'absence / de la nuit / du silence */
.recit{position:relative;margin:12px 0 16px;padding:14px 14px 12px;border-radius:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--violet) 22%,var(--fond2)),var(--fond2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--or) 40%,transparent),0 10px 30px rgba(0,0,0,.25)}
html[data-theme=jour] .recit{background:linear-gradient(160deg,#fff,#F1EBFF);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--violet) 30%,transparent),0 8px 24px rgba(91,63,214,.12)}
.recit-tete{display:flex;align-items:center;gap:10px;padding-inline-end:40px}
.recit-tete .tambour{width:38px;height:38px;flex:none}
.recit-tete div{flex:1;min-width:0}.recit-tete b{display:block;font-size:16.5px;font-weight:820;letter-spacing:-.01em}.recit-tete small{color:var(--brume);font-size:13px}
.recit-tete .rond{position:static}
.recit .fermer{position:absolute;top:10px;inset-inline-end:10px}
.top3{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.top3 li button{width:100%;display:flex;align-items:flex-start;gap:10px;padding:10px 10px;border-radius:13px;background:var(--surface);text-align:start;min-height:44px}
.top3 li i{flex:none;width:14px;height:16px;margin-top:2px;clip-path:var(--hx);background:var(--c)}
.top3 li span{font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.barres{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 2px 0;font-size:12.5px;color:var(--brume)}
.barres span{display:inline-flex;align-items:center;gap:5px}.barres i{width:9px;height:10px;clip-path:var(--hx);background:var(--c)}.barres b{color:var(--encre)}
.recit .projet{display:block;width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;text-align:start;font-size:13.5px;background:color-mix(in srgb,var(--or) 14%,transparent);color:var(--encre)}
/* l'invitation au son (jamais imposé) */
.accueil-son{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:10px 0;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--fil)}
.accueil-son>div:first-child{display:flex;align-items:center;gap:10px;flex:1 1 220px}.accueil-son p{margin:0;font-size:14px}.accueil-son small{display:block;color:var(--brume);font-size:12.5px}.accueil-son .boutons{display:flex;flex-wrap:wrap;gap:8px}.accueil-son .btn{min-height:40px;padding:0 14px}
.accueil-son .tambour{width:30px;height:30px}
/* le contrat de silence en cours */
.contrat-bandeau{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--sarcelle) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sarcelle) 40%,transparent)}
.contrat-bandeau span{flex:1;min-width:0;display:grid}.contrat-bandeau small{color:var(--brume);font-size:12.5px}

.contrat-actif small{color:var(--brume)}
.petit{font-size:12.5px!important;color:var(--brume)}
.champ{display:grid;gap:6px;margin:6px 0 10px}.champ span{font-size:13px;color:var(--brume)}
.champ input{width:100%;min-height:46px;padding:0 14px;border:0;border-radius:13px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--fil);font-size:15px;color:var(--encre)}
.champ input:focus{outline:2px solid var(--or);outline-offset:1px}
/* la recherche */
.cherche{padding:6px 16px 8px}
.cherche input{width:100%;min-height:44px;padding:0 14px;border-radius:13px;border:0;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--fil);font-size:15px}
.cherche input:focus{outline:2px solid var(--or);outline-offset:1px}
.trouve{margin:6px 0 8px;color:var(--brume);font-size:13px}
/* les états d'une nouvelle */
.p-haut.non-lu .carte{box-shadow:inset 0 0 0 1.5px var(--c),0 10px 28px color-mix(in srgb,var(--c) 22%,transparent)}
.agenda .carte{background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--c) 6%,transparent) 10px 20px),var(--carte-lue)}
.silence .noeud path{fill:var(--surface3)!important;stroke:var(--gris)!important}

.silence .noeud::after{content:"";position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:50%;background:var(--gris);box-shadow:0 0 0 2px var(--fond)}
.revient .carte{box-shadow:inset 0 0 0 1.5px var(--or),0 0 0 4px color-mix(in srgb,var(--or) 16%,transparent)!important}
.nv .carte{transition:transform .2s ease,opacity .2s ease}
.carte.glisse-pret{box-shadow:inset 0 0 0 2px var(--or),0 0 22px color-mix(in srgb,var(--or) 40%,transparent)!important}
.a-merci .carte{position:relative}.a-merci .ouvrir{padding-bottom:50px}
.merci{position:absolute;bottom:10px;inset-inline-start:56px;min-height:34px;padding:0 12px;border-radius:11px;font-size:13px;font-weight:760;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--encre)}
.merci.fait{opacity:.7}
/* le tambour au repos : tout est lu */
.paix{display:grid;justify-items:center;gap:4px;margin:18px 0 8px;color:var(--brume)}
.paix .pose{width:80px;height:54px;color:var(--brume)}
.paix p{margin:0;font-size:14px}

.pourquoi{border-radius:10px;padding:2px 4px;margin:-2px -4px}
.pourquoi:hover{background:var(--surface)}
/* la notification-cinéma : rare, plein écran, deux secondes et plus */
#cinema{position:fixed;inset:0;z-index:80;display:grid;place-content:center;justify-items:center;gap:18px;padding:24px;text-align:center;background:radial-gradient(80% 60% at 30% 20%,rgba(47,211,194,.35),transparent 60%),radial-gradient(70% 60% at 80% 30%,rgba(139,108,255,.45),transparent 60%),radial-gradient(90% 70% at 50% 100%,rgba(226,64,143,.4),transparent 60%),rgba(10,6,22,.94);color:#fff;animation:cineVient .5s ease-out both}
#cinema.fin{animation:cineVa .5s ease-in both}
#cinema .tambour{width:96px;height:96px}
.cine-msg{margin:0;max-width:22ch;font-size:clamp(24px,7vw,34px);line-height:1.15;font-weight:840;letter-spacing:-.02em}
#cinema .btn.leger{color:#fff;background:rgba(255,255,255,.12)}
.cine-hx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cine-hx i{position:absolute;left:calc(8% + var(--i) * 13%);bottom:-60px;width:44px;height:50px;clip-path:var(--hx);background:linear-gradient(160deg,#FFC857,#E2408F);opacity:.5;animation:cineHx 3.6s calc(var(--i) * .22s) ease-out both}
@keyframes cineVient{from{opacity:0}to{opacity:1}}@keyframes cineVa{to{opacity:0}}
@keyframes cineHx{from{transform:translateY(0) rotate(0) scale(.6)}to{transform:translateY(-110vh) rotate(90deg) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){#cinema,#cinema.fin,.cine-hx i{animation:none!important}.cine-hx i{bottom:20%;opacity:.25}}
/* mouvement réduit : le battement passe par l'intensité de la couleur, jamais par la taille */
@media (prefers-reduced-motion:reduce){
  .haut.bat .tambour path:not(.onde){animation:poulsDoux 1.1s ease-out}
  .vivant .noeud path{animation:poulsDoux 1.6s ease-in-out infinite!important}
}
@keyframes poulsDoux{50%{opacity:.55}}
/* le jour : les teintes foncées pour le contraste sur fond clair */
html[data-theme=jour] .filtres i{background:#B4236E}
/* « Maintenant » vivant même sans nouvelle */
.vivant-l{display:flex;align-items:flex-start;gap:10px;width:calc(100% - 46px);margin:8px 0 10px 46px;padding:11px 12px;border-radius:16px;text-align:start;background:var(--carte-lue);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}

.vivant-l i{flex:none;width:12px;height:14px;margin-top:4px;clip-path:var(--hx);background:var(--c)}

var IDB = {db:null, attente:null};
function idb(){
  if(IDB.db) return Promise.resolve(IDB.db);
  if(IDB.attente) return IDB.attente;
  IDB.attente = new Promise(function(ok, ko){
    try{
      var r = indexedDB.open('nv_tamtam', 1);
      r.onupgradeneeded = function(){ var d = r.result; ['cache', 'rappels', 'divers'].forEach(function(n){ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
      r.onsuccess = function(){ IDB.db = r.result; ok(IDB.db); };
      r.onerror = function(){ ko(r.error); };
      setTimeout(function(){ ko(new Error('idb lente')); }, 5000);
    }catch(e){ ko(e); }
  });
  IDB.attente.catch(function(){ IDB.attente = null; });
  return IDB.attente;
}
function idbOp(store, mode, fn){ return idb().then(function(d){ return new Promise(function(ok, ko){ var t = d.transaction(store, mode), s = t.objectStore(store), r = fn(s); t.oncomplete = function(){ ok(r && r.result); }; t.onerror = function(){ ko(t.error); }; t.onabort = function(){ ko(t.error); }; }); }); }
function idbLire(store, k){ return idbOp(store, 'readonly', function(s){ return s.get(k); }).catch(function(e){ dbg(e); return null; }); }
function idbEcrire(store, k, v){ return idbOp(store, 'readwrite', function(s){ return s.put(v, k); }).then(function(){ return true; }).catch(function(e){ dbg(e); return false; }); }
function idbEffacer(store, k){ return idbOp(store, 'readwrite', function(s){ return s.delete(k); }).catch(function(e){ dbg(e); }); }
/* « strict » : une lecture incomplète échoue au lieu de rendre une liste partielle (le ménage s'en sert pour ne rien effacer à tort) */
function idbTout(store, strict){ var p = idb().then(function(d){ return new Promise(function(ok, ko){ var t = d.transaction(store, 'readonly'), s = t.objectStore(store), out = [], c = s.openCursor(); c.onsuccess = function(){ var x = c.result; if(x){ out.push({k:x.key, v:x.value}); x.continue(); } else ok(out); }; c.onerror = function(){ if(strict) ko(c.error || new Error('idb')); else ok(out); }; t.onabort = function(){ if(strict) ko(t.error || new Error('idb')); }; }); }); return strict ? p : p.catch(function(e){ dbg(e); return []; }); }

function cadrer(sw, sh, L, H, mode){ var r = mode === 'contain' ? Math.min(L / sw, H / sh) : Math.max(L / sw, H / sh); var w = sw * r, h = sh * r; return {x:(L - w) / 2, y:(H - h) / 2, w:w, h:h}; }

/* télécharger : dans l'application, une WebView ne sait pas enregistrer un « blob: » ; l'application fournit
   window.NVTelecharger(blob, nom) (ou le gestionnaire Flutter « nvTelecharger »), sinon le navigateur s'en charge */
function telecharger(blob, nom){
  emit('download', {nom:nom, taille:blob.size, type:blob.type});
  try{ if(typeof window.NVTelecharger === 'function'){ window.NVTelecharger(blob, nom); return; } }catch(e){ dbg(e); }
  if(window.flutter_inappwebview && window.flutter_inappwebview.callHandler){
    /* par morceaux de 4 Mo : {nom, type, partie, total, base64} — l'application assemble les parties dans l'ordre */
    var T = 4194304, total = Math.max(1, Math.ceil(blob.size / T)), k = 0, cle = nid('dl');
    var suite = function(){ if(k >= total) return; var fr = new FileReader(); fr.onload = function(){ try{ Promise.resolve(window.flutter_inappwebview.callHandler('nvTelecharger', {id:cle, nom:nom, type:blob.type, partie:k, total:total, base64:String(fr.result).split(',')[1] || ''})).then(function(){ k++; suite(); }, function(e){ dbg(e); }); }catch(e){ dbg(e); } }; fr.readAsDataURL(blob.slice(k * T, (k + 1) * T)); };
    suite(); return;
  }
  telechargerNavigateur(blob, nom);
}
function telechargerNavigateur(blob, nom){ var u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = nom; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 60000); }

  var coups = {nouvelle:[[180, .0], [140, .16]], rappel:[[220, 0], [220, .14], [300, .28]], tic:[[520, 0]]}[k] || [], t0 = a.currentTime;

/* ════════════════════════════════════════════════════════════════════
   LE TAM-TAM v2 — « Une cloche sonne ; un tambour parle. NEURAVID ne sonne pas — il bat à ton rythme. »
   La priorité, « L'essentiel » (Top 3, absence, nuit), le « plus tard » et la salle d'attente, le tam-tam silencieux,
   les moments-cinéma, la recherche, le contrat de silence, le résumé parlé, mon propre tambour, l'accueil sonore,
   « Merci », le pouls partagé avec la cloche des autres modules, le pont avec le HVS (L'Empreinte), le Service Worker.
   ════════════════════════════════════════════════════════════════════ */

/* ════════ La priorité : ce qui compte pour une personne (un appel manqué passe avant un « j'aime » de 3 jours) ════════ */
var PRIO = {securite:95, appel_manque:90, message:85, retrait:80, victoire:75, direct:72, rappel:70, gain:70, finale:70, cadeau:65, mention:62, duo:60, palier:60, viral:60, hvs:58,
  defi_fin:55, billet:55, reponse:50, classement:50, evenement:50, salle:50, commentaire:45, son_repris:45, creation_prete:45, trace:40, superlike:40, direct_annonce:40,
  abonne:35, vote:35, systeme:30, defi_nouveau:30, publication:25, jaime:20};
function priorite(n){ var h = Math.max(0, (Date.now() - n.at) / 3600000); return (PRIO[n.type] || 30) + (n.fort ? 10 : 0) + (n.total > 5 ? 5 : 0) - Math.min(40, h * 2) + (n.fin && n.at <= Date.now() && Date.now() <= n.fin ? 15 : 0); }

  o = o && typeof o === 'object' ? o : {};
  MEM = {plusTard:o.plusTard || {}, vues:o.vues || {}, ignores:o.ignores || {}, silence:o.silence || {}, cinemaVus:o.cinemaVus || {}, dernierCinema:+o.dernierCinema || 0, mercis:o.mercis || {}, contrat:o.contrat || null, lusAttente:Array.isArray(o.lusAttente) ? o.lusAttente.slice(0, 2000) : [], hvs:o.hvs || null, accueilSon:o.accueilSon === true, rate:o.rate || null, revenus:o.revenus || {}};
  /* ménage : ce qui est trop vieux s'en va */
  var t = Date.now(); Object.keys(MEM.silence).forEach(function(k){ if(MEM.silence[k] < t) delete MEM.silence[k]; }); Object.keys(MEM.vues).slice(0, Math.max(0, Object.keys(MEM.vues).length - 1500)).forEach(function(k){ delete MEM.vues[k]; });
  if(MEM.contrat && MEM.contrat.jusqua && MEM.contrat.jusqua < t){ MEM.rate = {debut:MEM.contrat.debut, fin:MEM.contrat.jusqua}; MEM.contrat = null; }
  return c; }); }
var MEM_T = 0;

/* ════════ Le contrat de silence : une phrase, et le tam-tam la respecte à la lettre ════════ */

    || /\bate\s+(amanha)?\s*(?:as\s*)?(\d{1,2})\s*(?:h|:|horas?)\s*(\d{2})?/.exec(t) || /\bate\s+(amanha)?\s*as\s+(\d{1,2})()/.exec(t);

  /* une durée qu'on ne sait pas lire (« jusqu'à lundi », « pendant une semaine ») : on refuse plutôt que de deviner */
  if(!c.jusqua && /\b(jusqu.?a|until|till|hasta|pendant|durant|durante)\b/.test(t)) return null;

function contratActif(){ return MEM.contrat && MEM.contrat.jusqua > Date.now() ? MEM.contrat : null; }

  /* le moment que VOUS déclarez (le tam-tam ne devine jamais votre vie) */
  ['travail', 'Je travaille : seulement mes messages, jusqu\'à 18 h'], ['doux', 'Un moment difficile : seulement mes messages, sans fête ni bruit, pendant 3 jours']];
function contratProposition(k){ var d = new Date(); d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0);

/* ════════ « L'essentiel » : la carte qui décide (Top 3), fusionnée avec « Pendant votre absence » et « Pendant la nuit » ════════ */

/* ════════ Le pont avec L'Empreinte : le HVS (lu sur le téléphone, sans rien créer ni écrire chez elle) ════════ */

  return (indexedDB.databases ? indexedDB.databases().catch(function(){ return []; }) : Promise.resolve([])).then(function(l){ if(!(l || []).some(function(d){ return d && d.name === 'nv_empreinte'; })) return null;
    return new Promise(function(ok){ var fini = false, fin = function(v){ if(!fini){ fini = true; ok(v); } }; try{ var r = indexedDB.open('nv_empreinte'); r.onupgradeneeded = function(){ try{ r.transaction.abort(); }catch(e){ dbg(e); } fin(null); };
      r.onsuccess = function(){ var d = r.result; try{ if(!d.objectStoreNames.contains('cache')){ d.close(); return fin(null); } var q = d.transaction('cache', 'readonly').objectStore('cache').get('p_moi_' + c); q.onsuccess = function(){ d.close(); fin(q.result); }; q.onerror = function(){ d.close(); fin(null); }; }catch(e){ try{ d.close(); }catch(x){ dbg(x); } fin(null); } };
      r.onerror = function(){ fin(null); }; setTimeout(function(){ fin(null); }, 2500); }catch(e){ fin(null); } }); })
  .then(function(o){ if(g !== GEN.n || compteActuel() !== c) return; var s = o && o.P && o.P.hvs && typeof o.P.hvs.score === 'number' ? o.P.hvs.score : null; if(s == null) return;

/* ════════ Les moments-cinéma : rares (un par mois au plus), grandioses ════════ */
