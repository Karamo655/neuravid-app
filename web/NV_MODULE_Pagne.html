#toast.on{opacity:1}
.vide{color:var(--brume);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[dir="rtl"] .l1{direction:rtl}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
@media (min-width:560px){h1{font-size:1.35rem}}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{min-height:40px;padding:4px 12px;font-size:.88rem;border-radius:999px}
.chips button[aria-pressed="true"]{border-color:var(--or);color:var(--or)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:.88rem;color:var(--brume)}
input,textarea{font:inherit;color:var(--craie);background:var(--alv);border:1px solid var(--trait);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.btn-or{background:linear-gradient(135deg,var(--or),#ff9f1c);color:#2a1a00;border:0;font-weight:800}


select.plein{width:100%;min-height:44px}
.astuce{margin:0 0 8px;padding:8px 10px;border-radius:10px;background:rgba(255,197,49,.1);border:1px solid rgba(255,197,49,.35)}
.retour{margin:0 0 10px}
.regle{font-size:.82rem;color:var(--brume);margin:6px 0 0}
.defile{padding:10px 0;border-top:1px solid var(--trait)}
.defile:first-of-type{border-top:0}
.defile h3{margin:0 0 3px;font-size:1rem}
.defile h3 button{all:unset;cursor:pointer;color:var(--craie);font-weight:700}
.defile h3 button:focus-visible,.tissu h3 button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.puce.vo{color:#2a1a00;background:var(--or);border-color:var(--or)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tissu{background:var(--alv);border:1px solid var(--trait);border-radius:14px;padding:8px;display:grid;gap:6px;align-content:start}
.tissu video,.tissu canvas{width:100%;aspect-ratio:9/16;border-radius:10px;background:#000;display:block}
.tissu .vide-v{width:100%;aspect-ratio:9/16;border-radius:10px;background:repeating-linear-gradient(45deg,var(--nuit2),var(--nuit2) 8px,var(--alv) 8px,var(--alv) 16px);display:grid;place-items:center;color:var(--brume);font-size:.8rem;text-align:center;padding:8px}
.tissu h3{margin:0;font-size:.95rem}
.tissu p{margin:0;font-size:.8rem;color:var(--brume)}
.tissu button{min-height:40px;padding:4px 10px;font-size:.86rem}
.tissu button[aria-pressed="true"]{background:var(--or);color:#2a1a00;border-color:var(--or);font-weight:800}
.drap{font-size:1.1rem}
.podium{display:grid;gap:8px}
.marche{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--alv)}
.marche .hx{width:40px;height:36px;clip-path:var(--hex);display:grid;place-items:center;font-weight:900;color:#2a1a00}
.r1 .hx{background:var(--or)} .r2 .hx{background:var(--argent)} .r3 .hx{background:var(--bronze)}
.prise{width:100%;max-width:220px;aspect-ratio:9/16;border-radius:12px;background:#000;display:block;margin:0 auto 10px}
.nv-cree{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:var(--or)}
.nv-cree i{width:11px;height:10px;clip-path:var(--hex);background:var(--or);display:inline-block}

/* ══ Identité de la nouveauté (17 nov. 2026, étape 3 du plan des 8 nouveautés) : ses couleurs, son bandeau, ses cartes ══ */
:root{--id1:#ffc531;--id2:#ff4f9e}
header{position:relative;padding-bottom:13px;margin-bottom:8px}
header::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--id1),var(--id2) 55%,transparent)}
[dir=rtl] header::after{background:linear-gradient(270deg,var(--id1),var(--id2) 55%,transparent)}
.hex{background:linear-gradient(135deg,var(--id1),var(--id2));box-shadow:0 0 18px color-mix(in srgb,var(--id1) 45%,transparent)}
h2::before{background:linear-gradient(135deg,var(--id1),var(--id2))}
section{background:linear-gradient(180deg,color-mix(in srgb,var(--id1) 8%,transparent),transparent 80px),var(--nuit2)}

/* mon pagne : des motifs de tissus dessinés (aucune image), différents pour chaque défilé et chaque nation */
.wax{background-color:var(--w1)}
.wax.m0{background:radial-gradient(circle,var(--w3) 0 3px,var(--w1) 3.5px 6px,var(--w2) 6.5px 9px,var(--w1) 9.5px 12px,var(--w3) 12.5px 14px,transparent 14.5px) 0 0/30px 30px,var(--w1)}
.wax.m1{background:linear-gradient(135deg,var(--w2) 25%,transparent 25%) -8px 0/16px 16px,linear-gradient(225deg,var(--w2) 25%,transparent 25%) -8px 0/16px 16px,linear-gradient(315deg,var(--w3) 25%,transparent 25%) 0 0/16px 16px,linear-gradient(45deg,var(--w3) 25%,transparent 25%) 0 0/16px 16px,var(--w1)}
.wax.m2{background:radial-gradient(circle,var(--w2) 0 3px,transparent 3.5px) 0 0/14px 14px,radial-gradient(circle,var(--w3) 0 2px,transparent 2.5px) 7px 7px/14px 14px,var(--w1)}
.wax.m3{background:conic-gradient(from 45deg,var(--w2) 25%,var(--w1) 0 50%,var(--w3) 0 75%,var(--w1) 0) 0 0/18px 18px}
.defile{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start}
.waxhex{width:58px;height:51px;clip-path:var(--hex);display:block;box-shadow:inset 0 0 0 3px rgba(0,0,0,.2)}
.waxbande{height:10px;border-radius:6px;margin:0 0 10px}
.tissu .cadre{padding:4px;border-radius:13px;display:block}
.tissu .cadre video,.tissu .cadre canvas,.tissu .cadre .vide-v{border-radius:9px}
</style>
</head>

    try { if (typeof racine.NVemit === 'function') racine.NVemit(type, charge || {}); }
    catch (e) {}
  }
  function base() {
    var b = racine.NV_MODULES_BASE || BASE_DEFAUT;
    return b.slice(-1) === '/' ? b : b + '/';
  }

  /* ── LE COFFRE ────────────────────────────────────────────────────
     Une vidéo de quelques mégaoctets ne tient pas dans localStorage et
     ne survit pas à une navigation autrement. IndexedDB est le seul
     endroit où elle peut attendre. */
  function ouvrirBase() {
    return new Promise(function (res) {
      try { if (!racine.indexedDB) return res(null); } catch (e) { return res(null); }   /* stockage bloqué : l'accès lui-même peut lever une erreur */
      var r;
      try { r = racine.indexedDB.open(DB, 1); } catch (e) { return res(null); }
      r.onupgradeneeded = function () {
        try { r.result.createObjectStore(MAG); } catch (e) {}
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { res(null); };

      setTimeout(function () { res(null); }, 2000);
    });
  }

    return ouvrirBase().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var t = db.transaction(MAG, 'readwrite');
          t.objectStore(MAG).put(valeur, cle);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { res(false); };
        } catch (e) { res(false); }
      });
    });
  }
  function reprendre(cle) {
    return ouvrirBase().then(function (db) {
      if (!db) return null;
      return new Promise(function (res) {
        try {
          var t = db.transaction(MAG, 'readonly');
          var q = t.objectStore(MAG).get(cle);
          q.onsuccess = function () { res(q.result || null); };
          q.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    });
  }
  function oublier(cle) {
    return ouvrirBase().then(function (db) {
      if (!db) return;
      try {

      } catch (e) {}
    });

  function filmer(ctx) {
    ctx = ctx || {};
    ctx.module = ctx.module || racine.NV_MODULE_NAME || 'defi';
    ctx.quand = Date.now();

       story flash s'arrête à sept secondes. Sans ça, la personne filme
       trente secondes et se fait refuser au retour. */
    try { racine.sessionStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    try { racine.localStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}

       d'écran : c'est plus rapide et rien ne peut se perdre. */
    try {
      if (racine.NVStudio && typeof racine.NVStudio.open === 'function' &&
          typeof racine.NVStudio.tab === 'function') {
        racine.NVStudio.open(); racine.NVStudio.tab('video');
        return 'local';
      }
    } catch (e) {}
    try {
      if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') {
        racine.NVLien.ouvrir('NVCreate', ctx);
        return 'lien';
      }
    } catch (e) {}
    try {
      racine.location.href = base() + 'NV_MODULE_Create.html';
      return 'fichier';
    } catch (e) {}
    return 'aucun';   /* l'appelant reprend la main avec son propre enregistreur */
  }

  /* ── CÔTÉ STUDIO : d'où vient-on, et comment y retourner ──────────── */
  function contexte() {
    var t = null;
    try { t = racine.sessionStorage.getItem(CLE_CTX); } catch (e) {}
    if (!t) { try { t = racine.localStorage.getItem(CLE_CTX); } catch (e) {} }
    if (!t) return null;
    try {
      var c = JSON.parse(t);
      /* Un contexte vieux de plus d'une heure n'a plus de sens : la
         personne est passée à autre chose. On ne la renvoie pas dans un
         défi qu'elle a quitté. */
      if (!c || !c.quand || Date.now() - c.quand > 3600000) return null;
      return c;
    } catch (e) { return null; }
  }

  /* Le Studio appelle ceci quand la prise est terminée. */
  function rendre(blob, meta) {
    var c = contexte();

    var cle = 'prise_' + (c.module || 'defi') + '_' + (c.defi || 'x');
    return ranger(cle, {blob: blob, meta: meta || {}, ctx: c, at: Date.now()})
      .then(function (ok) {
        if (!ok) return false;
        emit('camera_done', {module: c.module, defi: c.defi || null,

          if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') {
            racine.NVLien.ouvrir('NV' + c.module, c);
            return true;
          }

        catch (e) {}

         retrouverait envoyée deux fois. */

      return p;

     Une prise n'est effacée qu'à sa reprise. Si la personne filme puis
     ne revient jamais dans le défi, l'entrée reste — une vidéo de
     plusieurs mégaoctets par tentative abandonnée, sur un téléphone

     même limite que le contexte, et au-delà la personne est passée à
     autre chose de toute façon. */
  function balayer() {
    return ouvrirBase().then(function (db) {
      if (!db) return 0;
      return new Promise(function (res) {

        try {
          var t = db.transaction(MAG, 'readwrite');
          var st = t.objectStore(MAG);
          var q = st.openCursor();
          q.onsuccess = function () {
            var c = q.result;
            if (!c) { res(n); return; }
            var v = c.value;
            if (!v || !v.at || Date.now() - v.at > 3600000) { c.delete(); n++; }
            c.continue();

        } catch (e) { res(0); }
      });
    });
  }
  /* au chargement, sans bloquer quoi que ce soit */
  try { setTimeout(balayer, 3000); } catch (e) {}

    balayer: balayer,
    filmer: filmer,
    contexte: contexte,
    rendre: rendre,
    recuperer: recuperer,

       l'enregistreur local. On ne propose jamais une porte qui ne
       s'ouvre pas. */
    studioJoignable: function () {
      try {
        if (racine.NVStudio && typeof racine.NVStudio.open === 'function') return true;
        if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') return true;
        return !!racine.NV_MODULES_BASE;
      } catch (e) { return false; }
    }
  };
})(window);
