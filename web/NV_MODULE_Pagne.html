/* mon pagne : des motifs de tissus dessinés (aucune image), différents pour chaque défilé et chaque nation */
.wax{background-color:var(--w1)}
.wax.m0{background:radial-gradient(circle,var(--w3) 0 3px,var(--w1) 3.5px 6px,var(--w2) 6.5px 9px,var(--w1) 9.5px 12px,var(--w3) 12.5px 14px,transparent 14.5px) 0 0/30px 30px,var(--w1)}
.wax.m1{background:linear-gradient(135deg,var(--w2) 25%,transparent 25%) -8px 0/16px 16px,linear-gradient(225deg,var(--w2) 25%,transparent 25%) -8px 0/16px 16px,linear-gradient(315deg,var(--w3) 25%,transparent 25%) 0 0/16px 16px,linear-gradient(45deg,var(--w3) 25%,transparent 25%) 0 0/16px 16px,var(--w1)}
.wax.m2{background:radial-gradient(circle,var(--w2) 0 3px,transparent 3.5px) 0 0/14px 14px,radial-gradient(circle,var(--w3) 0 2px,transparent 2.5px) 7px 7px/14px 14px,var(--w1)}
.wax.m3{background:conic-gradient(from 45deg,var(--w2) 25%,var(--w1) 0 50%,var(--w3) 0 75%,var(--w1) 0) 0 0/18px 18px}
.defile{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start}
.waxhex{width:58px;height:51px;clip-path:var(--hex);display:block;box-shadow:inset 0 0 0 3px rgba(0,0,0,.2)}
.waxbande{height:10px;border-radius:6px;margin:0 0 10px}
.tissu .cadre{padding:4px;border-radius:13px;display:block}
.tissu .cadre video,.tissu .cadre canvas,.tissu .cadre .vide-v{border-radius:9px}

/* ═══════════════════════════════════════════════════════════════════
   NEURAVID — NV_CAMERA.js
   Le bouton « Filmer » d'un défi ouvre la caméra du Studio créatif.

   À embarquer dans les 16 modules de défi ET dans NV_MODULE_Create.html.

   ── POURQUOI ─────────────────────────────────────────────────────────
   Chaque défi a son propre enregistreur. Il fonctionne, il grave les
   filtres et le logo dans l'image — mais il s'arrête là. La caméra du
   Studio sait faire beaucoup plus, et elle existe déjà :

       double caméra (médaillon, haut/bas, gauche/droite)
       masques qui suivent le visage
       effets pluie, neige, étincelles
       filtres gravés dans l'image enregistrée
       photo, montage, galerie

   Une personne qui veut participer à un défi n'a aucune raison d'avoir
   moins d'outils que quelqu'un qui filme pour rien.

   ── LA DIFFICULTÉ RÉELLE ─────────────────────────────────────────────
   Le Studio est un AUTRE fichier. Changer de page perd tout : le
   contexte du défi, et surtout la vidéo elle-même — un Blob ne
   traverse pas une navigation.

   IndexedDB, si. C'est la seule voie, et Create s'en sert déjà pour
   son relais. On l'emprunte :

       1. le défi range son contexte et ouvre le Studio
       2. la personne filme avec tous les outils
       3. le Studio range la vidéo dans IndexedDB et revient au défi
       4. le défi la reprend et la présente comme sa propre prise

   ── CE QU'ON NE FAIT PAS ─────────────────────────────────────────────
   On ne copie pas la caméra du Studio dans les seize défis. Elle pèse
   plus de trois cents kilo-octets, et seize copies divergeraient au
   premier correctif — c'est exactement ce qui est arrivé à IA et Coach,
   qui affichaient deux scores différents pour la même vidéo.

   Et on ne supprime pas l'enregistreur existant : si le Studio est
   injoignable, il reprend la main. Une passerelle ne doit jamais
   devenir un point de rupture.
   ═══════════════════════════════════════════════════════════════════ */

function deuxTouchers(cle){ if(ST.sur[cle]){ delete ST.sur[cle]; return true; } ST.sur[cle] = true; rendre(); setTimeout(function(){ if(ST.sur[cle]){ delete ST.sur[cle]; rendre(); } }, 5000); return false; }
function voter(tid){
  var d = ST.defile; if(!d || ST.occupe['v' + tid]) return;
  var m = d.moi || (d.moi = {}), deja = (m.votes || []).indexOf(tid) >= 0, oui = !deja;
  if(oui && nombre(m.restantes) === 0){ toast(T('Vous avez donné vos 3 voix.')); return; }
  ST.occupe['v' + tid] = true; rendre();
  (ST.apercu ? Promise.resolve({vote:oui, restantes:(m.restantes || 0) + (oui ? -1 : 1)}) : appeler('POST', '/v1/pagne/tissus/' + encodeURIComponent(tid) + '/voter', {oui:oui}))
    .then(function(o){ m.votes = (m.votes || []).filter(function(x){ return x !== tid; }); if(o.vote) m.votes.push(tid); m.restantes = nombre(o.restantes);
      toast(o.vote ? T('Voix donnée.') : T('Voix reprise.')); emit('pagne_voter', {tissu:tid, oui:oui}); }, function(e){ toast(erreurTexte(e)); })
    .then(function(){ delete ST.occupe['v' + tid]; rendre(); });

function demoDessiner(c, pays){
  var g = c.getContext('2d'); if(!g) return; var W = c.width, H = c.height, k = (String(pays).charCodeAt(0) * 53 + String(pays).charCodeAt(1) * 17) % 360;
  for(var y = 0; y < H; y += 20){ for(var x = 0; x < W; x += 20){ g.fillStyle = 'hsl(' + ((k + ((x + y) / 20 % 4) * 40) % 360) + ',70%,' + (35 + ((x * y) % 3) * 8) + '%)'; g.fillRect(x, y, 20, 20);
    g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); for(var a = 0; a < 6; a++){ var t = Math.PI / 3 * a; g.lineTo(x + 10 + 6 * Math.cos(t), y + 10 + 6 * Math.sin(t)); } g.closePath(); g.fill(); } }
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, H - 26, W, 26); g.fillStyle = '#ffc531'; g.textAlign = 'center'; g.font = 'bold 13px sans-serif'; g.fillText(T('Aperçu'), W / 2, H - 9);
}

  try{ ctx = JSON.parse(sessionStorage.getItem('nv_ctx_' + MOI) || 'null'); sessionStorage.removeItem('nv_ctx_' + MOI); }catch(e){}
  rendre();
  chargerCap().catch(function(e){ ST.cap = null; ST.etat = e && e.status && e.status < 500 ? 'indisponible' : navigator.onLine === false ? 'horsligne' : 'erreur'; })
    .then(function(){ if(!ST.cap) return rendre();
      var m = jeton() && !ST.apercu ? appeler('GET', '/v1/pagne/moi').then(function(o){ ST.moiSrv = o; }, function(){}) : Promise.resolve();
      return m.then(reprendrePrise); })
    .then(function(did){
      if(!ST.cap) return;
      if(did) return chargerDefile(did);
      if(ctx && typeof ctx.defile === 'string') return chargerDefile(ctx.defile);
      return chargerListe();
    });
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if(!b) return;
    var a = function(k){ return b.getAttribute(k); };
    if(a('data-vue')) changerVue(a('data-vue'));
    else if(a('data-ouvrir')) chargerDefile(a('data-ouvrir'));
    else if(a('data-voter')) voter(a('data-voter'));
    else if(b.id === 'bFilmer') filmer();
    else if(b.id === 'bRefilmer'){ if(deuxTouchers('refilmer')){ oublierPrise(); filmer(); } }
    else if(b.id === 'bRetirer') retirer();
    else if(b.id === 'bSaison') ouvrir('Arena', {vue:'reveil', depuis:'pagne'});
    else if(a('data-publier')) decider(a('data-publier'), true);
    else if(a('data-refuser')) decider(a('data-refuser'), false);
  });
  document.addEventListener('input', function(ev){
    var t = ev.target; if(!t || !ST.form) return;
    if(t.id === 'iNom') ST.form.nom = t.value; else if(t.id === 'iHistoire') ST.form.histoire = t.value;
  });
  document.addEventListener('change', function(ev){
    var t = ev.target; if(!t) return;
    if(t.id === 'langue'){ var l = t.value; if(!LANGUES_UI[l]) return; ecrire('nv_ui_langue', l); poserLangue(l); rendre(); var s = $('langue'); if(s) s.focus(); }
  });
  document.addEventListener('submit', function(ev){
    var f = ev.target; if(!f) return; ev.preventDefault();
    if(f.id === 'fTissu') presenter(); else if(f.id === 'fDefile') creerDefile();
  });
  window.NVPagne = {etat:function(){ return {etat:ST.etat, vue:ST.vue, apercu:ST.apercu, defiles:ST.defiles.length, prise:!!ST.prise, langue:L}; }};
}

/* ════════ La présentation (17 nov. 2026, étape 2 du plan des 8 nouveautés) : un film dessiné, « Comment ça marche »,
   « Ce qui vous protège ». En grand quand la nouveauté n'est pas encore ouverte ; repliée sur la page principale sinon. ════════ */
var _rendrePres = rendre;
rendre = function(){ var r = _rendrePres.apply(this, arguments); presenterNouveaute(); return r; };
function presenterNouveaute(){
  if(!window.NVPresente) return;
  var ferme = !ST.cap && !ST.apercu && (ST.etat === 'sansserveur' || ST.etat === 'indisponible');
  if(!ferme && !((ST.cap || ST.apercu) && ST.vue === 'liste')){ NVPresente.poser(null); return; }
  NVPresente.poser({cle:'pagne', scene:'pagne', couleurs:['#ffc531','#ff4f9e'], ouvert:ferme, apres:$('etat'), titreFilm:T('Mon pagne, ma nation'),
    intro:ferme ? T('Bientôt ouvert ici. Voici ce qui vous attend.') : '', comment:T('Comment ça marche'), protege:T('Ce qui vous protège'),
    etapes:[T('Filmez le pagne de votre nation (30 secondes) et racontez son histoire.'), T('L’équipe relit chaque tissu avant le défilé.'), T('Votez pour les plus beaux : 3 voix, jamais pour votre propre nation.')],
    protections:[T('Le vote est gratuit et demande un compte vérifié.'), T('Les résultats sont figés à la fin du vote.'), T('Le pseudo d’un mineur n’est jamais montré.')]});
}

demarrer();
})();

</script>
