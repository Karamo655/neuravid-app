<!-- ═══════════════════════════════════════════════════════════════════
     LE GRIOT — la bibliothèque musicale de NEURAVID (v1)
     Un seul fichier, aucune ressource extérieure. Ce fichier ne contient aucune musique :

     et des fichiers de la personne. Voir NOTE_AFAQ.md pour les routes et le pont avec les modules.
     ═══════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --nuit:#150f20; --nuit2:#1f1730; --terre:#2b1f36; --voile:rgba(255,244,228,.07); --trait:rgba(255,244,228,.12);
  --or:#f0b23e; --ocre:#d9762b; --indigo:#5a48e0; --lagon:#16c7c0; --rose:#ff4f9e;
  --lune:#f8f0e3; --brume:#bfb2cf; --sourd:#8d809f; --ok:#7ce2a8; --alerte:#ff9a7a;
  --hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  --titre:Optima,Candara,"Segoe UI Variable Display","Noto Sans",system-ui,-apple-system,sans-serif;
  --texte:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--nuit);color:var(--lune);font-family:var(--texte);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
/* le fond : les cordes de la kora, à peine visibles, et la lueur de la calebasse */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(90% 55% at 50% -8%,rgba(240,178,62,.20),transparent 62%),
             radial-gradient(70% 50% at 100% 100%,rgba(90,72,224,.18),transparent 70%),
             repeating-linear-gradient(90deg,transparent 0 37px,rgba(255,244,228,.025) 37px 38px),var(--nuit)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--or);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.hexa{clip-path:var(--hex)}
bdi{unicode-bidi:isolate}

/* ── la tête ── */
#tete{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) 14px 10px;background:linear-gradient(180deg,rgba(21,15,32,.96),rgba(21,15,32,.82));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#marque{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
#marque .logo{width:34px;height:38px;flex:none;clip-path:var(--hex);background:conic-gradient(from 210deg,var(--lagon),var(--indigo),var(--rose),var(--or),var(--lagon));display:grid;place-items:center}
#marque .logo i{width:24px;height:27px;clip-path:var(--hex);background:var(--nuit);display:grid;place-items:center;font-style:normal;font-size:13px}
#marque b{font-family:var(--titre);font-size:21px;letter-spacing:.01em;display:block;line-height:1.1}
#marque small{display:block;font-size:12px;color:var(--brume);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#marque>div{min-width:0}
.rond{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--voile);border:1px solid var(--trait);font-size:17px}

/* ── les vues ── */
main{padding:4px 0 calc(150px + var(--sb))}
.vue{display:none}.vue.on{display:block}
h2.titre{font-family:var(--titre);font-size:19px;margin:22px 16px 4px;display:flex;align-items:center;gap:8px}
p.sous{margin:0 16px 10px;color:var(--brume);font-size:13.5px}
.petit{font-size:13px;color:var(--brume);margin:6px 0}
.vide{margin:10px 16px;padding:18px;border-radius:18px;border:1px dashed var(--trait);color:var(--brume);text-align:center;font-size:14px}
.defile{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.defile::-webkit-scrollbar{display:none}

/* ── LA KORA : le son du moment ── */
#kora{position:relative;margin:6px 16px 0;padding:14px 14px 16px;border-radius:26px;background:linear-gradient(160deg,rgba(43,31,54,.95),rgba(31,23,48,.9));border:1px solid var(--trait);overflow:hidden}
#kora .scene{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto}
#kora canvas{position:absolute;inset:0;width:100%;height:100%}
#kora .coeur{position:absolute;left:50%;top:50%;width:38%;aspect-ratio:.87;transform:translate(-50%,-50%);clip-path:var(--hex);background:radial-gradient(circle at 35% 30%,#ffd98c,var(--or) 45%,var(--ocre));display:grid;place-items:center;overflow:hidden;box-shadow:0 0 40px rgba(240,178,62,.4)}
#kora .coeur img{width:100%;height:100%;object-fit:cover}
#kora .coeur span{font-size:34px}
#kora .info{text-align:center;margin-top:8px;min-width:0}
#kora .info b{font-family:var(--titre);font-size:20px;display:block;overflow-wrap:anywhere}
#kora .info>small{color:var(--brume);font-size:13.5px;display:block}
.puces{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.puce{display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 10px;border-radius:99px;background:var(--voile);border:1px solid var(--trait);font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums}
.puce.or{border-color:rgba(240,178,62,.5);color:#ffd98c}
.puce.ok{border-color:rgba(124,226,168,.45);color:var(--ok)}
.actions{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
.hexbtn{width:68px;height:76px;clip-path:var(--hex);background:var(--voile);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;line-height:1;gap:3px}
.hexbtn small{font-size:10.5px;font-weight:750;letter-spacing:-.01em;color:var(--brume);max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hexbtn.jouer{width:72px;height:80px;font-size:26px;background:linear-gradient(150deg,var(--or),var(--ocre));color:#2a1400}
.hexbtn.jouer small{color:#3d1d00}
.hexbtn.on{background:rgba(255,79,158,.35)}
.vers-mod{font-weight:600;font-size:12px;opacity:.75;margin-inline-start:4px}
.utiliser{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:14px;padding:0 18px;border-radius:16px;font-weight:800;font-size:15.5px;color:#fff;background:linear-gradient(120deg,var(--lagon),var(--indigo) 55%,var(--rose));box-shadow:0 12px 26px -14px var(--rose)}
.utiliser[disabled]{opacity:.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;font-weight:750;background:var(--voile);border:1px solid var(--trait)}
.btn.large{width:100%}
.btn.or{background:linear-gradient(135deg,var(--or),var(--ocre));color:#2a1400;border:0}
.rangee{display:flex;gap:8px}.rangee>*{flex:1}

/* ── les tuiles hexagonales (Ça monte) ── */
.tuile{flex:none;width:118px;scroll-snap-align:start;text-align:center}
.tuile .cv{position:relative;width:104px;height:116px;margin:0 auto 6px}
.tuile b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tuile small{display:block;font-size:11.5px;color:var(--brume);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tuile .monte{color:#ffd98c;font-weight:750;font-variant-numeric:tabular-nums}
.cv{clip-path:var(--hex);background:linear-gradient(150deg,var(--indigo),var(--rose));display:grid;place-items:center;overflow:hidden;font-size:24px}
.cv img{width:100%;height:100%;object-fit:cover}
.cv .lire{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;background:rgba(21,15,32,.25)}
.cv.joue{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}

/* ── les lignes ── */
.liste{margin:2px 10px}
.ligne{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:16px;min-width:0}
.ligne+.ligne{border-top:1px solid rgba(255,244,228,.05)}
.ligne .cv{position:relative;width:52px;height:58px;flex:none;font-size:18px}
.ligne .cv .lire{font-size:16px}
.ligne .x{flex:1;min-width:0;text-align:start}
.ligne .x b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .x small{display:block;font-size:12px;color:var(--brume);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .n{flex:none;font-size:12px;color:var(--brume);text-align:end;font-variant-numeric:tabular-nums;min-width:44px}
.ligne .n b{display:block;color:var(--lune);font-size:13px}
.ligne .fav{flex:none;width:38px;height:42px;clip-path:var(--hex);background:var(--voile);font-size:16px}
.ligne .fav.on{background:rgba(255,79,158,.35)}
.marque-orig{display:inline-block;margin-inline-start:6px;padding:0 7px;border-radius:99px;font-size:10.5px;font-weight:750;vertical-align:1px;background:rgba(22,199,192,.16);color:#7deee9;border:1px solid rgba(22,199,192,.35)}
.plus{display:block;margin:6px auto 0;min-height:40px;padding:0 18px;border-radius:99px;border:1px solid var(--trait);font-size:13.5px;font-weight:700}

/* ── le monde ── */
.ruche{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 4px;padding:6px 12px 2px}
.ruche button{width:104px;height:116px;clip-path:var(--hex);background:var(--terre);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:750;padding:0 10px;text-align:center}
.ruche button i{font-style:normal;font-size:24px}
.ruche button small{font-size:11.5px;color:var(--brume);font-weight:600;font-variant-numeric:tabular-nums}
.ruche button.on{background:linear-gradient(150deg,var(--or),var(--ocre));color:#2a1400}
.ruche button.on small{color:#4b2500}
.ruche button:nth-child(even){margin-top:30px}
.pays .drap{font-size:26px;width:52px;text-align:center;flex:none}
.retour-chip{display:inline-flex;align-items:center;gap:6px;margin:12px 16px 0;min-height:36px;padding:0 14px;border-radius:99px;background:var(--voile);border:1px solid var(--trait);font-size:13.5px;font-weight:700}

/* ── chercher ── */
.champ{display:flex;align-items:center;gap:8px;margin:10px 16px;padding:0 14px;min-height:48px;border-radius:16px;background:var(--voile);border:1px solid var(--trait)}
.champ input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.genres{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.genres button{min-height:36px;padding:0 13px;border-radius:99px;background:var(--voile);border:1px solid var(--trait);font-size:13px;font-weight:650}
.genres button.on{background:rgba(240,178,62,.2);border-color:rgba(240,178,62,.6);color:#ffd98c}

/* ── mes sons ── */
.onglets{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglets button{flex:none;min-height:38px;padding:0 14px;border-radius:99px;font-size:13.5px;font-weight:700;color:var(--brume);border:1px solid transparent}
.onglets button.on{color:var(--lune);background:var(--voile);border-color:var(--trait)}
.carte{margin:10px 16px;padding:14px;border-radius:20px;background:var(--terre);border:1px solid var(--trait)}
.carte h3{margin:0 0 6px;font-family:var(--titre);font-size:17px}
.chiffres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.chiffres div{padding:10px;border-radius:14px;background:var(--voile);text-align:center}
.chiffres b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.chiffres small{font-size:11.5px;color:var(--brume)}
.partage{margin:8px 0 0;padding:0;list-style:none}
.partage li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}
.partage li span{flex:1;min-width:0}
.partage li b{font-variant-numeric:tabular-nums}
.partage li i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--or),var(--rose));flex:none}

/* ── le petit lecteur ── */
#mini{position:fixed;left:8px;right:8px;bottom:calc(76px + var(--sb));z-index:40;display:flex;align-items:center;gap:10px;padding:7px 10px 9px;border-radius:20px;background:rgba(43,31,54,.96);border:1px solid var(--trait);box-shadow:0 14px 30px -14px #000;max-width:760px;margin:0 auto;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#mini .cv{position:relative;width:40px;height:44px;flex:none;font-size:15px}
#mini .x{flex:1;min-width:0}
#mini .x b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .x small{display:block;font-size:11.5px;color:var(--brume);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .barre{position:absolute;left:16px;right:16px;bottom:3px;height:3px;border-radius:2px;background:rgba(255,244,228,.12);overflow:hidden}

#mini .barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--or),var(--rose))}
#mini .rond{width:40px;height:40px}
#mini .go{flex:none;min-height:40px;padding:0 12px;border-radius:12px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(120deg,var(--lagon),var(--indigo) 55%,var(--rose));max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── le dock ── */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--sb));background:rgba(21,15,32,.97);border-top:1px solid var(--trait)}
#dock button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;font-size:11.5px;font-weight:700;color:var(--sourd)}
#dock button i{width:30px;height:33px;clip-path:var(--hex);display:grid;place-items:center;font-style:normal;font-size:16px;background:transparent}
#dock button.on{color:var(--lune)}
#dock button.on i{background:linear-gradient(150deg,var(--or),var(--ocre))}

/* ── les feuilles ── */
#voile{position:fixed;inset:0;z-index:60;background:rgba(8,5,14,.6);opacity:0;pointer-events:none;transition:opacity .25s}
#voile.on{opacity:1;pointer-events:auto}
.feuille{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:760px;margin:0 auto;max-height:92vh;display:flex;flex-direction:column;border-radius:26px 26px 0 0;background:linear-gradient(180deg,#2a1f38,#1a1329);border-top:1px solid var(--trait);transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.feuille.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.feuille.haute{height:92vh}
.feuille .tete-f{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.feuille .tete-f h3:focus{outline:none}
.feuille .tete-f h3{flex:1;margin:0;font-family:var(--titre);font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feuille .corps-f{overflow-y:auto;padding:4px 16px calc(20px + var(--sb));-webkit-overflow-scrolling:touch}
.accord{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px}
.accord input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--or)}
label.champ-f{display:block;margin:10px 0}
label.champ-f span{display:block;font-size:13px;color:var(--brume);margin-bottom:5px}
label.champ-f input,label.champ-f select{width:100%;min-height:46px;padding:0 12px;border-radius:12px;background:var(--voile);border:1px solid var(--trait)}

/* ── la page d'un son ── */
.entete-son{display:flex;gap:14px;align-items:center}
.entete-son .cv{position:relative;width:96px;height:108px;flex:none;font-size:32px}
.entete-son .x{min-width:0}
.entete-son b{display:block;font-family:var(--titre);font-size:20px;overflow-wrap:anywhere}
.entete-son .auteur{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:14px;color:var(--brume);text-decoration:underline;text-underline-offset:3px}
.chaine{display:flex;align-items:center;overflow-x:auto;gap:0;padding:8px 2px 12px;scrollbar-width:none}
.chaine::-webkit-scrollbar{display:none}
.chaine .noeud{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:64px}
.chaine .noeud i{width:46px;height:52px;clip-path:var(--hex);background:var(--terre);display:grid;place-items:center;font-style:normal;font-size:22px}
.chaine .noeud:first-child i{background:linear-gradient(150deg,var(--or),var(--ocre))}
.chaine .noeud small{font-size:11px;color:var(--brume);font-variant-numeric:tabular-nums;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chaine .lien{flex:none;width:18px;height:2px;background:linear-gradient(90deg,var(--or),var(--rose));margin-bottom:18px}
.grille{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grille .rep{position:relative;aspect-ratio:.87;clip-path:var(--hex);background:var(--terre);overflow:hidden;display:grid;place-items:center;font-size:22px}
.grille .rep img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grille .rep small{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:11px;font-weight:750;text-shadow:0 1px 3px #000}

/* ── le studio de découpe ── */
.onde{position:relative;height:132px;margin:8px 0 4px;border-radius:16px;background:rgba(0,0,0,.25);overflow:hidden;touch-action:none}
.onde canvas{position:absolute;inset:0;width:100%;height:100%}
.onde .fenetre{position:absolute;top:0;bottom:0;border:2px solid var(--or);border-radius:12px;background:rgba(240,178,62,.13);box-shadow:0 0 0 999px rgba(8,5,14,.38)}
.onde .fenetre::before,.onde .fenetre::after{content:"";position:absolute;top:50%;width:14px;height:34px;margin-top:-17px;clip-path:var(--hex);background:var(--or)}
.onde .fenetre::before{left:-8px}.onde .fenetre::after{right:-8px}
.onde .tete-l{position:absolute;top:0;bottom:0;width:2px;background:var(--lune);pointer-events:none}
.temps{display:flex;justify-content:space-between;font-size:13px;color:var(--brume);font-variant-numeric:tabular-nums}
.durees{display:flex;gap:8px;margin:12px 0}
.durees button{flex:1;min-height:40px;border-radius:12px;background:var(--voile);border:1px solid var(--trait);font-weight:750;font-size:13.5px}
.durees button.on{background:rgba(240,178,62,.22);border-color:rgba(240,178,62,.6);color:#ffd98c}
.durees button[disabled]{opacity:.35}

/* ── l'annonce ── */
#toast{position:fixed;left:50%;bottom:calc(150px + var(--sb));z-index:90;transform:translate(-50%,16px);max-width:min(92vw,520px);padding:11px 16px;border-radius:14px;background:var(--lune);color:#24152f;font-size:13.5px;font-weight:650;box-shadow:0 10px 30px -10px #000;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── fermé avant 13 ans ── */
#ferme{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;background:var(--nuit)}
#ferme.on{display:flex}

/* ── ouvert depuis une story ou une vidéo ── */
body.dedans #dock button[data-v="moi"] small{display:none}
body.dedans #marque small{color:#ffd98c}

@media (min-width:600px){
  #kora{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:center}
  #kora .info{text-align:start}
  #kora .puces,#kora .actions{justify-content:flex-start}
  .grille{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:350px){
  .actions{gap:6px}
  .hexbtn{width:58px;height:66px}
  .hexbtn small{font-size:9.5px;max-width:56px}
  .hexbtn.jouer{width:60px;height:68px}
  .tuile{width:104px}.tuile .cv{width:92px;height:104px}
  .ruche button{width:92px;height:104px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nv-cree{display:inline-flex;align-items:center;gap:5px;margin-inline-start:6px;padding:1px 8px 1px 6px;border-radius:10px;border:1px solid rgba(232,184,74,.7);color:#E8B84A;font-size:11px;font-weight:700;white-space:nowrap;vertical-align:middle}
.nv-cree::before{content:"";width:9px;height:10px;background:#E8B84A;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
</style>

/* ════════ La kora : 21 cordes autour de la calebasse ════════ */
var KORA = {raf:0, t0:0};
function animerKora(){
  if(KORA.raf) return;

    KORA.raf = 0;
    var c = [].filter.call(document.querySelectorAll('canvas.cordes'), function(cv){ return cv.offsetParent !== null; });
    c.forEach(function(cv){ dessinerKora(cv, t); });

}

function dessinerKora(cv, t){
  var r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));

  var x = cv.getContext('2d'); x.clearRect(0, 0, w, h);

  x.lineWidth = 2 * dpr; x.strokeStyle = 'rgba(248,240,227,.18)'; x.beginPath();
  for(var k = 0; k <= 6; k++){ var an = Math.PI / 3 * k - Math.PI / 2; var px = cx + R * Math.cos(an), py = cy + R * Math.sin(an); if(k) x.lineTo(px, py); else x.moveTo(px, py); }

  x.strokeStyle = g; x.lineCap = 'round';

    var a1 = (Math.PI * 2 / n) * i - Math.PI / 2, ca = Math.cos(a1), sa = Math.sin(a1);
    var x1 = cx + r0 * ca, y1 = cy + r0 * sa, x2 = cx + R * .96 * ca, y2 = cy + R * .96 * sa;

  }
  x.globalAlpha = 1;
}

/* ════════ Les feuilles ════════
   Une feuille à la fois, avec ses pages (la page d'un son → le studio de découpe). Le retour du
   téléphone revient d'une page, puis ferme la feuille. Ouvert dans un autre module, le Griot ne touche

var F = {pages:[], pousse:false, retour:0, apres:null, focus:null};
function feuilleOuverte(){ return $('feuille').classList.contains('on'); }
function ouvrirFeuille(titre, html, o){
  o = o || {};

  if(o.nouvelle !== false || !feuilleOuverte()){ while(F.pages.length){ var p0 = F.pages.pop(); if(p0.surFermer) try{ p0.surFermer(); }catch(e){ dbg(e); } } }
  F.pages.push({titre:titre, rendre:o.rendre || null, html:html, haute:!!o.haute, surFermer:o.surFermer || null, apres:o.apres || null});
  montrerPage();

  setTimeout(function(){ try{ $('fTitre').focus(); }catch(e){ dbg(e); } }, 60);

}
/* ouvert dans un autre module, le Griot dit combien de couches sont ouvertes : le module garde le retour du téléphone et le renvoie ici (music_back) */
function profondeur(){ return (feuilleOuverte() ? F.pages.length : 0) + (ETAT.paysOuvert ? 1 : 0); }
function annoncerCouches(){ if(DEDANS) emit('music_layer', {n:profondeur()}, true); }

function montrerPage(){
  var p = F.pages[F.pages.length - 1]; if(!p) return;
  var f = $('feuille'); f.classList.toggle('haute', p.haute);
  var retour = F.pages.length > 1;
  $('fTitre').textContent = p.titre;
  $('fFermer').textContent = retour ? (LANGUE === 'ar' ? '›' : '‹') : '✕';
  $('fFermer').setAttribute('aria-label', retour ? T('Revenir') : T('Fermer'));

  while(F.pages.length){ var p = F.pages.pop(); if(p.surFermer) try{ p.surFermer(); }catch(e){ dbg(e); } }

/* fermer, puis faire la suite une fois le retour revenu (sinon la suite se perd dans l'historique) */
function fermerFeuille(fn){
  if(!feuilleOuverte()){ if(fn) fn(); return; }
  cacherFeuille();
  if(F.pousse){ F.pousse = false; F.retour++; F.apres = fn || null; try{ history.back(); }catch(e){ F.retour--; }
    setTimeout(function(){ var f0 = F.apres; F.apres = null; if(f0) f0(); }, 1500); }

/* ════════ Mes fichiers : gardés dans le navigateur de la personne (IndexedDB) ════════ */
var FICHIERS = {db:null, liste:[], urls:{}, pret:false};
function baseFichiers(cb){
  if(FICHIERS.db){ cb(FICHIERS.db); return; }
  try{
    var r = indexedDB.open('nv_griot', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('fichiers', {keyPath:'cle'}); };
    r.onsuccess = function(){ FICHIERS.db = r.result; cb(FICHIERS.db); };
    r.onerror = function(){ cb(null); };
  }catch(e){ dbg(e); cb(null); }
}
function chargerFichiers(cb){
  baseFichiers(function(db){
    if(!db){ FICHIERS.pret = true; if(cb) cb(); return; }
    try{
      var q = db.transaction('fichiers').objectStore('fichiers').getAll();
      q.onsuccess = function(){
        var c = compte() || 'invite';
        FICHIERS.liste = (q.result || []).filter(function(x){ return x.compte === c; }).sort(function(a, b){ return b.at - a.at; });
        FICHIERS.liste.forEach(function(x){ if(!FICHIERS.urls[x.cle] && x.blob) FICHIERS.urls[x.cle] = URL.createObjectURL(x.blob); });
        FICHIERS.pret = true; if(cb) cb();
      };
      q.onerror = function(){ FICHIERS.pret = true; if(cb) cb(); };
    }catch(e){ dbg(e); FICHIERS.pret = true; if(cb) cb(); }
  });
}
function sonFichier(x){ return garder(normSon({id:null, cle:x.cle, src:FICHIERS.urls[x.cle], titre:x.titre, artiste:moi().nom || moi().handle || '', duree:x.duree, kind:'local', licence:T('Votre fichier')})); }
function ajouterFichier(f){
  if(!f) return;

  if(f.size > REGLES.fichierMax){ toast(T('Ce fichier est trop lourd (30 Mo au plus).')); return; }
  var url = URL.createObjectURL(f), a = new Audio();
  a.preload = 'metadata';
  a.onloadedmetadata = function(){
    var x = {cle:idem('fic'), compte:compte() || 'invite', titre:txt(String(f.name || '').replace(/\.[a-z0-9]+$/i, ''), 80) || T('Mon son'), duree:isFinite(a.duration) ? Math.round(a.duration) : null, at:Date.now(), blob:f};
    FICHIERS.urls[x.cle] = url;

    baseFichiers(function(db){ if(!db){ fin(); return; } try{ var tr = db.transaction('fichiers', 'readwrite'); tr.objectStore('fichiers').put(x); tr.oncomplete = fin; tr.onerror = fin; }catch(e){ dbg(e); fin(); } });
  };

}

  if(A.son && A.son.cle === cle) arreter();
  if(FICHIERS.urls[cle]){ try{ URL.revokeObjectURL(FICHIERS.urls[cle]); }catch(e){ dbg(e); } delete FICHIERS.urls[cle]; }
  baseFichiers(function(db){ if(db) try{ db.transaction('fichiers', 'readwrite').objectStore('fichiers').delete(cle); }catch(e){ dbg(e); } });

/* ════════ Le pont avec le module qui a ouvert le Griot (Story Universe…) ════════

   Messages reçus, seulement de la page parente : griot_config {api, token, user} (la session de la
   personne), music_load {sons} (un catalogue déjà chargé), music_open, music_hide. */

    if(d.user && typeof d.user === 'object') CFG.user = {id:d.user.id != null ? String(d.user.id) : null, nom:txt(d.user.nom, 60), handle:txt(d.user.handle, 40), iso:/^[A-Z]{2}$/.test(d.user.iso || '') ? d.user.iso : null, age:typeof d.user.age === 'number' ? d.user.age : undefined, majeur:typeof d.user.majeur === 'boolean' ? d.user.majeur : undefined};

<!--NV_VERS_IRIS--><script id="nv-vers-iris" data-module="Griot">
/* NEURAVID — VERS IRIS : toute vidéo d'un module peut s'ouvrir dans Iris, le lecteur principal.
