:root{
  --encre:#F7F3FF; --brume:#CFC8EA; --gris:#A49CC4; --or:#FFC93D; --teal:#2EE6C5; --violet:#7B3BFF; --rose:#FF3D9A; --rouge:#FF2D55;
  --nv:linear-gradient(110deg,#2EE6C5 0%,#7B3BFF 52%,#FF3D9A 100%);
  --verre:rgba(18,11,42,.56); --verre2:rgba(255,255,255,.08); --fil:rgba(255,255,255,.14);
  --hx:polygon(50% 0,93.3% 25%,93.3% 75%,50% 100%,6.7% 75%,6.7% 25%);
  --haut:env(safe-area-inset-top,0px); --basS:env(safe-area-inset-bottom,0px);
  --police:"Inter NV",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --ciel-haut:#050310; --ciel-mi:#0A0618; --ciel-bas:#170D33;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:#0A0620}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;min-height:100%;font:15px/1.45 var(--police);color:var(--encre);background:#0A0620;overflow-x:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--or);outline-offset:3px;border-radius:10px}
[lang=nqo] body,.nko{font-family:"NKo",var(--police)}
.hx-btn{position:relative;flex:none;width:42px;height:46px;display:grid;place-items:center;clip-path:var(--hx);background:rgba(255,255,255,.10)}
.hx-btn::before{content:"";position:absolute;inset:1.5px;clip-path:var(--hx);background:rgba(10,6,28,.55)}
.hx-btn svg{position:relative;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hx-btn.petit{width:36px;height:40px}
.hx-btn.petit svg{width:17px;height:17px}
@keyframes tourneSurf{to{transform:translateX(-76px)}}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 14px;border-radius:14px;background:var(--nv);color:#fff;font-weight:800;font-size:14.5px;text-align:center}
.btn.leger{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px var(--fil)}
.bas{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;padding:0 6px calc(6px + var(--basS));height:calc(78px + var(--basS));background:linear-gradient(180deg,rgba(9,6,26,0),rgba(9,6,26,.82) 38%,rgba(9,6,26,.95));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bas::before{content:"";position:absolute;left:0;right:0;top:22px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18) 20%,rgba(255,255,255,.18) 80%,transparent)}
.nb{position:relative;flex:1;max-width:96px;display:grid;justify-items:center;gap:2px;padding-bottom:2px;font-size:11px;font-weight:700;color:var(--gris);transition:color .3s}
.nb .ic{width:46px;height:44px;display:grid;place-items:center;position:relative}
.nb .ic svg{width:34px;height:34px;overflow:visible}
.nb.on{color:var(--encre)}
.nb.on::after{content:"";position:absolute;bottom:-3px;width:16px;height:4px;border-radius:2px;background:var(--nv)}
.nb>span:last-child{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb.centre{max-width:104px}
.nb.centre .ic{width:76px;height:82px;margin-top:-34px}
.nb.centre .ic svg{width:76px;height:82px}
.nb.centre span{color:var(--encre)}
.nb:active .ic{transform:scale(.92)}
.nb .ic{transition:transform .15s}
.voile{position:fixed;inset:0;z-index:40;background:rgba(4,2,14,.6);opacity:0;transition:opacity .25s}
.voile.on{opacity:1}
.feuille{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:88svh;overflow:auto;padding:16px 16px calc(20px + var(--basS));border-radius:24px 24px 0 0;background:#140C33;box-shadow:0 -20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto}
.feuille.on{transform:none}
.feuille .tete{position:static;padding:0 0 10px;display:flex;align-items:center;justify-content:space-between;background:none}
.feuille h2{margin:0;font-size:19px}
.feuille h3{margin:16px 0 8px;font-size:13px;color:var(--brume);font-weight:750}
.grille-mod{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.grille-mod button{display:grid;justify-items:center;gap:5px;padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.05);font-size:12px;font-weight:650;text-align:center;line-height:1.2}
.grille-mod button{background:radial-gradient(90% 70% at 50% 18%,color-mix(in srgb,var(--c) 22%,transparent),transparent 72%),rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .18s,box-shadow .18s}
.grille-mod button:active{transform:scale(.96)}
.grille-mod button:hover,.grille-mod button:focus-visible{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent)}
.gemme{width:50px;height:59px;display:block;overflow:visible;transition:transform .25s cubic-bezier(.2,.9,.3,1.3)}
.grille-mod button:hover .gemme,.grille-mod button:focus-visible .gemme{transform:translateY(-3px) rotate(-4deg)}
.feuille.on .grille-mod .gemme{animation:gemVient .5s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--k,0) * 45ms + 120ms)}
@keyframes gemVient{from{opacity:0;transform:translateY(10px) scale(.6) rotate(-20deg)}}
.interrupteur{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 0;text-align:start}
.interrupteur i{flex:none;width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.interrupteur i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.interrupteur[aria-checked=true] i{background:var(--teal)}
.interrupteur[aria-checked=true] i::after{transform:translateX(18px)}
[dir=rtl] .interrupteur[aria-checked=true] i::after{transform:translateX(-18px)}
#toast{position:fixed;z-index:60;left:50%;bottom:calc(100px + var(--basS));transform:translate(-50%,20px);max-width:calc(100% - 32px);padding:11px 16px;border-radius:14px;background:#FFFFFF;color:#140C33;font-weight:650;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes tourne{to{transform:rotate(360deg)}}
.nb .facettes{animation-duration:10s}
.nb .ondes .o1,.nb .ondes .o2{animation:onde 2.2s ease-out infinite}
.nb .ondes .o2{animation-delay:.35s}
@keyframes onde{0%{opacity:.25}40%{opacity:1}100%{opacity:.25}}
.nb.on .rempli{opacity:.35;transition:opacity .3s}
.nb .feuilles path{transform-box:fill-box;transform-origin:center bottom;animation:feuille 3.6s ease-in-out infinite}
.nb .feuilles path:nth-child(2n){animation-delay:-1.2s}
@keyframes feuille{50%{transform:rotate(4deg) translateY(-.5px)}}
.nb.centre .ic{filter:drop-shadow(0 6px 18px rgba(123,59,255,.55))}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puces button{min-height:38px;padding:0 13px;border-radius:19px;background:rgba(255,255,255,.07);font-size:13.5px}
.puces button.on{background:var(--nv);color:#fff}
.petit{font-size:12.5px;color:var(--brume)}
.tete{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--haut)) 14px 8px;transition:background .4s,box-shadow .4s,backdrop-filter .4s}
.tete-fin{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
/* ════ LE PASSEPORT ════
   Un livret d'encre de nuit : une couverture gravée de guillochis (les crêtes de l'empreinte), des pages de papier sombre,
   des timbres à l'encre dorée. Une seule métrique domine : le HVS. */
:root{--encre-nuit:#0B1020;--papier:#121834;--papier2:#171F40;--or-t:#E9C46A;--texte:#EEF3F1;--doux:#9DB3B0;--mont:#3DDC97;--desc:#FF6B7A;--fil:rgba(255,255,255,.12)}
body{background:radial-gradient(110% 50% at 50% -8%,#1B2554 0%,transparent 62%),radial-gradient(80% 40% at 100% 45%,rgba(47,211,194,.07),transparent 60%),var(--encre-nuit);color:var(--texte)}
.tete{background:rgba(11,16,32,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--fil)}
.titre{display:flex;align-items:center;gap:8px;min-width:0}
.titre .gemme{width:30px;height:35px;flex:none}
.titre b{display:block;font-size:17px;font-weight:850;white-space:nowrap}
.titre small{display:block;font-size:11.5px;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
main{padding:calc(70px + var(--haut)) 14px calc(116px + var(--basS));max-width:720px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.demo-bandeau{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;padding:8px 12px;border-radius:14px;background:rgba(233,196,106,.13);box-shadow:inset 0 0 0 1px rgba(233,196,106,.35);font-size:12.5px;text-align:center}
.demo-bandeau[hidden]{display:none}.demo-bandeau b{color:var(--or-t)}.demo-bandeau button{min-height:32px;padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.12);font-weight:750;font-size:12px}
#livret{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;perspective:1400px}
.vv,.vv span,.oeuvre b,.co-l b,.victoires b,.parcours span,.couv-qui h1,.p-tete h2{min-width:0;overflow-wrap:anywhere}
#livret.ouvre .couv{transform-origin:left center;animation:pageTourne 1s cubic-bezier(.2,.8,.2,1) both}
[dir=rtl] #livret.ouvre .couv{transform-origin:right center}
@keyframes pageTourne{from{transform:rotateY(-62deg);opacity:.2}to{transform:none;opacity:1}}
.page{position:relative;padding:18px 16px 18px;border-radius:6px 22px 22px 6px;background:linear-gradient(180deg,var(--papier2),var(--papier));box-shadow:inset 3px 0 0 rgba(233,196,106,.28),inset 0 0 0 1px var(--fil),0 14px 34px rgba(0,0,0,.35);overflow:hidden}
[dir=rtl] .page{border-radius:22px 6px 6px 22px;box-shadow:inset -3px 0 0 rgba(233,196,106,.28),inset 0 0 0 1px var(--fil),0 14px 34px rgba(0,0,0,.35)}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 110% -10%,rgba(255,255,255,.025) 0 1px,transparent 1px 7px)}
.p-tete{position:relative;z-index:1;display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.p-num{flex:none;width:26px;height:30px;display:grid;place-items:center;clip-path:var(--hx);background:rgba(233,196,106,.16);color:var(--or-t);font-weight:900;font-size:13px}
.p-tete>div{flex:1;min-width:0}
.p-tete h2{margin:0;font-size:22px;font-weight:850;letter-spacing:-.01em}
.p-q{margin:2px 0 0;color:var(--doux);font-size:13.5px;font-style:italic}.p-q::before{content:"« "}.p-q::after{content:" »"}
.t-page{flex:none;width:48px;height:52px;transform:rotate(var(--r,0deg))}
.t-page.neuf{animation:tampon .7s cubic-bezier(.2,1.6,.4,1) .4s both}
@keyframes tampon{from{transform:rotate(var(--r)) scale(2.2);opacity:0}60%{opacity:1}}
.champ{position:relative;z-index:1;margin-top:14px}
.champ h3{margin:0 0 8px;font-size:12.5px;font-weight:750;color:var(--doux)}
/* la couverture */
.couv{padding:16px 16px 18px;background:radial-gradient(120% 80% at 80% 10%,rgba(139,108,255,.22),transparent 60%),radial-gradient(90% 70% at 0% 100%,rgba(47,211,194,.16),transparent 60%),#0E1430}
.guilloche{position:absolute;inset:0;opacity:.16;background:repeating-radial-gradient(ellipse at 78% 32%,transparent 0 9px,rgba(233,196,106,.5) 9px 10px),repeating-radial-gradient(ellipse at 18% 88%,transparent 0 13px,rgba(47,211,194,.45) 13px 14px);mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%)}
.couv-haut{position:relative;display:flex;align-items:center;gap:8px;color:var(--or-t);font-weight:800;font-size:14px;letter-spacing:.04em}
.couv-haut span{flex:1}
.embleme{width:26px;height:28px}
.couv-corps{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,46%);align-items:center;gap:8px;margin-top:6px}
.hvs-dom{display:grid;justify-items:start;gap:2px;min-width:0}
.hvs-l{font-size:12.5px;color:var(--doux);font-weight:700}
.hvs-l abbr{text-decoration:none;color:var(--or-t)}
.hvs-n{font-size:clamp(52px,17vw,68px);line-height:1;font-weight:900;letter-spacing:-.04em;background:linear-gradient(110deg,#fff 30%,#CFC4FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.courbe.petite{width:150px;max-width:100%;height:34px;margin-top:4px}
.hvs-e{font-size:14px;font-weight:800}.hvs-e.mont{color:var(--mont)}.hvs-e.desc{color:var(--desc)}
.hvs-r{font-size:13px;color:var(--texte);font-weight:650}
.lien-doux{margin-top:4px;font-size:12.5px;color:var(--doux);text-decoration:underline;text-underline-offset:3px;min-height:32px;text-align:start}
.emp{justify-self:center;width:100%;max-width:220px;cursor:pointer;border-radius:50%}
.emp .empreinte{width:100%;height:auto;display:block;animation:respire 4s ease-in-out infinite}
@keyframes respire{50%{transform:scale(1.025);filter:drop-shadow(0 0 14px rgba(139,108,255,.35))}}
.couv-qui{position:relative;margin-top:8px}
.couv-qui h1{margin:0;font-size:26px;line-height:1.15;font-weight:900;letter-spacing:-.02em;overflow-wrap:anywhere}
.qui-l{margin:4px 0 0;color:var(--texte);font-size:14.5px;white-space:pre-wrap}
.qui-d{margin:2px 0 0;color:var(--doux);font-size:13px}
.qui-ph{margin:8px 0 0;font-style:italic;color:#E3DCFF;font-size:14.5px}
.certif{display:inline-block;width:16px;height:18px;clip-path:var(--hx);background:var(--teal);vertical-align:2px}
.sommaire{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:16px}
.sommaire button{display:grid;place-items:center;min-height:52px;border-radius:12px}
.sommaire .t-page{width:40px;height:44px}
.sommaire-n{position:relative;margin:4px 0 0;text-align:center;font-size:12.5px;color:var(--or-t);font-weight:700}
/* le passeport vivant */
.vivant{display:grid;gap:10px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--fil)}
.v-ligne h3{margin:0 0 6px;font-size:12px;color:var(--doux);font-weight:750}
.v-l{display:flex;flex-wrap:wrap;gap:6px}
.vv{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.07);font-size:13.5px;font-weight:650;text-align:start}
.vv.direct{background:rgba(255,45,70,.18);color:#FFD5DA}.vv.direct i{width:9px;height:9px;border-radius:50%;background:#FF2D46;animation:pouls 1.6s infinite}
@keyframes pouls{50%{opacity:.3}}
.vv.chiffre{background:rgba(61,220,151,.1)}
.vv.idee{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.vv .t-alv{flex:none}
/* l'identité */
.puces-t{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.puces-t span{padding:6px 11px;border-radius:12px;background:rgba(255,255,255,.07);font-size:13.5px}
.puces-t small{color:var(--doux)}
.bio{margin:0;white-space:pre-wrap;font-size:14.5px}
.lien-l{display:grid;width:100%;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.05);text-align:start;margin-bottom:6px}
.lien-l small{color:var(--doux);font-size:12px}
/* la vie créative */
.alv-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.alv{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:14px}
.alv b{font-size:13px;font-weight:800}
.a-allumer{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.a-allumer li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(233,196,106,.05);box-shadow:inset 0 0 0 1px rgba(233,196,106,.14)}
.a-allumer svg{width:40px;height:44px}
.a-allumer p{margin:0;font-size:13.5px}
.mini{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:12px;background:var(--nv);color:#fff;font-weight:750;font-size:13px}
.mini.doux{background:rgba(255,255,255,.09);color:var(--texte)}
.mini svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.oeuvre{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:14px;background:rgba(255,255,255,.04);text-align:start;margin-bottom:6px}
.oeuvre .gemme{width:38px;height:44px;flex:none}
.oeuvre span{display:grid;min-width:0}.oeuvre b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.oeuvre small{color:var(--doux);font-size:12.5px;white-space:pre-wrap}
.victoires{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.victoires li{display:flex;align-items:center;gap:10px}
.victoires span{display:grid}.victoires small{color:var(--doux);font-size:12.5px;white-space:pre-wrap}
.parcours{list-style:none;margin:0;padding:0 0 0 14px;border-inline-start:2px solid rgba(233,196,106,.3);display:grid;gap:10px}
[dir=rtl] .parcours{padding:0 14px 0 0}
.parcours li{position:relative;display:grid}
.parcours li::before{content:"";position:absolute;inset-inline-start:-21px;top:4px;width:11px;height:12px;clip-path:var(--hx);background:var(--c)}
.parcours small{color:var(--doux);font-size:12px}
/* la progression */
.courbe-g{position:relative;z-index:1}
.courbe{display:block;width:100%;height:130px}
.courbe .trace{stroke-dasharray:1;stroke-dashoffset:0;animation:trace 1.6s cubic-bezier(.3,.7,.2,1) .3s both}
@keyframes trace{from{stroke-dashoffset:1}}
.c-bornes{direction:ltr;display:flex;justify-content:space-between;font-size:12px;color:var(--doux)}
.rangs{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.rangs div{display:grid;gap:2px;padding:10px;border-radius:14px;background:rgba(255,255,255,.05)}
.rangs span{font-size:12px;color:var(--doux)}.rangs b{font-size:19px;font-weight:850}.rangs b.mont{color:var(--mont)}.rangs b.desc{color:var(--desc)}
.note{position:relative;z-index:1;margin:8px 0 0;font-size:12.5px;color:var(--doux)}
.vide-doux{position:relative;z-index:1;margin:6px 0;padding:14px;border-radius:14px;border:1.5px dashed rgba(233,196,106,.3);color:var(--texte);font-size:14px}
.btn.annee{position:relative;z-index:1;width:100%;margin-top:14px}
/* les relations */
.constellation{display:block;width:100%;max-width:360px;height:auto;margin:0 auto}
.co-l{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.co-l button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.04);text-align:start}
.co-l i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;box-shadow:inset 0 0 0 2px var(--c)}
.co-l span{display:grid}.co-l small{color:var(--doux);font-size:12px;white-space:pre-wrap}
.drapeaux{display:flex;flex-wrap:wrap;gap:6px;margin:0;font-size:26px;line-height:1}
.drapeaux.petits{font-size:20px}
/* la preuve */
.preuve{position:relative;z-index:1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.qr{width:132px;padding:8px;border-radius:12px;background:#fff}
.qr svg{display:block;width:100%;height:auto}
.preuve h3{margin:0 0 4px;font-size:12.5px;color:var(--doux)}
.url{margin:0 0 6px;font-size:13.5px;overflow-wrap:anywhere}
.signature p{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0}
.signature code{font-size:20px;font-weight:800;letter-spacing:.12em;color:var(--or-t)}
.zl{position:relative;z-index:1;display:grid;margin-top:16px;padding:10px;border-radius:10px;background:rgba(255,255,255,.04);font:600 11px/1.6 ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:.14em;color:rgba(238,243,241,.5);overflow:hidden;white-space:nowrap;direction:ltr}
/* les invitations (une page à remplir) */
.invite{position:relative;z-index:1;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 10px;align-items:center;margin-top:12px;padding:12px;border-radius:14px;border:1.5px dashed rgba(233,196,106,.35)}
.invite svg{width:40px;height:44px;grid-row:span 2}
.invite p{margin:0;font-size:14px}
.invite .mini{justify-self:start}
.vide-p{text-align:center}
.attente{text-align:center;color:var(--doux);padding:40px 0}
.maj-l{text-align:center;font-size:11.5px;color:var(--doux);margin:0}
/* la version texte */
.texte{padding:16px;border-radius:16px;background:var(--papier);font-size:15px}
.texte h1{margin:0 0 6px;font-size:24px}.texte h2{margin:18px 0 6px;font-size:18px}
.texte ul{margin:0;padding-inline-start:18px;display:grid;gap:4px}
.texte .btn{margin-top:18px;width:100%}
/* les feuilles */
.menu{display:grid;gap:4px}
.menu button{min-height:46px;padding:0 12px;border-radius:12px;text-align:start;font-weight:650;background:rgba(255,255,255,.04)}
.actions{display:flex;gap:8px;margin-top:12px}
.carte-img{display:block;margin:10px auto 0;max-width:100%;border-radius:14px}
.carte-img.story{max-height:56svh}
.carte-img.carre{max-height:46svh}
#occupe{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(4,6,16,.55)}
#occupe[hidden]{display:none}
#occupe i{width:44px;height:50px;clip-path:var(--hx);background:var(--nv);animation:tourne 1.2s linear infinite}
/* accessibilité, petits écrans, droite-à-gauche, mouvement réduit */
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rond{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.1);color:var(--texte)}
.rond svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
[dir=rtl] .hx-btn[data-a=retour] svg{transform:scaleX(-1)}
@media (max-width:360px){.couv-corps{grid-template-columns:minmax(0,1fr) 42%}.rangs b{font-size:16px}.preuve{grid-template-columns:1fr}.qr{justify-self:center}}
@media (prefers-reduced-motion:reduce){#livret.ouvre .couv,.emp .empreinte,.t-page.neuf,.courbe .trace,.vv.direct i,#occupe i,.nb .ondes .o1,.nb .ondes .o2,.nb .feuilles path,.nb .facettes{animation:none}.feuille,.voile,#toast{transition:none}}
/* imprimer ou enregistrer en PDF : une page du passeport par feuille, encre sombre sur papier clair */
@media print{
  .tete,.bas,.vivant,.sommaire,.lien-doux,.mini,.btn,.invite .mini,#toast,.maj-l{display:none!important}
  body{background:#fff!important;color:#111!important}
  main{padding:0;max-width:none}
  .page{break-after:page;box-shadow:none;border:1px solid #bbb;background:#fff!important;color:#111}
  .page::after,.guilloche{display:none}
  .couv{background:#fff!important}.hvs-n{color:#111;background:none;-webkit-text-fill-color:#111}
  .p-q,.champ h3,.note,.qui-d,.hvs-l,.rangs span,.c-bornes,.oeuvre small,.victoires small,.parcours small,.co-l small{color:#555!important}
  .rangs div,.puces-t span,.oeuvre,.co-l button,.a-allumer li,.zl{background:#f3f3f3!important}
  .emp .empreinte,.courbe .trace{animation:none}
  .qui-l,.hvs-r,.qui-ph,.zl,.couv-haut,.sommaire-n,.signature code,.hvs-l abbr,.p-num,.page,.texte{color:#111!important}
  #demoBandeau{background:#fff;color:#111;box-shadow:inset 0 0 0 2px #111}#demoBandeau button{display:none}
}
</style>

/* ════════════════════════════════════════════════════════════════════
   LES PAGES DU PASSEPORT — une couverture et cinq pages, comme un vrai passeport.

function drapeau(iso){ return /^[A-Z]{2}$/.test(iso || '') ? String.fromCodePoint(127397 + iso.charCodeAt(0), 127397 + iso.charCodeAt(1)) : ''; }
function nomPays(iso){ if(!iso) return ''; try{ return new Intl.DisplayNames([LOC()], {type:'region'}).of(iso) || iso; }catch(e){ return iso; } }
function moisAnnee(t){ if(!t) return ''; try{ return new Intl.DateTimeFormat(LOC(), {month:'long', year:'numeric'}).format(new Date(t)); }catch(e){ return new Date(t).getFullYear() + ''; } }

/* ════════ la courbe du HVS : une ligne douce, une zone remplie, sans grille ni axes ════════ */
function courbe(l, W, H, mini){ if(!l || l.length < 2) return ''; var t0 = +jourDate(l[0].d), t1 = +jourDate(l[l.length - 1].d), mn = Infinity, mx = -Infinity; l.forEach(function(p){ mn = Math.min(mn, p.v); mx = Math.max(mx, p.v); }); if(mx === mn){ mx += 1; mn -= 1; }

  var pts = l.map(function(p){ return [x(p), y(p)]; }), d = 'M' + pts.map(function(q){ return q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join('L'), id = mini ? 'cbM' : 'cbG';
  return '<svg class="courbe' + (mini ? ' petite' : '') + '" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FD3C2"/><stop offset=".55" stop-color="#8B6CFF"/><stop offset="1" stop-color="#FF5FA2"/></linearGradient><linearGradient id="' + id + 'a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B6CFF" stop-opacity=".35"/><stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + d + 'L' + pts[pts.length - 1][0].toFixed(1) + ' ' + H + 'L' + pts[0][0].toFixed(1) + ' ' + H + 'Z" fill="url(#' + id + 'a)"/><path class="trace" pathLength="1" d="' + d + '" fill="none" stroke="url(#' + id + ')" stroke-width="' + (mini ? 2 : 3) + '" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + pts[pts.length - 1][0].toFixed(1) + '" cy="' + pts[pts.length - 1][1].toFixed(1) + '" r="' + (mini ? 2.6 : 4.5) + '" fill="#FF5FA2"/></svg>'; }

<!--NV_VERS_IRIS--><script id="nv-vers-iris" data-module="Passeport">
/* NEURAVID — VERS IRIS : toute vidéo d'un module peut s'ouvrir dans Iris, le lecteur principal.
