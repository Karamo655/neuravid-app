<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140b33">
<title>La Tresse du monde · NEURAVID</title>
<style>
/* La Tresse du monde : une maille de 5 secondes par pays, de pays en pays, sur le globe (16 novembre 2026).
   Aucune ressource extérieure : le globe est dessiné dans la page, les vidéos viennent du serveur de la publication. */
:root{
  --nuit:#140b33; --nuit2:#1c1147; --alv:#241657; --craie:#f6f1ff; --brume:rgba(236,228,255,.74); --trait:rgba(255,255,255,.16);

  --hex:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--nuit);color:var(--craie);font:16px/1.45 var(--sans);min-height:100vh}
main{max-width:768px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.hex{width:34px;height:30px;flex:0 0 auto;clip-path:var(--hex);background:linear-gradient(135deg,var(--cyan),#6c2bd9);display:grid;place-items:center}
.hex i{width:14px;height:14px;border-radius:50%;background:var(--nuit);box-shadow:inset 0 0 0 4px var(--craie)}
h1{font-size:1.2rem;margin:0;line-height:1.2}
h2{font-size:1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:12px;height:11px;clip-path:var(--hex);background:var(--cyan);flex:0 0 auto}
.sous{margin:0;color:var(--brume);font-size:.88rem}
.apercu{display:inline-block;margin-inline-start:6px;padding:1px 8px;border-radius:999px;background:var(--or);color:#2a1a00;font-size:.75rem;font-weight:800;vertical-align:middle}
#etat{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:var(--nuit2);border:1px solid var(--trait);font-size:.9rem}
#etat.hl{border-color:var(--or)}
#etat.ok{border-color:rgba(22,224,212,.5)}
section{background:var(--nuit2);border:1px solid var(--trait);border-radius:14px;padding:12px 14px;margin:0 0 12px}
ul{list-style:none;margin:0;padding:0}
li{padding:7px 0;border-top:1px solid var(--trait)}
li:first-child{border-top:0}
.l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.d{color:var(--brume);font-size:.86rem}

.puce.an{color:var(--rouge);border-color:var(--rouge)}
.puce.re{color:var(--or);border-color:var(--or)}
.puce.co{color:var(--cyan);border-color:var(--cyan)}
.chiffres{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.chiffres b{display:block;font-size:1.25rem}
.chiffres span{font-size:.75rem;color:var(--brume)}
.med{display:inline-flex;align-items:center;gap:3px;margin-inline-end:8px;white-space:nowrap}
.med i{width:12px;height:11px;clip-path:var(--hex);display:inline-block}
.or i{background:var(--or)} .ar i{background:var(--argent)} .br i{background:var(--bronze)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:5px 4px;text-align:center;border-top:1px solid var(--trait)}
td:first-child,th:first-child{text-align:start}
th{font-size:.75rem;color:var(--brume);font-weight:600;border-top:0}
button,select,.lien{font:inherit;color:inherit}
button{min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--trait);background:var(--alv);cursor:pointer}
button:focus-visible,select:focus-visible,.lien:focus-visible{outline:2px solid var(--or);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.actions button{flex:1 1 140px}
.lien{background:none;border:0;padding:6px 0;min-height:36px;color:var(--cyan);text-decoration:underline;cursor:pointer;font-size:.88rem}
.jours button{min-height:40px;margin-block:4px 0;margin-inline:0 6px;padding:6px 10px;font-size:.88rem}
.jours button[aria-current="true"]{border-color:var(--or)}
footer{color:var(--brume);font-size:.8rem;display:grid;gap:8px;margin-top:4px}

select{min-height:40px;border-radius:10px;background:var(--alv);border:1px solid var(--trait);padding:4px 8px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--craie);color:var(--nuit);padding:8px 14px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.vide{color:var(--brume);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[dir="rtl"] .l1{direction:rtl}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
@media (min-width:560px){h1{font-size:1.35rem}}

.globe-cadre{position:relative;margin:0 auto 10px;max-width:420px}
#globe{display:block;width:100%;aspect-ratio:1/1;touch-action:pan-y}
.compte{position:absolute;inset-inline-start:0;bottom:6px;font-size:.85rem;color:var(--brume)}
.compte b{color:var(--or);font-size:1.1rem}

.lecteur{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:9/16;max-height:62vh;margin:0 auto 10px;max-width:360px}

.lecteur .fil i.fait{background:var(--or)}
.lecteur .fil i.ici{background:var(--cyan)}
.maille{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.maille video{width:96px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#000}

.liste li{display:flex;gap:10px;align-items:center}
.etiq{font-size:.8rem;color:var(--brume)}
.equipe .item{border-top:1px solid var(--trait);padding:10px 0}

.equipe .acts{display:flex;gap:6px;flex-wrap:wrap;clear:both;padding-top:6px}
.form{display:grid;gap:8px}
.form label{display:grid;gap:4px;font-size:.88rem}
.form input:focus-visible,.form textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.form input,.form textarea{font:inherit;color:inherit;background:var(--alv);border:1px solid var(--trait);border-radius:10px;padding:8px}
.btn-or{background:linear-gradient(135deg,#ffcf4a,#ff8a3d);color:#2a1300;border:0;font-weight:800}

<script>
/* ══ NV_CAMERA — EMBARQUÉ ════════════════════════════════════
   Embarqué, pas référencé : un module NEURAVID doit s'ouvrir
   seul depuis une URL file://, avec rien à côté. */
/* ═══════════════════════════════════════════════════════════════════
   NEURAVID — NV_CAMERA.js
   Le bouton « Filmer » d'un défi ouvre la caméra du Studio créatif.

   À embarquer dans les 16 modules de défi ET dans NV_MODULE_Create.html.

   ── POURQUOI ─────────────────────────────────────────────────────────
   Chaque défi a son propre enregistreur. Il fonctionne, il grave les
   filtres et le logo dans l'image — mais il s'arrête là. La caméra du
   Studio sait faire beaucoup plus, et elle existe déjà :

       double caméra (médaillon, haut/bas, gauche/droite)
       masques qui suivent le visage
       effets pluie, neige, étincelles
       filtres gravés dans l'image enregistrée
       photo, montage, galerie

   Une personne qui veut participer à un défi n'a aucune raison d'avoir
   moins d'outils que quelqu'un qui filme pour rien.

   ── LA DIFFICULTÉ RÉELLE ─────────────────────────────────────────────
   Le Studio est un AUTRE fichier. Changer de page perd tout : le
   contexte du défi, et surtout la vidéo elle-même — un Blob ne
   traverse pas une navigation.

   IndexedDB, si. C'est la seule voie, et Create s'en sert déjà pour
   son relais. On l'emprunte :

       1. le défi range son contexte et ouvre le Studio
       2. la personne filme avec tous les outils
       3. le Studio range la vidéo dans IndexedDB et revient au défi
       4. le défi la reprend et la présente comme sa propre prise

   ── CE QU'ON NE FAIT PAS ─────────────────────────────────────────────
   On ne copie pas la caméra du Studio dans les seize défis. Elle pèse
   plus de trois cents kilo-octets, et seize copies divergeraient au
   premier correctif — c'est exactement ce qui est arrivé à IA et Coach,
   qui affichaient deux scores différents pour la même vidéo.

   Et on ne supprime pas l'enregistreur existant : si le Studio est
   injoignable, il reprend la main. Une passerelle ne doit jamais
   devenir un point de rupture.
   ═══════════════════════════════════════════════════════════════════ */
(function (racine) {
  'use strict';
  if (racine.NVCamera) return;

  var BASE_DEFAUT = 'file:///android_asset/flutter_assets/assets/modules/';
  var CLE_CTX = 'nv_cam_ctx';
  var DB = 'nvcamera';
  var MAG = 'prises';

  function emit(type, charge) {
    try { if (typeof racine.NVemit === 'function') racine.NVemit(type, charge || {}); }
    catch (e) {}
  }
  function base() {
    var b = racine.NV_MODULES_BASE || BASE_DEFAUT;
    return b.slice(-1) === '/' ? b : b + '/';
  }

  /* ── LE COFFRE ────────────────────────────────────────────────────
     Une vidéo de quelques mégaoctets ne tient pas dans localStorage et
     ne survit pas à une navigation autrement. IndexedDB est le seul
     endroit où elle peut attendre. */
  function ouvrirBase() {
    return new Promise(function (res) {
      try { if (!racine.indexedDB) return res(null); } catch (e) { return res(null); }   /* stockage bloqué : l'accès lui-même peut lever une erreur */
      var r;
      try { r = racine.indexedDB.open(DB, 1); } catch (e) { return res(null); }
      r.onupgradeneeded = function () {
        try { r.result.createObjectStore(MAG); } catch (e) {}
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { res(null); };
      /* certains navigateurs ne répondent jamais (fichier ouvert en content://) */
      setTimeout(function () { res(null); }, 2000);
    });
  }
  function ranger(cle, valeur) {
    return ouvrirBase().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var t = db.transaction(MAG, 'readwrite');
          t.objectStore(MAG).put(valeur, cle);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { res(false); };
        } catch (e) { res(false); }
      });
    });
  }
  function reprendre(cle) {
    return ouvrirBase().then(function (db) {
      if (!db) return null;
      return new Promise(function (res) {
        try {
          var t = db.transaction(MAG, 'readonly');
          var q = t.objectStore(MAG).get(cle);
          q.onsuccess = function () { res(q.result || null); };
          q.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    });
  }
  function oublier(cle) {
    return ouvrirBase().then(function (db) {
      if (!db) return;
      try {
        var t = db.transaction(MAG, 'readwrite');
        t.objectStore(MAG).delete(cle);
      } catch (e) {}
    });
  }

  /* ── CÔTÉ DÉFI : partir vers le Studio ────────────────────────────── */
  function filmer(ctx) {
    ctx = ctx || {};
    ctx.module = ctx.module || racine.NV_MODULE_NAME || 'defi';
    ctx.quand = Date.now();
    /* La contrainte du défi voyage avec : le Studio doit savoir qu'une
       story flash s'arrête à sept secondes. Sans ça, la personne filme
       trente secondes et se fait refuser au retour. */
    try { racine.sessionStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    try { racine.localStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    emit('camera_open', ctx);

    /* Si le Studio est déjà dans cette page, on l'ouvre sans changer
       d'écran : c'est plus rapide et rien ne peut se perdre. */
    try {
      if (racine.NVStudio && typeof racine.NVStudio.open === 'function' &&
          typeof racine.NVStudio.tab === 'function') {
        racine.NVStudio.open(); racine.NVStudio.tab('video');
        return 'local';
      }
    } catch (e) {}
    try {
      if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') {
        racine.NVLien.ouvrir('NVCreate', ctx);
        return 'lien';
      }
    } catch (e) {}
    try {
      racine.location.href = base() + 'NV_MODULE_Create.html';
      return 'fichier';
    } catch (e) {}
    return 'aucun';   /* l'appelant reprend la main avec son propre enregistreur */
  }

  /* ── CÔTÉ STUDIO : d'où vient-on, et comment y retourner ──────────── */
  function contexte() {
    var t = null;
    try { t = racine.sessionStorage.getItem(CLE_CTX); } catch (e) {}
    if (!t) { try { t = racine.localStorage.getItem(CLE_CTX); } catch (e) {} }
    if (!t) return null;
    try {
      var c = JSON.parse(t);
      /* Un contexte vieux de plus d'une heure n'a plus de sens : la
         personne est passée à autre chose. On ne la renvoie pas dans un
         défi qu'elle a quitté. */
      if (!c || !c.quand || Date.now() - c.quand > 3600000) return null;
      return c;
    } catch (e) { return null; }
  }

  /* Le Studio appelle ceci quand la prise est terminée. */
  function rendre(blob, meta) {
    var c = contexte();
    if (!c) return Promise.resolve(false);
    var cle = 'prise_' + (c.module || 'defi') + '_' + (c.defi || 'x');
    return ranger(cle, {blob: blob, meta: meta || {}, ctx: c, at: Date.now()})
      .then(function (ok) {
        if (!ok) return false;
        emit('camera_done', {module: c.module, defi: c.defi || null,
                             secondes: (meta && meta.seconds) || null});
        try {
          if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') {
            racine.NVLien.ouvrir('NV' + c.module, c);
            return true;
          }
        } catch (e) {}
        try { racine.location.href = base() + 'NV_MODULE_' + c.module + '.html'; }
        catch (e) {}
        return true;
      });
  }

  /* ── CÔTÉ DÉFI : récupérer la prise au retour ─────────────────────── */
  function recuperer(module, defi) {
    var cle = 'prise_' + (module || racine.NV_MODULE_NAME || 'defi') + '_' + (defi || 'x');
    return reprendre(cle).then(function (p) {
      if (!p) return null;
      /* On efface tout de suite : une prise reprise deux fois se
         retrouverait envoyée deux fois. */
      oublier(cle);
      if (!p.at || Date.now() - p.at > 3600000) return null;
      return p;
    });
  }

  /* ══ LE MÉNAGE ════════════════════════════════════════════════════
     Une prise n'est effacée qu'à sa reprise. Si la personne filme puis
     ne revient jamais dans le défi, l'entrée reste — une vidéo de
     plusieurs mégaoctets par tentative abandonnée, sur un téléphone
     d'entrée de gamme.

     On balaie donc au chargement ce qui a plus d'une heure : c'est la
     même limite que le contexte, et au-delà la personne est passée à
     autre chose de toute façon. */
  function balayer() {
    return ouvrirBase().then(function (db) {
      if (!db) return 0;
      return new Promise(function (res) {
        var n = 0;
        try {
          var t = db.transaction(MAG, 'readwrite');
          var st = t.objectStore(MAG);
          var q = st.openCursor();
          q.onsuccess = function () {
            var c = q.result;
            if (!c) { res(n); return; }
            var v = c.value;
            if (!v || !v.at || Date.now() - v.at > 3600000) { c.delete(); n++; }
            c.continue();
          };
          q.onerror = function () { res(n); };
        } catch (e) { res(0); }
      });
    });
  }
  /* au chargement, sans bloquer quoi que ce soit */
  try { setTimeout(balayer, 3000); } catch (e) {}

  racine.NVCamera = {
    balayer: balayer,
    filmer: filmer,
    contexte: contexte,
    rendre: rendre,
    recuperer: recuperer,
    /* Pour savoir s'il faut proposer le Studio ou rester sur
       l'enregistreur local. On ne propose jamais une porte qui ne
       s'ouvre pas. */
    studioJoignable: function () {
      try {
        if (racine.NVStudio && typeof racine.NVStudio.open === 'function') return true;
        if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') return true;
        return !!racine.NV_MODULES_BASE;
      } catch (e) { return false; }
    }
  };
})(window);

function boucleGlobe(ts){

/* ════════ FILMER MA MAILLE (avec La Forge) ════════ */
function imageRelais(){
  /* la DERNIÈRE image de la maille précédente, réduite : le fantôme que La Forge montre. La vidéo est d'abord placée sur sa
     fin. Une vidéo servie sans autorisation de lecture croisée ne se lit pas : il n'y a alors pas de fantôme (jamais d'image
     inventée). Rend une promesse. */
  var capturer = function(src){
    try{
      var w = src.videoWidth || src.width, hh = src.videoHeight || src.height; if(!w || !hh) return '';
      var k = Math.min(1, 360 / Math.max(w, hh)), c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(hh * k);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', .7);
    }catch(e){ return ''; }
  };
  var d = $('vRelaisDemo'); if(d){ demoDessiner(d, ST.t && ST.t.relais, 4.95); return Promise.resolve(capturer(d)); }
  var v = $('vRelais'); if(!v) return Promise.resolve('');
  return new Promise(function(res){
    var fini = false, fin = function(){ if(fini) return; fini = true; res(capturer(v)); };
    try{
      v.pause();
      var du = v.duration;
      if(!isFinite(du) || du <= 0){ fin(); return; }
      v.addEventListener('seeked', fin, {once:true}); setTimeout(fin, 1500);
      v.currentTime = Math.max(0, du - .05);
    }catch(e){ fin(); }
  });
}
var CLE_FILM_L = 'nv_tresse_film';
function noterFilm(o){ var t = JSON.stringify(o); try{ sessionStorage.setItem(CLE_FILM, t); }catch(e){} try{ localStorage.setItem(CLE_FILM_L, t); }catch(e){} }
function lireFilm(){ var f = null; try{ f = JSON.parse(sessionStorage.getItem(CLE_FILM) || 'null'); }catch(e){} if(!f){ try{ f = JSON.parse(localStorage.getItem(CLE_FILM_L) || 'null'); }catch(e){} } return f; }
function oublierFilm(){ try{ sessionStorage.removeItem(CLE_FILM); }catch(e){} try{ localStorage.removeItem(CLE_FILM_L); }catch(e){} }
function filmer(){
  var t = ST.t; if(!t || !window.NVCamera) { toast(T('La Forge n’est pas joignable ici.')); return; }
  if(!NVCamera.studioJoignable()){ toast(T('La Forge n’est pas joignable ici.')); return; }
  var b = $('bFilmer'); if(b) b.disabled = true;
  imageRelais().then(function(relais){
    noterFilm({tresse:t.id, quand:Date.now()});
    emit('tresse_filmer', {tresse:t.id, relais:!!relais});
    NVCamera.filmer({module:MOI, defi:t.id, titre:t.titre, mode:'video', minSeconds:1, maxSeconds:5, relais:relais || undefined,
      regles:[T('Une maille de 5 secondes au plus.'), t.geste ? T('Le geste à passer :') + ' ' + t.geste : T('Reprenez le geste du pays précédent.')]});
    setTimeout(function(){ var b2 = $('bFilmer'); if(b2) b2.disabled = false; }, 1500);
  });
}
/* au retour de La Forge : la tresse vient du contexte rendu (ctx.defi), sinon de la note gardée (sessionStorage, puis
   localStorage si l'application a ouvert une autre vue) ; la prise reste liée à SA tresse */
function reprendrePrise(retour){
  var f = lireFilm(), tid = retour || (f && f.tresse);
  if(!tid || !window.NVCamera || (!retour && Date.now() - ((f && f.quand) || 0) > 3600000)) return Promise.resolve();
  return NVCamera.recuperer(MOI, tid).then(function(p){
    if(!p || !p.blob) return;
    oublierFilm();
    ST.id = tid; ST.prise = {tresse:tid, blob:p.blob, url:URL.createObjectURL(p.blob), secondes:nombre(p.meta && (p.meta.seconds || p.meta.secondes)), meta:p.meta || {}};
  });
}
/* la durée réelle de la prise : un enregistrement webm annonce souvent une durée « infinie » ; on la force en allant très
   loin dans la vidéo. Inconnue malgré tout : rien n'est inventé (la publication la lira). */
function dureeBlob(prise){
  if(prise.secondes) return Promise.resolve(prise.secondes);
  return new Promise(function(res){ var v = document.createElement('video'), fait = false; v.preload = 'metadata'; v.muted = true;
    var fin = function(x){ if(fait) return; fait = true; res(x); try{ v.removeAttribute('src'); v.load(); }catch(e){} };
    v.onloadedmetadata = function(){ if(isFinite(v.duration) && v.duration > 0) return fin(v.duration);
      v.ondurationchange = function(){ if(isFinite(v.duration) && v.duration > 0) fin(v.duration); }; try{ v.currentTime = 1e7; }catch(e){ fin(null); } };
    v.onerror = function(){ fin(null); }; v.src = prise.url; setTimeout(function(){ fin(null); }, 4000); });
}
function envoyer(){
  var pr = ST.prise; if(!pr || ST.envoi) return;
  var tid = pr.tresse || (ST.t && ST.t.id); if(!tid) return;
  ST.envoi = true; rendre();
  var envoyee = false;
  dureeBlob(pr).then(function(s){
    if(s != null && s > 6){ throw {code:'trop_long'}; }
    if(ST.apercu){ var t = ST.t; t.moi.maille = {id:'tm_apercu', etat:'verification', pays:t.moi.pays}; t.moi.peut = false; t.moi.raison = 'deja'; envoyee = true; return; }
    var fd = new FormData();
    if(s != null) fd.append('seconds', String(Math.round(s * 100) / 100));     /* inconnue : non envoyée, jamais inventée */
    if(pr.meta && pr.meta.provenance) try{ fd.append('meta', JSON.stringify({provenance:pr.meta.provenance})); }catch(e){}
    fd.append('video', pr.blob, 'maille.' + (/mp4/.test(pr.blob.type) ? 'mp4' : 'webm'));
    if(!pr.cle) pr.cle = 'tr-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    var h = {Accept:'application/json', 'Idempotency-Key':pr.cle}; if(jeton()) h.Authorization = 'Bearer ' + jeton();
    return fetch(api() + '/v1/tresses/' + encodeURIComponent(tid) + '/mailles', {method:'POST', headers:h, body:fd, mode:'cors'}).then(function(r){
      return r.text().then(function(x){ var j = null; try{ j = JSON.parse(x); }catch(e){} if(!r.ok){ var err = new Error('http'); err.status = r.status; err.code = j && j.erreur; throw err; } return j; });
    }).then(function(){ envoyee = true; ST.id = tid; return chargerTresse().catch(function(){}); });   /* un échec de relecture n'annule pas l'envoi */
  }).then(function(){
    emit('tresse_envoyer', {tresse:tid});
    try{ URL.revokeObjectURL(pr.url); }catch(e){}
    ST.prise = null; toast(T('Maille envoyée : elle sera relue avant d’entrer dans la tresse.'));
  }, function(e){
    /* une clé déjà servie (le premier envoi est arrivé, sa réponse s'est perdue) vaut « déjà envoyée » : on relit la tresse */
    if(e && (e.code === 'cle_reutilisee' || e.code === 'en_cours')) e = {code:'deja_envoye'};
    toast(erreurTexte(e));
    if(e && (e.code === 'deja_envoye' || e.code === 'tresse_fermee' || e.code === 'trop_de_refus' || e.code === 'trop_long')){
      try{ URL.revokeObjectURL(pr.url); }catch(x){} ST.prise = null; if(!ST.apercu) chargerTresse().then(rendre, function(){}); }
  }).then(function(){ ST.envoi = false; rendre(); });
}
function retirer(id){
  var b = $('bRetirer');
  if(b && !b.getAttribute('data-sur')){ b.setAttribute('data-sur', '1'); b.textContent = T('Toucher encore pour retirer'); return; }
  if(ST.apercu){ ST.t.moi.maille = null; ST.t.moi.peut = true; ST.t.moi.raison = null; rendre(); return; }
  appeler('POST', '/v1/tresses/mailles/' + encodeURIComponent(id) + '/retirer', {}).then(function(){ toast(T('Maille retirée.')); return chargerTresse(); })
    .then(rendre, function(e){ toast(erreurTexte(e)); });
}

/* ════════ L'ÉQUIPE ════════ */
function chargerEquipe(){
  if(ST.apercu || !api() || !ST.cap || !aRole('moderateur', 'verificateur', 'organisateur')) return;
  appeler('GET', '/v1/tresses/equipe/file').then(function(o){ ST.equipe = o && Array.isArray(o.items) ? o.items : []; rendre(); }, function(){ ST.equipe = null; });
}
function decider(id, tisser){
  if(ST.decisions[id]) return; ST.decisions[id] = true;
  var c = {tisser:tisser, __cle:'trd-' + id}; if(!tisser){ var s = document.querySelector('[data-motif="' + id + '"]'); c.motif = s ? s.value : 'autre'; }
  appeler('POST', '/v1/tresses/mailles/' + encodeURIComponent(id) + '/decider', c).then(function(){
    toast(tisser ? T('Maille tissée.') : T('Maille refusée')); ST.equipe = (ST.equipe || []).filter(function(x){ return x.id !== id; }); return chargerTresse();
  }).then(rendre, function(e){ toast(erreurTexte(e)); }).then(function(){ delete ST.decisions[id]; });
}
function annulerTresse(b){
  if(!b.getAttribute('data-sur')){ b.setAttribute('data-sur', '1'); b.textContent = T('Toucher encore pour annuler la tresse'); return; }
  appeler('POST', '/v1/tresses/' + encodeURIComponent(ST.id) + '/annuler', {__cle:'tra-' + ST.id}).then(function(){ toast(T('Tresse annulée.')); ST.id = null; return charger(); }, function(e){ toast(erreurTexte(e)); });
}
function ouvrirTresse(f){
  var c = {titre:f.titre.value, consigne:f.consigne.value, geste:f.geste.value, jours:parseInt(f.jours.value, 10) || 14};
  appeler('POST', '/v1/tresses', c).then(function(x){ toast(T('Tresse ouverte.')); ST.id = x.id; return charger(); }, function(e){ toast(erreurTexte(e)); });
}

/* ════════ L'APERÇU (démonstration seulement) ════════ */
var DEMO_PAYS = ['SN', 'GN', 'CI', 'NG', 'BR', 'FR', 'MA', 'KE', 'IN', 'JP'];
function demoTresses(){
  var t = Date.now();
  return [{id:'tr_apercu_1', titre:'La main tendue', consigne:'Reprenez le geste du pays précédent, puis tendez la main vers le pays suivant.', geste:'La main tendue vers la droite',
    debutMs:t - 5 * 864e5, finMs:t + 9 * 864e5, ouverte:true, avenir:false, annulee:false}];
}
function demoTresse(id){
  var b = demoTresses()[0];
  var m = DEMO_PAYS.map(function(p, i){ return {id:'tm_ap' + i, rang:i + 1, pays:p, url:null, auteur:i % 3 === 1 ? null : {id:'u' + i, handle:['awa', 'moussa', 'kofi', 'ada', 'lucas', 'ines', 'yasmine', 'wanjiru', 'priya', 'aiko'][i]}, duree:5}; });
  return Object.assign({}, b, {secondes:5, nbPays:m.length, mailles:m, relais:m[m.length - 1], moi:{maille:null, peut:true, raison:null, pays:(utilisateur() && utilisateur().iso) || 'GN'}});
}
function demoDessiner(c, x, s){
  var g = c.getContext('2d'); if(!g || !x) return; var W = c.width, H = c.height, k = (x.pays.charCodeAt(0) * 7 + x.pays.charCodeAt(1)) % 360;
  var gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, 'hsl(' + k + ',70%,35%)'); gr.addColorStop(1, 'hsl(' + ((k + 60) % 360) + ',70%,18%)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  /* la main qui passe le geste : un hexagone qui traverse l'image de gauche à droite */
  var p = (s % 5) / 5, r = Math.min(W, H) * .16, cx = W * (.15 + .7 * p), cy = H * .55;
  g.fillStyle = 'rgba(255,197,49,.9)'; g.beginPath(); for(var j = 0; j < 6; j++){ var a = Math.PI / 6 + j * Math.PI / 3; g[j ? 'lineTo' : 'moveTo'](cx + r * Math.cos(a), cy + r * Math.sin(a)); } g.closePath(); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = Math.round(H * .12) + 'px sans-serif'; g.fillText(drapeau(x.pays), W / 2, H * .3);
  g.font = 'bold ' + Math.round(H * .05) + 'px sans-serif'; g.fillText(T('Aperçu'), W / 2, H * .9);
}

/* ════════ LE DÉMARRAGE ════════ */
function demarrer(){
  poserLangue(langueDetectee());
  /* 17 nov. 2026 (Karamo) : sans serveur branché, la page montre son aperçu (repère « Aperçu »), aussi dans l'application,
     comme les autres modules ; dès qu'un serveur est branché, seul le vrai contenu est montré. */
  ST.apercu = !api();
  if(ST.apercu && !utilisateur()){ try{ window.NV_USER = {id:'demo', handle:'visiteur', prenom:'Aya', age:25, majeur:true, iso:'GN'}; }catch(e){} }
  var retour = null;
  try{ var c = JSON.parse(sessionStorage.getItem('nv_ctx_' + MOI) || 'null'); if(c && typeof c.tresse === 'string') ST.id = c.tresse; if(c && c.module === MOI && typeof c.defi === 'string') retour = c.defi; sessionStorage.removeItem('nv_ctx_' + MOI); }catch(e){}
  rendre();
  reprendrePrise(retour).then(charger, charger);
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if(!b) return;
    if(b.id === 'bRegarder') regarder();
    else if(b.id === 'bPause') pause();
    else if(b.id === 'bArret') arreter();
    else if(b.id === 'bFilmer') filmer();
    else if(b.id === 'bEnvoyer') envoyer();
    else if(b.id === 'bRefaire'){ try{ URL.revokeObjectURL(ST.prise.url); }catch(e){} ST.prise = null; filmer(); }
    else if(b.id === 'bRetirer') retirer(b.getAttribute('data-maille'));
    else if(b.id === 'bAnnulerTresse') annulerTresse(b);
    else if(b.id === 'bConnexion') ouvrir('Entree', {depuis:'tresse'});
    else if(b.id === 'bPays') ouvrir('Reglages', {depuis:'tresse'});
    else if(b.getAttribute('data-tresse')){ if(ST.prise){ toast(T('Envoyez ou refaites d’abord votre maille.')); return; } arreter(); ST.id = b.getAttribute('data-tresse'); if(ST.apercu){ ST.t = demoTresse(ST.id); rendre(); } else chargerTresse().then(rendre, function(e){ toast(erreurTexte(e)); }); }
    else if(b.getAttribute('data-tisser')) decider(b.getAttribute('data-tisser'), true);
    else if(b.getAttribute('data-refuser')) decider(b.getAttribute('data-refuser'), false);
  });
  document.addEventListener('submit', function(ev){ if(ev.target && ev.target.id === 'fOuvrir'){ ev.preventDefault(); ouvrirTresse(ev.target); } });
  document.addEventListener('change', function(ev){
    if(ev.target && ev.target.getAttribute && ev.target.getAttribute('data-motif')) ST.motifs[ev.target.getAttribute('data-motif')] = ev.target.value;
    if(ev.target && ev.target.id === 'langue'){ var l = ev.target.value; if(!LANGUES_UI[l]) return; ecrire('nv_ui_langue', l); NOMS = null; poserLangue(l); rendre(); var s = $('langue'); if(s) s.focus(); }
  });
  document.addEventListener('visibilitychange', function(){ if(document.hidden){ if(ST.lecture && !ST.lecture.pause) pause(); } else relancerGlobe(); });
  try{ G.io = new IntersectionObserver(function(e){ G.vu = e[e.length - 1].isIntersecting; if(G.vu) relancerGlobe(); }); if($('globe')) G.io.observe($('globe')); }catch(e){}
  window.NVTresse = {etat:function(){ return {etat:ST.etat, id:ST.id, apercu:ST.apercu, mailles:mailles().length, lecture:ST.lecture ? ST.lecture.i : null, prise:!!ST.prise, langue:L}; }};
}

demarrer();
})();
