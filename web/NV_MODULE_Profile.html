:root{
  --fond:#0B1416; --surface:#122125; --surface2:#1A2D32; --surface3:#22393F; --fil:#2B444A;
  --encre:#EEF3F1; --brume:#A3B8B5; --gris:#6F8783; --crete:#5d7470;
  --teal:#2FD3C2; --violet:#8B6CFF; --rose:#FF5FA2; --or:#F2C14E; --braise:#F0645A;
  --degrade:linear-gradient(100deg,#2FD3C2,#8B6CFF 55%,#FF5FA2);
  --hx:polygon(50% 0,93.3% 25%,93.3% 75%,50% 100%,6.7% 75%,6.7% 25%);
  --r:14px; --haut:env(safe-area-inset-top,0px); --bas:env(safe-area-inset-bottom,0px);
  --police:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fond);color:var(--encre);font:15px/1.5 var(--police);overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.42;cursor:default}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .i-retour{transform:scaleX(-1)}
.nko{font-family:"NKo","Noto Sans NKo",var(--police)}
h1,h2,h3{margin:0;letter-spacing:-.015em}
h2{font-size:17px;font-weight:750}
h3{font-size:13px;color:var(--brume);font-weight:650;margin:18px 0 8px}
p{margin:6px 0}
.note{font-size:13px;color:var(--brume)}
.petit{font-size:12px;color:var(--gris)}
.centre{text-align:center}
.vide{color:var(--brume);text-align:center;padding:26px 10px;font-size:14px}

/* ════ le cadre ════ */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.haut{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--haut)) 12px 8px;min-height:56px;z-index:5;background:linear-gradient(180deg,rgba(11,20,22,.96),rgba(11,20,22,.7));backdrop-filter:blur(10px)}
.haut .titre{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.haut .titre b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.haut .titre small{font-size:11px;color:var(--gris)}
.rond{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--surface2);flex:none}
.corps{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(32px + var(--bas));max-width:720px;width:100%;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:13px;background:var(--encre);color:#0B1416;font-weight:750}
.btn.leger{background:var(--surface2);color:var(--encre);box-shadow:inset 0 0 0 1px var(--fil)}
.btn.braise{background:var(--braise);color:#fff}
.btn.plein{width:100%;margin:8px 0}
.btn.petit{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.carre{width:46px;padding:0;flex:none}
.puces{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.puces>button{min-height:34px;padding:0 12px;border-radius:17px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--fil);font-size:13px}
.puces>button[aria-pressed="true"]{background:var(--encre);color:#0B1416;box-shadow:none;font-weight:650}
.ligne{display:flex;align-items:center;gap:8px}
.ligne>.ext{flex:1;min-width:0}
.champ{display:block;margin:10px 0}
.champ>span{display:flex;justify-content:space-between;font-size:13px;color:var(--brume);margin-bottom:4px}
.champ input,.champ textarea,.champ-seul{width:100%;background:var(--surface2);border:1px solid var(--fil);border-radius:12px;padding:10px 12px;color:var(--encre)}
.champ-seul{width:auto;min-width:0}

/* ════ l'empreinte et l'identité ════ */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 6px}
.empreinte-cadre{width:min(68vw,260px);aspect-ratio:1;cursor:pointer;border-radius:50%}
.empreinte{width:100%;height:100%;display:block;overflow:visible}
.empreinte path{transition:opacity .4s}
@media (prefers-reduced-motion:no-preference){.empreinte{animation:naitre 1.1s ease-out both}@keyframes naitre{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}}
.hero h1{font-size:clamp(26px,7.5vw,34px);font-weight:820;line-height:1.1;margin-top:6px;display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.verifie{color:var(--teal);display:inline-flex}
.verifie .ico{width:24px;height:24px}
.meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;color:var(--brume);font-size:14px;margin:6px 0 0}
.meta .sep{width:4px;height:4px;border-radius:50%;background:var(--gris)}
.metiers{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.metiers span{font-size:12.5px;padding:4px 10px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--fil);color:#d6e3e0}

/* les chiffres : le HVS d'abord, souligné du dégradé de NEURAVID */
.chiffres{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:16px 0 12px}
.chiffre-case{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:12px;background:var(--surface);min-width:0}
.chiffre-case:disabled{opacity:1;cursor:default}
.chiffre-case b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.chiffre-case small{font-size:11px;letter-spacing:-.01em;color:var(--brume);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chiffre-case.hvs{position:relative;background:var(--surface2)}
.chiffre-case.hvs b{background:var(--degrade);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:22px}
.actions{display:flex;gap:8px;margin:6px 0}
.actions>.btn:not(.carre){flex:1;min-width:0}
.actions .btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.identite{margin:12px 0 4px}
.bio{white-space:pre-line;font-size:15px;color:#dde7e5;margin:4px 0 10px}
.langues{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.langue{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;background:rgba(47,211,194,.1);color:#bff2ec;font-size:13px}
.langue.apprend{background:transparent;box-shadow:inset 0 0 0 1px var(--fil);color:var(--brume)}
.langue small{font-size:11px;opacity:.8}
.langues.edit .langue button{font-size:11px;padding:2px 6px;border-radius:8px;background:var(--surface3)}
.langues.edit .langue button .ico{width:14px;height:14px}
.liens{display:flex;flex-wrap:wrap;gap:6px}
.liens button{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--teal);padding:4px 0}
.liens .ico{width:16px;height:16px}

/* ════ les alvéoles des talents ════ */
.ruche-bloc{margin:22px 0 8px}
.titre-bloc{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.titre-bloc small{font-size:12px;color:var(--brume)}
.titre-bloc small b{color:var(--encre)}
.ruche{display:flex;flex-direction:column;align-items:center;padding:4px 0 6px}
.rangee{display:flex;justify-content:center;gap:6px}
.rangee+.rangee{margin-top:-12px}
.alveole{width:min(22vw,92px);display:flex;flex-direction:column;align-items:center;gap:3px}
.alveole .hx{position:relative;width:100%;aspect-ratio:.866;clip-path:var(--hx);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.alveole .hx::before{content:"";position:absolute;inset:0;clip-path:var(--hx);background:var(--fil);z-index:0}
.alveole .hx::after{content:"";position:absolute;inset:2px;clip-path:var(--hx);background:var(--surface);z-index:0}
.alveole .hx>*{position:relative;z-index:1}
.alveole .e{font-size:22px;filter:grayscale(1);opacity:.45}
.alveole small{font-size:10.5px;color:var(--gris);text-align:center;line-height:1.15;max-width:100%;min-height:2.3em}
.alveole.allume .hx::before{background:var(--c)}
.alveole.allume .hx::after{background:radial-gradient(120% 90% at 50% 20%,color-mix(in srgb,var(--c) 26%,var(--surface)),var(--surface) 75%)}
.alveole.allume .e{filter:none;opacity:1}
.alveole.allume b{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.alveole.allume small{color:#d6e3e0}
.alveole.prive .hx::before{background:repeating-linear-gradient(45deg,var(--c) 0 4px,transparent 4px 8px)}
.alveole .couronne,.alveole .cad{position:absolute;top:12%;right:22%;color:var(--or)}
.alveole .cad{color:var(--brume)}
.alveole .couronne .ico,.alveole .cad .ico{width:13px;height:13px}
.rangee.decale{transform:none}
@supports not (background:color-mix(in srgb,red 50%,blue)){.alveole.allume .hx::after{background:var(--surface2)}}

/* ════ les onglets ════ */
.onglets-bloc{margin:22px 0 10px}
.onglets{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface)}
.onglets button{flex:1;min-height:38px;border-radius:10px;font-size:14px;color:var(--brume);font-weight:600}
.onglets button[aria-selected="true"]{background:var(--surface3);color:var(--encre)}
.onglet-corps{padding-top:10px}
.grille{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:12px;overflow:hidden}
.oeuvre{position:relative;aspect-ratio:9/16;background:var(--surface);overflow:hidden}
.oeuvre img{width:100%;height:100%;object-fit:cover;display:block}
.oeuvre .sans-image{display:grid;place-items:center;height:100%;font-size:28px;opacity:.5}
.oeuvre-bas{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:14px 6px 5px;font-size:11.5px;font-weight:650;background:linear-gradient(0deg,rgba(0,0,0,.72),transparent)}
.oeuvre-bas span{display:inline-flex;align-items:center;gap:3px}
.oeuvre-bas .ico{width:14px;height:14px}
.hvs-mini{color:#bff2ec}
.epingle{position:absolute;top:6px;left:6px;font-style:normal;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--encre);color:#0B1416}
.pastille{position:absolute;top:6px;right:6px;width:24px;height:27px;clip-path:var(--hx);background:var(--c);display:grid;place-items:center;font-size:13px;font-style:normal}
.palmares{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface);box-shadow:inset 3px 0 0 var(--c);margin-bottom:8px}
[dir=rtl] .palmares{box-shadow:inset -3px 0 0 var(--c)}
.palmares .e{font-size:24px}
.palmares b{display:block}
.palmares small{color:var(--brume);font-size:12.5px}
.victoires,.parcours{list-style:none;margin:0;padding:0}
.victoires li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--surface2)}
.medaille{width:40px;height:46px;clip-path:var(--hx);background:var(--c);display:grid;place-items:center;color:#0B1416;flex:none;font-weight:850}
.medaille.or{background:var(--or)}.medaille.argent{background:#cfd8dc}.medaille.bronze{background:#d39b6a}
.medaille .ico{width:20px;height:20px}
.victoires b{display:block;font-size:14.5px}
.victoires small{color:var(--brume);font-size:12px}
.parcours li{position:relative;display:flex;gap:12px;padding:0 0 16px}
.parcours li::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--surface2)}
[dir=rtl] .parcours li::before{left:auto;right:5px}
.parcours li:last-child::before{display:none}
.parcours .point{width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:4px;flex:none;box-shadow:0 0 0 4px var(--fond)}
.parcours small{color:var(--brume);font-size:12px}
.parcours p{margin:2px 0 0}

/* ════ mon espace ════ */
.espace{margin:24px 0 8px}
.espace h2{margin-bottom:6px}
.action{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin:6px 0;border-radius:14px;background:var(--surface);text-align:start}
.action .h{display:grid;place-items:center;width:40px;height:44px;clip-path:var(--hx);background:var(--surface3);color:var(--teal);flex:none}
.action .ext{flex:1;min-width:0}
.action b{display:block;font-size:15px}
.action small{display:block;font-size:12.5px;color:var(--brume)}
.pied{text-align:center;margin:20px 0 0}
.bandeau-apercu{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:8px 10px;margin:0 -4px 8px;border-radius:12px;background:#1c3a3a;color:#bff2ec;font-size:13px}
.bandeau-apercu span{flex:1}
.attente .sq{width:160px;height:160px;margin:20px auto;border-radius:50%;background:radial-gradient(circle,var(--surface2) 30%,transparent 31%),repeating-radial-gradient(circle,var(--surface) 0 6px,transparent 6px 12px);opacity:.8}

/* ════ par-dessus ════ */
.voile{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;transition:opacity .2s}
.voile.on{opacity:1}
#feuille{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;padding:12px 16px calc(18px + var(--bas));border-radius:22px 22px 0 0;background:var(--surface);box-shadow:0 -10px 40px rgba(0,0,0,.5);z-index:21;transform:translateY(100%);transition:transform .22s ease-out;max-width:720px;margin:0 auto}
#feuille.on{transform:none}
#feuille .tete{display:flex;align-items:center;gap:10px;margin:-12px -16px 6px;padding:12px 16px 6px;position:sticky;top:-12px;background:var(--surface);z-index:2}
#feuille .tete h2{flex:1;font-size:18px}
#fTitre:focus{outline:none}
.grand-chiffre{text-align:center;margin:8px 0 10px}
.grand-chiffre b{display:block;font-size:44px;font-weight:850;font-variant-numeric:tabular-nums;background:var(--degrade);-webkit-background-clip:text;background-clip:text;color:transparent}
.grand-chiffre small{color:var(--brume)}
.duo-chiffres{display:flex;gap:8px;margin:10px 0}
.duo-chiffres>div{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--surface2)}
.duo-chiffres b{display:block;font-size:22px}
.duo-chiffres small{font-size:12px;color:var(--brume)}
.legende{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legende span{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.legende i{width:14px;height:16px;clip-path:var(--hx);background:var(--c)}
.alv-tete{display:flex;align-items:center;gap:12px;margin:4px 0 8px}
.alv-tete .hx.grand{width:56px;height:64px;clip-path:var(--hx);background:var(--c);display:grid;place-items:center;font-size:26px;flex:none}
.alv-tete b{display:block;font-size:16px}
.alv-tete small{color:var(--brume);font-size:12.5px}
.personne{display:flex;align-items:center;gap:12px;width:100%;padding:8px 2px;text-align:start;border-bottom:1px solid var(--surface2)}
/* ════ la confiance (2 nov. 2026) : le score de chaque contribution, mes décisions et recours ════ */
.hvs2{margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--surface2)}
.contrib{margin:10px 0;padding:12px;border-radius:14px;background:var(--surface);min-width:0;overflow-wrap:anywhere}
.contrib-tete{display:flex;align-items:center;gap:10px;min-width:0}
.contrib-tete .ext{flex:1;min-width:0}
.contrib-tete b{display:block;font-size:14px}
.contrib-tete small{display:block;font-size:12px;color:var(--gris)}
.hx-mini{width:30px;height:34px;flex:none;display:grid;place-items:center;clip-path:var(--hx);background:var(--surface2);font-size:14px}
.dim{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:8px 0 2px;font-size:13px;color:var(--brume)}
.dim b{color:var(--encre);font-variant-numeric:tabular-nums;white-space:nowrap}
.compos{margin:2px 0 6px;padding-inline-start:18px;font-size:13px;line-height:1.45}
.compos li{margin:3px 0}
.compos small{color:var(--gris)}
.contrib h4{margin:10px 0 2px;font-size:13px;color:var(--brume);font-weight:650}
.etat-d{flex:none;font-size:11.5px;padding:3px 8px;border-radius:10px;background:var(--surface2);color:var(--brume)}
.etat-d.on{background:var(--braise);color:#fff}
.contrib .btn.petit{margin-top:6px}
.palier{display:flex;align-items:center;gap:12px;margin:10px 0 4px;min-width:0}
.palier .ext{flex:1;min-width:0;overflow-wrap:anywhere}
.palier-hx{position:relative;flex:none;width:74px;height:84px;clip-path:var(--hx);display:grid;place-items:center;background:var(--surface2);color:var(--encre);text-align:center}
.palier-hx>span{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;opacity:.18}
.palier-hx b{position:relative;font-size:12.5px;font-weight:800;padding:0 4px;overflow-wrap:anywhere}
.palier-hx.p-bronze{background:linear-gradient(160deg,#E2A36B,#8C5527);color:#fff}
.palier-hx.p-argent{background:linear-gradient(160deg,#EEF3F6,#93A3AE);color:#0B1416}
.palier-hx.p-or{background:linear-gradient(160deg,#FFE08A,#E0A400);color:#0B1416}
.palier-hx.p-diamant{background:var(--degrade,linear-gradient(160deg,#2EE6C5,#6F4DFF 55%,#F0459A));color:#fff}
.palier-hx.petit{width:34px;height:38px}
.palier-hx.petit>span{font-size:22px}
.paliers-liste{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 10px}
.palier-mini{display:flex;align-items:center;gap:8px;min-width:0;padding:8px;border-radius:12px;background:var(--surface)}
.palier-mini .ext{min-width:0}.palier-mini b{display:block;font-size:13px}.palier-mini small{font-size:11.5px;color:var(--gris)}
.av{width:44px;height:44px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;overflow:hidden;font-weight:800;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.grand{width:84px;height:84px;font-size:30px}
.personne b{display:flex;align-items:center;gap:4px}
.personne b .ico{width:16px;height:16px;color:var(--teal)}
.personne small{color:var(--brume);font-size:12.5px}
.photo-edit{display:flex;align-items:center;gap:14px;margin:6px 0}
.lien-edit .champ-seul:first-child{width:34%}
.vis{margin:12px 0}
.vis b{display:block;font-size:14px;margin-bottom:6px}
.segment{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--surface2)}
.segment button{flex:1;min-height:34px;border-radius:9px;font-size:12.5px;color:var(--brume)}
.segment button[aria-checked="true"]{background:var(--encre);color:#0B1416;font-weight:650}
.carte-img{display:block;width:100%;max-width:360px;margin:4px auto 8px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.lien-plein{word-break:break-all;padding:10px;border-radius:10px;background:var(--surface2);font-size:13px}
.enregistrer{position:sticky;bottom:0}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--bas));transform:translate(-50%,20px);width:max-content;max-width:min(92vw,520px);padding:10px 16px;border-radius:14px;background:var(--encre);color:#0B1416;font-size:14px;font-weight:650;opacity:0;pointer-events:none;transition:all .2s;z-index:40;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#occupe{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(6,12,13,.78)}
#occupe .boite{width:min(86vw,340px);padding:18px;border-radius:18px;background:var(--surface);text-align:center}
#occupe .barre{height:6px;border-radius:3px;background:var(--surface3);overflow:hidden;margin:12px 0 6px}
#occupe .barre i{display:block;height:100%;width:0;background:var(--degrade);transition:width .2s}
@media (max-width:350px){.chiffre-case b{font-size:16px}.chiffre-case.hvs b{font-size:18px}.chiffre-case small{font-size:10.5px}.actions .btn{padding:0 10px}}

/* ════ L'AURORE : la nuit de NEURAVID éclairée par les couleurs du logo (sarcelle, violet, rose) et l'or des victoires ════ */
:root{--fond:#090E1C; --surface:#121a30; --surface2:#19233d; --surface3:#22304f; --fil:#2c3a5c; --encre:#F4F6FF; --brume:#AEB8D6; --gris:#7C88AA;
  --vif:linear-gradient(110deg,#12b5a6 0%,#6f4dff 55%,#e2408f 100%)}
body{background:
  radial-gradient(90% 45% at 0% 0%,rgba(47,211,194,.22),transparent 60%),
  radial-gradient(80% 45% at 100% 6%,rgba(139,108,255,.28),transparent 62%),
  radial-gradient(90% 50% at 50% 105%,rgba(255,95,162,.16),transparent 65%),
  #090E1C;background-attachment:fixed}
html{background:#090E1C}
.haut{background:linear-gradient(180deg,rgba(9,14,28,.92),rgba(9,14,28,.55))}
.rond{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
/* le halo derrière l'empreinte */
.empreinte-cadre{position:relative;background:radial-gradient(circle at 50% 50%,rgba(139,108,255,.30) 0%,rgba(47,211,194,.14) 38%,transparent 66%)}
.empreinte-cadre::after{content:"";position:absolute;inset:8%;border-radius:50%;box-shadow:0 0 80px 10px rgba(111,77,255,.18);pointer-events:none}
.hero h1{background:linear-gradient(180deg,#fff,#cdd5f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.verifie{-webkit-text-fill-color:initial}
.metiers span{background:rgba(139,108,255,.14);box-shadow:inset 0 0 0 1px rgba(139,108,255,.35);color:#e3dcff}
/* les chiffres : des verres colorés */
.chiffre-case{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.chiffre-case:nth-child(2) b{color:#7fe9dd}
.chiffre-case:nth-child(3) b{color:#c3b4ff}
.chiffre-case:nth-child(4) b{color:#ff9cc7}
.chiffre-case.hvs{background:linear-gradient(#17203a,#17203a) padding-box,var(--vif) border-box;border:1.5px solid transparent;box-shadow:0 8px 24px rgba(111,77,255,.25)}
.chiffre-case.hvs b{background:linear-gradient(110deg,#5ff2e2,#a993ff 55%,#ff7fb5);-webkit-background-clip:text;background-clip:text}
/* les boutons */
.btn{background:var(--vif);color:#fff;box-shadow:0 8px 22px rgba(111,77,255,.32)}
.btn.leger{background:rgba(255,255,255,.07);color:var(--encre);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.btn.braise{background:linear-gradient(110deg,#ff6a5a,#e2408f);box-shadow:none}
.puces>button[aria-pressed="true"],.segment button[aria-checked="true"]{background:var(--vif);color:#fff}
.langue{background:rgba(47,211,194,.14);color:#aef6ee}
/* les alvéoles : chacune garde sa couleur, même éteinte ; allumée, elle brille */
.alveole .hx::before{background:color-mix(in srgb,var(--c) 42%,transparent)}
.alveole .hx::after{background:linear-gradient(170deg,color-mix(in srgb,var(--c) 16%,#121a30),#101729 80%)}
.alveole .e{filter:saturate(.55);opacity:.72}
.alveole small{color:#9aa5c6}
.alveole.allume{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 55%,transparent))}
.alveole.allume .hx::before{background:linear-gradient(160deg,#fff 0%,var(--c) 30%,var(--c) 100%)}
.alveole.allume .hx::after{background:radial-gradient(120% 95% at 50% 10%,color-mix(in srgb,var(--c) 48%,#121a30),color-mix(in srgb,var(--c) 14%,#0d1426) 80%)}
.alveole.allume .e{filter:none;opacity:1}
.alveole.allume small{color:#fff;font-weight:650}
.titre-bloc h2,.espace h2{background:linear-gradient(90deg,#fff,#c9bdff);-webkit-background-clip:text;background-clip:text;color:transparent}
/* les onglets */
.onglets{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.onglets button[aria-selected="true"]{background:var(--vif);color:#fff;box-shadow:0 6px 18px rgba(111,77,255,.3)}
/* mon espace : une couleur par porte */
.action{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.espace .action:nth-of-type(4n+1) .h{background:rgba(47,211,194,.18);color:#5ff2e2}
.espace .action:nth-of-type(4n+2) .h{background:rgba(139,108,255,.2);color:#b6a6ff}
.espace .action:nth-of-type(4n+3) .h{background:rgba(255,95,162,.18);color:#ff8cc0}
.espace .action:nth-of-type(4n+4) .h{background:rgba(242,193,78,.18);color:#f6cf6b}
.bandeau-apercu{background:linear-gradient(110deg,rgba(18,181,166,.35),rgba(111,77,255,.35));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
#feuille{background:#141c33}
#feuille .tete{background:#141c33}
.oeuvre,.palmares{background:rgba(255,255,255,.05)}

/* ════════════════════════════════════════════════════════════════════
   v3 — UN PROFIL VIVANT
   ════════════════════════════════════════════════════════════════════ */
:root{--police:"Inter NV",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;--brume:#B8C2E0;--trame:rgba(184,194,224,.22);--or-vif:#F2C14E;
  --at:.22;--av:.28;--ar:.16}
html,body{font-optical-sizing:auto;font-variant-numeric:tabular-nums}
body{background:
  radial-gradient(90% 45% at 0% 0%,rgba(47,211,194,var(--at)),transparent 60%),
  radial-gradient(80% 45% at 100% 6%,rgba(139,108,255,var(--av)),transparent 62%),
  radial-gradient(90% 50% at 50% 105%,rgba(255,95,162,var(--ar)),transparent 65%),
  var(--fond);background-attachment:fixed;transition:background-color .6s}
/* l'aurore suit l'heure : sarcelle le matin, violet à midi, rose le soir, l'équilibre la nuit */
html[data-aurore=matin]{--at:.36;--av:.16;--ar:.10}
html[data-aurore=midi]{--at:.14;--av:.36;--ar:.12}
html[data-aurore=soir]{--at:.08;--av:.22;--ar:.32}
.bio{color:color-mix(in srgb,var(--encre) 88%,transparent)}
#toast{color:var(--fond)}
.epingle{color:var(--fond)}
.bloc{margin:22px 0 8px}

/* ════ l'empreinte vivante ════ */
.empreinte-scene{position:relative;display:flex;justify-content:center;transform-origin:50% 30%;will-change:transform}
.empreinte .racine{stroke-dasharray:1;stroke-dashoffset:0;opacity:.95}
.empreinte .racine.neuve{stroke-dashoffset:1;animation:pousser 1.6s .6s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes pousser{to{stroke-dashoffset:0}}
.empreinte .noeud{filter:drop-shadow(0 0 3px rgba(242,193,78,.7))}
.empreinte-cadre.echo{background:radial-gradient(circle,rgba(242,193,78,.36) 0%,rgba(242,193,78,.12) 42%,transparent 68%)}
.empreinte-cadre.echo::after{box-shadow:0 0 0 2px rgba(242,193,78,.55),0 0 70px 16px rgba(242,193,78,.32);animation:echo 2.8s ease-in-out infinite}
@keyframes echo{50%{box-shadow:0 0 0 3px rgba(242,193,78,.8),0 0 96px 24px rgba(242,193,78,.42)}}
.particules{position:absolute;inset:0;pointer-events:none}
.particules i{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#ffe39a;box-shadow:0 0 8px #F2C14E;opacity:0;animation:etincelle 2.8s var(--d) ease-out infinite}
@keyframes etincelle{0%{opacity:0;transform:rotate(var(--a)) translateY(-38%) scale(.4)}25%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(-62%) scale(1)}}
.particules i{transform-origin:0 0}
.echo-texte{display:inline-flex;margin:4px 0 0;padding:4px 12px;border-radius:14px;font-size:13px;font-weight:700;color:#2a1d00;background:linear-gradient(110deg,#ffe39a,#F2C14E 60%,#e0a52a);box-shadow:0 6px 18px rgba(242,193,78,.35)}
/* le battement */
#battementZone{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);z-index:2}
.battement{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 9px;border-radius:14px;font-size:12px;font-weight:700;white-space:nowrap;background:rgba(9,14,28,.86);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--encre)}
.battement i{width:9px;height:9px;border-radius:50%;background:#7C88AA;flex:none}
.battement.creation i{background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:bat 1.6s infinite}
.battement.live i{background:#ff3b5c;animation:bat-r 1.2s infinite}
.battement.live.bientot i{animation:none;background:#ff6b84}
.battement.actif i{background:#F2C14E}
.battement.absent{color:var(--brume)}
@keyframes bat{70%{box-shadow:0 0 0 7px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
@keyframes bat-r{0%{box-shadow:0 0 0 0 rgba(255,59,92,.6)}70%{box-shadow:0 0 0 7px rgba(255,59,92,0)}}
button.battement{cursor:pointer}
/* la phrase signature, la voix */
.phrase-signature{max-width:30em;margin:10px auto 0;font-size:15.5px;line-height:1.45;font-weight:500;color:color-mix(in srgb,var(--encre) 92%,transparent);font-style:italic;overflow-wrap:anywhere}
.phrase-signature::before{content:"« "}.phrase-signature::after{content:" »"}
.phrase-signature.vide-phrase{display:inline-flex;align-items:center;gap:6px;font-style:normal;font-size:13px;color:var(--brume);padding:5px 12px;border-radius:14px;box-shadow:inset 0 0 0 1px dashed;border:1px dashed var(--fil)}
.phrase-signature.vide-phrase::before,.phrase-signature.vide-phrase::after{content:none}
.vide-phrase .ico{width:16px;height:16px}
.voix-btn{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:13px;font-size:12.5px;font-weight:650;color:var(--encre);background:rgba(139,108,255,.18);box-shadow:inset 0 0 0 1px rgba(139,108,255,.4)}
.voix-btn .ico{width:15px;height:15px}
.voix-btn.joue{background:var(--vif);color:#fff}
/* les trois alvéoles principales, la dernière œuvre */
.trio{display:flex;justify-content:center;gap:14px;margin-top:12px}
.trio-hx{display:flex;flex-direction:column;align-items:center;gap:3px;width:68px}
.hx-mini{width:44px;height:50px;clip-path:var(--hx);display:grid;place-items:center;font-size:20px;background:linear-gradient(160deg,#fff 0%,var(--c) 30%,var(--c));filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 60%,transparent))}
.trio-hx small{font-size:10.5px;line-height:1.15;color:var(--brume);text-align:center}
.derniere{display:flex;align-items:center;gap:10px;margin:12px auto 0;padding:6px 12px 6px 6px;border-radius:14px;max-width:100%;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);text-align:start}
.derniere .vign{width:34px;height:46px;border-radius:7px;overflow:hidden;display:grid;place-items:center;background:var(--surface3);flex:none}
.derniere .vign img{width:100%;height:100%;object-fit:cover}
.derniere small{display:block;font-size:11px;color:var(--brume)}
.derniere b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.soutien-moi{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 0;font-size:12.5px;color:#f6cf6b}
.soutien-moi .ico{width:16px;height:16px}

/* ════ la séquence d'ouverture (8 s) et le cinéma (1,8 s) ════ */
#corps.seq [data-etape]{opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease}
#corps.seq [data-etape="1"]{transition-duration:.9s}
#corps.seq[data-e="1"] [data-etape="1"],
#corps.seq[data-e="2"] [data-etape="1"],#corps.seq[data-e="2"] [data-etape="2"],
#corps.seq[data-e="3"] [data-etape="1"],#corps.seq[data-e="3"] [data-etape="2"],#corps.seq[data-e="3"] [data-etape="3"],
#corps.seq[data-e="4"] [data-etape]{opacity:1;transform:none}
#corps.seq .trio-hx{opacity:.15;transform:scale(.8);transition:opacity .5s calc(var(--i) * .55s),transform .5s calc(var(--i) * .55s)}
#corps.seq[data-e="3"] .trio-hx,#corps.seq[data-e="4"] .trio-hx{opacity:1;transform:none}
#corps.seq .empreinte-scene{transform:none!important;opacity:1!important}
#cinema{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:var(--fond);transition:opacity .38s}
#cinema.fin{opacity:0;pointer-events:none}
.cine-empreinte{width:min(78vw,420px);aspect-ratio:1;animation:cine 1.8s cubic-bezier(.2,.7,.2,1) both}
.cine-empreinte svg{width:100%;height:100%;overflow:visible}
@keyframes cine{0%{opacity:0;transform:scale(2.6);filter:blur(10px)}45%{opacity:1;filter:blur(0)}100%{transform:scale(.62);opacity:1}}
#cinema .passer{position:absolute;bottom:calc(24px + var(--bas));right:20px}
[dir=rtl] #cinema .passer{right:auto;left:20px}

/* ════ le squelette, les transitions, tirer pour actualiser ════ */
.squelette{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.sk{background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.05) 70%) 0 0/300% 100%;animation:luire 1.4s linear infinite;border-radius:10px}
@keyframes luire{to{background-position:-150% 0}}
.sk-rond{width:min(60vw,220px);aspect-ratio:1;border-radius:50%}
.sk-ligne{height:14px;margin-top:12px}.sk-ligne.l1{width:52%;height:26px}.sk-ligne.l2{width:34%}.sk-ligne.l3{width:70%}
.sk-chiffres{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-top:18px}.sk-chiffres i{height:56px}
.sk-btn{width:100%;height:46px;margin-top:10px;border-radius:13px}
.sk-ruche{margin-top:22px}.sk-ruche>div{display:flex;justify-content:center;gap:6px}.sk-ruche>div+div{margin-top:-12px}
.sk-hx{width:min(20vw,80px);aspect-ratio:.866;clip-path:var(--hx);border-radius:0}
.entre-avant{animation:glisser-av .38s ease-out}.entre-arriere{animation:glisser-ar .38s ease-out}.entre-fondu{animation:fondu .35s ease-out}
@keyframes glisser-av{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes glisser-ar{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes fondu{from{opacity:0}to{opacity:1}}
[dir=rtl] .entre-avant{animation-name:glisser-ar}[dir=rtl] .entre-arriere{animation-name:glisser-av}
#tirer{position:fixed;top:calc(64px + var(--haut));left:50%;z-index:6;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);box-shadow:0 6px 18px rgba(0,0,0,.35);color:var(--brume);transform:translate(-50%,0)}
#tirer.pret{color:#fff;background:var(--vif)}
#tirer.tourne svg{animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}

/* ════ l'atelier ════ */
.atelier ul{list-style:none;margin:0;padding:0}
.atelier li{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:6px 0;border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:inset 3px 0 0 var(--c)}
[dir=rtl] .atelier li{box-shadow:inset -3px 0 0 var(--c)}
.atelier .e{font-size:22px}
.atelier b{display:block;font-size:14.5px}
.atelier small{display:block;font-size:12px;color:var(--brume)}
.progres{display:block;height:5px;margin-top:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.progres>i{display:block;height:100%;border-radius:3px;background:var(--c)}
.progres.indet>i{animation:indet 1.6s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}

/* ════ la roue des talents ════ */
.roue-cadre{display:flex;justify-content:center}
.roue{width:min(70vw,240px);height:auto;overflow:visible}
.roue .branche{cursor:pointer;outline:none}
.roue .branche:focus-visible circle:last-child{stroke:var(--teal);stroke-width:2}
.anime-vue .roue-forme{transform-origin:50% 50%;transform-box:fill-box}
.anime-vue:not(.vue) .roue-forme{transform:scale(.2);opacity:0}
.anime-vue.vue .roue-forme{transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s}
.roue-legende{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.roue-legende button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);font-size:13px;text-align:start}
.roue-legende i{width:12px;height:14px;clip-path:var(--hx);background:var(--c);flex:none}
.roue-legende span{flex:1;min-width:0}
.roue-legende b{font-weight:800}
.action .h.fam{background:color-mix(in srgb,var(--c) 22%,transparent);font-size:20px}

/* ════ la constellation ════ */
.constellation-cadre{border-radius:16px;background:radial-gradient(80% 70% at 50% 50%,rgba(139,108,255,.14),transparent 70%)}
.constellation{width:100%;height:auto;display:block}
.constellation .astre{cursor:pointer;outline:none}
.constellation .astre:hover circle,.constellation .astre:focus-visible circle{stroke-width:3.5}
.anime-vue:not(.vue) .constellation line{stroke-dasharray:200;stroke-dashoffset:200}
.anime-vue.vue .constellation line{stroke-dasharray:200;stroke-dashoffset:0;transition:stroke-dashoffset 1.2s ease-out}

/* ════ le livre d'or, la gratitude ════ */
.traces{list-style:none;margin:0;padding:0}
.traces li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.av.mini{width:34px;height:34px;font-size:14px}
.traces p{margin:0;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.traces small{font-size:11.5px;color:var(--brume)}
.fondateur{display:inline-flex;align-items:center;gap:3px;font-style:normal;font-size:11px;font-weight:750;color:#2a1d00;background:linear-gradient(110deg,#ffe39a,#F2C14E);padding:1px 8px 1px 5px;border-radius:9px;vertical-align:middle}
.fondateur .ico{width:12px;height:12px;fill:currentColor;stroke:none}
.rond.petit-rond{width:34px;height:34px}
.rond.petit-rond .ico{width:16px;height:16px}
.soutiens{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0}
.soutien{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.soutien .av{width:52px;height:52px;box-shadow:0 0 0 2px #F2C14E}
.soutien small{font-size:11px;color:var(--brume);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visites{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;margin:6px 0;background:linear-gradient(110deg,rgba(18,181,166,.18),rgba(111,77,255,.18))}
.visites small{display:block;color:var(--brume);font-size:11.5px}
.visites .ico{margin-top:2px}

/* ════ les œuvres : le résumé vocal ; les victoires : les trophées gravés ════ */
.oeuvre-case{position:relative}
.oeuvre-case .oeuvre{width:100%;display:block}
.resume{position:absolute;bottom:26px;right:6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(9,14,28,.78);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
[dir=rtl] .resume{right:auto;left:6px}
.resume .ico{width:16px;height:16px}
.resume.joue{background:var(--vif)}
.eco{margin:0 0 8px}
.victoires li{gap:10px}
.victoires .ext{flex:1;min-width:0}
.trophee{width:42px;height:49px;flex:none;overflow:visible}
.trophee.p1{filter:drop-shadow(0 0 6px rgba(242,193,78,.55))}
@media (prefers-reduced-motion:no-preference){.trophee .eclat{animation:eclat 3.2s 1s ease-in-out infinite}}
@keyframes eclat{0%{opacity:0;transform:translateX(0) skewX(-20deg)}10%{opacity:.55}30%{opacity:0;transform:translateX(70px) skewX(-20deg)}100%{opacity:0;transform:translateX(70px) skewX(-20deg)}}
.tendance{font-weight:650;font-size:14px}
.tendance.monte{color:#5ff2a0}.tendance.baisse{color:#ffb38a}
.tendance.monte::before{content:"▲ "}.tendance.baisse::before{content:"▼ "}

/* ════ l'alvéole touchée respire ════ */
@media (prefers-reduced-motion:no-preference){.alveole.respire .hx{animation:respire 6s ease-in-out infinite}}
@keyframes respire{50%{transform:scale(1.02)}}
.alveole.respire{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--c) 70%,transparent))}

/* ════ les interrupteurs (sons et affichage) ════ */
.interrupteur{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;text-align:start;border-bottom:1px solid rgba(255,255,255,.06)}
.interrupteur .ext{flex:1;min-width:0}
.interrupteur b{display:block;font-size:15px}
.interrupteur small{display:block;font-size:12.5px;color:var(--brume)}
.interrupteur i{width:46px;height:28px;border-radius:14px;background:var(--surface3);position:relative;flex:none;transition:background .2s}
.interrupteur i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.interrupteur[aria-checked="true"] i{background:var(--vif)}
.interrupteur[aria-checked="true"] i::after{transform:translateX(18px)}
[dir=rtl] .interrupteur[aria-checked="true"] i::after{transform:translateX(-18px)}
[dir=rtl] .interrupteur i::after{left:auto;right:3px}
.enr-en-cours{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px}
.point-rouge{width:16px;height:16px;border-radius:50%;background:#ff3b5c;animation:bat-r 1s infinite}
.barre-voix{width:100%;height:6px;border-radius:3px;background:var(--surface3);overflow:hidden}
.barre-voix i{display:block;height:100%;background:var(--vif);animation:remplir 2s linear forwards}
@keyframes remplir{from{width:0}to{width:100%}}

/* ════ le JOUR : la même aurore sur un ciel clair (contrastes AA) ════ */
html[data-theme=jour]{--fond:#F4F2FB;--surface:#FFFFFF;--surface2:#EEEAF8;--surface3:#E2DCF3;--fil:#D5CEEA;--encre:#141A33;--brume:#4A5272;--gris:#5E6688;--trame:rgba(74,82,114,.22);--at:.16;--av:.16;--ar:.10;background:#F4F2FB}
html[data-theme=jour][data-aurore=matin]{--at:.26;--av:.10;--ar:.06}
html[data-theme=jour][data-aurore=midi]{--at:.10;--av:.24;--ar:.08}
html[data-theme=jour][data-aurore=soir]{--at:.06;--av:.14;--ar:.22}
html[data-theme=jour] .haut{background:linear-gradient(180deg,rgba(244,242,251,.95),rgba(244,242,251,.6))}
html[data-theme=jour] .rond{background:rgba(20,26,51,.06);box-shadow:inset 0 0 0 1px rgba(20,26,51,.08)}
html[data-theme=jour] .hero h1{background:linear-gradient(180deg,#141A33,#3b3f6b);-webkit-background-clip:text;background-clip:text}
html[data-theme=jour] .metiers span{background:rgba(111,77,255,.1);box-shadow:inset 0 0 0 1px rgba(111,77,255,.3);color:#4b37b8}
html[data-theme=jour] .chiffre-case,html[data-theme=jour] .action,html[data-theme=jour] .atelier li,html[data-theme=jour] .roue-legende button,html[data-theme=jour] .derniere{background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px rgba(20,26,51,.08),0 2px 10px rgba(20,26,51,.04)}
html[data-theme=jour] .chiffre-case:nth-child(2) b{color:#0b7d73}
html[data-theme=jour] .chiffre-case:nth-child(3) b{color:#5b45d6}
html[data-theme=jour] .chiffre-case:nth-child(4) b{color:#b82f70}
html[data-theme=jour] .chiffre-case.hvs{background:linear-gradient(#fff,#fff) padding-box,var(--vif) border-box}
html[data-theme=jour] .chiffre-case.hvs b,html[data-theme=jour] .grand-chiffre b{background:linear-gradient(110deg,#0b8f84,#5b3fe0 55%,#c42f78);-webkit-background-clip:text;background-clip:text}
html[data-theme=jour] .btn.leger{background:rgba(20,26,51,.05);box-shadow:inset 0 0 0 1px rgba(20,26,51,.12)}
html[data-theme=jour] .langue{background:rgba(18,181,166,.12);color:#0b6d64}
html[data-theme=jour] .titre-bloc h2,html[data-theme=jour] .espace h2{background:linear-gradient(90deg,#141A33,#5b45d6);-webkit-background-clip:text;background-clip:text}
html[data-theme=jour] .alveole .hx::after{background:linear-gradient(170deg,color-mix(in srgb,var(--c) 14%,#fff),#f7f5fd 80%)}
html[data-theme=jour] .alveole.allume .hx::after{background:radial-gradient(120% 95% at 50% 10%,color-mix(in srgb,var(--c) 40%,#fff),color-mix(in srgb,var(--c) 14%,#fff) 80%)}
html[data-theme=jour] .alveole small{color:#4A5272}
html[data-theme=jour] .alveole.allume small{color:#141A33}
html[data-theme=jour] #feuille,html[data-theme=jour] #feuille .tete{background:#fff}
html[data-theme=jour] .onglets{background:rgba(20,26,51,.05)}
html[data-theme=jour] .oeuvre,html[data-theme=jour] .palmares{background:rgba(20,26,51,.05)}
html[data-theme=jour] .liens button{color:#0b7d73}
html[data-theme=jour] .hvs-mini{color:#bff2ec}
html[data-theme=jour] .battement{background:rgba(255,255,255,.94);box-shadow:0 2px 10px rgba(20,26,51,.15)}
html[data-theme=jour] .soutien-moi{color:#8a5d00}
html[data-theme=jour] .tendance.monte{color:#0b7d4a}html[data-theme=jour] .tendance.baisse{color:#b0461a}
html[data-theme=jour] .sk{background:linear-gradient(100deg,rgba(20,26,51,.05) 30%,rgba(20,26,51,.11) 50%,rgba(20,26,51,.05) 70%) 0 0/300% 100%}
html[data-theme=jour] .traces li,html[data-theme=jour] .interrupteur{border-color:rgba(20,26,51,.08)}
html[data-theme=jour] .progres{background:rgba(20,26,51,.08)}
html[data-theme=jour] .voix-btn{background:rgba(111,77,255,.1);color:#3b2aa0}
html[data-theme=jour] .voix-btn.joue{color:#fff;background:var(--vif)}
html[data-theme=jour] .empreinte-cadre{background:radial-gradient(circle at 50% 50%,rgba(139,108,255,.22) 0%,rgba(47,211,194,.10) 38%,transparent 66%)}
html[data-theme=jour] .victoires li{border-color:rgba(20,26,51,.08)}

/* ════ LES DESSINS DES MODULES : nets de jour comme de nuit ════
   Éteinte : un bord plein à la couleur de sa famille, un fond teinté, l'icône en vraies couleurs.
   Allumée : remplie de sa couleur, avec son halo et son nombre. */
.alveole .hx::before{background:var(--c)}
.alveole .hx::after{inset:3px;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 30%,#121a30),color-mix(in srgb,var(--c) 12%,#0f1628) 85%)}
.alveole .e{font-size:clamp(22px,7vw,28px);filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));opacity:1}
.alveole small{color:#cfd6f2;font-weight:600}
.alveole.allume .hx::after{background:radial-gradient(120% 95% at 50% 10%,color-mix(in srgb,var(--c) 70%,#fff 8%),color-mix(in srgb,var(--c) 38%,#0d1426) 85%)}
.alveole.allume b{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
html[data-theme=jour] .alveole .hx::before{background:color-mix(in srgb,var(--c) 82%,#1b1f45)}
html[data-theme=jour] .alveole .hx::after{background:linear-gradient(170deg,color-mix(in srgb,var(--c) 26%,#fff),color-mix(in srgb,var(--c) 10%,#fff) 85%)}
html[data-theme=jour] .alveole .e{filter:drop-shadow(0 1px 1.5px rgba(20,26,51,.35))}
html[data-theme=jour] .alveole small{color:#262c4d}
html[data-theme=jour] .alveole.allume{filter:drop-shadow(0 4px 12px color-mix(in srgb,var(--c) 55%,transparent))}
html[data-theme=jour] .alveole.allume .hx::after{background:radial-gradient(120% 95% at 50% 10%,color-mix(in srgb,var(--c) 75%,#fff),color-mix(in srgb,var(--c) 92%,#1b1f45) 90%)}
html[data-theme=jour] .alveole.allume small{color:#141A33;font-weight:750}
html[data-theme=jour] .alveole .couronne{color:#b07c00}
@supports not (background:color-mix(in srgb,red 50%,blue)){.alveole .hx::after{background:var(--surface2)}}

/* ════ moins de transparence, moins de mouvement (réglages du téléphone) ════ */
@media (prefers-reduced-transparency:reduce){
  .haut{backdrop-filter:none;background:var(--fond)}
  .chiffre-case,.action,.atelier li,.roue-legende button,.derniere,.btn.leger,.rond,.onglets,.oeuvre,.palmares{background:var(--surface2)!important}
  .battement{background:var(--surface)}
  body{background:var(--fond)}
}
@media (prefers-reduced-motion:reduce){
  .particules,.empreinte .racine.neuve{animation:none!important;stroke-dashoffset:0}
  .empreinte-cadre.echo::after,.sk,.battement i,.progres.indet>i,.point-rouge,.barre-voix i,#tirer.tourne svg{animation:none!important}
  .barre-voix i{width:100%}
  .entre-avant,.entre-arriere,.entre-fondu{animation:none!important}
  .anime-vue:not(.vue) .roue-forme{transform:none;opacity:1}
}
/* le réglage « Mouvements » de NEURAVID éteint les mêmes animations que le téléphone */
html[data-mouvement=non] .particules{display:none}
html[data-mouvement=non] .empreinte .racine.neuve{animation:none!important;stroke-dashoffset:0}
html[data-mouvement=non] .empreinte-cadre.echo::after,html[data-mouvement=non] .sk,html[data-mouvement=non] .battement i,html[data-mouvement=non] .progres.indet>i,html[data-mouvement=non] .point-rouge,html[data-mouvement=non] .barre-voix i,html[data-mouvement=non] #tirer.tourne svg,html[data-mouvement=non] .trophee .eclat,html[data-mouvement=non] .alveole.respire .hx,html[data-mouvement=non] .empreinte{animation:none!important}
html[data-mouvement=non] .barre-voix i{width:100%}
html[data-mouvement=non] .entre-avant,html[data-mouvement=non] .entre-arriere,html[data-mouvement=non] .entre-fondu{animation:none!important}
html[data-mouvement=non] .anime-vue:not(.vue) .roue-forme,html[data-mouvement=non] .anime-vue:not(.vue) .constellation line{transform:none;opacity:1;stroke-dashoffset:0}
</style>
</head>

/* ════════ La base de L'Empreinte (IndexedDB) : mon profil (texte, photo, couverture), les profils vus (cache court) ════════ */
var IDB = {db:null, attente:null};

      r.onsuccess = function(){ IDB.db = r.result; ok(IDB.db); };
      r.onerror = function(){ ko(r.error); };
      setTimeout(function(){ ko(new Error('idb lente')); }, 5000);
    }catch(e){ ko(e); }
  });
  IDB.attente.catch(function(){ IDB.attente = null; });
  return IDB.attente;
}

function idbEcrire(store, k, v){ return idbOp(store, 'readwrite', function(s){ return s.put(v, k); }).then(function(){ return true; }).catch(function(e){ dbg(e); return false; }); }
function idbEffacer(store, k){ return idbOp(store, 'readwrite', function(s){ return s.delete(k); }).catch(function(e){ dbg(e); }); }

/* L'ÉCHANGE entre modules (même origine) : un fichier déposé ici est repris par La Forge ou Cinema World.
   Base partagée « nv_echange », magasin « fichiers » : {blob, nom, type, de, at}. Effacé après 24 h. */
function deposerEchange(blob, nom, type){
  return new Promise(function(ok, ko){
    try{
      var r = indexedDB.open('nv_echange', 1);
      r.onupgradeneeded = function(){ if(!r.result.objectStoreNames.contains('fichiers')) r.result.createObjectStore('fichiers'); };
      r.onsuccess = function(){ var d = r.result, k = nid('x'), t = d.transaction('fichiers', 'readwrite'), s = t.objectStore('fichiers');
        s.put({blob:blob, nom:nom, type:type, de:MOI, at:Date.now()}, k);
        var c = s.openCursor(); c.onsuccess = function(){ var x = c.result; if(!x) return; if(x.value && x.value.at && Date.now() - x.value.at > 864e5) x.delete(); x.continue(); };
        t.oncomplete = function(){ d.close(); ok(k); }; t.onerror = function(){ ko(t.error); }; };
      r.onerror = function(){ ko(r.error); };
    }catch(e){ ko(e); }
  });
}

/* ════════ Le cinéma d'ouverture (1,8 s) et la séquence de 8 s — une fois par session et par profil ════════
   0–2 s l'empreinte, le nom, le HVS · 2–4 s les métiers et la phrase · 4–6 s les trois alvéoles principales · 6–8 s le reste.
   Un toucher, une touche ou un défilement passe tout ; sans mouvement (réglage du téléphone ou de NEURAVID), rien ne bouge. */
function dejaVuSession(k){ try{ var l = JSON.parse(sessionStorage.getItem('nv_empreinte_vus') || '[]'); return Array.isArray(l) && l.indexOf(k) >= 0; }catch(e){ return false; } }
function marquerVuSession(k){ try{ var l = JSON.parse(sessionStorage.getItem('nv_empreinte_vus') || '[]'); l = Array.isArray(l) ? l.slice(-40) : []; if(l.indexOf(k) < 0) l.push(k); sessionStorage.setItem('nv_empreinte_vus', JSON.stringify(l)); }catch(e){ dbg(e); } }
function jouerOuverture(){
  var c = $('corps'), svg = document.querySelector('.empreinte-cadre .empreinte'); if(!c || !svg) return;
  OUV.enCours = true; c.classList.add('seq'); c.setAttribute('data-e', '0');
  var cine = document.createElement('div'); cine.id = 'cinema'; cine.innerHTML = '<div class="cine-empreinte" aria-hidden="true">' + svg.outerHTML + '</div><button class="btn leger petit passer" data-a="passerOuverture">' + esc(tr('Passer')) + '</button>'; document.body.appendChild(cine); son('ouverture');
  var etape = function(n, ms){ OUV.t.push(setTimeout(function(){ c.setAttribute('data-e', String(n)); if(n === 1){ var x = $('cinema'); if(x){ x.classList.add('fin'); setTimeout(function(){ if(x.parentNode) x.remove(); }, 380); } } }, ms)); };
  etape(1, 1800); etape(2, 2600); etape(3, 4000); etape(4, 6000);
  OUV.t.push(setTimeout(finOuverture, 8000));
  ['pointerdown', 'wheel', 'keydown'].forEach(function(t){ window.addEventListener(t, passerSurGeste, {capture:true, passive:true}); });
}
function passerSurGeste(e){ if(e && e.target && e.target.closest && e.target.closest('.passer')) return; finOuverture(); }
function finOuverture(){ OUV.t.forEach(clearTimeout); OUV.t = []; OUV.enCours = false; var c = $('corps'); if(c){ c.classList.remove('seq'); c.removeAttribute('data-e'); } var x = $('cinema'); if(x) x.remove(); ['pointerdown', 'wheel', 'keydown'].forEach(function(t){ window.removeEventListener(t, passerSurGeste, {capture:true}); }); }
A.passerOuverture = function(){ finOuverture(); };

/* ════════ Les transitions entre profils : un fondu qui glisse (vers l'avant ou vers l'arrière) ════════ */
function entree(sens){ var c = $('corps'); if(!c || !mouvementPermis()) return; c.classList.remove('entre-avant', 'entre-arriere', 'entre-fondu'); void c.offsetWidth; c.classList.add(sens === 'avant' ? 'entre-avant' : sens === 'arriere' ? 'entre-arriere' : 'entre-fondu'); }

/* ════════ Après chaque rendu : images paresseuses, sections qui apparaissent, ouverture, racines, voix ════════ */
var IO = (function(){ try{ return 'IntersectionObserver' in window ? new IntersectionObserver(function(l){ l.forEach(function(x){ if(!x.isIntersecting) return; var el = x.target; if(el.tagName === 'IMG' && el.getAttribute('data-src')){ el.src = el.getAttribute('data-src'); el.removeAttribute('data-src'); } else el.classList.add('vue'); IO.unobserve(el); }); }, {rootMargin:'200px 0px'}) : null; }catch(e){ return null; } })();
function apresRendu(P){
  document.querySelectorAll('#corps img[data-src]').forEach(function(im){ if(IO) IO.observe(im); else { im.src = im.getAttribute('data-src'); im.removeAttribute('data-src'); } });
  document.querySelectorAll('#corps .anime-vue').forEach(function(s){ if(IO && mouvementPermis()) IO.observe(s); else s.classList.add('vue'); });
  if(OUV.attendu && ETAT.charge){ OUV.attendu = false; var k = (ETAT.moi ? 'moi:' : '') + (P.id || P.handle || ''); var premiere = !dejaVuSession(k); marquerVuSession(k);
    if(premiere && mouvementPermis() && !economie() && !ETAT.apercu) jouerOuverture(); else if(SQ.vu) entree('fondu');
    TRANS.sens = ''; SQ.vu = false;
    /* la signature vivante ne part seule que si la personne qui écoute l'a choisi, après un premier geste */
    var u = voixDe(P); if(premiere && u && PREFS.voix && !(ETAT.moi && !ETAT.apercu) && !(navigator.userActivation && !navigator.userActivation.hasBeenActive)) setTimeout(function(){ if(profilVu() === P && PREFS.voix && !AUDIO.k) jouerAudio(u, 'voix', REGLES.voixMs + 600); }, OUV.enCours ? 1900 : 300);
  }

<!--NV_VERS_IRIS--><script id="nv-vers-iris" data-module="Profile">
/* NEURAVID — VERS IRIS : toute vidéo d'un module peut s'ouvrir dans Iris, le lecteur principal.

   1. window.NVIris.ouvrir(clip, {liste, index}) : ouvre une vidéo (ou une série) dans Iris.

    bouton.style.cssText = 'position:fixed;z-index:2147483000;width:44px;height:44px;display:none;place-items:center;border:0;padding:0;cursor:pointer;' +
      'background:linear-gradient(140deg,rgba(108,43,217,.92),rgba(224,36,154,.92));clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)';
    bouton.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
