<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140b33">
<title>Espace presse et radio · NEURAVID</title>
<style>
/* L'espace presse et radio de la Saison des Nations : chiffres réels, faits, fiche radio, communiqués, kit média.
   Léger, lisible sur un petit téléphone et sans connexion. */
:root{
  --nuit:#140b33; --nuit2:#1c1147; --alv:#241657; --craie:#f6f1ff; --brume:rgba(236,228,255,.74); --trait:rgba(255,255,255,.16);
  --or:#ffc531; --argent:#d7dbe6; --bronze:#e0995a; --cyan:#16e0d4; --rose:#ff4f9e; --rouge:#ff7a7a;
  --hex:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--nuit);color:var(--craie);font:16px/1.45 var(--sans);min-height:100vh}
main{max-width:768px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.hex{width:34px;height:30px;flex:0 0 auto;clip-path:var(--hex);background:linear-gradient(135deg,var(--cyan),#6c2bd9);display:grid;place-items:center}
.hex i{width:14px;height:14px;border-radius:50%;background:var(--nuit);box-shadow:inset 0 0 0 4px var(--craie)}
h1{font-size:1.2rem;margin:0;line-height:1.2}
h2{font-size:1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:12px;height:11px;clip-path:var(--hex);background:var(--cyan);flex:0 0 auto}
.sous{margin:0;color:var(--brume);font-size:.88rem}
.apercu{display:inline-block;margin-inline-start:6px;padding:1px 8px;border-radius:999px;background:var(--or);color:#2a1a00;font-size:.75rem;font-weight:800;vertical-align:middle}
#etat{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:var(--nuit2);border:1px solid var(--trait);font-size:.9rem}
#etat.hl{border-color:var(--or)}
#etat.ok{border-color:rgba(22,224,212,.5)}
section{background:var(--nuit2);border:1px solid var(--trait);border-radius:14px;padding:12px 14px;margin:0 0 12px}
ul{list-style:none;margin:0;padding:0}
li{padding:7px 0;border-top:1px solid var(--trait)}
li:first-child{border-top:0}
.l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.d{color:var(--brume);font-size:.86rem}
.puce{display:inline-block;padding:0 7px;border-radius:999px;font-size:.75rem;font-weight:700;border:1px solid var(--trait);white-space:nowrap}
.puce.an{color:var(--rouge);border-color:var(--rouge)}
.puce.re{color:var(--or);border-color:var(--or)}
.puce.co{color:var(--cyan);border-color:var(--cyan)}
.chiffres{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.chiffres b{display:block;font-size:1.25rem}
.chiffres span{font-size:.75rem;color:var(--brume)}
.med{display:inline-flex;align-items:center;gap:3px;margin-inline-end:8px;white-space:nowrap}
.med i{width:12px;height:11px;clip-path:var(--hex);display:inline-block}
.or i{background:var(--or)} .ar i{background:var(--argent)} .br i{background:var(--bronze)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:5px 4px;text-align:center;border-top:1px solid var(--trait)}
td:first-child,th:first-child{text-align:start}
th{font-size:.75rem;color:var(--brume);font-weight:600;border-top:0}
button,select,.lien{font:inherit;color:inherit}
button{min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--trait);background:var(--alv);cursor:pointer}
button:focus-visible,select:focus-visible,.lien:focus-visible{outline:2px solid var(--or);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.actions button{flex:1 1 140px}
.lien{background:none;border:0;padding:6px 0;min-height:36px;color:var(--cyan);text-decoration:underline;cursor:pointer;font-size:.88rem}
.jours button{min-height:40px;margin-block:4px 0;margin-inline:0 6px;padding:6px 10px;font-size:.88rem}
.jours button[aria-current="true"]{border-color:var(--or)}
footer{color:var(--brume);font-size:.8rem;display:grid;gap:8px;margin-top:4px}
footer label{display:flex;gap:8px;align-items:center}
select{min-height:40px;border-radius:10px;background:var(--alv);border:1px solid var(--trait);padding:4px 8px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--craie);color:var(--nuit);padding:8px 14px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.vide{color:var(--brume);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[dir="rtl"] .l1{direction:rtl}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
@media (min-width:560px){h1{font-size:1.35rem}}
.texte{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--alv);border:1px solid var(--trait);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.95rem;line-height:1.5}
.ligne{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.ligne button{flex:0 1 auto}
ol.methode,ul.faits{margin:6px 0 0;padding-inline-start:20px;list-style:disc}
ol.methode li,ul.faits li{border-top:0;padding:3px 0}
.logo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo img{width:96px;height:96px;border-radius:12px;background:#000}
label.champ{display:grid;gap:4px;margin:8px 0;font-size:.9rem}
input[type=text],textarea{font:inherit;color:inherit;background:var(--alv);border:1px solid var(--trait);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:140px;resize:vertical}
details{margin:6px 0}
summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.erreur{color:var(--rouge);font-size:.88rem;margin:4px 0}
.med{white-space:normal}
.chiffres span{overflow-wrap:anywhere;hyphens:auto}
@media (max-width:400px){.chiffres{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main id="app">
<header><div class="hex" aria-hidden="true"><i></i></div><div><h1 id="titre">Espace presse et radio</h1><p class="sous" id="soustitre"></p></div></header>
<p id="etat" role="status" aria-live="polite"></p>
<div class="actions" id="actions"></div>
<div id="contenu"></div>
<footer id="pied"></footer>
</main>

function rendreEquipe(){
  var b = '<p class="d" style="margin:0">' + esc(T('Un communiqué est publié par un autre rédacteur que celui qui a écrit la version.')) + '</p>';
  b += '<div class="ligne"><button type="button" id="bNouveau">' + esc(T('Écrire un communiqué')) + '</button></div>';
  if(ST.form) b += formulaire(ST.form);
  if(ST.erreur) b += '<p class="erreur" role="alert">' + esc(ST.erreur) + '</p>';
  if(!ST.file) b += '<p class="vide">—</p>';
  else if(!ST.file.length) b += '<p class="vide">' + esc(T('Aucun communiqué en cours.')) + '</p>';
  else b += '<ul>' + ST.file.map(function(c){
    var src = c.textes[c.langue] || {}, et = {brouillon:'Brouillon', a_relire:'À relire'}[c.etat] || (c.etat === 'publie' ? 'Publié' : c.etat);
    if(ST.relire && ST.relire.id === c.id && ST.relire.version !== c.version) ST.relire = null;          /* une nouvelle version : à relire de nouveau */
    if(ST.confPub && ST.confPub.id === c.id && ST.confPub.version !== c.version) ST.confPub = null;
    var lu = !!(ST.relire && ST.relire.id === c.id), conf = !!(ST.confPub && ST.confPub.id === c.id), dis = ST.envoi ? ' disabled' : '';
    return '<li><div class="l1"><b>' + esc(src.titre || '—') + '</b><span class="puce">' + esc(T(et)) + ' · v' + c.version + '</span></div>' +
      (c.publie ? '<div class="d">' + esc(T('Version publiée : {0}', c.publie.version)) + '</div>' : '') +
      /* relire : chaque langue, en lecture seule (le second rédacteur lit avant de publier ; « Modifier » ferait de lui un auteur) */
      '<div class="ligne"><button type="button" data-act="relire" data-id="' + esc(c.id) + '" aria-expanded="' + lu + '">' + esc(lu ? T('Fermer') : T('Relire le texte')) + '</button></div>' +
      (lu ? Object.keys(c.textes).map(function(k){ var t = c.textes[k]; return '<div class="d">' + esc((LANGUES_UI[k] || {}).nom || k) + (k === c.langue ? ' · ' + T('Langue d’origine') : '') + '</div><div class="texte" lang="' + esc(k) + '" dir="' + (LANGUES_UI[k] && LANGUES_UI[k].rtl ? 'rtl' : 'ltr') + '">' + esc(t.titre + '\n\n' + t.texte) + '</div>'; }).join('') : '') +
      '<div class="ligne">' + (c.peutSoumettre ? '<button type="button" data-act="soumettre" data-id="' + esc(c.id) + '"' + dis + '>' + esc(T('Envoyer en relecture')) + '</button>' : '') +
      (c.peutPublier && lu && !conf ? '<button type="button" data-act="publier" data-id="' + esc(c.id) + '"' + dis + '>' + esc(T('Publier cette version')) + '</button>' : '') +
      (c.peutPublier && lu && conf ? '<button type="button" data-act="confirmerPublier" data-id="' + esc(c.id) + '" data-version="' + c.version + '"' + dis + '>' + esc(T('Je l’ai relue : publier la version {0}', c.version)) + '</button>' : '') +
      (c.peutPublier && !lu ? '<span class="d">' + esc(T('Relisez le texte pour pouvoir le publier.')) + '</span>' : '') +
      (c.etat === 'a_relire' && !c.peutPublier ? '<span class="d">' + esc(T('En attente d’un autre rédacteur.')) + '</span>' : '') +
      '<button type="button" data-act="modifier" data-id="' + esc(c.id) + '"' + dis + '>' + esc(T('Modifier')) + '</button>' +
      '<button type="button" data-act="retirer" data-id="' + esc(c.id) + '" aria-expanded="' + (ST.retrait === c.id) + '">' + esc(T('Retirer')) + '</button></div>' +
      (ST.retrait === c.id ? '<label class="champ">' + esc(T('Motif du retrait (au moins 10 caractères)')) + ' <input type="text" id="motifRetrait" maxlength="500" value="' + esc(ST.motif || '') + '"></label><div class="ligne"><button type="button" data-act="confirmerRetrait" data-id="' + esc(c.id) + '"' + dis + '>' + esc(T('Retirer ce communiqué')) + '</button></div>' : '') + '</li>'; }).join('') + '</ul>';
  return '<section aria-labelledby="hEquipe"><h2 id="hEquipe">' + esc(T('L’espace de l’équipe')) + '</h2>' + b + '</section>';
}
function formulaire(f){
  var h = '<form id="formCom" novalidate><label class="champ">' + esc(T('Langue d’origine')) + ' <select name="langue">' + Object.keys(LANGUES_UI).map(function(k){ return '<option value="' + k + '"' + (k === f.langue ? ' selected' : '') + '>' + esc(LANGUES_UI[k].nom) + '</option>'; }).join('') + '</select></label>';
  Object.keys(LANGUES_UI).forEach(function(k){
    var t = f.textes[k] || {titre:'', texte:''}, champs = '<label class="champ">' + esc(T('Titre')) + ' <input type="text" name="titre_' + k + '" maxlength="140" lang="' + k + '" value="' + esc(t.titre) + '"></label>' +
      '<label class="champ">' + esc(T('Texte')) + ' <textarea name="texte_' + k + '" maxlength="6000" lang="' + k + '">' + esc(t.texte) + '</textarea></label>';
    h += k === f.langue ? champs : '<details data-lg="' + k + '"' + (t.titre || t.texte || ST.ouverts[k] ? ' open' : '') + '><summary>' + esc(T('Traduction : {0}', LANGUES_UI[k].nom)) + '</summary>' + champs + '</details>';
  });
  return h + '<div class="ligne"><button type="submit"' + (ST.envoi ? ' disabled' : '') + '>' + esc(T('Enregistrer')) + '</button><button type="button" id="bAnnuler">' + esc(T('Annuler')) + '</button></div></form>';
}
function lireFormulaire(){
  var fm = $('formCom'); if(!fm) return null;
  var langue = fm.elements.langue.value, textes = {};
  Object.keys(LANGUES_UI).forEach(function(k){ var ti = fm.elements['titre_' + k].value.trim(), tx = fm.elements['texte_' + k].value.trim(); if(ti || tx || k === langue) textes[k] = {titre:ti, texte:tx}; });
  return {langue:langue, textes:textes};
}
function rendrePied(){
  var h = '<label>' + esc(T('Langue')) + ' <select id="langue">' + Object.keys(LANGUES_UI).map(function(k){ return '<option value="' + k + '"' + (k === L ? ' selected' : '') + '>' + esc(LANGUES_UI[k].nom) + '</option>'; }).join('') + '</select></label>';
  if(LANGUES_UI[L].relire) h += '<span>' + esc(T('Traduction en cours de relecture.')) + '</span>';
  h += '<span>' + esc(T('Les chiffres de cette page sont ceux du résumé public du jour : aucun nom de personne, aucune estimation.')) + '</span>';
  $('pied').innerHTML = h;
}
function selecteur(el){
  if(!el || el === document.body) return null;
  if(el.id) return '#' + el.id;
  var a = ['data-act', 'data-com', 'data-copier', 'data-copier-com', 'data-tel-com'].filter(function(x){ return el.hasAttribute(x); })[0];
  if(a) return '[' + a + '="' + el.getAttribute(a) + '"]' + (el.getAttribute('data-id') ? '[data-id="' + el.getAttribute('data-id') + '"]' : '');
  if(el.name && el.form && el.form.id) return '#' + el.form.id + ' [name="' + el.name + '"]';
  return null;
}
function rendre(){
  var ae = document.activeElement, sel = selecteur(ae), pos = ae && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null;
  document.title = T('Espace presse et radio') + ' · NEURAVID';
  $('titre').textContent = T('Espace presse et radio');
  $('soustitre').textContent = T('Les chiffres réels de la Saison des Nations, et des textes prêts à lire à l’antenne, en 11 langues.');
  rendreEtat(); rendreActions(); rendreContenu(); rendrePied();
  var n = null; try{ n = sel && document.querySelector(sel); }catch(e){ n = null; }
  if(n && !n.disabled){ try{ n.focus(); if(pos && typeof n.setSelectionRange === 'function') n.setSelectionRange(pos[0], pos[1]); }catch(e){} }
  else if(sel && /bMaj/.test(sel)){ var t = $('etat'); if(t){ t.tabIndex = -1; try{ t.focus(); }catch(e){} } }   /* le bouton désactivé : on garde la place près de l'état */
}

/* ── les communiqués : lire, copier, télécharger ── */
function ouvrirCommunique(id){
  if(ST.ouvert === id){ ST.ouvert = null; rendre(); return; }
  ST.ouvert = id; rendre();
  if(ST.textes[id] && (ST.textes[id].demande === L || (navigator.onLine === false && ST.textes[id].titre))) return;
  if(ST.apercu){ ST.textes[id] = demoCommunique(id); rendre(); return; }
  if(!api()) return;
  appeler('/v1/arene/presse/communiques/' + encodeURIComponent(id) + '?langue=' + L).then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); }).then(function(j){
    var c = j && j.communique; if(!c || typeof c.texte !== 'string' || typeof c.titre !== 'string') throw new Error('forme');
    ST.textes[id] = {titre:c.titre, texte:c.texte, langue:LANGUES_UI[c.langue] ? c.langue : 'fr', demande:L}; garderTextes(); rendre();
  }).catch(function(){
    var g = lire(CLE, null), t = g && g.textes && g.textes[id];
    if(t && typeof t.titre === 'string' && typeof t.texte === 'string'){ ST.textes[id] = {titre:t.titre, texte:t.texte, langue:LANGUES_UI[t.langue] ? t.langue : 'fr', demande:t.demande}; rendre(); return; }
    toast(T('Impossible de joindre NEURAVID pour le moment.')); ST.ouvert = null; rendre(); });
}
function garderTextes(){ if(ST.apercu) return; var g = lire(CLE, null); if(g && g.p){ var t = {}; Object.keys(ST.textes).slice(-20).forEach(function(k){ t[k] = ST.textes[k]; }); g.textes = t; ecrire(CLE, g); } }   /* lus une fois, relisibles sans connexion */
function texteCommunique(id){ var t = ST.textes[id]; return t ? (ST.apercu ? T('Aperçu : un exemple, pour découvrir l’espace presse.') + '\n\n' : '') + t.titre + '\n\n' + t.texte + (ST.apercu ? '' : '\n\n' + T('Source : NEURAVID.')) : ''; }

/* ── l'équipe : écrire, envoyer en relecture, publier (un autre rédacteur), retirer ── */
function cle(act, id, v){ var k = act + ':' + (id || 'nouveau') + ':' + (v || 0); if(!ST.cles[k]) ST.cles[k] = 'pr-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); return ST.cles[k]; }
var ERREURS = {quatre_yeux:'Un autre rédacteur doit publier cette version.', pas_soumis:'Cette version n’a pas encore été envoyée en relecture.', version_changee:'Le texte a changé : relisez la nouvelle version.',
  invalide:'Vérifiez le titre (5 à 140 caractères) et le texte (80 à 6000 caractères).', interdit:'Réservé aux rédacteurs de l’équipe.', etat:'Ce communiqué a changé entre-temps : la liste est relue.',
  deja_fait:'C’est déjà fait.', non_connecte:'Reconnectez-vous pour continuer.', trop_de_demandes:'Trop de demandes : réessayez dans une minute.', introuvable:'Ce communiqué n’existe plus.'};
function messageErreur(e){
  if(!e || !e.repondu) return T('Impossible de joindre NEURAVID pour le moment.');
  var ch = String(e.champ || '');
  if(e.erreur === 'invalide' && ch === 'motif') return T('Écrivez un motif d’au moins 10 caractères.');
  var m = /^textes\.([a-z]{2})/.exec(ch); if(e.erreur === 'invalide' && m && LANGUES_UI[m[1]]) return T('Vérifiez le titre (5 à 140 caractères) et le texte (80 à 6000 caractères) en {0}.', LANGUES_UI[m[1]].nom);
  if(e.erreur === 'cle_reutilisee') return T('Ce communiqué est déjà enregistré : retrouvez-le dans la liste.');
  return ERREURS[e.erreur] ? T(ERREURS[e.erreur]) : T('La demande a été refusée.');
}
function envoyer(chemin, corps, k, apres, fait){
  if(ST.envoi) return;                                 /* un double toucher n'envoie jamais deux fois */
  ST.erreur = null; ST.envoi = true; rendre();
  return appeler(chemin, {jeton:true, corps:corps, cle:k}).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok){ j = j || {}; j.repondu = true; throw j; } return j; }); })
    .then(function(){ ST.envoi = false; ST.form = null; ST.confPub = null; if(apres) apres(); toast(fait || T('Enregistré.'));
      return chargerFile().then(function(){ return actualiserApres(); }).then(function(){ var hq = $('hEquipe'); if(hq){ hq.tabIndex = -1; try{ hq.focus(); }catch(x){} } }); })
    .catch(function(e){
      var nouveau = ST.form && !ST.form.id;
      ST.envoi = false; ST.confPub = null; ST.erreur = messageErreur(e);
      if(e && e.erreur === 'cle_reutilisee' && nouveau) ST.form = null;
      /* la liste relue ; un formulaire en conflit reprend la version actuelle et garde les saisies */
      return chargerFile().then(function(){
        if(ST.form && ST.form.id){ var c = (ST.file || []).filter(function(x){ return x.id === ST.form.id; })[0]; if(c) ST.form.version = c.version; }
        else if(ST.form && (!e || !e.repondu)){   /* une création partie mais restée sans réponse : déjà enregistrée ? on la reprend en « modifier » */
          var src = (ST.form.textes || {})[ST.form.langue] || {}, deja = (ST.file || []).filter(function(x){ return x.ecritParMoi && x.version === 1 && (x.textes[x.langue] || {}).titre === src.titre; })[0];
          if(deja){ ST.form.id = deja.id; ST.form.version = deja.version; ST.erreur = T('Ce communiqué est déjà enregistré : retrouvez-le dans la liste.'); }
        }
        rendre(); });
    });
}
function actualiserApres(){ ST.enCours = false; ST.dernier = 0; try{ localStorage.removeItem(CLE_CAP); }catch(e){} actualiser(false); }
function action(act, id){
  var c = (ST.file || []).filter(function(x){ return x.id === id; })[0]; if(!c) return;
  if(act === 'relire'){ ST.relire = ST.relire && ST.relire.id === id ? null : {id:id, version:c.version}; ST.confPub = null; rendre(); return; }
  if(act === 'publier'){ if(!ST.relire || ST.relire.id !== id || ST.relire.version !== c.version) return; ST.confPub = {id:id, version:c.version}; rendre(); var b = document.querySelector('[data-act="confirmerPublier"][data-id="' + id + '"]'); if(b) b.focus(); return; }   /* deux touchers */
  if(act === 'confirmerPublier'){ if(!ST.confPub || ST.confPub.id !== id || ST.confPub.version !== c.version){ ST.confPub = null; rendre(); return; }
    envoyer('/v1/arene/presse/communiques/' + id + '/publier', {version:c.version}, cle('publier', id, c.version), function(){ ST.relire = null; }, T('Publié.')); return; }
  if(act === 'modifier'){ ST.form = {id:id, version:c.version, langue:c.langue, textes:JSON.parse(JSON.stringify(c.textes)), cle:null}; rendre(); return; }
  if(act === 'retirer'){ ST.retrait = ST.retrait === id ? null : id; ST.motif = ''; ST.erreur = null; rendre(); var m = $('motifRetrait'); if(m) m.focus(); return; }
  if(act === 'confirmerRetrait'){ var mo = ($('motifRetrait') || {}).value || ''; ST.motif = mo; if(mo.trim().length < 10){ ST.erreur = T('Écrivez un motif d’au moins 10 caractères.'); rendre(); return; }
    envoyer('/v1/arene/presse/communiques/' + id + '/retirer', {motif:mo.trim()}, cle('retirer', id, c.version), function(){ ST.retrait = null; ST.motif = ''; }, T('Retiré.')); return; }   /* le motif reste si l'envoi échoue */
  envoyer('/v1/arene/presse/communiques/' + id + '/' + act, {version:c.version}, cle(act, id, c.version), null, act === 'soumettre' ? T('Envoyé en relecture.') : T('Enregistré.'));
}

/* ── l'aperçu (démonstration seulement) ── */
function demoPresse(){
  var now = Math.floor(Date.now() / 1000), J = 86400;
  return {resume:{v:1, jour:'', genere:now - 1200, saison:{id:'s2027', ouverture:now - 40 * J, cloture:now - 12 * J, phase:'competition'},
      chiffres:{inscrits:4826, nations:41, eveil:23, pretes:18, seuil:5}, eveils:[],
      prochains:[{id:'ep_a1', type:'vote_fin', at:now + 2 * J, annule:false, discipline:'danse'}, {id:'ce_c3', type:'ceremonie', at:now + 9 * J, annule:false}, {id:'nu_d4', type:'nuit', at:now + 30 * J, annule:false, ville:'Dakar'}],
      resultats:[{id:'ep_e5', discipline:'chant', categorie:'generale', definitif:false, corrige:false, valideA:now - 8 * 3600, podium:{or:['SN'], argent:['GH'], bronze:['GN']}},
        {id:'ep_f6', discipline:'gastronomie', categorie:'espoirs', definitif:true, corrige:false, valideA:now - 2 * J, podium:{or:['CI'], argent:['ML'], bronze:['BF']}}],
      nuit:{id:'nu_d4', etat:'programmee', debut:now + 30 * J, ville:{nom:'Dakar', pays:'SN'}}, ceremonie:{id:'ce_c3', etat:'programmee', debut:now + 9 * J}},
    faits:{disciplines:Object.keys(DISC), partPublic:50, partJury:50, pasPourSaNation:true, cadeauxComptent:false, inscriptionGratuite:true, seuilPublic:5,
      ages:{espoirs_video:[13, 15], espoirs:[16, 17], adulte:18}, auditAvantProclamation:true, ceremonieGratuite:true},
    communiques:[{id:'pc_apercu0000000001', titre:'La Saison des Nations ouvre ses portes', langue:'fr', langues:['fr'], version:1, publieA:now - 3 * J, misAJourA:null}], contact:null};
}
function demoCommunique(){ return {titre:'La Saison des Nations ouvre ses portes', texte:'Ceci est un exemple de communiqué, pour découvrir l’espace presse. Les vrais communiqués sont écrits par l’équipe de NEURAVID et publiés après la relecture d’un second rédacteur.', langue:'fr', demande:L}; }

/* ── le logo (le même œil dans l'hexagone que le lever de rideau) ── */
function telechargerLogo(){
  try{ var img = $('logoImg'), d = img.getAttribute('src'), m = /^data:([^;]+);base64,(.*)$/.exec(d), bin = atob(m[2]), u8 = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var b = new Blob([u8], {type:m[1]}), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = 'NEURAVID_logo.jpg'; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 4000); toast(T('Fichier prêt.')); }
  catch(e){ toast(T('Impossible d’enregistrer sur ce téléphone.')); }
}

/* ── le démarrage ── */
function demarrer(){
  poserLangue(langueDetectee());
  ST.apercu = !!window.NV_DEMO && !api(); posercles();
  if(ST.apercu) ST.p = demoPresse();
  else { var g = lire(CLE, null); if(g && valide(g.p)){ ST.p = g.p; ST.recu = nombre(g.recu) || 0; if(g.textes && typeof g.textes === 'object') Object.keys(g.textes).forEach(function(k){ var t = g.textes[k]; if(t && typeof t.titre === 'string' && typeof t.texte === 'string') ST.textes[k] = {titre:t.titre, texte:t.texte, langue:LANGUES_UI[t.langue] ? t.langue : 'fr', demande:t.demande}; }); } }
  rendre();
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if(!b) return;
    var id = b.id;
    if(id === 'bMaj') actualiser(true);
    else if(id === 'bSaison') ouvrir('Saison', {depuis:'presse'});
    else if(id === 'bFicheTxt') telecharger(ficheTexte(ST.p, ST.radio || L), 'NEURAVID_fiche_radio_' + (ST.radio || L) + '.txt');
    else if(id === 'bLogo') telechargerLogo();
    else if(id === 'bNouveau'){ ST.form = {id:null, version:null, langue:L, textes:{}, cle:'pr-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10)}; ST.erreur = null; rendre(); var t = document.querySelector('#formCom input'); if(t) t.focus(); }
    else if(id === 'bAnnuler'){ ST.form = null; ST.erreur = null; rendre(); }
    else if(b.getAttribute('data-copier') === 'chiffres') copier(chiffresTexte(ST.p));
    else if(b.getAttribute('data-copier') === 'fiche') copier(ficheTexte(ST.p, ST.radio || L));
    else if(b.getAttribute('data-com')) ouvrirCommunique(b.getAttribute('data-com'));
    else if(b.getAttribute('data-copier-com')) copier(texteCommunique(b.getAttribute('data-copier-com')));
    else if(b.getAttribute('data-tel-com')) telecharger(texteCommunique(b.getAttribute('data-tel-com')), 'NEURAVID_communique.txt');
    else if(b.getAttribute('data-act')) action(b.getAttribute('data-act'), b.getAttribute('data-id'));
  });
  document.addEventListener('submit', function(ev){
    if(!ev.target || ev.target.id !== 'formCom') return; ev.preventDefault();
    var d = lireFormulaire(); if(!d || !ST.form) return;
    var f = ST.form; f.langue = d.langue; f.textes = d.textes;
    if(f.id) envoyer('/v1/arene/presse/communiques/' + f.id + '/modifier', {version:f.version, langue:d.langue, textes:d.textes}, cle('modifier', f.id, f.version));   /* la clé suit la version : un conflit repart d'une clé neuve */
    else envoyer('/v1/arene/presse/communiques', d, f.cle);
  });
  document.addEventListener('input', function(ev){ if(ev.target && ev.target.id === 'motifRetrait') ST.motif = ev.target.value; });
  document.addEventListener('toggle', function(ev){ var d = ev.target; if(d && d.tagName === 'DETAILS' && d.getAttribute('data-lg')){ ST.ouverts[d.getAttribute('data-lg')] = d.open; } }, true);
  document.addEventListener('input', function(ev){ if(ST.form && ev.target && ev.target.form && ev.target.form.id === 'formCom'){ var d = lireFormulaire(); if(d){ ST.form.langue = d.langue; ST.form.textes = d.textes; } } });
  document.addEventListener('change', function(ev){
    var t = ev.target; if(!t) return;
    if(t.id === 'langue'){ var l = t.value; if(!LANGUES_UI[l]) return; ecrire('nv_ui_langue', l); poserLangue(l); ST.textes = {}; ST.ouvert = null; rendre(); if(!ST.apercu && api()){ ST.dernier = 0; actualiser(false); } }
    else if(t.id === 'langueRadio'){ if(LANGUES_UI[t.value]){ ST.radio = t.value; rendre(); } }
    else if(t.form && t.form.id === 'formCom' && t.name === 'langue'){ var d = lireFormulaire(); if(d && ST.form){ ST.form.langue = d.langue; ST.form.textes = d.textes; rendre(); } }
  });
  window.addEventListener('online', function(){ actualiser(false); });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible' && Date.now() - ST.dernier > RELIRE_APRES) actualiser(false); });
  try{ if('serviceWorker' in navigator && location.protocol === 'https:' && !ST.apercu) navigator.serviceWorker.register(typeof window.NV_SW_URL === 'string' && window.NV_SW_URL ? window.NV_SW_URL : 'sw-tamtam.js').catch(function(){}); }catch(e){}
  if(!ST.apercu && api()) actualiser(false);
  window.NVPresse = {etat:function(){ return {etat:ST.etat, apercu:ST.apercu, langue:L, radio:ST.radio || L}; }, fiche:function(l){ return ST.p ? ficheTexte(ST.p, l || L) : null; }};
}

demarrer();
})();

</script>
