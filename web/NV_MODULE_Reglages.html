:root{
  --encre:#F7F3FF; --brume:#CFC8EA; --gris:#A49CC4; --or:#FFC93D; --teal:#2EE6C5; --violet:#7B3BFF; --rose:#FF3D9A; --rouge:#FF2D55;
  --nv:linear-gradient(110deg,#2EE6C5 0%,#7B3BFF 52%,#FF3D9A 100%);
  --verre:rgba(18,11,42,.56); --verre2:rgba(255,255,255,.08); --fil:rgba(255,255,255,.14);
  --hx:polygon(50% 0,93.3% 25%,93.3% 75%,50% 100%,6.7% 75%,6.7% 25%);
  --haut:env(safe-area-inset-top,0px); --basS:env(safe-area-inset-bottom,0px);
  --police:"Inter NV",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --ciel-haut:#050310; --ciel-mi:#0A0618; --ciel-bas:#170D33;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:#0A0620}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;min-height:100%;font:15px/1.45 var(--police);color:var(--encre);background:#0A0620;overflow-x:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--or);outline-offset:3px;border-radius:10px}
[lang=nqo] body,.nko{font-family:"NKo",var(--police)}
.hx-btn{position:relative;flex:none;width:42px;height:46px;display:grid;place-items:center;clip-path:var(--hx);background:rgba(255,255,255,.10)}
.hx-btn::before{content:"";position:absolute;inset:1.5px;clip-path:var(--hx);background:rgba(10,6,28,.55)}
.hx-btn svg{position:relative;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hx-btn.petit{width:36px;height:40px}
.hx-btn.petit svg{width:17px;height:17px}
@keyframes tourneSurf{to{transform:translateX(-76px)}}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 14px;border-radius:14px;background:var(--nv);color:#fff;font-weight:800;font-size:14.5px;text-align:center}
.btn.leger{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px var(--fil)}
.bas{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;padding:0 6px calc(6px + var(--basS));height:calc(78px + var(--basS));background:linear-gradient(180deg,rgba(9,6,26,0),rgba(9,6,26,.82) 38%,rgba(9,6,26,.95));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bas::before{content:"";position:absolute;left:0;right:0;top:22px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18) 20%,rgba(255,255,255,.18) 80%,transparent)}
.nb{position:relative;flex:1;max-width:96px;display:grid;justify-items:center;gap:2px;padding-bottom:2px;font-size:11px;font-weight:700;color:var(--gris);transition:color .3s}
.nb .ic{width:46px;height:44px;display:grid;place-items:center;position:relative}
.nb .ic svg{width:34px;height:34px;overflow:visible}
.nb.on{color:var(--encre)}
.nb.on::after{content:"";position:absolute;bottom:-3px;width:16px;height:4px;border-radius:2px;background:var(--nv)}
.nb>span:last-child{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb.centre{max-width:104px}
.nb.centre .ic{width:76px;height:82px;margin-top:-34px}
.nb.centre .ic svg{width:76px;height:82px}
.nb.centre span{color:var(--encre)}
.nb:active .ic{transform:scale(.92)}
.nb .ic{transition:transform .15s}
.voile{position:fixed;inset:0;z-index:40;background:rgba(4,2,14,.6);opacity:0;transition:opacity .25s}
.voile.on{opacity:1}
.feuille{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:88svh;overflow:auto;padding:16px 16px calc(20px + var(--basS));border-radius:24px 24px 0 0;background:#140C33;box-shadow:0 -20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto}
.feuille.on{transform:none}
.feuille .tete{position:static;padding:0 0 10px;display:flex;align-items:center;justify-content:space-between;background:none}
.feuille h2{margin:0;font-size:19px}
.feuille h3{margin:16px 0 8px;font-size:13px;color:var(--brume);font-weight:750}
.grille-mod{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.grille-mod button{display:grid;justify-items:center;gap:5px;padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.05);font-size:12px;font-weight:650;text-align:center;line-height:1.2}
.grille-mod button{background:radial-gradient(90% 70% at 50% 18%,color-mix(in srgb,var(--c) 22%,transparent),transparent 72%),rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .18s,box-shadow .18s}
.grille-mod button:active{transform:scale(.96)}
.grille-mod button:hover,.grille-mod button:focus-visible{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent)}
.gemme{width:50px;height:59px;display:block;overflow:visible;transition:transform .25s cubic-bezier(.2,.9,.3,1.3)}
.grille-mod button:hover .gemme,.grille-mod button:focus-visible .gemme{transform:translateY(-3px) rotate(-4deg)}
.feuille.on .grille-mod .gemme{animation:gemVient .5s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--k,0) * 45ms + 120ms)}
@keyframes gemVient{from{opacity:0;transform:translateY(10px) scale(.6) rotate(-20deg)}}
.interrupteur{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 0;text-align:start}
.interrupteur i{flex:none;width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.interrupteur i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.interrupteur[aria-checked=true] i{background:var(--teal)}
.interrupteur[aria-checked=true] i::after{transform:translateX(18px)}
[dir=rtl] .interrupteur[aria-checked=true] i::after{transform:translateX(-18px)}
#toast{position:fixed;z-index:60;left:50%;bottom:calc(100px + var(--basS));transform:translate(-50%,20px);max-width:calc(100% - 32px);padding:11px 16px;border-radius:14px;background:#FFFFFF;color:#140C33;font-weight:650;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes tourne{to{transform:rotate(360deg)}}
.nb .facettes{animation-duration:10s}
.nb .ondes .o1,.nb .ondes .o2{animation:onde 2.2s ease-out infinite}
.nb .ondes .o2{animation-delay:.35s}
@keyframes onde{0%{opacity:.25}40%{opacity:1}100%{opacity:.25}}
.nb.on .rempli{opacity:.35;transition:opacity .3s}
.nb .feuilles path{transform-box:fill-box;transform-origin:center bottom;animation:feuille 3.6s ease-in-out infinite}
.nb .feuilles path:nth-child(2n){animation-delay:-1.2s}
@keyframes feuille{50%{transform:rotate(4deg) translateY(-.5px)}}
.nb.centre .ic{filter:drop-shadow(0 6px 18px rgba(123,59,255,.55))}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puces button{min-height:38px;padding:0 13px;border-radius:19px;background:rgba(255,255,255,.07);font-size:13.5px}
.puces button.on{background:var(--nv);color:#fff}
.petit{font-size:12.5px;color:var(--brume)}
.tete{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--haut)) 14px 8px;transition:background .4s,box-shadow .4s,backdrop-filter .4s}
.tete-fin{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
/* ════ RÉGLAGES ET CONFIDENTIALITÉ ════
   Calme et clair : une encre d'ardoise, des lignes nettes, une couleur par groupe portée par son hexagone. Les protections se voient (un cadenas). */
:root{--fond:#0D1222;--carte:#141B31;--carte2:#1A2340;--texte:#EEF2FA;--doux:#A7B1C8;--ok:#3DDC97;--att:#FFB547;--danger:#FF5C6C;--fil:rgba(255,255,255,.10)}
body{background:radial-gradient(100% 45% at 50% -10%,#1C2850 0%,transparent 60%),var(--fond);color:var(--texte)}
.tete{background:rgba(13,18,34,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--fil)}
.titre{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.titre .gemme{width:30px;height:35px;flex:none}
.titre>span{min-width:0}
.manque{color:var(--att)!important;font-weight:650}
.titre b{display:block;font-size:17px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:calc(70px + var(--haut)) 14px calc(116px + var(--basS));max-width:680px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
#corps{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.demo-bandeau{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;padding:8px 12px;border-radius:14px;background:rgba(255,201,61,.13);box-shadow:inset 0 0 0 1px rgba(255,201,61,.35);font-size:12.5px;text-align:center}
.demo-bandeau[hidden]{display:none}.demo-bandeau b{color:#FFC93D}.demo-bandeau button{min-height:32px;padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.12);font-weight:750;font-size:12px}
.cherche{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:48px;border-radius:16px;background:var(--carte);box-shadow:inset 0 0 0 1px var(--fil)}
.cherche svg{width:20px;height:20px;fill:none;stroke:var(--doux);stroke-width:2;stroke-linecap:round}
.cherche input{flex:1;min-width:0;height:46px;border:0;background:none;color:var(--texte);font:inherit;font-size:15.5px;outline:none}
.cherche:focus-within{box-shadow:inset 0 0 0 2px #8FA3C8}
.etat{padding:14px;border-radius:18px;background:linear-gradient(160deg,var(--carte2),var(--carte));box-shadow:inset 0 0 0 1px var(--fil)}
.etat h2{margin:0 0 8px;font-size:16px;font-weight:850}
.etat ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.etat li{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px}
.etat li span{flex:1;min-width:0}
.etat li i{flex:none;width:24px;height:27px;display:grid;place-items:center;clip-path:var(--hx);font-style:normal;font-weight:900;font-size:13px;color:#0D1222}
.etat .ok i{background:var(--ok)}.etat .attention i{background:var(--att)}.etat .info i{background:#8FA3C8}
.groupes{display:grid;gap:6px}

/* ════════ La base des réglages (IndexedDB) : ce que le serveur a dit en dernier (hors réseau) ════════ */
var IDB = {db:null, attente:null};
function idb(){
  if(IDB.db) return Promise.resolve(IDB.db);
  if(IDB.attente) return IDB.attente;
  IDB.attente = new Promise(function(ok, ko){
    try{
      var r = indexedDB.open('nv_reglages', 1);
      r.onupgradeneeded = function(){ var d = r.result; ['cache', 'divers'].forEach(function(n){ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
      r.onsuccess = function(){ IDB.db = r.result; IDB.db.onversionchange = function(){ try{ IDB.db.close(); }catch(e){ dbg(e); } IDB.db = null; IDB.attente = null; }; ok(IDB.db); };
      r.onerror = function(){ ko(r.error); };
      setTimeout(function(){ ko(new Error('idb lente')); }, 5000);
    }catch(e){ ko(e); }
  });
  IDB.attente.catch(function(){ IDB.attente = null; });
  return IDB.attente;
}
function idbOp(store, mode, fn){ return idb().then(function(d){ return new Promise(function(ok, ko){ var t = d.transaction(store, mode), s = t.objectStore(store), r = fn(s); t.oncomplete = function(){ ok(r && r.result); }; t.onerror = function(){ ko(t.error); }; t.onabort = function(){ ko(t.error); }; }); }); }
function idbLire(store, k){ return idbOp(store, 'readonly', function(s){ return s.get(k); }).catch(function(e){ dbg(e); return null; }); }
function idbEcrire(store, k, v){ return idbOp(store, 'readwrite', function(s){ return s.put(v, k); }).then(function(){ return true; }).catch(function(e){ dbg(e); return false; }); }
function idbEffacer(store, k){ return idbOp(store, 'readwrite', function(s){ return s.delete(k); }).catch(function(e){ dbg(e); }); }
/* « strict » : une lecture incomplète échoue au lieu de rendre une liste partielle (le ménage s'en sert pour ne rien effacer à tort) */
function idbTout(store, strict){ var p = idb().then(function(d){ return new Promise(function(ok, ko){ var t = d.transaction(store, 'readonly'), s = t.objectStore(store), out = [], c = s.openCursor(); c.onsuccess = function(){ var x = c.result; if(x){ out.push({k:x.key, v:x.value}); x.continue(); } else ok(out); }; c.onerror = function(){ if(strict) ko(c.error || new Error('idb')); else ok(out); }; t.onabort = function(){ if(strict) ko(t.error || new Error('idb')); }; }); }); return strict ? p : p.catch(function(e){ dbg(e); return []; }); }

/* télécharger : dans l'application, une WebView ne sait pas enregistrer un « blob: » ; l'application fournit
   window.NVTelecharger(blob, nom) (ou le gestionnaire Flutter « nvTelecharger »), sinon le navigateur s'en charge */
function telecharger(blob, nom){
  emit('download', {nom:nom, taille:blob.size, type:blob.type});
  try{ if(typeof window.NVTelecharger === 'function'){ window.NVTelecharger(blob, nom); return; } }catch(e){ dbg(e); }
  if(window.flutter_inappwebview && window.flutter_inappwebview.callHandler){
    /* par morceaux de 4 Mo : {nom, type, partie, total, base64} — l'application assemble les parties dans l'ordre */
    var T = 4194304, total = Math.max(1, Math.ceil(blob.size / T)), k = 0, cle = nid('dl');
    var suite = function(){ if(k >= total) return; var fr = new FileReader(); fr.onload = function(){ try{ Promise.resolve(window.flutter_inappwebview.callHandler('nvTelecharger', {id:cle, nom:nom, type:blob.type, partie:k, total:total, base64:String(fr.result).split(',')[1] || ''})).then(function(){ k++; suite(); }, function(e){ dbg(e); }); }catch(e){ dbg(e); } }; fr.readAsDataURL(blob.slice(k * T, (k + 1) * T)); };
    suite(); return;
  }

<!--NV_VERS_IRIS--><script id="nv-vers-iris" data-module="Reglages">
/* NEURAVID — VERS IRIS : toute vidéo d'un module peut s'ouvrir dans Iris, le lecteur principal.
   Injecté dans chaque module (outils/injecter_vers_iris.py). Le module garde son propre lecteur (NVLecteur, avec ses
   votes, cadeaux et calques) ; ce pont ajoute seulement le passage vers Iris :
   1. window.NVIris.ouvrir(clip, {liste, index}) : ouvre une vidéo (ou une série) dans Iris.
      clip = identifiant, ou objet {id, src | sources | hls | whep, type:'video'|'replay'|'direct', directId, title, author, module, thumbnail, ageMin}.
   2. Dans le lecteur plein écran des modules (NVLecteur), le menu « ⋯ » de chaque vidéo gagne « Ouvrir dans Iris ».
   3. Une vidéo qui joue ailleurs dans le module (hors NVLecteur) reçoit un bouton hexagonal « Ouvrir dans Iris »
      si son adresse est lisible ailleurs (http(s), ou data-nv-hls / data-nv-whep posés par le module).
   Un blob:, une caméra ou un flux local ne peuvent pas changer de page : pas de passage. Iris applique les âges. */
(function(){
  if(window.NVIris) return;

    yo:'Ṣí i nínú Iris', wo:'Ubbi ko ci Iris', bm:'A da Iris kɔnɔ', ln:'Fungola na Iris'};
  var SOUS = {fr:'Le lecteur principal', en:'The main player', es:'El reproductor principal', pt:'O player principal', ar:'المشغّل الرئيسي', sw:'Kicheza video kikuu', ha:'Babban mai kunna bidiyo',
    yo:'Ẹ̀rọ ìwòran àkọ́kọ́', wo:'Lecteur bu mag bi', bm:'Videwo lajɛlan kunba', ln:'Lecteur ya liboso'};
  function lg(){ var l = String(document.documentElement.lang || 'fr').slice(0, 2); return TXT[l] ? l : 'fr'; }
  function sur(u){ u = typeof u === 'string' ? u.trim() : ''; return /^https?:\/\//.test(u) ? u : ''; }
  function ouvrir(clip, o){
    o = o || {};
    var ctx = {clip:clip, depuis:MOI || null};
    if(Array.isArray(o.liste)){ ctx.liste = o.liste.slice(0, 100); ctx.index = +o.index || 0; }
    try{ document.querySelectorAll('video').forEach(function(v){ try{ v.pause(); }catch(e){} }); }catch(e){}
    try{ if(window.NVLecteur && NVLecteur.ouvert && NVLecteur.ouvert()) NVLecteur.fermer(); }catch(e){}

    try{ sessionStorage.setItem('nv_ctx_Player', JSON.stringify(ctx)); }catch(e){ return false; }

    location.href = base + 'NV_MODULE_Iris.html';

  /* une vidéo du lecteur des modules (NVLecteur) → une vidéo pour Iris, avec seulement ce que le module a donné */

      if(/^live:/.test(brut)) d.directId = brut.replace(/^live:/, '');

    var id = v.getAttribute('data-nv-id') || (porteur && (porteur.getAttribute('data-nv-id') || porteur.getAttribute('data-clip') || porteur.getAttribute('data-id') || porteur.getAttribute('data-video'))) || src || hls || whep;
    var d = {id:String(id).slice(0, 200), module:MOI || null};
    if(src) d.src = src;
    if(hls) d.hls = hls;
    if(whep){ d.whep = whep; d.type = 'direct'; }
    var ty = v.getAttribute('data-nv-type'); if(ty === 'direct' || ty === 'replay') d.type = ty;

    return d;
  }
  var bouton = null, cible = null, raf = 0;

    bouton = document.createElement('button');
    bouton.type = 'button'; bouton.id = 'nvVersIris'; bouton.setAttribute('data-brut', '');
    bouton.style.cssText = 'position:fixed;z-index:2147483000;width:44px;height:44px;display:none;place-items:center;border:0;padding:0;cursor:pointer;' +
      'background:linear-gradient(140deg,rgba(108,43,217,.92),rgba(224,36,154,.92));clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)';
    bouton.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    bouton.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); var d = cible && decrire(cible); if(d) ouvrir(d); });
    document.body.appendChild(bouton);

    var rtl = document.documentElement.dir === 'rtl';

})();

</script><!--/NV_VERS_IRIS-->
