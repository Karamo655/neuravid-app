<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140b33">
<title>Talent du Jour · NEURAVID</title>
<style>
/* Talent du Jour : un défi par jour, ouvert au monde entier (17 novembre 2026).
   Aucune ressource extérieure : les vidéos viennent des serveurs (univers et publication). */
:root{
  --nuit:#140b33; --nuit2:#1c1147; --alv:#241657; --craie:#f6f1ff; --brume:rgba(236,228,255,.74); --trait:rgba(255,255,255,.16);
  --or:#ffc531; --argent:#d7dbe6; --bronze:#e0995a; --cyan:#16e0d4; --rose:#ff4f9e; --rouge:#ff7a7a;
  --hex:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--nuit);color:var(--craie);font:16px/1.45 var(--sans);min-height:100vh}
main{max-width:768px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.hex{width:34px;height:30px;flex:0 0 auto;clip-path:var(--hex);background:linear-gradient(135deg,var(--cyan),#6c2bd9);display:grid;place-items:center}
.hex i{width:14px;height:14px;border-radius:50%;background:var(--nuit);box-shadow:inset 0 0 0 4px var(--craie)}
h1{font-size:1.2rem;margin:0;line-height:1.2}
h2{font-size:1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:12px;height:11px;clip-path:var(--hex);background:var(--cyan);flex:0 0 auto}
.sous{margin:0;color:var(--brume);font-size:.88rem}
.apercu{display:inline-block;margin-inline-start:6px;padding:1px 8px;border-radius:999px;background:var(--or);color:#2a1a00;font-size:.75rem;font-weight:800;vertical-align:middle}
#etat{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:var(--nuit2);border:1px solid var(--trait);font-size:.9rem}
#etat.hl{border-color:var(--or)}
#etat.ok{border-color:rgba(22,224,212,.5)}
section{background:var(--nuit2);border:1px solid var(--trait);border-radius:14px;padding:12px 14px;margin:0 0 12px}
ul{list-style:none;margin:0;padding:0}
li{padding:7px 0;border-top:1px solid var(--trait)}
li:first-child{border-top:0}
.l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.d{color:var(--brume);font-size:.86rem}
.puce{display:inline-block;padding:0 7px;border-radius:999px;font-size:.75rem;font-weight:700;border:1px solid var(--trait);white-space:nowrap}
.puce.an{color:var(--rouge);border-color:var(--rouge)}
.puce.re{color:var(--or);border-color:var(--or)}
.puce.co{color:var(--cyan);border-color:var(--cyan)}
.chiffres{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.chiffres b{display:block;font-size:1.25rem}
.chiffres span{font-size:.75rem;color:var(--brume)}
.med{display:inline-flex;align-items:center;gap:3px;margin-inline-end:8px;white-space:nowrap}
.med i{width:12px;height:11px;clip-path:var(--hex);display:inline-block}
.or i{background:var(--or)} .ar i{background:var(--argent)} .br i{background:var(--bronze)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:5px 4px;text-align:center;border-top:1px solid var(--trait)}
td:first-child,th:first-child{text-align:start}
th{font-size:.75rem;color:var(--brume);font-weight:600;border-top:0}
button,select,.lien{font:inherit;color:inherit}
button{min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--trait);background:var(--alv);cursor:pointer}
button:focus-visible,select:focus-visible,.lien:focus-visible{outline:2px solid var(--or);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.actions button{flex:1 1 140px}
.lien{background:none;border:0;padding:6px 0;min-height:36px;color:var(--cyan);text-decoration:underline;cursor:pointer;font-size:.88rem}
.jours button{min-height:40px;margin-block:4px 0;margin-inline:0 6px;padding:6px 10px;font-size:.88rem}
.jours button[aria-current="true"]{border-color:var(--or)}
footer{color:var(--brume);font-size:.8rem;display:grid;gap:8px;margin-top:4px}
footer label{display:flex;gap:8px;align-items:center}
select{min-height:40px;border-radius:10px;background:var(--alv);border:1px solid var(--trait);padding:4px 8px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--craie);color:var(--nuit);padding:8px 14px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.vide{color:var(--brume);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[dir="rtl"] .l1{direction:rtl}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
@media (min-width:560px){h1{font-size:1.35rem}}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{min-height:40px;padding:4px 12px;font-size:.88rem;border-radius:999px}
.chips button[aria-pressed="true"]{border-color:var(--or);color:var(--or)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:.88rem;color:var(--brume)}
input,textarea{font:inherit;color:var(--craie);background:var(--alv);border:1px solid var(--trait);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.btn-or{background:linear-gradient(135deg,var(--or),#ff9f1c);color:#2a1a00;border:0;font-weight:800}


.astuce{margin:0 0 8px;padding:8px 10px;border-radius:10px;background:rgba(255,197,49,.1);border:1px solid rgba(255,197,49,.35)}
.retour{margin:0 0 10px}
.regle{font-size:.82rem;color:var(--brume);margin:6px 0 0}
select.plein{width:100%;min-height:44px}
/* le défi du jour : un grand hexagone */
.jour{display:grid;grid-template-columns:minmax(96px,130px) 1fr;gap:14px;align-items:center}
.jour-hex{aspect-ratio:1/1.1;clip-path:var(--hex);background:linear-gradient(140deg,var(--id1),var(--id2));display:grid;place-items:center;position:relative}
.jour-hex::after{content:"";position:absolute;inset:5px;clip-path:var(--hex);background:var(--nuit2)}
.jour-hex span{position:relative;z-index:1;font-size:2.6rem;line-height:1}
.jour h3{margin:0 0 4px;font-size:1.15rem;line-height:1.25}
.jour .cons{margin:0 0 6px}
@media (max-width:360px){.jour{grid-template-columns:84px 1fr;gap:10px}.jour-hex span{font-size:2rem}}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.part{background:var(--alv);border:1px solid var(--trait);border-radius:14px;padding:8px;display:grid;gap:6px;align-content:start;position:relative}
.part.vedette{border-color:var(--or);box-shadow:0 0 0 1px var(--or) inset}
.part video,.part canvas{width:100%;aspect-ratio:9/16;border-radius:10px;background:#000;display:block}
.part .vide-v{width:100%;aspect-ratio:9/16;border-radius:10px;background:repeating-linear-gradient(45deg,var(--nuit2),var(--nuit2) 8px,var(--alv) 8px,var(--alv) 16px);display:grid;place-items:center;color:var(--brume);font-size:.8rem;text-align:center;padding:8px}
.part p{margin:0;font-size:.82rem;color:var(--brume)}
.part button{min-height:40px;padding:4px 10px;font-size:.86rem}
.etoile{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:800;color:var(--or)}
.etoile i{width:13px;height:12px;clip-path:var(--hex);background:var(--or);display:inline-block}
.nv-cree{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;color:var(--or)}
.nv-cree i{width:11px;height:10px;clip-path:var(--hex);background:var(--or);display:inline-block}
.passe{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--trait)}
.passe:first-of-type{border-top:0}
.passe .mini{width:40px;height:44px;clip-path:var(--hex);background:var(--alv);display:grid;place-items:center;font-size:1.2rem}
.passe h3{margin:0;font-size:.95rem}
.passe h3 button{all:unset;cursor:pointer;color:var(--craie);font-weight:700}
.passe h3 button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.prise{width:100%;max-width:260px;aspect-ratio:9/16;border-radius:12px;background:#000;display:block;margin:0 0 10px}
.interrupteur{display:flex;gap:10px;align-items:center;justify-content:space-between}
.interrupteur button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
/* Identité de la nouveauté : or et turquoise, le hexagone du jour */
:root{--id1:#ffc531;--id2:#16e0d4}
header{position:relative}
header::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--id1),var(--id2))}
.hex{background:linear-gradient(135deg,var(--id1),var(--id2))}
h2::before{background:linear-gradient(135deg,var(--id1),var(--id2))}
</style>

<script>
/* ══ NV_CAMERA — EMBARQUÉ ════════════════════════════════════
   Embarqué, pas référencé : un module NEURAVID doit s'ouvrir
   seul depuis une URL file://, avec rien à côté. */
/* ═══════════════════════════════════════════════════════════════════
   NEURAVID — NV_CAMERA.js
   Le bouton « Filmer » d'un défi ouvre la caméra du Studio créatif.

   À embarquer dans les 16 modules de défi ET dans NV_MODULE_Create.html.

   ── POURQUOI ─────────────────────────────────────────────────────────
   Chaque défi a son propre enregistreur. Il fonctionne, il grave les
   filtres et le logo dans l'image — mais il s'arrête là. La caméra du
   Studio sait faire beaucoup plus, et elle existe déjà :

       double caméra (médaillon, haut/bas, gauche/droite)
       masques qui suivent le visage
       effets pluie, neige, étincelles
       filtres gravés dans l'image enregistrée
       photo, montage, galerie

   Une personne qui veut participer à un défi n'a aucune raison d'avoir
   moins d'outils que quelqu'un qui filme pour rien.

   ── LA DIFFICULTÉ RÉELLE ─────────────────────────────────────────────
   Le Studio est un AUTRE fichier. Changer de page perd tout : le
   contexte du défi, et surtout la vidéo elle-même — un Blob ne
   traverse pas une navigation.

   IndexedDB, si. C'est la seule voie, et Create s'en sert déjà pour
   son relais. On l'emprunte :

       1. le défi range son contexte et ouvre le Studio
       2. la personne filme avec tous les outils
       3. le Studio range la vidéo dans IndexedDB et revient au défi
       4. le défi la reprend et la présente comme sa propre prise

   ── CE QU'ON NE FAIT PAS ─────────────────────────────────────────────
   On ne copie pas la caméra du Studio dans les seize défis. Elle pèse
   plus de trois cents kilo-octets, et seize copies divergeraient au
   premier correctif — c'est exactement ce qui est arrivé à IA et Coach,
   qui affichaient deux scores différents pour la même vidéo.

   Et on ne supprime pas l'enregistreur existant : si le Studio est
   injoignable, il reprend la main. Une passerelle ne doit jamais
   devenir un point de rupture.
   ═══════════════════════════════════════════════════════════════════ */
(function (racine) {
  'use strict';
  if (racine.NVCamera) return;

  var BASE_DEFAUT = 'file:///android_asset/flutter_assets/assets/modules/';
  var CLE_CTX = 'nv_cam_ctx';
  var DB = 'nvcamera';
  var MAG = 'prises';

  function emit(type, charge) {
    try { if (typeof racine.NVemit === 'function') racine.NVemit(type, charge || {}); }
    catch (e) {}
  }
  function base() {
    var b = racine.NV_MODULES_BASE || BASE_DEFAUT;
    return b.slice(-1) === '/' ? b : b + '/';
  }

  /* ── LE COFFRE ────────────────────────────────────────────────────
     Une vidéo de quelques mégaoctets ne tient pas dans localStorage et
     ne survit pas à une navigation autrement. IndexedDB est le seul
     endroit où elle peut attendre. */
  function ouvrirBase() {
    return new Promise(function (res) {
      try { if (!racine.indexedDB) return res(null); } catch (e) { return res(null); }   /* stockage bloqué : l'accès lui-même peut lever une erreur */
      var r;
      try { r = racine.indexedDB.open(DB, 1); } catch (e) { return res(null); }
      r.onupgradeneeded = function () {
        try { r.result.createObjectStore(MAG); } catch (e) {}
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { res(null); };
      /* certains navigateurs ne répondent jamais (fichier ouvert en content://) */
      setTimeout(function () { res(null); }, 2000);
    });
  }
  function ranger(cle, valeur) {
    return ouvrirBase().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var t = db.transaction(MAG, 'readwrite');
          t.objectStore(MAG).put(valeur, cle);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { res(false); };
        } catch (e) { res(false); }
      });
    });
  }
  function reprendre(cle) {
    return ouvrirBase().then(function (db) {
      if (!db) return null;
      return new Promise(function (res) {
        try {
          var t = db.transaction(MAG, 'readonly');
          var q = t.objectStore(MAG).get(cle);
          q.onsuccess = function () { res(q.result || null); };
          q.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    });
  }
  function oublier(cle) {
    return ouvrirBase().then(function (db) {
      if (!db) return;
      try {
        var t = db.transaction(MAG, 'readwrite');
        t.objectStore(MAG).delete(cle);
      } catch (e) {}
    });
  }

  /* ── CÔTÉ DÉFI : partir vers le Studio ────────────────────────────── */
  function filmer(ctx) {
    ctx = ctx || {};
    ctx.module = ctx.module || racine.NV_MODULE_NAME || 'defi';
    ctx.quand = Date.now();
    /* La contrainte du défi voyage avec : le Studio doit savoir qu'une
       story flash s'arrête à sept secondes. Sans ça, la personne filme
       trente secondes et se fait refuser au retour. */
    try { racine.sessionStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    try { racine.localStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    emit('camera_open', ctx);

    /* Si le Studio est déjà dans cette page, on l'ouvre sans changer
       d'écran : c'est plus rapide et rien ne peut se perdre. */
    try {
      if (racine.NVStudio && typeof racine.NVStudio.open === 'function' &&
          typeof racine.NVStudio.tab === 'function') {
        racine.NVStudio.open(); racine.NVStudio.tab('video');
        return 'local';
      }
    } catch (e) {}
    try {
      if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') {
        racine.NVLien.ouvrir('NVCreate', ctx);
        return 'lien';
      }
    } catch (e) {}
    try {
      racine.location.href = base() + 'NV_MODULE_Create.html';
      return 'fichier';
    } catch (e) {}
    return 'aucun';   /* l'appelant reprend la main avec son propre enregistreur */
  }

  /* ── CÔTÉ STUDIO : d'où vient-on, et comment y retourner ──────────── */
  function contexte() {
    var t = null;
    try { t = racine.sessionStorage.getItem(CLE_CTX); } catch (e) {}
    if (!t) { try { t = racine.localStorage.getItem(CLE_CTX); } catch (e) {} }
    if (!t) return null;
    try {
      var c = JSON.parse(t);
      /* Un contexte vieux de plus d'une heure n'a plus de sens : la
         personne est passée à autre chose. On ne la renvoie pas dans un
         défi qu'elle a quitté. */
      if (!c || !c.quand || Date.now() - c.quand > 3600000) return null;
      return c;
    } catch (e) { return null; }
  }

  /* Le Studio appelle ceci quand la prise est terminée. */
  function rendre(blob, meta) {
    var c = contexte();
    if (!c) return Promise.resolve(false);
    var cle = 'prise_' + (c.module || 'defi') + '_' + (c.defi || 'x');
    return ranger(cle, {blob: blob, meta: meta || {}, ctx: c, at: Date.now()})
      .then(function (ok) {
        if (!ok) return false;
        emit('camera_done', {module: c.module, defi: c.defi || null,
                             secondes: (meta && meta.seconds) || null});
        try {
          if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') {
            racine.NVLien.ouvrir('NV' + c.module, c);
            return true;
          }
        } catch (e) {}
        try { racine.location.href = base() + 'NV_MODULE_' + c.module + '.html'; }
        catch (e) {}
        return true;
      });
  }

  /* ── CÔTÉ DÉFI : récupérer la prise au retour ─────────────────────── */
  function recuperer(module, defi) {
    var cle = 'prise_' + (module || racine.NV_MODULE_NAME || 'defi') + '_' + (defi || 'x');
    return reprendre(cle).then(function (p) {
      if (!p) return null;
      /* On efface tout de suite : une prise reprise deux fois se
         retrouverait envoyée deux fois. */
      oublier(cle);
      if (!p.at || Date.now() - p.at > 3600000) return null;
      return p;
    });
  }

  /* ══ LE MÉNAGE ════════════════════════════════════════════════════
     Une prise n'est effacée qu'à sa reprise. Si la personne filme puis
     ne revient jamais dans le défi, l'entrée reste — une vidéo de
     plusieurs mégaoctets par tentative abandonnée, sur un téléphone
     d'entrée de gamme.

     On balaie donc au chargement ce qui a plus d'une heure : c'est la
     même limite que le contexte, et au-delà la personne est passée à
     autre chose de toute façon. */
  function balayer() {
    return ouvrirBase().then(function (db) {
      if (!db) return 0;
      return new Promise(function (res) {
        var n = 0;
        try {
          var t = db.transaction(MAG, 'readwrite');
          var st = t.objectStore(MAG);
          var q = st.openCursor();
          q.onsuccess = function () {
            var c = q.result;
            if (!c) { res(n); return; }
            var v = c.value;
            if (!v || !v.at || Date.now() - v.at > 3600000) { c.delete(); n++; }
            c.continue();
          };
          q.onerror = function () { res(n); };
        } catch (e) { res(0); }
      });
    });
  }
  /* au chargement, sans bloquer quoi que ce soit */
  try { setTimeout(balayer, 3000); } catch (e) {}

  racine.NVCamera = {
    balayer: balayer,
    filmer: filmer,
    contexte: contexte,
    rendre: rendre,
    recuperer: recuperer,
    /* Pour savoir s'il faut proposer le Studio ou rester sur
       l'enregistreur local. On ne propose jamais une porte qui ne
       s'ouvre pas. */
    studioJoignable: function () {
      try {
        if (racine.NVStudio && typeof racine.NVStudio.open === 'function') return true;
        if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') return true;
        return !!racine.NV_MODULES_BASE;
      } catch (e) { return false; }
    }
  };
})(window);

</script>

  var l = []; try{ l = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'fr']; }catch(e){}
  for(var i = 0; i < l.length; i++){ var k = String(l[i] || '').slice(0, 2).toLowerCase(); if(LANGUES_UI[k]) return k; }

function drapeau(iso){ iso = String(iso || '').toUpperCase(); if(!/^[A-Z]{2}$/.test(iso)) return ''; return String.fromCodePoint(127397 + iso.charCodeAt(0), 127397 + iso.charCodeAt(1)); }

function appeler(methode, chemin, corps, cle){

  if(methode !== 'GET') h['Idempotency-Key'] = cle || ('tj-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
  var o = {method:methode, headers:h, mode:'cors', cache:'no-cache'};
  if(corps instanceof FormData) o.body = corps; else if(corps){ h['Content-Type'] = 'application/json'; o.body = JSON.stringify(corps); }
  return fetch(api() + chemin, o).then(function(r){
    return r.text().then(function(t){ var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){ j = null; }
      if(!r.ok){ var err = new Error('http ' + r.status); err.status = r.status; err.code = j && (j.erreur || j.code); err.params = j && j.params || {}; throw err; } return j; });
  });
}
function emit(type, payload){

  if(window.NVemit && !window.NVemit.__nvLocal){ try{ window.NVemit(type, msg.payload); }catch(e){} }
  try{ if(window.flutter_inappwebview) window.flutter_inappwebview.callHandler('nvEvent', msg); }catch(e){}
  try{ window.dispatchEvent(new CustomEvent('nv:' + type, {detail:msg.payload})); }catch(e){}
}
function ouvrir(id, ctx){

  emit('open_module', {target:'NV' + id, url:url, contexte:ctx || null});
  try{ if(ctx) sessionStorage.setItem('nv_ctx_' + id, JSON.stringify(ctx)); }catch(e){}
  if(window.flutter_inappwebview) return;
  if(window.NVLien && typeof window.NVLien.ouvrir === 'function'){ try{ window.NVLien.ouvrir('NV' + id, ctx); return; }catch(e){} }
  try{ location.href = url; }catch(e){}
}

  publication_indisponible:N('Le service est momentanément indisponible. Réessayez dans un instant.'), rappel_indisponible:N('Le service est momentanément indisponible. Réessayez dans un instant.')};
function erreurTexte(e){
  var c = e && e.code;
  if(c === 'champ_invalide') return T('Vérifiez le formulaire : un champ n’est pas rempli comme il faut.');
  if(c && ERREURS[c]) return T(ERREURS[c]);
  if(e && e.status === 401) return T('Connectez-vous pour continuer.');
  return navigator.onLine === false ? T('Pas de connexion pour le moment.') : T('Impossible de joindre NEURAVID pour le moment.');
}

function chargerCap(){
  if(ST.apercu){ ST.cap = {talentjour:true, secondes:[15, 60], participer:true, rappel:true}; return Promise.resolve(); }
  if(!api()){ ST.cap = null; ST.etat = 'sansserveur'; return Promise.resolve(); }
  return appeler('GET', '/v1/talentjour/capacites').then(function(c){ ST.cap = c && c.talentjour === true ? c : null; if(!ST.cap) ST.etat = 'indisponible'; });
}
/* l'heure du serveur : la fin du jour est comptée avec elle, jamais avec l'horloge du téléphone seule */
function maintenant(){ return Date.now() + ST.decalage; }
function chargerJour(){
  ST.vue = 'jour'; ST.defi = null;
  if(ST.apercu){ var dm = demo(); ST.liste = dm.liste; ST.defi = dm.details[dm.liste.aujourdhui.id]; ST.liste.aujourdhui.moi = ST.defi.moi; ST.etat = 'ok'; rendre(); return Promise.resolve(); }
  if(!ST.cap){ rendre(); return Promise.resolve(); }
  ST.etat = 'charge'; rendreEtat();
  return appeler('GET', '/v1/talentjour').then(function(o){
      ST.liste = o && typeof o === 'object' ? o : null; ST.etat = 'ok';
      var t = o && Date.parse(o.maintenant); if(t && isFinite(t)) ST.decalage = t - Date.now();
      /* le défi du jour : ses participations (la liste ne les donne pas) */
      var a = o && o.aujourdhui; if(!a) return;
      return appeler('GET', '/v1/talentjour/defis/' + encodeURIComponent(a.id)).then(function(x){ ST.defi = x; }, function(){ ST.defi = null; });
    }, function(){ ST.etat = navigator.onLine === false ? 'horsligne' : 'erreur'; }).then(function(){ rendre(); armer(); });
}
function chargerDefi(id){
  ST.vue = 'defi'; ST.defi = null; ST.sur = {};
  if(ST.apercu){ ST.defi = demo().details[id] || null; ST.focusVers = 'hDefi'; rendre(); return Promise.resolve(); }
  ST.etat = 'charge'; rendre();

    function(e){ ST.etat = 'ok'; toast(erreurTexte(e)); ST.vue = 'jour'; }).then(function(){ ST.focusVers = ST.defi ? 'hDefi' : 'hJour'; rendre(); });
}
function chargerEquipe(){
  ST.vue = 'equipe';
  if(ST.apercu){ var d = demo(); ST.prog = d.prog; ST.file = d.file; rendre(); return Promise.resolve(); }
  ST.etat = 'charge'; rendre();
  return Promise.all([redacteur() ? appeler('GET', '/v1/talentjour/equipe/programme').catch(function(e){ toast(erreurTexte(e)); return null; }) : null,
    moderateur() ? appeler('GET', '/v1/talentjour/equipe/file').catch(function(e){ toast(erreurTexte(e)); return null; }) : null])
    .then(function(r){ ST.prog = r[0]; ST.file = r[1]; ST.etat = 'ok'; rendre(); });
}
/* à la fin du jour (heure du serveur), la page se relit : le défi suivant commence */
function armer(){ clearTimeout(ST.minuteur); var a = ST.liste && ST.liste.aujourdhui; if(!a || ST.apercu) return; var f = Date.parse(a.fin) - maintenant();
  if(isFinite(f) && f > 0 && f < 864e5 + 6e4) ST.minuteur = setTimeout(function(){ if(ST.vue === 'jour') chargerJour(); }, f + 1500); }

  else if(ST.etat === 'horsligne') t = T('Pas de connexion pour le moment.');

}

function deuxTouchers(cle){ if(ST.sur[cle]){ delete ST.sur[cle]; return true; } ST.sur[cle] = true; rendre(); setTimeout(function(){ if(ST.sur[cle]){ delete ST.sur[cle]; rendre(); } }, 5000); return false; }

  if(ST.apercu){ var m = d.moi || (d.moi = {}); m.participation = {id:'tp_ap' + Date.now(), etat:'verification'}; m.peut = false; p = Promise.resolve({etat:'verification'}); }

function demoDessiner(c, pays){
  var g = c.getContext('2d'); if(!g) return; var W = c.width, H = c.height, k = ((String(pays).charCodeAt(0) || 70) * 53 + (String(pays).charCodeAt(1) || 70) * 17) % 360;
  var gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, 'hsl(' + k + ',60%,30%)'); gr.addColorStop(1, 'hsl(' + ((k + 60) % 360) + ',70%,18%)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for(var i = 0; i < 7; i++){ var x = W / 2 + Math.cos(i) * 50, y = H / 2 - 20 + Math.sin(i * 1.7) * 70; g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath();
    for(var a = 0; a < 6; a++){ var t = Math.PI / 3 * a; g.lineTo(x + 18 * Math.cos(t), y + 18 * Math.sin(t)); } g.closePath(); g.fill(); }
  g.font = '64px sans-serif'; g.textAlign = 'center'; g.fillText(drapeau(pays) || '✨', W / 2, H / 2);
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, H - 26, W, 26); g.fillStyle = '#ffc531'; g.font = 'bold 13px sans-serif'; g.fillText(T('Aperçu'), W / 2, H - 9);
}

/* ════════ LE DÉMARRAGE ════════ */
function changerVue(v){
  ST.sur = {};
  if(v === 'equipe' && (moderateur() || redacteur())) return chargerEquipe();
  return chargerJour().then(function(){ var b = $('hJour'); if(b) b.focus(); });
}
function demarrer(){
  poserLangue(langueDetectee());
  /* sans serveur branché, la page montre son aperçu (repère « Aperçu »), aussi dans l'application, comme les autres
     modules ; dès qu'un serveur est branché, seul le vrai contenu est montré. */
  ST.apercu = !api();
  if(ST.apercu && !utilisateur()){ try{ window.NV_USER = {id:'demo', handle:'visiteur', prenom:'Aya', age:25, majeur:true, iso:'GN'}; }catch(e){} }
  var ctx = null;
  try{ ctx = JSON.parse(sessionStorage.getItem('nv_ctx_' + MOI) || 'null'); sessionStorage.removeItem('nv_ctx_' + MOI); }catch(e){}
  rendre();
  chargerCap().catch(function(e){ ST.cap = null; ST.etat = e && e.status && e.status < 500 ? 'indisponible' : navigator.onLine === false ? 'horsligne' : 'erreur'; })
    .then(function(){ if(!ST.cap) return rendre();
      var m = jeton() && !ST.apercu ? appeler('GET', '/v1/talentjour/moi').then(function(o){ ST.moiSrv = o; }, function(){}) : Promise.resolve();
      return m.then(reprendrePrise); })
    .then(function(did){
      if(!ST.cap) return;
      return chargerJour().then(function(){
        var a = ST.liste && ST.liste.aujourdhui;
        /* une prise filmée pour un défi qui n'est plus celui du jour : oubliée (jamais envoyée ailleurs), et c'est dit */
        if(did && !(a && a.id === did)){ oublierPrise(); toast(T('Le défi de ce jour est terminé.')); rendre(); return; }
        if(ctx && typeof ctx.defi === 'string' && !(a && a.id === ctx.defi)) return chargerDefi(ctx.defi);
        if(ctx && ctx.vue === 'equipe' && (moderateur() || redacteur())) return chargerEquipe();
      });
    });
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if(!b) return;
    var a = function(k){ return b.getAttribute(k); };
    if(a('data-vue')) changerVue(a('data-vue'));
    else if(a('data-ouvrir')) chargerDefi(a('data-ouvrir'));
    else if(a('data-vedette')) vedette(a('data-vedette'));
    else if(b.id === 'bFilmer') filmer();
    else if(b.id === 'bRefilmer'){ if(deuxTouchers('refilmer')){ oublierPrise(); filmer(); } }
    else if(b.id === 'bRetirer') retirer();
    else if(b.id === 'bRappel') rappel();
    else if(a('data-publier')) decider(a('data-publier'), true);
    else if(a('data-refuser')) decider(a('data-refuser'), false);
    else if(a('data-annuler')) annuler(a('data-annuler'));
  });
  document.addEventListener('input', function(ev){ var t = ev.target; if(t && t.id === 'iLegende') ST.legende = t.value; });
  document.addEventListener('change', function(ev){
    var t = ev.target; if(!t) return;
    if(t.id === 'langue'){ var l = t.value; if(!LANGUES_UI[l]) return; ecrire('nv_ui_langue', l); poserLangue(l); rendre(); var s = $('langue'); if(s) s.focus(); }
  });
  document.addEventListener('submit', function(ev){
    var f = ev.target; if(!f) return; ev.preventDefault();
    if(f.id === 'fPart') envoyer(); else if(f.id === 'fDefi') creerDefi();
  });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible' && ST.cap && !ST.apercu && ST.vue === 'jour' && ST.liste && ST.liste.aujourdhui && Date.parse(ST.liste.aujourdhui.fin) <= maintenant()) chargerJour(); });
  window.NVTalentJour = {etat:function(){ return {etat:ST.etat, vue:ST.vue, apercu:ST.apercu, aujourdhui:!!(ST.liste && ST.liste.aujourdhui), prise:!!ST.prise, langue:L}; }};
}

/* ════════ La présentation : un film dessiné, « Comment ça marche », « Ce qui vous protège ». En grand quand la page n'est
   pas encore ouverte ; repliée sur la page principale sinon. ════════ */
var _rendrePres = rendre;
rendre = function(){ var r = _rendrePres.apply(this, arguments); presenterNouveaute(); return r; };
function presenterNouveaute(){
  if(!window.NVPresente) return;
  var ferme = !ST.cap && !ST.apercu && (ST.etat === 'sansserveur' || ST.etat === 'indisponible');
  if(!ferme && !((ST.cap || ST.apercu) && ST.vue === 'jour')){ NVPresente.poser(null); return; }
  NVPresente.poser({cle:'talent', scene:'talent', couleurs:['#ffc531', '#16e0d4'], ouvert:ferme, apres:$('etat'), titreFilm:T('Talent du Jour'),
    intro:ferme ? T('Bientôt ouvert ici. Voici ce qui vous attend.') : '', comment:T('Comment ça marche'), protege:T('Ce qui vous protège'),
    etapes:[T('Chaque jour, un nouveau défi de 15 à 60 secondes.'), T('Filmez votre talent avec La Forge.'), T('L’équipe relit chaque vidéo et choisit les talents du jour.')],
    protections:[T('Chaque vidéo est relue avant d’être publique.'), T('Le pseudo d’un mineur n’est jamais montré.'), T('Vous pouvez retirer votre vidéo à tout moment.')]});
}

/* ════════ L'aperçu en repli (17 nov. 2026, rappel de Karamo : « ne plus dépendre l'affichage des contenus ou fonctionnalités
   d'un module uniquement par la présence ou branchement d'un serveur ») ════════
   Un serveur branché qui ne propose pas (encore) cette fonction, ou qui ne répond pas : la page ne reste jamais fermée,
   elle montre son aperçu, toujours marqué « Aperçu » (rien n'est envoyé). Dès que le serveur l'annonce, seul le vrai contenu. */
function repliApercu(){ if(ST.cap || ST.apercu) return false; ST.apercu = true; ST.repli = true;
  if(!utilisateur()){ try{ window.NV_USER = {id:'demo', handle:'visiteur', prenom:'Aya', age:25, majeur:true, iso:'GN'}; }catch(e){} }
  return true; }
(function(){ var cc0 = chargerCap;
  chargerCap = function(){ return cc0().then(function(){ if(repliApercu()) return cc0(); }, function(e){ if(repliApercu()) return cc0(); throw e; }); }; })();

demarrer();
})();
