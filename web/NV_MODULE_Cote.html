          q.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    });
  }

    return ouvrirBase().then(function (db) {

  function filmer(ctx) {
    ctx = ctx || {};
    ctx.module = ctx.module || racine.NV_MODULE_NAME || 'defi';
    ctx.quand = Date.now();
    /* La contrainte du défi voyage avec : le Studio doit savoir qu'une
       story flash s'arrête à sept secondes. Sans ça, la personne filme
       trente secondes et se fait refuser au retour. */
    try { racine.sessionStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    try { racine.localStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    emit('camera_open', ctx);

    /* Si le Studio est déjà dans cette page, on l'ouvre sans changer
       d'écran : c'est plus rapide et rien ne peut se perdre. */
    try {
      if (racine.NVStudio && typeof racine.NVStudio.open === 'function' &&
          typeof racine.NVStudio.tab === 'function') {
        racine.NVStudio.open(); racine.NVStudio.tab('video');

      }
    } catch (e) {}

      racine.location.href = base() + 'NV_MODULE_Create.html';
      return 'fichier';
    } catch (e) {}

  }

  function contexte() {
    var t = null;

    try {
      var c = JSON.parse(t);

         personne est passée à autre chose. On ne la renvoie pas dans un
         défi qu'elle a quitté. */
      if (!c || !c.quand || Date.now() - c.quand > 3600000) return null;

  function rendre(blob, meta) {

  /* ── CÔTÉ DÉFI : récupérer la prise au retour ─────────────────────── */
  function recuperer(module, defi) {

         retrouverait envoyée deux fois. */

      return p;
    });
  }

  /* ══ LE MÉNAGE ════════════════════════════════════════════════════
     Une prise n'est effacée qu'à sa reprise. Si la personne filme puis
     ne revient jamais dans le défi, l'entrée reste — une vidéo de
     plusieurs mégaoctets par tentative abandonnée, sur un téléphone
     d'entrée de gamme.

     On balaie donc au chargement ce qui a plus d'une heure : c'est la
     même limite que le contexte, et au-delà la personne est passée à
     autre chose de toute façon. */
  function balayer() {
    return ouvrirBase().then(function (db) {
      if (!db) return 0;

          var st = t.objectStore(MAG);

            var c = q.result;

    contexte: contexte,
    rendre: rendre,
    recuperer: recuperer,

       s'ouvre pas. */
    studioJoignable: function () {
      try {
        if (racine.NVStudio && typeof racine.NVStudio.open === 'function') return true;

      } catch (e) { return false; }
    }
  };

 Un duo à distance, l'écran partagé en deux : vous filmez votre moitié et invitez UNE personne (16 ans, d'un autre pays
 ou d'à côté) ; elle filme la sienne à côté de la vôtre dans La Forge ; vous décidez ensemble de la publier.
 Serveur : /v1/cote (univers), capacité /v1/cote/capacites. On filme avec La Forge (NVCamera), qui pose la moitié de l'autre
 à côté de la caméra (gauche / droite ou haut / bas).
 Rien n'est inventé : une valeur inconnue s'écrit « — » ; les exemples n'existent que dans l'aperçu, marqués « Aperçu ».
 ════════════════════════════════════════════════════════════════════ */
'use strict';
var MOI = 'Cote';
var AGE_MIN = 16;
var LANGUES_UI = {fr:{nom:'Français', loc:'fr-FR'}, en:{nom:'English', loc:'en-GB'}, es:{nom:'Español', loc:'es-ES'}, pt:{nom:'Português', loc:'pt-BR'},
  ar:{nom:'العربية', loc:'ar-u-nu-latn', rtl:true}, sw:{nom:'Kiswahili', loc:'sw-KE', relire:true}, ha:{nom:'Hausa', loc:'ha-NG', relire:true},
  yo:{nom:'Yorùbá', loc:'yo-NG', relire:true}, wo:{nom:'Wolof', loc:'fr-SN', relire:true}, bm:{nom:'Bamanankan', loc:'fr-ML', relire:true},
  ln:{nom:'Lingála', loc:'fr-CD', relire:true}};
var CLE_FILM = 'nv_cote_film';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]; }); }
function brut(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function ecrire(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function api(){ return window.NV_API_BASE ? String(window.NV_API_BASE).replace(/\/$/, '') : null; }
function jeton(){ return window.NV_TOKEN ? String(window.NV_TOKEN) : ''; }
function utilisateur(){ return window.NV_USER && typeof window.NV_USER === 'object' ? window.NV_USER : null; }
function nombre(x){ return typeof x === 'number' && isFinite(x) && x >= 0 ? x : null; }

/* ── la langue : la même que le reste de NEURAVID (« nv_ui_langue »), sinon l'application, sinon le téléphone ── */
function langueDetectee(){
  try{ var hl = /(?:^#|&)lang=([a-z]{2})/.exec(location.hash || ''); if(hl && LANGUES_UI[hl[1]]) return hl[1]; }catch(e){}
  var c = brut('nv_ui_langue'); if(c){ try{ c = JSON.parse(c); }catch(e){} if(typeof c === 'string' && LANGUES_UI[c]) return c; }
  try{ if(window.NV_LANG){ var n = String(window.NV_LANG).slice(0, 2).toLowerCase(); if(LANGUES_UI[n]) return n; } }catch(e){}
  var l = []; try{ l = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'fr']; }catch(e){}
  for(var i = 0; i < l.length; i++){ var k = String(l[i] || '').slice(0, 2).toLowerCase(); if(LANGUES_UI[k]) return k; }
  return 'fr';
}
var L = 'fr', LOC = 'fr-FR', DICO = {};
function poserLangue(l){
  L = LANGUES_UI[l] ? l : 'fr'; DICO = {};
  if(L !== 'fr'){ try{ DICO = JSON.parse($('nvI18n-' + L).textContent) || {}; }catch(e){ L = 'fr'; DICO = {}; } }
  LOC = LANGUES_UI[L].loc;
  document.documentElement.lang = L; document.documentElement.dir = LANGUES_UI[L].rtl ? 'rtl' : 'ltr';
}
function T(s){ var t = DICO[s] || s, a = arguments; return t.replace(/\{(\d)\}/g, function(m, i){ var v = a[+i + 1]; return v == null ? '—' : String(v); }); }
function dateTexte(iso){ var d = iso ? new Date(iso) : null; if(!d || isNaN(d)) return '—'; try{ return d.toLocaleDateString(LOC, {day:'numeric', month:'long'}); }catch(e){ return '—'; } }

/* ── les pays : drapeau + nom (le code seul si le téléphone ne connaît pas le nom) ── */
function drapeau(iso){ iso = String(iso || '').toUpperCase(); if(!/^[A-Z]{2}$/.test(iso)) return ''; return String.fromCodePoint(127397 + iso.charCodeAt(0), 127397 + iso.charCodeAt(1)); }
var NOMS = null;
function nomPays(iso){
  iso = String(iso || '').toUpperCase(); if(!/^[A-Z]{2}$/.test(iso)) return '';
  if(NOMS === null){ NOMS = false; try{ NOMS = new Intl.DisplayNames([LOC, 'fr'], {type:'region'}); }catch(e){ NOMS = false; } }
  var n = null; try{ n = NOMS ? NOMS.of(iso) : null; }catch(e){ n = null; }
  return n && n !== iso ? n : iso;
}
function quiTexte(p){ if(!p) return '—'; var h = p.handle ? '@' + p.handle : (p.nom || '—'), f = drapeau(p.pays); return (f ? f + ' ' : '') + h; }

/* ── l'état ── */
var ST = {apercu:false, cap:null, etat:'', envoyes:[], recus:[], prise:null, envoi:false, form:{invite:'', disposition:'gd', message:''}, sur:{}, occupe:{}};

/* ── le réseau ── */
function appeler(methode, chemin, corps, cle){
  var h = {Accept:'application/json'}; if(jeton()) h.Authorization = 'Bearer ' + jeton();
  if(methode !== 'GET') h['Idempotency-Key'] = cle || ('ct-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
  var o = {method:methode, headers:h, mode:'cors', cache:'no-cache'};
  if(corps instanceof FormData) o.body = corps; else if(corps){ h['Content-Type'] = 'application/json'; o.body = JSON.stringify(corps); }
  return fetch(api() + chemin, o).then(function(r){
    return r.text().then(function(t){ var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){ j = null; }
      if(!r.ok){ var err = new Error('http ' + r.status); err.status = r.status; err.code = j && j.erreur; throw err; } return j; });
  });
}
function emit(type, payload){
  var msg = {source:'neuravid', module:MOI, type:type, payload:payload || {}};
  if(window.NVemit && !window.NVemit.__nvLocal){ try{ window.NVemit(type, msg.payload); }catch(e){} }
  try{ if(window.flutter_inappwebview) window.flutter_inappwebview.callHandler('nvEvent', msg); }catch(e){}
  try{ window.dispatchEvent(new CustomEvent('nv:' + type, {detail:msg.payload})); }catch(e){}
}
function ouvrir(id, ctx){
  var base = window.NV_MODULES_BASE ? String(window.NV_MODULES_BASE).replace(/\/?$/, '/') : '', url = base + 'NV_MODULE_' + id + '.html';
  emit('open_module', {target:'NV' + id, url:url, contexte:ctx || null});
  try{ if(ctx) sessionStorage.setItem('nv_ctx_' + id, JSON.stringify(ctx)); }catch(e){}
  if(window.flutter_inappwebview) return;
  if(window.NVLien && typeof window.NVLien.ouvrir === 'function'){ try{ window.NVLien.ouvrir('NV' + id, ctx); return; }catch(e){} }
  try{ location.href = url; }catch(e){}
}
var toastT = 0;
function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('on'); }, 3400); }
var ERREURS = {personne_inconnue:'Aucun compte trouvé sous ce nom.', invite_age:'Cette personne ne peut pas encore faire de duo (16 ans).',
  duos_fermes:'Cette personne n’accepte pas de duo de votre part pour le moment.', deja_invite:'Un duo est déjà en cours entre vous deux.',
  trop_d_invitations:'Vous avez déjà 5 duos en attente : attendez une réponse.', age_minimum:'Côte à côte est ouvert à partir de 16 ans.',
  trop_long:'Une moitié de 60 secondes au plus.', moderation:'Votre message n’a pas été accepté. Changez-le.', trop_de_tours:'Vous avez déjà demandé de refaire deux fois.',
  cote_indisponible:'Côte à côte n’est pas encore ouvert.', trop_court:'Votre moitié est trop courte.', type_refuse:'Cette vidéo n’est pas acceptée : filmez-la avec La Forge.',
  video_manquante:'Cette vidéo n’est pas acceptée : filmez-la avec La Forge.', fichier_trop_grand:'Cette vidéo est trop lourde.', video_trop_longue:'Une moitié de 60 secondes au plus.',
  publication_injoignable:'Le service est momentanément indisponible. Réessayez dans un instant.', socle_injoignable:'Le service est momentanément indisponible. Réessayez dans un instant.',
  publication_indisponible:'Le service est momentanément indisponible. Réessayez dans un instant.', moderation_indisponible:'Le service est momentanément indisponible. Réessayez dans un instant.'};
function erreurTexte(e){
  var c = e && e.code;
  if(c && ERREURS[c]) return T(ERREURS[c]);
  if(c && /^duo_/.test(c)) return T('Ce duo a changé entre-temps.');
  if(e && e.status === 401) return T('Connectez-vous pour faire un duo.');
  return navigator.onLine === false ? T('Pas de connexion pour le moment.') : T('Impossible de joindre NEURAVID pour le moment.');
}

/* ════════ LES DONNÉES ════════ */
function age(){ var u = utilisateur(); return u && typeof u.age === 'number' ? u.age : null; }
function charger(){
  if(ST.apercu){ ST.cap = true; if(!ST.envoyes.length && !ST.recus.length){ var d = demoDuos(); ST.envoyes = d.envoyes; ST.recus = d.recus; } ST.etat = 'ok'; rendre(); return Promise.resolve(); }
  if(!api()){ ST.cap = false; ST.etat = 'sansserveur'; rendre(); return Promise.resolve(); }
  ST.etat = 'charge'; rendreEtat();
  return appeler('GET', '/v1/cote/capacites').then(function(c){
    ST.cap = !!(c && c.cote === true);
    if(!ST.cap){ ST.etat = 'indisponible'; return; }
    if(!jeton()){ ST.etat = 'connexion'; return; }
    return appeler('GET', '/v1/cote').then(function(o){ ST.envoyes = o && Array.isArray(o.envoyes) ? o.envoyes : []; ST.recus = o && Array.isArray(o.recus) ? o.recus : []; ST.etat = 'ok'; });
  }).catch(function(e){ ST.etat = e && e.status === 401 ? 'connexion' : !ST.cap && e && e.status && e.status < 500 ? 'indisponible' : navigator.onLine === false ? 'horsligne' : 'erreur'; })
    .then(function(){ rendre(); });
}
function trouver(id){ return ST.envoyes.concat(ST.recus).filter(function(x){ return x.id === id; })[0] || null; }

/* ════════ L'AFFICHAGE ════════ */
var ETATS = {invitation:['Invitation en attente', 're'], a_valider:['À décider', 're'], publiee:['Publié', 'co'], refusee:['Refusé', 'an'],
  annulee:['Annulé', 'an'], expiree:['Expiré', 'an'], declinee:['Non publié', 'an'], retiree:['Retiré', 'an']};
function puce(x){ var e = ETATS[x.etat] || ['—', '']; return '<span class="puce ' + e[1] + '">' + esc(T(e[0])) + '</span>'; }
function rendreEtat(){
  var el = $('etat'), t = '';
  if(ST.apercu) t = T('Aperçu : des duos d’exemple, pour découvrir la page.');
  else if(ST.etat === 'charge') t = T('Chargement…');
  else if(ST.etat === 'sansserveur' || ST.etat === 'indisponible') t = T('Côte à côte n’est pas encore ouvert.');
  else if(ST.etat === 'connexion') t = T('Connectez-vous pour faire un duo.');
  else if(ST.etat === 'horsligne') t = T('Pas de connexion pour le moment.');
  else if(ST.etat === 'erreur') t = T('Impossible de joindre NEURAVID pour le moment.');
  el.textContent = t; el.hidden = !t;
}
function ecran(dispo, gauche, droite){
  return '<div class="ecran' + (dispo === 'hb' ? ' hb' : '') + '" aria-hidden="true"><i>' + esc(gauche) + '</i><i class="moi">' + esc(droite) + '</i></div>';
}
function rendreNouveau(){
  var a = age();
  var h = '<section aria-labelledby="hNouveau"><h2 id="hNouveau">' + esc(T('Commencer un duo')) + '</h2>';
  if(a != null && a < AGE_MIN && !ST.apercu) return h + '<p class="vide">' + esc(T('Côte à côte est ouvert à partir de 16 ans.')) + '</p></section>';
  var pr = ST.prise && ST.prise.quoi === 'nouveau' ? ST.prise : null, f = ST.form;
  if(pr){
    h += '<div class="grand"><video id="vPrise" playsinline controls muted></video></div>' +
      '<p>' + esc(T('Votre moitié est prête. {0} recevra l’invitation et filmera la sienne à côté.', f.invite ? '@' + f.invite.replace(/^@/, '') : null)) + '</p>' +
      '<div class="form"><label>' + esc(T('Avec qui ? (son pseudo)')) + '<input id="iInvite" autocomplete="off" maxlength="41" placeholder="@" value="' + esc(f.invite) + '"></label></div>' +
      '<div class="actions"><button class="btn-or" id="bInviter"' + (ST.envoi ? ' disabled' : '') + '>' + esc(ST.envoi ? T('Envoi…') : T('Envoyer l’invitation')) + '</button>' +
      '<button id="bRefaireMoitie"' + (ST.envoi ? ' disabled' : '') + '>' + esc(ST.sur.refaireNouveau ? T('Toucher encore pour refaire') : T('Refaire ma moitié')) + '</button></div>';
    return h + '</section>';
  }
  h += '<p class="d">' + esc(T('Filmez votre moitié, puis invitez une personne : elle filmera la sienne à côté de la vôtre, où qu’elle soit dans le monde.')) + '</p>' +
    '<form class="form" id="fNouveau"><label>' + esc(T('Avec qui ? (son pseudo)')) + '<input name="invite" id="iInvite" autocomplete="off" maxlength="41" placeholder="@" value="' + esc(f.invite) + '"></label>' +
    '<div class="chips" role="radiogroup" aria-label="' + esc(T('L’écran partagé')) + '">' +
    '<button type="button" role="radio" data-dispo="gd" aria-checked="' + (f.disposition === 'gd') + '">' + esc(T('Gauche / droite')) + '</button>' +
    '<button type="button" role="radio" data-dispo="hb" aria-checked="' + (f.disposition === 'hb') + '">' + esc(T('Haut / bas')) + '</button></div>' +
    ecran(f.disposition, T('Vous'), T('Votre duo')) +
    '<label>' + esc(T('Un mot pour l’inviter (facultatif)')) + '<textarea name="message" id="iMessage" maxlength="140" rows="2">' + esc(f.message) + '</textarea></label>' +
    '<button class="btn-or" type="submit" id="bFilmerMoitie">' + esc(T('Filmer ma moitié')) + '</button></form>';
  return h + '</section>';
}
function rendreRecu(x){
  var h = '<div class="duo" data-duo="' + esc(x.id) + '"><div class="vign">';
  h += x.etat === 'invitation' && x.moitie ? '<video playsinline controls muted preload="metadata" crossorigin="anonymous" src="' + esc(x.moitie) + '"></video>'
    : x.video ? '<video playsinline controls preload="metadata" src="' + esc(x.video.url) + '"></video>' : (ST.apercu ? '<canvas width="96" height="170" data-demo="' + esc(x.id) + '"></canvas>' : '<i></i>');
  h += '<span class="sx" aria-hidden="true"><i></i><i></i></span></div>';
  h += '<div><p><span class="qui">' + esc(quiTexte(x.avec)) + '</span> ' + puce(x) + '</p>';
  if(x.message) h += '<p class="message">« ' + esc(x.message) + ' »</p>';
  var pr = ST.prise && ST.prise.quoi === 'repondre' && ST.prise.duo === x.id ? ST.prise : null;
  if(x.etat === 'invitation'){
    if(x.tours && x.motif) h += '<p class="d">' + esc(T('{0} vous demande de refaire : {1}', quiTexte(x.avec), x.motif)) + '</p>';
    else if(x.tours) h += '<p class="d">' + esc(T('{0} vous demande de refaire votre moitié.', quiTexte(x.avec))) + '</p>';
    if(pr){
      h += '<div class="grand"><video id="vPrise" playsinline controls muted></video></div><div class="actions"><button class="btn-or" data-envoyer="' + esc(x.id) + '"' + (ST.envoi ? ' disabled' : '') + '>' +
        esc(ST.envoi ? T('Envoi…') : T('Envoyer à {0}', quiTexte(x.avec))) + '</button><button data-refaire-prise="' + esc(x.id) + '"' + (ST.envoi ? ' disabled' : '') + '>' + esc(ST.sur['refairePrise' + x.id] ? T('Toucher encore pour refaire') : T('Refaire ma moitié')) + '</button></div>';
    } else {
      h += '<p class="d">' + esc(T('Filmez votre moitié à côté de la sienne. Réponse avant le {0}.', dateTexte(x.expire))) + '</p>' +
        '<div class="actions"><button class="btn-or" data-filmer="' + esc(x.id) + '">' + esc(T('Filmer ma moitié à côté')) + '</button>' +
        '<button data-refuser="' + esc(x.id) + '">' + esc(ST.sur['refuser' + x.id] ? T('Toucher encore pour refuser') : T('Refuser')) + '</button></div>';
    }
  } else if(x.etat === 'a_valider') h += '<p class="d">' + esc(T('Envoyé : {0} décide de le publier.', quiTexte(x.avec))) + '</p>' +
    '<div class="actions"><button data-refuser="' + esc(x.id) + '">' + esc(ST.sur['refuser' + x.id] ? T('Toucher encore pour retirer ma moitié') : T('Retirer ma moitié')) + '</button></div>';
  else if(x.etat === 'publiee') h += retirerBouton(x);
  return h + '</div></div>';
}
function retirerBouton(x){
  return '<div class="actions"><button data-retirer="' + esc(x.id) + '">' + esc(ST.sur['retirer' + x.id] ? T('Toucher encore pour retirer le duo') : T('Retirer le duo')) + '</button></div>';
}
function rendreEnvoye(x){
  var h = '<div class="duo" data-duo="' + esc(x.id) + '"><div class="vign">';
  h += x.video ? '<video playsinline controls preload="metadata" src="' + esc(x.video.url) + '"></video>'
    : x.moitie ? '<video playsinline muted preload="metadata" src="' + esc(x.moitie) + '"></video>' : (ST.apercu ? '<canvas width="96" height="170" data-demo="' + esc(x.id) + '"></canvas>' : '<i></i>');
  h += '<span class="sx" aria-hidden="true"><i></i><i></i></span></div>';
  h += '<div><p><span class="qui">' + esc(quiTexte(x.avec)) + '</span> ' + puce(x) + '</p>';
  if(x.etat === 'invitation') h += '<p class="d">' + esc(T('En attente de {0}, jusqu’au {1}.', quiTexte(x.avec), dateTexte(x.expire))) + '</p>' +
    '<div class="actions"><button data-annuler="' + esc(x.id) + '">' + esc(ST.sur['annuler' + x.id] ? T('Toucher encore pour annuler') : T('Annuler l’invitation')) + '</button></div>';
  else if(x.etat === 'a_valider'){
    h += '<p class="d">' + esc(x.video ? T('{0} a filmé sa moitié. Regardez, puis décidez.', quiTexte(x.avec)) : T('La vidéo se prépare. Revenez dans un instant.')) + '</p>' +
      '<div class="actions"><button class="btn-or" data-publier="' + esc(x.id) + '"' + (ST.occupe[x.id] || (!x.video && !ST.apercu) ? ' disabled' : '') + '>' + esc(T('Publier le duo')) + '</button>';
    if(x.tours + 1 < (x.toursMax || 3)) h += '<button data-redemander="' + esc(x.id) + '">' + esc(T('Demander de refaire')) + '</button>';
    h += '<button data-decliner="' + esc(x.id) + '">' + esc(ST.sur['decliner' + x.id] ? T('Toucher encore pour ne pas publier') : T('Ne pas publier')) + '</button></div>';
    if(ST.sur['redemander' + x.id]) h += '<form class="form" data-redemander-form="' + esc(x.id) + '"><label>' + esc(T('Ce qu’il faudrait changer (facultatif)')) + '<input name="motif" maxlength="140"></label>' +
      '<button type="submit">' + esc(T('Envoyer la demande')) + '</button></form>';
  } else if(x.etat === 'publiee') h += retirerBouton(x);
  return h + '</div></div>';
}
function rendreListes(){
  var h = '';
  if(ST.recus.length) h += '<section aria-labelledby="hRecus"><h2 id="hRecus">' + esc(T('Invitations reçues')) + (ST.apercu ? '<span class="apercu">' + esc(T('Aperçu')) + '</span>' : '') + '</h2>' + ST.recus.map(rendreRecu).join('') + '</section>';
  if(ST.envoyes.length) h += '<section aria-labelledby="hEnvoyes"><h2 id="hEnvoyes">' + esc(T('Mes duos')) + (ST.apercu ? '<span class="apercu">' + esc(T('Aperçu')) + '</span>' : '') + '</h2>' + ST.envoyes.map(rendreEnvoye).join('') + '</section>';
  if(!h && ST.etat === 'ok') h = '<section><p class="vide">' + esc(T('Aucun duo pour l’instant : commencez le premier.')) + '</p></section>';
  return h;
}
function rendrePied(){
  var h = '<label>' + esc(T('Langue')) + ' <select id="langue">' + Object.keys(LANGUES_UI).map(function(k){ return '<option value="' + k + '"' + (k === L ? ' selected' : '') + '>' + esc(LANGUES_UI[k].nom) + '</option>'; }).join('') + '</select></label>';
  if(LANGUES_UI[L].relire) h += '<span>' + esc(T('Traduction en cours de relecture.')) + '</span>';
  h += '<span>' + esc(T('À partir de 16 ans. Votre moitié n’est jamais publiée seule ; le duo n’est publié que si vous l’acceptez tous les deux, et chacun peut le retirer à tout moment.')) + '</span>';
  $('pied').innerHTML = h;
}
function rendre(){
  document.title = T('Côte à côte') + ' · NEURAVID';
  $('titre').textContent = T('Côte à côte');
  $('soustitre').textContent = T('Un duo à distance : vous et une personne d’un autre pays, sur le même écran.');
  rendreEtat();
  var h = '';
  if(ST.cap && (ST.etat === 'ok')) h = rendreNouveau() + rendreListes();
  var ae = document.activeElement, focus = null;
  if(ae && $('contenu').contains(ae)){ if(ae.id) focus = '#' + ae.id; else { for(var k = 0; k < ae.attributes.length; k++){ var at = ae.attributes[k]; if(/^data-/.test(at.name) && at.name !== 'data-demo'){ focus = '[' + at.name + '="' + String(at.value).replace(/["\\]/g, '') + '"]'; break; } } } }
  $('contenu').innerHTML = h;
  if(focus){ try{ var fe = document.querySelector(focus); if(fe) fe.focus({preventScroll:true}); }catch(e){} }
  if(ST.prise && $('vPrise')){ try{ $('vPrise').src = ST.prise.url; }catch(e){} }
  /* une moitié servie sans autorisation de lecture croisée : elle reste visible sans « crossorigin » */
  Array.prototype.forEach.call(document.querySelectorAll('video[crossorigin]'), function(v){ v.onerror = function(){ if(v.getAttribute('crossorigin') !== null){ v.removeAttribute('crossorigin'); v.src = v.getAttribute('src'); v.load(); } }; });
  if(ST.apercu) Array.prototype.forEach.call(document.querySelectorAll('canvas[data-demo]'), function(c){ var x = trouver(c.getAttribute('data-demo')); demoDessiner(c, x); });
  /* ouvert depuis une notification du Tam-tam : le duo concerné est montré */
  if(ST.vers && ST.etat === 'ok'){ var dv = document.querySelector('[data-duo="' + String(ST.vers).replace(/["\\]/g, '') + '"]'); if(dv){ dv.classList.add('vise'); try{ dv.scrollIntoView({block:'center'}); }catch(e){} } ST.vers = null; }
  rendrePied();
}

/* ════════ FILMER (avec La Forge) ════════ */
function noterFilm(o){ o.quand = Date.now(); var t = JSON.stringify(o); try{ sessionStorage.setItem(CLE_FILM, t); }catch(e){} try{ localStorage.setItem(CLE_FILM, t); }catch(e){} }
function lireFilm(){ var f = null; try{ f = JSON.parse(sessionStorage.getItem(CLE_FILM) || 'null'); }catch(e){} if(!f){ try{ f = JSON.parse(localStorage.getItem(CLE_FILM) || 'null'); }catch(e){} } return f; }
function oublierFilm(){ try{ sessionStorage.removeItem(CLE_FILM); }catch(e){} try{ localStorage.removeItem(CLE_FILM); }catch(e){} }
function forgeOk(){ if(!window.NVCamera || !NVCamera.studioJoignable()){ toast(T('La Forge n’est pas joignable ici.')); return false; } return true; }
function filmerMoitie(){
  var f = ST.form; f.invite = String(f.invite || '').trim();
  if(!/^@?[A-Za-z0-9_.]{2,40}$/.test(f.invite)){ toast(T('Écrivez le pseudo de la personne à inviter.')); var i = $('iInvite'); if(i) i.focus(); return; }
  if(ST.apercu){ ST.prise = {quoi:'nouveau', url:'', blob:null, apercu:true}; rendre(); return; }
  if(!forgeOk()) return;
  noterFilm({quoi:'nouveau', invite:f.invite, disposition:f.disposition, message:f.message});
  emit('cote_filmer', {quoi:'nouveau'});
  NVCamera.filmer({module:MOI, defi:'nouveau', titre:T('Ma moitié'), mode:'video', minSeconds:1, maxSeconds:60,
    regles:[T('Votre moitié : 60 secondes au plus.'), f.disposition === 'hb' ? T('Vous serez en haut de l’écran.') : T('Vous serez à gauche de l’écran.')]});
}
function filmerReponse(id){
  var x = trouver(id); if(!x) return;
  if(ST.apercu){ ST.prise = {quoi:'repondre', duo:id, url:'', blob:null, apercu:true}; rendre(); return; }
  if(!x.moitie){ toast(T('Ce duo a changé entre-temps.')); charger(); return; }
  if(!forgeOk()) return;
  noterFilm({quoi:'repondre', duo:id});
  emit('cote_filmer', {quoi:'repondre', duo:id});
  var max = nombre(x.secondes) ? Math.min(60, Math.ceil(x.secondes) + 1) : 60;
  NVCamera.filmer({module:MOI, defi:id, titre:T('Duo avec {0}', quiTexte(x.avec)), mode:'video', minSeconds:1, maxSeconds:max,
    duo:{url:x.moitie, auteur:x.avec && x.avec.handle && x.avec.mineur === false ? '@' + x.avec.handle : null, dispo:x.disposition === 'hb' ? 'hb' : 'gd'},
    regles:[T('Filmez votre moitié à côté de la sienne.')]});
}
/* au retour de La Forge : la prise reste liée à SON duo (contexte rendu, sinon la note gardée) */
function reprendrePrise(retour){
  var f = lireFilm(), defi = retour || (f && (f.quoi === 'nouveau' ? 'nouveau' : f.duo));
  if(!defi || !window.NVCamera || (!retour && Date.now() - ((f && f.quand) || 0) > 3600000)) return Promise.resolve();
  return NVCamera.recuperer(MOI, defi).then(function(p){
    if(!p || !p.blob) return;
    if(f && f.quoi === 'nouveau' && defi === 'nouveau'){ ST.form = {invite:f.invite || '', disposition:f.disposition === 'hb' ? 'hb' : 'gd', message:f.message || ''}; }
    oublierFilm();
    ST.prise = {quoi:defi === 'nouveau' ? 'nouveau' : 'repondre', duo:defi === 'nouveau' ? null : defi, blob:p.blob, url:URL.createObjectURL(p.blob),
      secondes:nombre(p.meta && (p.meta.seconds || p.meta.secondes)), meta:p.meta || {}};
    return garderPrise(ST.prise);
  });
}
function dureeBlob(prise){
  if(prise.secondes || !prise.url) return Promise.resolve(prise.secondes || null);
  return new Promise(function(res){ var v = document.createElement('video'), fait = false; v.preload = 'metadata'; v.muted = true;
    var fin = function(x){ if(fait) return; fait = true; res(x); try{ v.removeAttribute('src'); v.load(); }catch(e){} };
    v.onloadedmetadata = function(){ if(isFinite(v.duration) && v.duration > 0) return fin(v.duration);
      v.ondurationchange = function(){ if(isFinite(v.duration) && v.duration > 0) fin(v.duration); }; try{ v.currentTime = 1e7; }catch(e){ fin(null); } };
    v.onerror = function(){ fin(null); }; v.src = prise.url; setTimeout(function(){ fin(null); }, 4000); });
}
function oublierPrise(){ if(ST.prise){ try{ if(ST.prise.url) URL.revokeObjectURL(ST.prise.url); }catch(e){} } ST.prise = null; garderPrise(null); }
/* la prise est gardée sur le téléphone (IndexedDB) jusqu'à ce que le serveur l'ait reçue : un rechargement ne la perd pas */
function baseLocale(){ return new Promise(function(res){ try{ var r = indexedDB.open('nv_cote', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('prises'); };
  r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ res(null); }; }catch(e){ res(null); } setTimeout(function(){ res(null); }, 2000); }); }
function cleLocale(){ var u = utilisateur(); return 'prise|' + (u && u.id ? u.id : '—'); }
function garderPrise(pr){
  if(ST.apercu) return Promise.resolve();
  return baseLocale().then(function(db){ if(!db) return; return new Promise(function(res){ try{ var t = db.transaction('prises', 'readwrite'), st = t.objectStore('prises');
    if(pr && pr.blob) st.put({quoi:pr.quoi, duo:pr.duo || null, blob:pr.blob, secondes:pr.secondes || null, meta:pr.meta || {}, form:pr.quoi === 'nouveau' ? ST.form : null, cle:pr.cle || null, quand:Date.now()}, cleLocale());
    else st.delete(cleLocale());
    t.oncomplete = function(){ res(); }; t.onerror = function(){ res(); }; }catch(e){ res(); } }); });
}
function reprendrePriseLocale(){
  if(ST.prise || ST.apercu) return Promise.resolve();
  return baseLocale().then(function(db){ if(!db) return; return new Promise(function(res){ try{ var q = db.transaction('prises', 'readonly').objectStore('prises').get(cleLocale());
    q.onsuccess = function(){ var o = q.result; if(o && o.blob && Date.now() - (o.quand || 0) < 7 * 864e5){ if(o.form) ST.form = {invite:o.form.invite || '', disposition:o.form.disposition === 'hb' ? 'hb' : 'gd', message:o.form.message || ''};
      ST.prise = {quoi:o.quoi, duo:o.duo, blob:o.blob, url:URL.createObjectURL(o.blob), secondes:o.secondes, meta:o.meta || {}, cle:o.cle || null}; } res(); };
    q.onerror = function(){ res(); }; }catch(e){ res(); } }); });
}
function envoyerPrise(){
  var pr = ST.prise; if(!pr || ST.envoi) return;
  ST.envoi = true; rendre();
  if(!pr.cle){ pr.cle = 'ct-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); garderPrise(pr); }      /* la même clé après un rechargement */
  dureeBlob(pr).then(function(s){
    if(s != null && s > 61) throw {code:'trop_long'};
    if(ST.apercu) return demoEnvoyer(pr);
    var fd = new FormData();
    if(s != null) fd.append('seconds', String(Math.round(s * 100) / 100));          /* inconnue : non envoyée, jamais inventée */
    if(pr.meta && pr.meta.provenance) try{ fd.append('meta', JSON.stringify({provenance:pr.meta.provenance})); }catch(e){}
    var chemin;
    if(pr.quoi === 'nouveau'){ fd.append('invite', '@' + ST.form.invite.replace(/^@/, '')); fd.append('disposition', ST.form.disposition); if(ST.form.message) fd.append('message', ST.form.message); chemin = '/v1/cote'; }
    else chemin = '/v1/cote/' + encodeURIComponent(pr.duo) + '/repondre';
    fd.append('video', pr.blob, 'moitie.' + (/mp4/.test(pr.blob.type) ? 'mp4' : 'webm'));
    return appeler('POST', chemin, fd, pr.cle);
  }).then(function(){
    emit(pr.quoi === 'nouveau' ? 'cote_inviter' : 'cote_repondre', {duo:pr.duo || null});
    toast(pr.quoi === 'nouveau' ? T('Invitation envoyée.') : T('Votre moitié est envoyée.'));
    if(pr.quoi === 'nouveau') ST.form = {invite:'', disposition:'gd', message:''};
    oublierPrise();
    return ST.apercu ? null : charger();
  }, function(e){
    if(e && e.code === 'cle_reutilisee'){ oublierPrise(); toast(T('Déjà envoyé.')); return charger(); }
    if(e && e.code === 'en_cours'){ toast(T('Envoi déjà en cours : patientez un instant.')); return; }
    toast(erreurTexte(e));
    /* une invitation refusée (personne, âge, réglages) : la moitié est gardée, on peut corriger le pseudo */
    if(e && pr.quoi === 'repondre' && /^duo_/.test(e.code || '')){ oublierPrise(); return charger(); }
  }).then(function(){ ST.envoi = false; rendre(); });
}

/* ════════ LES DÉCISIONS ════════ */
function deuxTouchers(cle){ if(ST.sur[cle]) { delete ST.sur[cle]; return true; } ST.sur[cle] = true; rendre(); return false; }

  else { moitie(0, 0, W / 2, H, x.role === 'auteur' ? moi : x.avec.pays, drapeau(x.role === 'auteur' ? moi : x.avec.pays)); moitie(W / 2, 0, W / 2, H, x.role === 'auteur' ? x.avec.pays : moi, drapeau(x.role === 'auteur' ? x.avec.pays : moi)); }

/* ════════ LE DÉMARRAGE ════════ */
function demarrer(){
  poserLangue(langueDetectee());
  /* 17 nov. 2026 (Karamo) : sans serveur branché, la page montre son aperçu (repère « Aperçu »), aussi dans l'application,
     comme les autres modules ; dès qu'un serveur est branché, seul le vrai contenu est montré. */

  try{ var c = JSON.parse(sessionStorage.getItem('nv_ctx_' + MOI) || 'null'); if(c && c.module === MOI && typeof c.defi === 'string') retour = c.defi; if(c && typeof c.duo === 'string') ST.vers = c.duo; if(c && typeof c.invite === 'string' && /^@?[\w.]{2,40}$/.test(c.invite)) ST.form.invite = '@' + c.invite.replace(/^@/, ''); sessionStorage.removeItem('nv_ctx_' + MOI); }catch(e){}
  rendre();

  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if(!b) return;

    if(a('data-dispo')){ ST.form.disposition = a('data-dispo') === 'hb' ? 'hb' : 'gd'; rendre(); var q = document.querySelector('[data-dispo="' + ST.form.disposition + '"]'); if(q) q.focus(); }

    else if(a('data-refaire-prise')){ var id = a('data-refaire-prise'); if(deuxTouchers('refairePrise' + id)){ oublierPrise(); filmerReponse(id); } }
    else if(a('data-refuser')){ if(deuxTouchers('refuser' + a('data-refuser'))) agir(a('data-refuser'), 'refuser', null, 'Duo refusé.'); }
    else if(a('data-annuler')){ if(deuxTouchers('annuler' + a('data-annuler'))) agir(a('data-annuler'), 'annuler', null, 'Invitation annulée.'); }

    else if(a('data-redemander')){ ST.sur['redemander' + a('data-redemander')] = !ST.sur['redemander' + a('data-redemander')]; rendre(); }
  });
  document.addEventListener('input', function(ev){
    var t = ev.target; if(!t) return;

  });

  });

  });
  window.NVCote = {etat:function(){ return {etat:ST.etat, apercu:ST.apercu, envoyes:ST.envoyes.length, recus:ST.recus.length, prise:!!ST.prise, langue:L}; }};
}

      x.style.cssText = b + (plein ? ';background:linear-gradient(135deg,#F3D27A,#E8B84A);color:#231800' : ';background:rgba(255,255,255,.1);color:#fff');
      x.addEventListener('click', fn); zone.appendChild(x); }
    if(info.src) bouton(T[3], true, function(){ revoir(); });
    bouton(T[4], !info.src, versIris);
    d.querySelector('[data-x]').addEventListener('click', function(){ d.remove(); });
    document.body.appendChild(d);
  }
  /* le module ouvre lui-même la vidéo s'il le sait ; sinon le bandeau */
  var debut = Date.now();
  /* « Relever le défi » (21 nov. 2026) : le module montre son défi (ou ses épreuves) avec ce qu'il faut pour participer ;
     chaque module qui sait mieux le faire range sa fonction dans window.NV_RELEVER_H (fonction(info) → true). */
  var RELEVER = {
    ChallengeUniverse:function(){ var a = window.NVUniversAPI; if(a && a.ouvrirDefi && info.defi){ a.ouvrirDefi(info.defi); return true; } },
    LoveUniverse:function(){ var a = window.NVLoveUniverse; if(a && a.defi && info.defi){ a.defi(info.defi); return true; } },
    ViralStorm:function(){ var a = window.NVViralStorm; if(a && a.ouvrirDefi && info.defi){ a.ouvrirDefi(info.defi); return true; } },
    Battle:function(){ var a = window.NVBattle; if(a && a.defier){ a.defier(); return true; } },
    MissMaster:function(){ var a = window.NVMissMaster; if(a && a.montrer){ a.montrer('epreuves'); return true; } },
    Artistes:function(){ var a = window.NVArtistes; if(a && a.montrer){ a.montrer('epreuves'); return true; } },
    CinemaWorld:function(){ var a = window.NVCinemaWorld; if(a && a.montrer){ a.montrer('defis'); return true; } },
    Arena:function(){ var a = window.NVArenaAPI; if(a && a.montrer){ a.montrer('arene'); return true; } },
    ArenaArts:function(){ var a = window.NVArenaArts; if(a && a.open){ a.open('arts'); return true; } }
  };
  function essayerRelever(){
    var h = window.NV_RELEVER_H || [];
    for(var i = 0; i < h.length; i++){ try{ if(h[i](info) === true) return true; }catch(e){} }
    try{ return RELEVER[MOD] ? RELEVER[MOD].call(null, info) === true : false; }catch(e){ return false; }
  }
  function essayer(){
    if(info.action === 'relever'){
      /* le bandeau dit toujours qu'on relève ce défi (avec « Revoir la vidéo ») ; le module montre en plus son défi s'il le sait */
      var fait = essayerRelever();
      if(!fait && Date.now() - debut < 6000){ setTimeout(essayer, 500); return; }
      if(document.body) bandeau(); return;
    }
    var h = window.NV_DEPUIS_IRIS_H || [];
    for(var i = 0; i < h.length; i++){ try{ var r = h[i](info); if(r === true){ info.ouvert = true; return; } }catch(e){} }
    var e = Date.now() - debut;
    if(e < 8000 && (h.length || e < 1500)){ setTimeout(essayer, 500); return; }     /* aucun module qui sait l'ouvrir : le bandeau tout de suite */
    if(document.body) bandeau();
  }
  function partir(){ setTimeout(essayer, 400); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', partir); else partir();
}catch(e){ /* rien */ } })();
</script><!--/NV_DEPUIS_IRIS-->
