<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140b33">
<title>Côte à côte · NEURAVID</title>
<style>
/* Côte à côte : un duo à distance, l'écran partagé en deux (16 novembre 2026).
   Aucune ressource extérieure : les vidéos viennent des serveurs (univers et publication). */
:root{
  --nuit:#140b33; --nuit2:#1c1147; --alv:#241657; --craie:#f6f1ff; --brume:rgba(236,228,255,.74); --trait:rgba(255,255,255,.16);
  --or:#ffc531; --argent:#d7dbe6; --bronze:#e0995a; --cyan:#16e0d4; --rose:#ff4f9e; --rouge:#ff7a7a;
  --hex:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--nuit);color:var(--craie);font:16px/1.45 var(--sans);min-height:100vh}
main{max-width:768px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.hex{width:34px;height:30px;flex:0 0 auto;clip-path:var(--hex);background:linear-gradient(135deg,var(--cyan),#6c2bd9);display:grid;place-items:center}
.hex i{width:14px;height:14px;border-radius:50%;background:var(--nuit);box-shadow:inset 0 0 0 4px var(--craie)}
h1{font-size:1.2rem;margin:0;line-height:1.2}
h2{font-size:1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:12px;height:11px;clip-path:var(--hex);background:var(--cyan);flex:0 0 auto}
.sous{margin:0;color:var(--brume);font-size:.88rem}
.apercu{display:inline-block;margin-inline-start:6px;padding:1px 8px;border-radius:999px;background:var(--or);color:#2a1a00;font-size:.75rem;font-weight:800;vertical-align:middle}
#etat{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:var(--nuit2);border:1px solid var(--trait);font-size:.9rem}
#etat.hl{border-color:var(--or)}
#etat.ok{border-color:rgba(22,224,212,.5)}
section{background:var(--nuit2);border:1px solid var(--trait);border-radius:14px;padding:12px 14px;margin:0 0 12px}
ul{list-style:none;margin:0;padding:0}
li{padding:7px 0;border-top:1px solid var(--trait)}
li:first-child{border-top:0}
.l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.d{color:var(--brume);font-size:.86rem}
.puce{display:inline-block;padding:0 7px;border-radius:999px;font-size:.75rem;font-weight:700;border:1px solid var(--trait);white-space:nowrap}
.puce.an{color:var(--rouge);border-color:var(--rouge)}
.puce.re{color:var(--or);border-color:var(--or)}
.puce.co{color:var(--cyan);border-color:var(--cyan)}
.chiffres{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.chiffres b{display:block;font-size:1.25rem}
.chiffres span{font-size:.75rem;color:var(--brume)}
.med{display:inline-flex;align-items:center;gap:3px;margin-inline-end:8px;white-space:nowrap}
.med i{width:12px;height:11px;clip-path:var(--hex);display:inline-block}
.or i{background:var(--or)} .ar i{background:var(--argent)} .br i{background:var(--bronze)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:5px 4px;text-align:center;border-top:1px solid var(--trait)}
td:first-child,th:first-child{text-align:start}
th{font-size:.75rem;color:var(--brume);font-weight:600;border-top:0}
button,select,.lien{font:inherit;color:inherit}
button{min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--trait);background:var(--alv);cursor:pointer}
button:focus-visible,select:focus-visible,.lien:focus-visible{outline:2px solid var(--or);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.actions button{flex:1 1 140px}
.lien{background:none;border:0;padding:6px 0;min-height:36px;color:var(--cyan);text-decoration:underline;cursor:pointer;font-size:.88rem}
.jours button{min-height:40px;margin-block:4px 0;margin-inline:0 6px;padding:6px 10px;font-size:.88rem}
.jours button[aria-current="true"]{border-color:var(--or)}
footer{color:var(--brume);font-size:.8rem;display:grid;gap:8px;margin-top:4px}
footer label{display:flex;gap:8px;align-items:center}
select{min-height:40px;border-radius:10px;background:var(--alv);border:1px solid var(--trait);padding:4px 8px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--craie);color:var(--nuit);padding:8px 14px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.vide{color:var(--brume);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[dir="rtl"] .l1{direction:rtl}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
@media (min-width:560px){h1{font-size:1.35rem}}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{min-height:40px;padding:4px 12px;font-size:.88rem;border-radius:999px}
.chips button[aria-pressed="true"]{border-color:var(--or);color:var(--or)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:.88rem;color:var(--brume)}
input,textarea{font:inherit;color:var(--craie);background:var(--alv);border:1px solid var(--trait);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.btn-or{background:linear-gradient(135deg,var(--or),#ff9f1c);color:#2a1a00;border:0;font-weight:800}
.duo{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--trait)}
.duo:first-of-type{border-top:0}
.duo video,.duo canvas{width:96px;aspect-ratio:9/16;border-radius:10px;background:#000;object-fit:cover;display:block}
.duo .qui{font-weight:700}
.duo .actions{margin:8px 0 0}
.duo .actions button{flex:1 1 120px;min-height:40px;padding:6px 10px;font-size:.88rem}
.grand video,.grand canvas{width:100%;max-width:300px;aspect-ratio:9/16;border-radius:12px;background:#000;display:block;margin:0 auto 10px}
.ecran{display:grid;grid-template-columns:1fr 1fr;gap:3px;max-width:300px;margin:0 auto 10px;border-radius:12px;overflow:hidden}
.ecran.hb{grid-template-columns:1fr}
.ecran i{display:grid;place-items:center;aspect-ratio:9/16;background:var(--alv);font-style:normal;font-size:.8rem;color:var(--brume);text-align:center;padding:6px}
.ecran.hb i{aspect-ratio:16/9}
.ecran i.moi{background:linear-gradient(135deg,rgba(22,224,212,.25),rgba(108,43,217,.35));color:var(--craie)}
.message{margin:4px 0 0;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.06);font-size:.88rem}
.duo.vise{outline:2px solid var(--or);outline-offset:4px;border-radius:12px}
.ecran{direction:ltr}

/* ══ Identité de la nouveauté (17 nov. 2026, étape 3 du plan des 8 nouveautés) : ses couleurs, son bandeau, ses cartes ══ */
:root{--id1:#ff4f9e;--id2:#16e0d4}
header{position:relative;padding-bottom:13px;margin-bottom:8px}
header::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--id1),var(--id2) 55%,transparent)}
[dir=rtl] header::after{background:linear-gradient(270deg,var(--id1),var(--id2) 55%,transparent)}
.hex{background:linear-gradient(135deg,var(--id1),var(--id2));box-shadow:0 0 18px color-mix(in srgb,var(--id1) 45%,transparent)}
h2::before{background:linear-gradient(135deg,var(--id1),var(--id2))}
section{background:linear-gradient(180deg,color-mix(in srgb,var(--id1) 8%,transparent),transparent 80px),var(--nuit2)}

/* côte à côte : deux moitiés d'un même hexagone */
.vign{position:relative;width:96px}
.vign .sx{position:absolute;top:6px;inset-inline-start:6px;width:26px;height:23px;clip-path:var(--hex);display:flex;pointer-events:none;box-shadow:0 0 0 2px var(--nuit)}
.vign .sx i{flex:1;background:var(--id1)}.vign .sx i+i{background:var(--id2)}
.vign>i{display:block;width:96px;aspect-ratio:9/16;border-radius:10px;background:var(--alv)}
.vign>video,.vign>canvas,.vign>i{box-shadow:0 0 0 2px color-mix(in srgb,var(--id1) 55%,transparent),0 0 0 4px color-mix(in srgb,var(--id2) 35%,transparent)}
</style>

<div id="contenu"></div>
<footer id="pied"></footer>

       story flash s'arrête à sept secondes. Sans ça, la personne filme
       trente secondes et se fait refuser au retour. */
    try { racine.sessionStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    try { racine.localStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}

       d'écran : c'est plus rapide et rien ne peut se perdre. */
    try {

     ne revient jamais dans le défi, l'entrée reste — une vidéo de

function rendre(){

  $('contenu').innerHTML = h;
  if(focus){ try{ var fe = document.querySelector(focus); if(fe) fe.focus({preventScroll:true}); }catch(e){} }
  if(ST.prise && $('vPrise')){ try{ $('vPrise').src = ST.prise.url; }catch(e){} }
  /* une moitié servie sans autorisation de lecture croisée : elle reste visible sans « crossorigin » */
  Array.prototype.forEach.call(document.querySelectorAll('video[crossorigin]'), function(v){ v.onerror = function(){ if(v.getAttribute('crossorigin') !== null){ v.removeAttribute('crossorigin'); v.src = v.getAttribute('src'); v.load(); } }; });

/* ════════ FILMER (avec La Forge) ════════ */
function noterFilm(o){ o.quand = Date.now(); var t = JSON.stringify(o); try{ sessionStorage.setItem(CLE_FILM, t); }catch(e){} try{ localStorage.setItem(CLE_FILM, t); }catch(e){} }
function lireFilm(){ var f = null; try{ f = JSON.parse(sessionStorage.getItem(CLE_FILM) || 'null'); }catch(e){} if(!f){ try{ f = JSON.parse(localStorage.getItem(CLE_FILM) || 'null'); }catch(e){} } return f; }
function oublierFilm(){ try{ sessionStorage.removeItem(CLE_FILM); }catch(e){} try{ localStorage.removeItem(CLE_FILM); }catch(e){} }
function forgeOk(){ if(!window.NVCamera || !NVCamera.studioJoignable()){ toast(T('La Forge n’est pas joignable ici.')); return false; } return true; }
function filmerMoitie(){
  var f = ST.form; f.invite = String(f.invite || '').trim();
  if(!/^@?[A-Za-z0-9_.]{2,40}$/.test(f.invite)){ toast(T('Écrivez le pseudo de la personne à inviter.')); var i = $('iInvite'); if(i) i.focus(); return; }
  if(ST.apercu){ ST.prise = {quoi:'nouveau', url:'', blob:null, apercu:true}; rendre(); return; }
  if(!forgeOk()) return;
  noterFilm({quoi:'nouveau', invite:f.invite, disposition:f.disposition, message:f.message});
  emit('cote_filmer', {quoi:'nouveau'});
  NVCamera.filmer({module:MOI, defi:'nouveau', titre:T('Ma moitié'), mode:'video', minSeconds:1, maxSeconds:60,
    regles:[T('Votre moitié : 60 secondes au plus.'), f.disposition === 'hb' ? T('Vous serez en haut de l’écran.') : T('Vous serez à gauche de l’écran.')]});
}
function filmerReponse(id){
  var x = trouver(id); if(!x) return;
  if(ST.apercu){ ST.prise = {quoi:'repondre', duo:id, url:'', blob:null, apercu:true}; rendre(); return; }
  if(!x.moitie){ toast(T('Ce duo a changé entre-temps.')); charger(); return; }
  if(!forgeOk()) return;
  noterFilm({quoi:'repondre', duo:id});
  emit('cote_filmer', {quoi:'repondre', duo:id});
  var max = nombre(x.secondes) ? Math.min(60, Math.ceil(x.secondes) + 1) : 60;
  NVCamera.filmer({module:MOI, defi:id, titre:T('Duo avec {0}', quiTexte(x.avec)), mode:'video', minSeconds:1, maxSeconds:max,
    duo:{url:x.moitie, auteur:x.avec && x.avec.handle && x.avec.mineur === false ? '@' + x.avec.handle : null, dispo:x.disposition === 'hb' ? 'hb' : 'gd'},
    regles:[T('Filmez votre moitié à côté de la sienne.')]});
}
/* au retour de La Forge : la prise reste liée à SON duo (contexte rendu, sinon la note gardée) */
function reprendrePrise(retour){
  var f = lireFilm(), defi = retour || (f && (f.quoi === 'nouveau' ? 'nouveau' : f.duo));
  if(!defi || !window.NVCamera || (!retour && Date.now() - ((f && f.quand) || 0) > 3600000)) return Promise.resolve();
  return NVCamera.recuperer(MOI, defi).then(function(p){
    if(!p || !p.blob) return;
    if(f && f.quoi === 'nouveau' && defi === 'nouveau'){ ST.form = {invite:f.invite || '', disposition:f.disposition === 'hb' ? 'hb' : 'gd', message:f.message || ''}; }
    oublierFilm();
    ST.prise = {quoi:defi === 'nouveau' ? 'nouveau' : 'repondre', duo:defi === 'nouveau' ? null : defi, blob:p.blob, url:URL.createObjectURL(p.blob),
      secondes:nombre(p.meta && (p.meta.seconds || p.meta.secondes)), meta:p.meta || {}};
    return garderPrise(ST.prise);
  });
}
function dureeBlob(prise){
  if(prise.secondes || !prise.url) return Promise.resolve(prise.secondes || null);
  return new Promise(function(res){ var v = document.createElement('video'), fait = false; v.preload = 'metadata'; v.muted = true;
    var fin = function(x){ if(fait) return; fait = true; res(x); try{ v.removeAttribute('src'); v.load(); }catch(e){} };
    v.onloadedmetadata = function(){ if(isFinite(v.duration) && v.duration > 0) return fin(v.duration);
      v.ondurationchange = function(){ if(isFinite(v.duration) && v.duration > 0) fin(v.duration); }; try{ v.currentTime = 1e7; }catch(e){ fin(null); } };
    v.onerror = function(){ fin(null); }; v.src = prise.url; setTimeout(function(){ fin(null); }, 4000); });
}
function oublierPrise(){ if(ST.prise){ try{ if(ST.prise.url) URL.revokeObjectURL(ST.prise.url); }catch(e){} } ST.prise = null; garderPrise(null); }
/* la prise est gardée sur le téléphone (IndexedDB) jusqu'à ce que le serveur l'ait reçue : un rechargement ne la perd pas */
function baseLocale(){ return new Promise(function(res){ try{ var r = indexedDB.open('nv_cote', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('prises'); };
  r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ res(null); }; }catch(e){ res(null); } setTimeout(function(){ res(null); }, 2000); }); }
function cleLocale(){ var u = utilisateur(); return 'prise|' + (u && u.id ? u.id : '—'); }
function garderPrise(pr){
  if(ST.apercu) return Promise.resolve();
  return baseLocale().then(function(db){ if(!db) return; return new Promise(function(res){ try{ var t = db.transaction('prises', 'readwrite'), st = t.objectStore('prises');
    if(pr && pr.blob) st.put({quoi:pr.quoi, duo:pr.duo || null, blob:pr.blob, secondes:pr.secondes || null, meta:pr.meta || {}, form:pr.quoi === 'nouveau' ? ST.form : null, cle:pr.cle || null, quand:Date.now()}, cleLocale());
    else st.delete(cleLocale());
    t.oncomplete = function(){ res(); }; t.onerror = function(){ res(); }; }catch(e){ res(); } }); });
}
function reprendrePriseLocale(){
  if(ST.prise || ST.apercu) return Promise.resolve();
  return baseLocale().then(function(db){ if(!db) return; return new Promise(function(res){ try{ var q = db.transaction('prises', 'readonly').objectStore('prises').get(cleLocale());
    q.onsuccess = function(){ var o = q.result; if(o && o.blob && Date.now() - (o.quand || 0) < 7 * 864e5){ if(o.form) ST.form = {invite:o.form.invite || '', disposition:o.form.disposition === 'hb' ? 'hb' : 'gd', message:o.form.message || ''};
      ST.prise = {quoi:o.quoi, duo:o.duo, blob:o.blob, url:URL.createObjectURL(o.blob), secondes:o.secondes, meta:o.meta || {}, cle:o.cle || null}; } res(); };
    q.onerror = function(){ res(); }; }catch(e){ res(); } }); });
}
function envoyerPrise(){
  var pr = ST.prise; if(!pr || ST.envoi) return;
  ST.envoi = true; rendre();
  if(!pr.cle){ pr.cle = 'ct-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); garderPrise(pr); }      /* la même clé après un rechargement */
  dureeBlob(pr).then(function(s){
    if(s != null && s > 61) throw {code:'trop_long'};
    if(ST.apercu) return demoEnvoyer(pr);
    var fd = new FormData();
    if(s != null) fd.append('seconds', String(Math.round(s * 100) / 100));          /* inconnue : non envoyée, jamais inventée */
    if(pr.meta && pr.meta.provenance) try{ fd.append('meta', JSON.stringify({provenance:pr.meta.provenance})); }catch(e){}
    var chemin;
    if(pr.quoi === 'nouveau'){ fd.append('invite', '@' + ST.form.invite.replace(/^@/, '')); fd.append('disposition', ST.form.disposition); if(ST.form.message) fd.append('message', ST.form.message); chemin = '/v1/cote'; }
    else chemin = '/v1/cote/' + encodeURIComponent(pr.duo) + '/repondre';
    fd.append('video', pr.blob, 'moitie.' + (/mp4/.test(pr.blob.type) ? 'mp4' : 'webm'));
    return appeler('POST', chemin, fd, pr.cle);
  }).then(function(){
    emit(pr.quoi === 'nouveau' ? 'cote_inviter' : 'cote_repondre', {duo:pr.duo || null});
    toast(pr.quoi === 'nouveau' ? T('Invitation envoyée.') : T('Votre moitié est envoyée.'));
    if(pr.quoi === 'nouveau') ST.form = {invite:'', disposition:'gd', message:''};
    oublierPrise();
    return ST.apercu ? null : charger();
  }, function(e){
    if(e && e.code === 'cle_reutilisee'){ oublierPrise(); toast(T('Déjà envoyé.')); return charger(); }
    if(e && e.code === 'en_cours'){ toast(T('Envoi déjà en cours : patientez un instant.')); return; }
    toast(erreurTexte(e));
    /* une invitation refusée (personne, âge, réglages) : la moitié est gardée, on peut corriger le pseudo */
    if(e && pr.quoi === 'repondre' && /^duo_/.test(e.code || '')){ oublierPrise(); return charger(); }
  }).then(function(){ ST.envoi = false; rendre(); });
}

/* ════════ LES DÉCISIONS ════════ */
function deuxTouchers(cle){ if(ST.sur[cle]) { delete ST.sur[cle]; return true; } ST.sur[cle] = true; rendre(); return false; }
function agir(id, quoi, corps, message){
  if(ST.occupe[id]) return; ST.occupe[id] = true; rendre();
  var p = ST.apercu ? Promise.resolve(demoAgir(id, quoi)) : appeler('POST', '/v1/cote/' + encodeURIComponent(id) + '/' + quoi, corps || {}, 'cta-' + id + '-' + quoi + '-' + (trouver(id) || {}).tours);
  p.then(function(){ toast(T(message)); emit('cote_' + quoi, {duo:id}); return ST.apercu ? null : charger(); }, function(e){ toast(erreurTexte(e)); return ST.apercu ? null : charger(); })
    .then(function(){ delete ST.occupe[id]; rendre(); });
}

/* ════════ L'APERÇU (démonstration seulement) ════════ */
function demoDuos(){
  var j = Date.now(), d = function(n){ return new Date(j + n * 864e5).toISOString(); };
  return {
    recus:[{id:'ct_ap1', role:'invite', etat:'invitation', disposition:'gd', message:'On danse le même pas, toi à Conakry, moi à Abidjan ?', secondes:12, tours:0, toursMax:3,
      avec:{id:'u-ap1', nom:'Aminata', handle:'aminata', pays:'CI'}, expire:d(6), moitie:null, video:null}],
    envoyes:[{id:'ct_ap2', role:'auteur', etat:'a_valider', disposition:'hb', message:'Ma recette, ta recette !', secondes:20, tours:0, toursMax:3,
      avec:{id:'u-ap2', nom:'Lucas', handle:'lucas', pays:'BR'}, expire:d(12), moitie:null, video:null},
      {id:'ct_ap3', role:'auteur', etat:'publiee', disposition:'gd', message:'', secondes:15, tours:1, toursMax:3,
      avec:{id:'u-ap3', nom:'Wanjiru', handle:'wanjiru', pays:'KE'}, expire:null, moitie:null, video:null}]};
}
function demoAgir(id, quoi){
  var x = trouver(id); if(!x) return;
  x.etat = {refuser:'refusee', annuler:'annulee', publier:'publiee', decliner:'declinee', retirer:'retiree', refaire:'invitation'}[quoi] || x.etat;
  if(quoi === 'refaire') x.tours++;
}
function demoEnvoyer(pr){
  if(pr.quoi === 'nouveau') ST.envoyes.unshift({id:'ct_ap' + Date.now(), role:'auteur', etat:'invitation', disposition:ST.form.disposition, message:ST.form.message, secondes:null, tours:0, toursMax:3,
    avec:{id:null, handle:ST.form.invite.replace(/^@/, ''), pays:''}, expire:new Date(Date.now() + 7 * 864e5).toISOString(), moitie:null, video:null});
  else { var x = trouver(pr.duo); if(x) x.etat = 'a_valider'; }
}
function demoDessiner(c, x){
  var g = c.getContext('2d'); if(!g || !x) return; var W = c.width, H = c.height, hb = x.disposition === 'hb';
  var teinte = function(iso){ iso = iso || 'NV'; return (iso.charCodeAt(0) * 7 + iso.charCodeAt(1)) % 360; };
  var moitie = function(x0, y0, w, h, iso, dra){ var k = teinte(iso), gr = g.createLinearGradient(x0, y0, x0 + w, y0 + h); gr.addColorStop(0, 'hsl(' + k + ',70%,38%)'); gr.addColorStop(1, 'hsl(' + ((k + 60) % 360) + ',70%,18%)');
    g.fillStyle = gr; g.fillRect(x0, y0, w, h); g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = Math.round(Math.min(w, h) * .32) + 'px sans-serif'; g.fillText(dra, x0 + w / 2, y0 + h * .58); };
  var moi = (utilisateur() && utilisateur().iso) || 'GN';
  if(hb){ moitie(0, 0, W, H / 2, x.role === 'auteur' ? moi : x.avec.pays, drapeau(x.role === 'auteur' ? moi : x.avec.pays)); moitie(0, H / 2, W, H / 2, x.role === 'auteur' ? x.avec.pays : moi, drapeau(x.role === 'auteur' ? x.avec.pays : moi)); }
  else { moitie(0, 0, W / 2, H, x.role === 'auteur' ? moi : x.avec.pays, drapeau(x.role === 'auteur' ? moi : x.avec.pays)); moitie(W / 2, 0, W / 2, H, x.role === 'auteur' ? x.avec.pays : moi, drapeau(x.role === 'auteur' ? x.avec.pays : moi)); }
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, H - 18, W, 18); g.fillStyle = '#ffc531'; g.font = 'bold 11px sans-serif'; g.fillText(T('Aperçu'), W / 2, H - 5);
}

/* ════════ LE DÉMARRAGE ════════ */
function demarrer(){
  poserLangue(langueDetectee());
  /* 17 nov. 2026 (Karamo) : sans serveur branché, la page montre son aperçu (repère « Aperçu »), aussi dans l'application,
     comme les autres modules ; dès qu'un serveur est branché, seul le vrai contenu est montré. */
  ST.apercu = !api();
  if(ST.apercu && !utilisateur()){ try{ window.NV_USER = {id:'demo', handle:'visiteur', prenom:'Aya', age:25, majeur:true, iso:'GN'}; }catch(e){} }
  var retour = null;
  try{ var c = JSON.parse(sessionStorage.getItem('nv_ctx_' + MOI) || 'null'); if(c && c.module === MOI && typeof c.defi === 'string') retour = c.defi; if(c && typeof c.duo === 'string') ST.vers = c.duo; sessionStorage.removeItem('nv_ctx_' + MOI); }catch(e){}
  rendre();
  reprendrePrise(retour).then(reprendrePriseLocale, reprendrePriseLocale).then(charger, charger);
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if(!b) return;
    var a = function(k){ return b.getAttribute(k); };
    if(a('data-dispo')){ ST.form.disposition = a('data-dispo') === 'hb' ? 'hb' : 'gd'; rendre(); var q = document.querySelector('[data-dispo="' + ST.form.disposition + '"]'); if(q) q.focus(); }
    else if(b.id === 'bInviter') envoyerPrise();
    else if(b.id === 'bRefaireMoitie'){ if(deuxTouchers('refaireNouveau')){ oublierPrise(); filmerMoitie(); } }
    else if(a('data-filmer')) filmerReponse(a('data-filmer'));
    else if(a('data-envoyer')) envoyerPrise();
    else if(a('data-refaire-prise')){ var id = a('data-refaire-prise'); if(deuxTouchers('refairePrise' + id)){ oublierPrise(); filmerReponse(id); } }
    else if(a('data-refuser')){ if(deuxTouchers('refuser' + a('data-refuser'))) agir(a('data-refuser'), 'refuser', null, 'Duo refusé.'); }
    else if(a('data-annuler')){ if(deuxTouchers('annuler' + a('data-annuler'))) agir(a('data-annuler'), 'annuler', null, 'Invitation annulée.'); }
    else if(a('data-decliner')){ if(deuxTouchers('decliner' + a('data-decliner'))) agir(a('data-decliner'), 'decliner', null, 'Le duo ne sera pas publié.'); }
    else if(a('data-retirer')){ if(deuxTouchers('retirer' + a('data-retirer'))) agir(a('data-retirer'), 'retirer', null, 'Duo retiré.'); }
    else if(a('data-publier')) agir(a('data-publier'), 'publier', null, 'Duo publié.');
    else if(a('data-redemander')){ ST.sur['redemander' + a('data-redemander')] = !ST.sur['redemander' + a('data-redemander')]; rendre(); }
  });
  document.addEventListener('input', function(ev){
    var t = ev.target; if(!t) return;
    if(t.id === 'iInvite') ST.form.invite = t.value; else if(t.id === 'iMessage') ST.form.message = t.value;
  });
  document.addEventListener('submit', function(ev){
    var f = ev.target; if(!f) return; ev.preventDefault();
    if(f.id === 'fNouveau') filmerMoitie();
    else if(f.getAttribute('data-redemander-form')){ var id = f.getAttribute('data-redemander-form'), m = f.motif.value.trim(); delete ST.sur['redemander' + id]; agir(id, 'refaire', m ? {message:m} : {}, 'Demande envoyée.'); }
  });
  document.addEventListener('change', function(ev){
    if(ev.target && ev.target.id === 'langue'){ var l = ev.target.value; if(!LANGUES_UI[l]) return; ecrire('nv_ui_langue', l); NOMS = null; poserLangue(l); rendre(); var s = $('langue'); if(s) s.focus(); }
  });
  window.NVCote = {etat:function(){ return {etat:ST.etat, apercu:ST.apercu, envoyes:ST.envoyes.length, recus:ST.recus.length, prise:!!ST.prise, langue:L}; }};
}

/* ════════ La présentation (17 nov. 2026, étape 2 du plan des 8 nouveautés) : un film dessiné, « Comment ça marche »,
   « Ce qui vous protège ». En grand quand la nouveauté n'est pas encore ouverte ; repliée sur la page principale sinon. ════════ */

rendre = function(){ var r = _rendrePres.apply(this, arguments); presenter(); return r; };
