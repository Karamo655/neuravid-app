assar por outra pessoa, uma marca ou a NEURAVID. Não use a foto de outra pessoa como se fosse sua."]},{"id":"verite","t":"A verdade","p":["Um conteúdo modificado ou sintético tem de continuar indicado como tal. Não o apresente como real.","Não ponha uma pessoa real a dizer ou fazer o que não disse ou fez, sem o seu consentimento."]},{"id":"defis","t":"Desafios leais","p":["Respeite o regulamento publicado de cada desafio. Não vote em si próprio. Não faça batota numa participação. Valorize o trabalho dos outros, vencedores e vencidos."]},{"id":"manquement","t":"O que acontece em caso de incumprimento","p":["Conforme a gravidade: verificação adicional, conteúdo ocultado ou retirado, limitação, suspensão, banimento.","A limitação, a suspensão e o banimento são decididos por uma pessoa, e cada decisão é explicada."]},{"id":"signaler","t":"Como denunciar","p":["Toque em «Denunciar» num vídeo, num direto, numa mensagem ou num perfil e escolha o motivo.","A pessoa denunciada não sabe quem a denunciou."]},{"id":"recours","t":"Como fazer um recurso","p":["Se pensa que uma decisão é um erro, conteste-a no prazo de 30 dias a partir de «As minhas decisões e recursos» em L'Empreinte, ou com «Contestar».","Uma pessoa diferente da que decidiu examina o seu recurso."]}]}}</script>
<script type="application/json" id="nvDocs-ar">{"cgu":{"titre":"الشروط العامة للاستخدام","chapeau":"تشرح هذه الشروط قواعد NEURAVID: ما يمكنك فعله هنا، وما نفعله نحن، وما يحدث عند وقوع مشكلة. وهي مكتوبة بجمل بسيطة.","changements":["النسخة الأولى من هذا النص."],"sections":[{"id":"editeur","t":"من نحن","p":["NEURAVID خدمة تابعة لشركة TENAGON GROUP, LLC، وهي شركة أُنشئت في الولايات المتحدة.","في هذه الشروط، تعني «نحن» NEURAVID وشركة TENAGON GROUP, LLC. وتعني «أنت» الشخص الذي يستخدم NEURAVID.","للتواصل معنا: contact@neuravid.com."]},{"id":"acceptation","t":"قبول هذه الشروط","p":["لإنشاء حساب، يجب أن تقبل هذه الشروط، وأن تقرأ سياسة الخصوصية، وأن تقبل قواعد المجتمع. وهي ثلاث موافقات منفصلة.","عندما يتغيّر أحد هذه النصوص، نعرض عليك ما تغيّر ونطلب منك قبوله من جديد قبل المتابعة.","نحتفظ بأثر كل موافقة: النص، وإصداره، والتاريخ، ولغة العرض."]},{"id":"ages","t":"الأعمار","p":["لا يوجد حساب في NEURAVID قبل سن 13 عامًا.","• من 13 عامًا: استخدام NEURAVID، ومشاهدة الفيديوهات وصنعها، ومشاهدة البث المباشر والكتابة في دردشته، والمشاركة في التحديات.","• من 16 عامًا: تقديم بث مباشر، والصعود إلى المسرح في بث مباشر، والإبداع المشترك مع صنّاع آخرين.","• من 18 عامًا: المال (الهدايا المدفوعة والمشتريات والأرباح والسحوبات)، وMiss & Master، ولقاءات Love Universe، ومكالمات Palabre.","لا يُعرض البث المباشر الموسوم «للجمهور الواعي» إلا ابتداءً من 16 عامًا.","من 13 إلى 17 عامًا، تُطبَّق حماية معزّزة. وهي موصوفة في سياسة الخصوصية.","يجب أن يكون العمر الذي تصرّح به صحيحًا. يمكن لـ NEURAVID أن تطلب منك التحقق منه. وإذا كان العمر المصرّح به خاطئًا، فقد يُقيَّد الوصول إلى بعض الوظائف."]},{"id":"compte","t":"حسابك وأمانه","p":["قدّم معلومات صحيحة وحافظ على تحديثها.","احفظ كلمة المرور سرًّا. فعّل التحقق بخطوتين عندما يُعرض عليك.","إذا ظننت أن أحدًا يستخدم حسابك، فغيّر كلمة المرور وأخبرنا فورًا.","أنت مسؤول عمّا يُفعل بحسابك، إلا إذا استخدمه أحد دون إذنك."]},{"id":"contenus","t":"محتواك","p":["تبقى أنت صاحب ما تنشره: الفيديوهات والأصوات والصور والنصوص.","لتشغيل NEURAVID، تمنحنا الحق، مجانًا وفي العالم كله، في استضافة محتواك ونسخه وعرضه وبثّه، وتكييفه تقنيًا (الصيغ والجودة والترجمة النصية). وينتهي هذا الحق عندما تحذف المحتوى، بعد المهلة التقنية اللازمة، إلا إذا ألزمنا القانون بالاحتفاظ به.","لا يمكن للآخرين إعادة استخدام أصواتك أو عمل ثنائي مع فيديوهاتك إلا إذا سمحت إعداداتك بذلك.","المحتوى المعدّل أو الاصطناعي (صوت مولَّد، دبلجة، خلفية افتراضية، صورة رمزية، جسم ممحوّ، تعديل من الخادم) يُشار إليه للمشاهدين بأنه «محتوى معدّل». لا تُخفِ هذه الإشارة.","لا يمكنك دبلجة أو تقليد إلا صوتك أنت، وبموافقتك.","بالنسبة للموسيقى، يجب أن يكون لديك الحق في استخدام كل صوت. الصوت القادم من هاتفك يطلب منك تأكيد ذلك قبل النشر. وأصوات Le Griot مرفقة بشروط استخدامها."]},{"id":"interdits","t":"ما هو ممنوع","p":["قواعد المجتمع جزء من هذه الشروط. ويُمنع خصوصًا:","• تعريض القاصرين للخطر أو استغلالهم أو إضفاء طابع جنسي عليهم؛","• التحرش أو التهديد أو التحريض على الكراهية أو العنف؛","• نشر محتوى جنسي أو غير قانوني؛","• الاحتيال أو الخداع بشأن المال أو بيع خدمات زائفة؛","• صنع تفاعل زائف: روبوتات، أصوات مشتراة، حسابات متعددة، هدايا تدور في حلقة مفرغة؛","• انتحال شخصية شخص آخر؛","• الالتفاف على أمان NEURAVID أو جمع بيانات أشخاص آخرين."]},{"id":"moderation","t":"الإشراف","p":["يرصد درع NEURAVID تلقائيًا علامات الاحتيال أو الخطر. وهو وحده لا يستطيع إلا طلب تحقق إضافي.","المحتوى المبلَّغ عنه على أنه خطر على الحياة أو استغلال للقاصرين يُخفى فورًا، في انتظار أن يفحصه شخص.","العقوبات متدرّجة: تحقق إضافي، تقييد، تعليق، حظر. التقييد والتعليق والحظر يقرّرها دائمًا شخص. ويجب أن يؤكد الحظرَ شخصٌ ثانٍ.","يُشرح لك كل قرار مع سببه."]},{"id":"recours","t":"الطعن","p":["يمكنك الطعن في قرار إشراف خلال 30 يومًا، مرة واحدة لكل قرار، من «قراراتي وطعوني» في L'Empreinte، أو عبر «اعتراض».","يفحص طعنك شخص غير الذي اتخذ القرار.","إذا قُبل طعنك، يُلغى القرار ويعود محتواك مرئيًا."]},{"id":"hvs","t":"مؤشر HVS","p":["يقيس HVS قيمة مساهمة: عمل، أو مشاركة، أو تعليق مفيد، أو مساعدة، أو بلاغ تم التحقق منه. ولا يقيس أبدًا قيمة شخص.","لا تقوم NEURAVID بأي ترتيب للأشخاص باستخدام HVS: لا مجموع لكل شخص، ولا متوسط، ولا مرتبة.","كل نتيجة قابلة للشرح: تعرض مكوّناتها، والأرقام المستخدمة، وإصدار المعادلة.","يمكن لصاحب المساهمة الاعتراض على نتيجتها. ويفحص شخصٌ الطعنَ ويعلّل قراره."]},{"id":"defis","t":"التحديات والمسابقات","p":["لكل تحدٍّ نظام يُنشر قبل بدايته: التواريخ، والمعايير، وطريقة التصويت، وطريقة الفصل بين المتعادلين.","عندما تفصل قرعة بين متعادلين، يمكن التحقق منها: فهي تُحسب انطلاقًا من بصمة النظام المنشور.","الأمم متساوية: لا مكافأة على الجنسية، وكل صوت يُحسب صوتًا واحدًا.","لا يصوّت أحد لنفسه. قبل 18 عامًا، يمنح الفوز ألقابًا وشارات، ولا يمنح مالًا أبدًا.","يمكن الاعتراض على نتيجة. ويفحص شخصٌ الاعتراض."]},{"id":"argent","t":"المال","p":["كل ما يتعلق بالمال مخصّص للأشخاص الذين بلغوا 18 عامًا فأكثر.","تُستخدم عملات NVCoins المشتراة لإهداء الهدايا. ولا يمكن سحبها.","يبقى الربح معلّقًا خلال مهلة أمان قبل أن يصبح قابلًا للسحب. وتُعرض المهلة والرسوم والمبلغ الصافي قبل كل سحب.","لمكافحة الاحتيال، يمكن تجميد ربح أو سحب ريثما يفحصه شخص. والتجميد ليس مصادرة أبدًا: يبقى المال ملكك ما لم يقرّر شخص، مع ذكر السبب. ويمكنك الطعن في هذا القرار.","تختلف وسائل الدفع حسب بلدك. وقد يُطلب التحقق من الهوية لسحب المال."]},{"id":"fin","t":"تعليق حساب أو حذفه","p":["يمكنك تعطيل حسابك أو حذفه من الإعدادات والخصوصية. ويترك الحذف 30 يومًا للتفكير قبل أن يصبح نهائيًا.","قبل المغادرة، يمكنك طلب نسخة من بياناتك.","يمكن لـ NEURAVID تعليق أو إغلاق حساب يخالف هذه الشروط، وفق قواعد الإشراف، مع حق الطعن."]},{"id":"responsabilite","t":"مسؤوليتنا","p":["نبذل قصارى جهدنا ليعمل NEURAVID جيدًا ويبقى آمنًا. ولا يمكننا أن نعد بأنه لن يحدث أي انقطاع أو خطأ.","كل شخص مسؤول عمّا ينشره. وعندما يُبلَّغ إلينا عن محتوى ممنوع، نتصرّف.","لا شيء في هذه الشروط يسلبك الحقوق التي يمنحها لك قانون بلدك."]},{"id":"changements","t":"تغييرات هذه الشروط","p":["لكل إصدار رقم وتاريخ.","عندما تتغيّر هذه الشروط، نعرض عليك ملخصًا لما تغيّر ونطلب منك قبولها من جديد.","إذا لم تقبل إصدارًا جديدًا، يمكنك طلب نسخة من بياناتك وحذف حسابك."]},{"id":"loi","t":"القانون المطبّق والتواصل","p":["تخضع هذه الشروط للقانون المطبّق في مقرّ شركة TENAGON GROUP, LLC، في الولايات المتحدة، دون أن يحرمك ذلك من الحماية التي يمنحها لك قانون بلد إقامتك.","توجد هذه الشروط بعدة لغات. في حال وجود اختلاف، تكون النسخة الفرنسية هي المعتمدة.","لأي سؤال: contact@neuravid.com."]}]},"confidentialite":{"titre":"سياسة الخصوصية","chapeau":"تشرح هذه السياسة البيانات التي يستخدمها NEURAVID، ولماذا، وما يبقى على هاتفك، وكيف تحتفظ بالتحكم.","changements":["النسخة الأولى من هذا النص."],"sections":[{"id":"responsable","t":"من المسؤول","p":["تعالج شركة TENAGON GROUP, LLC، وهي شركة أُنشئت في الولايات المتحدة، بياناتك لتشغيل NEURAVID.","للتواصل معنا: contact@neuravid.com."]},{"id":"donnees","t":"البيانات التي نستخدمها، ولماذا","p":["• حسابك (الاسم المستعار، والاسم، ووسيلة الدخول، واللغة، والبلد): لإنشاء حسابك وحمايته.","• تاريخ ميلادك: لتطبيق أعمار NEURAVID وحماية القاصرين.","• بلدك ولغاتك: لنعرض عليك فيديوهات بلغاتك وتحديات بلدك.","• محتواك (الفيديوهات والأصوات والتعليقات والرسائل): لنشره أو إيصاله، حسب اختياراتك.","• إشارات المشاهدة (الجزء الذي شاهدته، فيديو تخطّيته أو أعدت مشاهدته، تفاعلاتك): لنقترح عليك فيديوهات. يمكنك التوقف عن حفظ سجلك ومحوه.","• HVS: مساهماتك والآراء التي تلقّيتها، لحساب نتيجة كل مساهمة.","• جودة التشغيل في Iris، المشغّل: مع إشارات المشاهدة، يرسل الهاتف أيضًا الوقت قبل ظهور الصورة الأولى وعدد الانقطاعات. تُستخدم هذه الأرقام فقط لمراقبة الخدمة وتحسينها. ولا تدخل أبدًا في ملفك الشخصي ولا في توصياتك.","• «مساعدة المقدّم» في Le Direct: لا يُرسل مستوى الصوت وجودة الشبكة التي يستقبلها هاتفك إلا إذا شغّلت ذلك (مطفأ افتراضيًا، في «الجودة»). ولا يُرسل الصوت ولا الصورة أبدًا.","• موقعك: فقط إذا سمحت به، ويُقرَّب على الهاتف إلى مستوى الحي أو المدينة قبل إرساله. قبل 18 عامًا، المدينة فقط.","• المال (من 18 عامًا): عملياتك ومستوى التحقق من هويتك. لا نحتفظ برقم وثيقة هويتك ولا بصورتها.","• الأمان: أجهزتك المتصلة وتسجيلات دخولك الأخيرة. لمكافحة الاحتيال، يُحوَّل عنوان الشبكة والجهاز إلى بصمة قبل حفظهما.","• بلاغاتك وقرارات الإشراف: لحماية المجتمع وإتاحة الطعون."]},{"id":"telephone","t":"ما يبقى على هاتفك","p":["الكاميرا، والتجميل، وتتبّع الوجه، وإزالة الضجيج الخلفي تُحسب على هاتفك. ولا تُرسل هذه الصور والقياسات.","تبقى مسوّداتك ولقطاتك ومشاهدك على هاتفك ما دمت لم تنشرها."]},{"id":"accord","t":"ما يُرسل إلى الخادم بموافقتك فقط","p":["تتم بعض المعالجات الثقيلة على خوادمنا: التثبيت، والتكبير، وإنشاء ترجمة نصية تلقائية، ودبلجة صوت، وتوليد مؤثر. يطلب NEURAVID موافقتك قبل إرسال أي شيء.","بالنسبة لمؤثر مولَّد من جملة، تُرسل الجملة فقط: لا صورة ولا صوت.","يستخدم الإملاء والأوامر الصوتية خدمة التعرّف في هاتفك. وقد ترسل هذه الخدمة صوتك إلى مزوّدها. وتنبّهك الشاشة مسبقًا."]},{"id":"mineurs","t":"حماية القاصرين","p":["من 13 إلى 17 عامًا، تُطبَّق هذه الحمايات ولا يمكن إزالتها:","• الحساب خاص؛","• لا يمكن للآخرين تنزيل الفيديوهات؛","• لا تُعرض المدينة ولا يُقترح الحساب على الغرباء؛","• توضع رسائل الغرباء جانبًا؛","• لا إعلانات مخصّصة؛","• لا مكالمات مع حساب قاصر، ولا مال.","البالغ الذي يكتب إلى عدة قاصرين لا يعرفهم يفحص أمرَه شخصٌ من فريق الإشراف.","يمكن لأحد الوالدين مرافقة مراهق برمز. فيرى الوقت المستغرق والحمايات، ولا يرى أبدًا الرسائل ولا ما يشاهده المراهق."]},{"id":"conservation","t":"كم من الوقت نحتفظ ببياناتك","p":["• حسابك: ما دام موجودًا. بعد طلب الحذف، 30 يومًا للتفكير، ثم المحو خلال 90 يومًا التالية، بما في ذلك النسخ الاحتياطية.","• سجل مشاهدتك: إلى أن تمحوه أو تتوقف عن حفظه. وتُمحى العلامات المجهولة التي تمنع احتساب المشاهدة نفسها مرتين بعد 30 يومًا.","• البلاغات وقرارات الإشراف: سنة واحدة بعد القرار، أو أكثر إذا اقتضى القانون ذلك.","• أثر موافقاتك على هذه النصوص: ما دام حسابك موجودًا، ثم 5 سنوات.","• العمليات المالية: المدة التي يفرضها قانون المحاسبة.","• بصمات الأمان: 12 شهرًا.","• الموقع المشارَك: يُمحى عند انتهاء المشاركة."]},{"id":"droits","t":"حقوقك","p":["يمكنك في أي وقت:","• الاطلاع على بياناتك وطلب نسخة منها؛","• تصحيح معلوماتك؛","• محو سجلاتك أو حذف حسابك؛","• رفض التوصيات والإعلانات المخصّصة؛","• سحب موافقة سبق أن منحتها.","يتم كل ذلك من الإعدادات والخصوصية، في قسم «بياناتي». ويمكنك أيضًا الكتابة إلى contact@neuravid.com. ونردّ خلال 30 يومًا.","يمكنك أيضًا التوجّه إلى سلطة حماية البيانات في بلدك."]},{"id":"securite","t":"الأمان","p":["تمر الاتصالات بين التطبيق وخوادمنا عبر اتصالات مشفّرة.","تُسجَّل قرارات الإشراف في سجلّ محمي من التعديل.","لا يوجد نظام كامل. في حال تسرّب بيانات يخصّك، سنُعلمك كما ينص القانون."]},{"id":"transferts","t":"النقل إلى بلدان أخرى","p":["شركة TENAGON GROUP, LLC موجودة في الولايات المتحدة. قد تُعالج بياناتك في بلد غير بلدك، ومنها الولايات المتحدة، مع الحمايات التي يفرضها القانون."]},{"id":"vente","t":"لا نبيع بياناتك","p":["لا نبيع بياناتك الشخصية.","مقدّمو الخدمات الذين يساعدوننا (الاستضافة، والدفع، والتحقق من الهوية) لا يتلقّون إلا ما يلزم لمهمتهم."]},{"id":"contact","t":"التغييرات والتواصل","p":["عندما تتغيّر هذه السياسة، نعرض عليك ما تغيّر ونطلب منك إعادة قراءتها.","في حال وجود اختلاف بين اللغات، تكون النسخة الفرنسية هي المعتمدة.","لأي سؤال: contact@neuravid.com."]}]},"regles":{"titre":"قواعد المجتمع","chapeau":"يجمع NEURAVID أشخاصًا من العالم كله. هذه القواعد تحمي الجميع. وهي تُطبَّق في كل مكان: الفيديوهات، والبث المباشر، والتعليقات، والرسائل، والتحديات.","changements":["النسخة الأولى من هذا النص."],"sections":[{"id":"respect","t":"الاحترام","p":["احترم الناس وثقافاتهم ولغاتهم ومعتقداتهم. انتقد العمل، لا الشخص أبدًا."]},{"id":"harcelement","t":"لا للتحرش","p":["لا تهديدات، ولا إهانات متكررة، ولا إذلال، ولا سخرية جماعية، ولا نشر معلومات خاصة عن أحد."]},{"id":"haine","t":"لا للكراهية","p":["لا هجوم على شخص أو جماعة بسبب الأصل، أو الجنسية، أو الدين، أو الجنس، أو الإعاقة، أو أي جزء آخر من الهوية."]},{"id":"violence","t":"لا للعنف ولا للخطر","p":["لا دعوة إلى العنف، ولا تحديات خطرة، ولا تشجيع على إيذاء النفس.","إذا كان أحد في خطر، فاتصل أولًا بخدمات الطوارئ في بلدك، ثم أبلغ عن المحتوى."]},{"id":"sexuel","t":"لا للمحتوى الجنسي","p":["لا عُري ولا محتوى جنسي.","كل ما يُضفي طابعًا جنسيًا على قاصر أو يعرّضه للخطر ممنوع، دون استثناء. يُخفى المحتوى فورًا، ويُفحص الحساب بأولوية وقد يُغلق، وتُبلَّغ الوقائع إلى السلطات عندما ينص القانون على ذلك."]},{"id":"arnaques","t":"لا للاحتيال","p":["لا وعود كاذبة بالمال، ولا مسابقات زائفة، ولا طلب كلمات مرور أو رموز، ولا بيع مضلّل."]},{"id":"engagement","t":"لا للتفاعل الزائف","p":["لا روبوتات، ولا أصوات مشتراة، ولا حسابات متعددة للتصويت، ولا هدايا تدور في حلقة مفرغة لتضخيم الأرقام."]},{"id":"usurpation","t":"لا لانتحال الشخصية","p":["لا تنتحل شخصية شخص آخر أو علامة تجارية أو NEURAVID. لا تستخدم صورة شخص آخر على أنها صورتك."]},{"id":"verite","t":"الحقيقة","p":["يجب أن يبقى المحتوى المعدّل أو الاصطناعي موسومًا بذلك. لا تقدّمه على أنه حقيقي.","لا تجعل شخصًا حقيقيًا يقول أو يفعل ما لم يقله أو يفعله، دون موافقته."]},{"id":"defis","t":"تحديات نزيهة","p":["احترم النظام المنشور لكل تحدٍّ. لا تصوّت لنفسك. لا تغشّ في مشاركة. قدّر عمل الآخرين، فائزين وخاسرين."]},{"id":"manquement","t":"ما يحدث عند المخالفة","p":["حسب الخطورة: تحقق إضافي، أو إخفاء المحتوى أو إزالته، أو تقييد، أو تعليق، أو حظر.","التقييد والتعليق والحظر يقرّرها شخص، وكل قرار يُشرح."]},{"id":"signaler","t":"كيف تبلّغ","p":["المس «إبلاغ» على فيديو أو بث مباشر أو رسالة أو ملف شخصي، ثم اختر السبب.","لا يعرف الشخص المبلَّغ عنه من أبلغ عنه."]},{"id":"recours","t":"كيف تقدّم طعنًا","p":["إذا رأيت أن قرارًا خاطئ، فاعترض عليه خلال 30 يومًا من «قراراتي وطعوني» في L'Empreinte، أو عبر «اعتراض».","يفحص طعنك شخص غير الذي اتخذ القرار."]}]}}</script>
<script type="application/json" id="nvDocs-sw">{"cgu":{"titre":"Masharti ya jumla ya matumizi","chapeau":"Masharti haya yanaeleza kanuni za NEURAVID: unachoweza kufanya hapa, tunachofanya sisi, na kinachotokea kukiwa na tatizo. Yameandikwa kwa sentensi rahisi.","changements":["Toleo la kwanza la maandishi haya."],"sections":[{"id":"editeur","t":"Sisi ni nani","p":["NEURAVID ni huduma ya TENAGON GROUP, LLC, kampuni iliyoanzishwa nchini Marekani.","Katika masharti haya, «sisi» maana yake ni NEURAVID na TENAGON GROUP, LLC. «Wewe» maana yake ni mtu anayetumia NEURAVID.","Kutuandikia: contact@neuravid.com."]},{"id":"acceptation","t":"Kukubali masharti haya","p":["Ili kufungua akaunti, lazima ukubali masharti haya, usome Sera ya faragha na ukubali Kanuni za jumuiya. Haya ni makubaliano matatu tofauti.","Mojawapo ya maandishi haya likibadilika, tunakuonyesha kinachobadilika na tunakuomba ulikubali tena kabla ya kuendelea.","Tunahifadhi kumbukumbu ya kila makubaliano: maandishi, toleo lake, tarehe na lugha ya kuonyesha."]},{"id":"ages","t":"Umri","p":["Hakuna akaunti ya NEURAVID kabla ya miaka 13.","• Kuanzia miaka 13: kutumia NEURAVID, kutazama na kuunda video, kutazama matangazo ya moja kwa moja na kuandika kwenye gumzo lake, kushiriki katika changamoto.","• Kuanzia miaka 16: kuendesha tangazo la moja kwa moja, kupanda jukwaani katika tangazo la moja kwa moja, kuunda pamoja na waundaji wengine.","• Kuanzia miaka 18: pesa (zawadi za kulipia, ununuzi, mapato na utoaji wa pesa), Miss & Master, kukutana kwenye Love Universe na simu za Palabre.","Matangazo ya moja kwa moja yenye alama ya «hadhira ya watu wazima» huonyeshwa kuanzia miaka 16 tu.","Kuanzia miaka 13 hadi 17, ulinzi wa ziada unatumika. Umeelezwa katika Sera ya faragha.","Umri unaoutaja lazima uwe wa kweli. NEURAVID inaweza kukuomba uuthibitishe. Umri uliotajwa ukiwa si wa kweli, ufikiaji wa baadhi ya huduma unaweza kuzuiwa."]},{"id":"compte","t":"Akaunti yako na usalama wake","p":["Toa taarifa sahihi na uzisasishe.","Weka nenosiri lako siri. Washa uthibitishaji wa hatua mbili unapopewa nafasi hiyo.","Ukidhani mtu anatumia akaunti yako, badilisha nenosiri lako na utujulishe mara moja.","Unawajibika kwa kinachofanywa na akaunti yako, isipokuwa mtu ameitumia bila idhini yako."]},{"id":"contenus","t":"Maudhui yako","p":["Unabaki kuwa mwandishi wa unachochapisha: video, sauti, picha, maandishi.","Ili NEURAVID ifanye kazi, unatupa haki, bila malipo na kwa dunia nzima, ya kuhifadhi, kunakili, kuonyesha na kusambaza maudhui yako, na kuyarekebisha kiufundi (miundo, ubora, manukuu). Haki hii inaisha unapofuta maudhui, baada ya muda wa kiufundi unaohitajika, isipokuwa sheria inatulazimisha kuyahifadhi.","Watu wengine wanaweza kutumia tena sauti zako au kufanya duo na video zako ikiwa tu mipangilio yako inaruhusu.","Maudhui yaliyorekebishwa au ya bandia (sauti iliyozalishwa, kubadilisha sauti kwa lugha nyingine, mandhari ya kidijitali, avatar, kitu kilichofutwa, urekebishaji wa seva) huonyeshwa kwa watazamaji kama «maudhui yaliyorekebishwa». Usifiche alama hii.","Unaweza kubadilisha au kuiga sauti yako mwenyewe tu, kwa idhini yako.","Kwa muziki, lazima uwe na haki ya kutumia kila sauti. Sauti inayotoka kwenye simu yako inakuomba uthibitishe hilo kabla ya kuchapisha. Sauti za Le Griot huja na masharti yake ya matumizi."]},{"id":"interdits","t":"Kilichokatazwa","p":["Kanuni za jumuiya ni sehemu ya masharti haya. Hasa, ni marufuku:","• kuhatarisha, kunyonya au kuwaingiza watoto katika mambo ya ngono;","• kunyanyasa, kutishia, kuchochea chuki au vurugu;","• kuchapisha maudhui ya ngono au yasiyo halali;","• kutapeli, kudanganya kuhusu pesa au kuuza huduma bandia;","• kutengeneza ushiriki bandia: roboti, kura zilizonunuliwa, akaunti nyingi, zawadi zinazozunguka kwenye mduara;","• kujifanya mtu mwingine;","• kukwepa usalama wa NEURAVID au kukusanya data za watu wengine."]},{"id":"moderation","t":"Udhibiti","p":["Ngao ya NEURAVID hugundua yenyewe dalili za udanganyifu au hatari. Peke yake, inaweza tu kuomba uthibitisho wa ziada.","Maudhui yaliyoripotiwa kuwa hatari kwa maisha au unyonyaji wa watoto hufichwa mara moja, yakisubiri kuchunguzwa na mtu.","Adhabu zinaenda kwa ngazi: uthibitisho wa ziada, kizuizi, kusimamishwa, kufukuzwa. Kizuizi, kusimamishwa na kufukuzwa huamuliwa daima na mtu. Kufukuzwa lazima kuthibitishwe na mtu wa pili.","Kila uamuzi unaelezwa kwako pamoja na sababu."]},{"id":"recours","t":"Rufaa","p":["Unaweza kupinga uamuzi wa udhibiti ndani ya siku 30, mara moja kwa kila uamuzi, kutoka «Maamuzi na rufaa zangu» katika L'Empreinte, au kwa «Pinga».","Rufaa yako huchunguzwa na mtu tofauti na yule aliyeamua.","Rufaa yako ikikubaliwa, uamuzi unafutwa na maudhui yako yanaonekana tena."]},{"id":"hvs","t":"HVS","p":["HVS hupima thamani ya mchango: kazi, ushiriki, maoni yenye manufaa, msaada, ripoti iliyothibitishwa. Haipimi kamwe thamani ya mtu.","NEURAVID haipangi watu kwa HVS: hakuna jumla kwa kila mtu, hakuna wastani, hakuna nafasi.","Kila alama inaweza kuelezwa: inaonyesha vipengele vyake, namba zilizotumika na toleo la fomula.","Mwandishi wa mchango anaweza kupinga alama yake. Mtu huchunguza rufaa na kueleza sababu za uamuzi wake."]},{"id":"defis","t":"Changamoto na mashindano","p":["Kila changamoto ina kanuni zinazochapishwa kabla ya kuanza: tarehe, vigezo, namna ya kupiga kura na namna ya kuamua sare.","Bahati nasibu inapoamua sare, inaweza kuthibitishwa: inakokotolewa kutoka kwenye alama ya kidijitali ya kanuni zilizochapishwa.","Mataifa ni sawa: hakuna nyongeza kwa uraia, na kila kura inahesabiwa kama moja.","Huwezi kujipigia kura. Kabla ya miaka 18, ushindi hutoa vyeo na beji, kamwe si pesa.","Matokeo yanaweza kupingwa. Mtu huchunguza upinzani huo."]},{"id":"argent","t":"Pesa","p":["Kila kitu kinachohusu pesa ni kwa watu wa miaka 18 na zaidi.","NVCoins zilizonunuliwa hutumika kutoa zawadi. Haziwezi kutolewa kama pesa.","Mapato hubaki yakisubiri kwa muda wa usalama kabla ya kuweza kutolewa. Muda, ada na kiasi halisi huonyeshwa kabla ya kila utoaji.","Ili kupambana na udanganyifu, mapato au utoaji unaweza kusimamishwa wakati mtu anauchunguza. Kusimamisha si kunyang'anya kamwe: pesa inabaki yako hadi mtu aamue, kwa sababu. Unaweza kupinga uamuzi huo.","Njia za malipo hutegemea nchi yako. Uthibitisho wa utambulisho unaweza kuhitajika ili kutoa pesa."]},{"id":"fin","t":"Kusimamisha au kufuta akaunti","p":["Unaweza kuzima akaunti yako au kuifuta katika Mipangilio na faragha. Kufuta kunaacha siku 30 za kufikiri kabla ya kuwa kwa mwisho.","Kabla ya kuondoka, unaweza kuomba nakala ya data zako.","NEURAVID inaweza kusimamisha au kufunga akaunti inayovunja masharti haya, kwa kufuata kanuni za udhibiti, pamoja na haki ya rufaa."]},{"id":"responsabilite","t":"Wajibu wetu","p":["Tunajitahidi kadiri tuwezavyo ili NEURAVID ifanye kazi vizuri na ibaki salama. Hatuwezi kuahidi kwamba hakutakuwa kamwe na kukatika au kosa.","Kila mtu anawajibika kwa anachochapisha. Tunapoarifiwa kuhusu maudhui yaliyokatazwa, tunachukua hatua.","Hakuna kitu katika masharti haya kinachokunyang'anya haki ambazo sheria ya nchi yako inakupa."]},{"id":"changements","t":"Mabadiliko ya masharti haya","p":["Kila toleo lina namba na tarehe.","Masharti haya yakibadilika, tunakuonyesha muhtasari wa kinachobadilika na tunakuomba uyakubali tena.","Usipokubali toleo jipya, unaweza kuomba nakala ya data zako na kufuta akaunti yako."]},{"id":"loi","t":"Sheria inayotumika na mawasiliano","p":["Masharti haya yanaongozwa na sheria inayotumika mahali ilipo ofisi kuu ya TENAGON GROUP, LLC, nchini Marekani, bila kukunyima ulinzi unaopewa na sheria ya nchi unayoishi.","Masharti haya yapo kwa lugha kadhaa. Kukiwa na tofauti, toleo la Kifaransa ndilo linalotumika.","Kwa swali lolote: contact@neuravid.com."]}]},"confidentialite":{"titre":"Sera ya faragha","chapeau":"Sera hii inaeleza data ambazo NEURAVID inatumia, kwa nini, kinachobaki kwenye simu yako, na jinsi unavyoendelea kuwa na udhibiti.","changements":["Toleo la kwanza la maandishi haya."],"sections":[{"id":"responsable","t":"Nani anawajibika","p":["Data zako zinashughulikiwa na TENAGON GROUP, LLC, kampuni iliyoanzishwa nchini Marekani, ili kuendesha NEURAVID.","Kutuandikia: contact@neuravid.com."]},{"id":"donnees","t":"Data tunazotumia, na kwa nini","p":["• Akaunti yako (jina la utani, jina, njia ya kuingia, lugha, nchi): ili kufungua akaunti yako na kuilinda.","• Tarehe yako ya kuzaliwa: ili kutekeleza umri wa NEURAVID na kuwalinda watoto.","• Nchi yako na lugha zako: ili kukuonyesha video kwa lugha zako na changamoto za nchi yako.","• Maudhui yako (video, sauti, maoni, ujumbe): ili kuyachapisha au kuyafikisha, kulingana na chaguo zako.","• Ishara zako za kutazama (sehemu uliyotazama, video uliyoruka au kutazama tena, miitikio yako): ili kukupendekezea video. Unaweza kuacha kuhifadhi historia yako na kuifuta.","• HVS: michango yako na maoni uliyopokea, ili kukokotoa alama ya kila mchango.","• Ubora wa uchezaji katika Iris, kicheza video: pamoja na ishara za kutazama, simu hutuma pia muda kabla ya picha ya kwanza na idadi ya kukatika. Namba hizi hutumika tu kufuatilia na kuboresha huduma. Haziingii kamwe kwenye wasifu wako wala kwenye mapendekezo yako.","• «Msaidie mwendeshaji» katika Le Direct: kiwango cha sauti na ubora wa mtandao ambao simu yako inapokea hutumwa tu ukiwasha (imezimwa kwa chaguo-msingi, katika «Ubora»). Kamwe si sauti wala picha.","• Mahali ulipo: ukiruhusu tu, na hukadiriwa kwenye simu hadi kiwango cha mtaa au jiji kabla ya kutumwa. Kabla ya miaka 18, jiji tu.","• Pesa (kuanzia miaka 18): miamala yako na kiwango cha uthibitisho wa utambulisho wako. Hatuhifadhi namba ya kitambulisho chako wala picha yake.","• Usalama: vifaa vyako vilivyounganishwa na kuingia kwako kwa hivi karibuni. Ili kupambana na udanganyifu, anwani ya mtandao na kifaa hubadilishwa kuwa alama ya kidijitali kabla ya kuhifadhiwa.","• Ripoti zako na maamuzi ya udhibiti: ili kulinda jumuiya na kuruhusu rufaa."]},{"id":"telephone","t":"Kinachobaki kwenye simu yako","p":["Kamera, urembo, ufuatiliaji wa uso na uondoaji wa kelele za nyuma hukokotolewa kwenye simu yako. Picha na vipimo hivi havitumwi.","Rasimu zako, picha ulizorekodi na matukio yako hubaki kwenye simu yako mradi hujachapisha."]},{"id":"accord","t":"Kinachokwenda kwenye seva kwa idhini yako tu","p":["Baadhi ya kazi nzito hufanywa kwenye seva zetu: kuimarisha picha, kukuza, kuunda manukuu ya kiotomatiki, kubadilisha sauti kwa lugha nyingine, kuzalisha athari. NEURAVID inakuomba idhini yako kabla ya kutuma chochote.","Kwa athari inayozalishwa kutoka kwa sentensi, sentensi tu ndiyo inatumwa: hakuna picha wala sauti.","Kuandika kwa sauti na amri za sauti hutumia huduma ya utambuzi ya simu yako. Huduma hii inaweza kutuma sauti yako kwa mtoa huduma wake. Skrini inakuonya kabla."]},{"id":"mineurs","t":"Ulinzi wa watoto","p":["Kuanzia miaka 13 hadi 17, ulinzi huu unatumika na hauwezi kuondolewa:","• akaunti ni ya faragha;","• video haziwezi kupakuliwa na wengine;","• jiji halionyeshwi na akaunti haipendekezwi kwa wasiojulikana;","• ujumbe kutoka kwa wasiojulikana huwekwa kando;","• hakuna matangazo yanayolenga mtu binafsi;","• hakuna simu na akaunti ya mtoto, na hakuna pesa.","Mtu mzima anayewaandikia watoto kadhaa asiowajua huchunguzwa na mtu wa timu ya udhibiti.","Mzazi anaweza kumsindikiza kijana kwa msimbo. Anaona muda uliotumika na ulinzi, kamwe si ujumbe wala anachotazama kijana."]},{"id":"conservation","t":"Tunahifadhi data zako kwa muda gani","p":["• Akaunti yako: muda wote inapokuwepo. Baada ya ombi la kufuta, siku 30 za kufikiri, kisha kufutwa ndani ya siku 90 zinazofuata, pamoja na nakala za akiba.","• Historia yako ya kutazama: hadi uifute au uache kuihifadhi. Alama zisizojulikana zinazozuia kuhesabu mtazamo uleule mara mbili hufutwa baada ya siku 30.","• Ripoti na maamuzi ya udhibiti: mwaka 1 baada ya uamuzi, au zaidi ikiwa sheria inahitaji.","• Kumbukumbu ya makubaliano yako kwa maandishi haya: muda wote akaunti yako ipo, kisha miaka 5.","• Miamala ya pesa: muda unaohitajika na sheria ya uhasibu.","• Alama za kidijitali za usalama: miezi 12.","• Mahali paliposhirikiwa: hufutwa ushirikiano unapoisha."]},{"id":"droits","t":"Haki zako","p":["Wakati wowote, unaweza:","• kuona data zako na kuomba nakala;","• kurekebisha taarifa zako;","• kufuta historia zako au kufuta akaunti yako;","• kukataa mapendekezo na matangazo yanayolenga mtu binafsi;","• kuondoa idhini uliyotoa.","Haya yote hufanywa katika Mipangilio na faragha, sehemu ya «Data zangu». Unaweza pia kuandika kwa contact@neuravid.com. Tunajibu ndani ya siku 30.","Unaweza pia kuwasiliana na mamlaka ya ulinzi wa data ya nchi yako."]},{"id":"securite","t":"Usalama","p":["Mawasiliano kati ya programu na seva zetu hupitia miunganisho iliyosimbwa.","Maamuzi ya udhibiti huandikwa kwenye daftari linalolindwa dhidi ya mabadiliko.","Hakuna mfumo ulio kamili. Data zinazokuhusu zikivuja, tutakujulisha kama sheria inavyoelekeza."]},{"id":"transferts","t":"Uhamishaji kwenda nchi nyingine","p":["TENAGON GROUP, LLC iko nchini Marekani. Data zako zinaweza kushughulikiwa katika nchi tofauti na yako, ikiwemo Marekani, pamoja na ulinzi unaohitajika na sheria."]},{"id":"vente","t":"Hatuuzi data zako","p":["Hatuuzi data zako binafsi.","Watoa huduma wanaotusaidia (uhifadhi, malipo, uthibitisho wa utambulisho) hupokea tu kinachohitajika kwa kazi yao."]},{"id":"contact","t":"Mabadiliko na mawasiliano","p":["Sera hii ikibadilika, tunakuonyesha kinachobadilika na tunakuomba uisome tena.","Kukiwa na tofauti kati ya lugha, toleo la Kifaransa ndilo linalotumika.","Kwa swali lolote: contact@neuravid.com."]}]},"regles":{"titre":"Kanuni za jumuiya","chapeau":"NEURAVID inawaleta pamoja watu kutoka duniani kote. Kanuni hizi zinamlinda kila mmoja. Zinatumika kila mahali: video, matangazo ya moja kwa moja, maoni, ujumbe na changamoto.","changements":["Toleo la kwanza la maandishi haya."],"sections":[{"id":"respect","t":"Heshima","p":["Heshimu watu, tamaduni zao, lugha zao na imani zao. Kosoa kazi, kamwe si mtu."]},{"id":"harcelement","t":"Hakuna unyanyasaji","p":["Hakuna vitisho, matusi ya mara kwa mara, kudhalilisha, kudhihaki kwa kikundi wala kusambaza taarifa za faragha za mtu."]},{"id":"haine","t":"Hakuna chuki","p":["Hakuna shambulio dhidi ya mtu au kikundi kwa sababu ya asili yake, uraia, dini, jinsia, ulemavu au sehemu nyingine yoyote ya utambulisho wake."]},{"id":"violence","t":"Hakuna vurugu wala hatari","p":["Hakuna wito wa vurugu, hakuna changamoto hatari, hakuna kuhimiza kujidhuru.","Mtu akiwa hatarini, piga simu kwanza kwa huduma za dharura za nchi yako, kisha ripoti maudhui."]},{"id":"sexuel","t":"Hakuna maudhui ya ngono","p":["Hakuna uchi wala maudhui ya ngono.","Chochote kinachomwingiza mtoto katika mambo ya ngono au kumhatarisha kimekatazwa, bila kuachilia. Maudhui hufichwa mara moja, akaunti huchunguzwa kwa kipaumbele na inaweza kufungwa, na matukio huripotiwa kwa mamlaka pale sheria inapoelekeza."]},{"id":"arnaques","t":"Hakuna utapeli","p":["Hakuna ahadi za uongo za pesa, mashindano bandia, maombi ya nenosiri au misimbo, wala mauzo ya udanganyifu."]},{"id":"engagement","t":"Hakuna ushiriki bandia","p":["Hakuna roboti, kura zilizonunuliwa, akaunti nyingi za kupiga kura, wala zawadi zinazozunguka kwenye mduara ili kuongeza namba."]},{"id":"usurpation","t":"Hakuna kujifanya mtu mwingine","p":["Usijifanye kuwa mtu mwingine, chapa ya biashara au NEURAVID. Usitumie picha ya mtu mwingine kama yako."]},{"id":"verite","t":"Ukweli","p":["Maudhui yaliyorekebishwa au ya bandia lazima yabaki na alama yake. Usiyaonyeshe kama ya kweli.","Usimfanye mtu halisi aseme au afanye asichosema au asichofanya, bila idhini yake."]},{"id":"defis","t":"Changamoto za haki","p":["Heshimu kanuni zilizochapishwa za kila changamoto. Usijipigie kura. Usidanganye katika ushiriki. Heshimu kazi ya wengine, washindi na walioshindwa."]},{"id":"manquement","t":"Kinachotokea kanuni zikivunjwa","p":["Kulingana na uzito: uthibitisho wa ziada, maudhui kufichwa au kuondolewa, kizuizi, kusimamishwa, kufukuzwa.","Kizuizi, kusimamishwa na kufukuzwa huamuliwa na mtu, na kila uamuzi unaelezwa."]},{"id":"signaler","t":"Jinsi ya kuripoti","p":["Gusa «Ripoti» kwenye video, tangazo la moja kwa moja, ujumbe au wasifu, kisha uchague sababu.","Mtu aliyeripotiwa hajui ni nani aliyemripoti."]},{"id":"recours","t":"Jinsi ya kukata rufaa","p":["Ukidhani uamuzi ni kosa, upinge ndani ya siku 30 kutoka «Maamuzi na rufaa zangu» katika L'Empreinte, au kwa «Pinga».","Mtu tofauti na yule aliyeamua huchunguza rufaa yako."]}]}}</script>
<script type="application/json" id="nvDocs-ha">{"cgu":{"titre":"Sharuɗɗan amfani na gaba ɗaya","chapeau":"Waɗannan sharuɗɗa suna bayyana dokokin NEURAVID: abin da za ku iya yi a nan, abin da muke yi, da abin da ke faruwa idan matsala ta taso. An rubuta su cikin jimloli masu sauƙi.","changements":["Sigar farko ta wannan rubutu."],"sections":[{"id":"editeur","t":"Su wane ne mu","p":["NEURAVID sabis ne na TENAGON GROUP, LLC, kamfanin da aka kafa a Amurka.","A cikin waɗannan sharuɗɗa, «mu» na nufin NEURAVID da TENAGON GROUP, LLC. «Ku» na nufin mutumin da ke amfani da NEURAVID.","Don rubuto mana: contact@neuravid.com."]},{"id":"acceptation","t":"Amincewa da waɗannan sharuɗɗa","p":["Don ƙirƙirar asusu, dole ne ku amince da waɗannan sharuɗɗa, ku karanta Manufar sirri, kuma ku amince da Dokokin al'umma. Waɗannan yarjejeniyoyi uku ne daban-daban.","Idan ɗaya daga cikin waɗannan rubuce-rubuce ya canza, za mu nuna muku abin da ya canza kuma mu nemi ku sake amincewa kafin ku ci gaba.","Muna adana shaidar kowace yarjejeniya: rubutun, sigarsa, kwanan wata da harshen da aka nuna shi."]},{"id":"ages","t":"Shekaru","p":["Babu asusun NEURAVID kafin shekara 13.","• Daga shekara 13: amfani da NEURAVID, kallo da ƙirƙirar bidiyo, kallon kai tsaye da rubutu a cikin hirarsu, shiga ƙalubale.","• Daga shekara 16: gabatar da kai tsaye, hawa dandali a cikin kai tsaye, ƙirƙira tare da wasu masu ƙirƙira.","• Daga shekara 18: kuɗi (kyaututtuka na biya, sayayya, riba da cire kuɗi), Miss & Master, haɗuwa a Love Universe da kiran waya na Palabre.","Kai tsaye da aka yi wa alamar «manyan masu kallo» ana nuna su ne kawai daga shekara 16.","Daga shekara 13 zuwa 17, ƙarin kariya na aiki. An bayyana su a cikin Manufar sirri.","Shekarun da kuka bayyana dole ne su zama gaskiya. NEURAVID na iya neman ku tabbatar da su. Idan shekarun da aka bayyana ƙarya ne, ana iya taƙaita samun wasu ayyuka."]},{"id":"compte","t":"Asusunku da tsaronsa","p":["Ku ba da bayanai na gaskiya kuma ku riƙa sabunta su.","Ku ɓoye kalmar sirrinku. Ku kunna tabbatarwa ta matakai biyu idan an ba ku dama.","Idan kuna tsammanin wani yana amfani da asusunku, ku canza kalmar sirri kuma ku sanar da mu nan take.","Ku ne ke da alhakin abin da aka yi da asusunku, sai dai idan wani ya yi amfani da shi ba tare da izininku ba."]},{"id":"contenus","t":"Abubuwan da kuke wallafawa","p":["Ku ne kuke ci gaba da kasancewa marubutan abin da kuka wallafa: bidiyo, sauti, hotuna, rubutu.","Don NEURAVID ta yi aiki, kuna ba mu izini, kyauta kuma a duniya baki ɗaya, don ajiye, kwafa, nunawa da yaɗa abubuwanku, da daidaita su ta fannin fasaha (tsari, inganci, rubutun ƙasa). Wannan izini yana ƙarewa idan kun goge abu, bayan lokacin fasaha da ake buƙata, sai dai idan doka ta tilasta mana mu ajiye shi.","Wasu mutane na iya sake amfani da sautunanku ko yin duo da bidiyonku ne kawai idan saitunanku sun ba da dama.","Abin da aka gyara ko aka ƙirƙira ta na'ura (muryar da aka samar, fassarar murya, bango na kwamfuta, avatar, abin da aka goge, gyara daga sabar) ana nuna wa masu kallo a matsayin «abin da aka gyara». Kada ku ɓoye wannan alamar.","Muryarku kawai za ku iya fassara ko kwaikwaya, da izininku.","Game da kiɗa, dole ne ku sami izinin amfani da kowane sauti. Sauti daga wayarku yana neman ku tabbatar da hakan kafin wallafawa. Sautunan Le Griot suna zuwa tare da sharuɗɗan amfaninsu."]},{"id":"interdits","t":"Abin da aka hana","p":["Dokokin al'umma ɓangare ne na waɗannan sharuɗɗa. An hana musamman:","• jefa ƙananan yara cikin haɗari, cin zarafinsu ko sanya su cikin abubuwan jima'i;","• cin zarafi, barazana, tayar da ƙiyayya ko tashin hankali;","• wallafa abubuwan jima'i ko na haram;","• zamba, yaudara game da kuɗi ko sayar da ayyukan ƙarya;","• ƙirƙirar hulɗa ta ƙarya: na'urori masu aiki da kansu, ƙuri'un da aka saya, asusu da yawa, kyaututtuka masu zagayawa;","• yin kamar wani mutum ne;","• kauce wa tsaron NEURAVID ko tattara bayanan wasu mutane."]},{"id":"moderation","t":"Kula da abubuwa","p":["Garkuwar NEURAVID tana gano alamun zamba ko haɗari da kanta. Ita kaɗai, za ta iya neman ƙarin tabbatarwa kawai.","Abin da aka ba da rahoto a matsayin haɗari ga rai ko cin zarafin ƙananan yara ana ɓoye shi nan take, har sai wani mutum ya duba shi.","Hukunce-hukunce suna da matakai: ƙarin tabbatarwa, taƙaitawa, dakatarwa, korewa. Taƙaitawa, dakatarwa da korewa koyaushe mutum ne ke yanke su. Dole ne mutum na biyu ya tabbatar da korewa.","Ana bayyana muku kowane hukunci tare da dalili."]},{"id":"recours","t":"Ƙara","p":["Kuna iya ƙalubalantar hukuncin kula cikin kwanaki 30, sau ɗaya ga kowane hukunci, daga «Hukunce-hukuncena da ƙararrakina» a cikin L'Empreinte, ko da «Ƙalubalanci».","Wani mutum dabam da wanda ya yanke hukunci ne ke duba ƙararku.","Idan aka karɓi ƙararku, za a soke hukuncin kuma abinku zai sake bayyana."]},{"id":"hvs","t":"HVS","p":["HVS yana auna darajar gudummawa: aiki, shiga, sharhi mai amfani, taimako, rahoton da aka tabbatar. Ba ya taɓa auna darajar mutum.","NEURAVID ba ta jera mutane da HVS: babu jimla ga kowane mutum, babu matsakaici, babu matsayi.","Kowane maki ana iya bayyana shi: yana nuna sassansa, lambobin da aka yi amfani da su da sigar dabarar.","Marubucin gudummawa na iya ƙalubalantar makinta. Wani mutum yana duba ƙarar kuma ya bayyana dalilin hukuncinsa."]},{"id":"defis","t":"Ƙalubale da gasa","p":["Kowane ƙalubale yana da dokoki da ake wallafawa kafin farawa: kwanaki, sharuɗɗa, yadda ake jefa ƙuri'a da yadda ake raba kunnen doki.","Idan ƙuri'ar sa'a ta raba kunnen doki, ana iya tabbatar da ita: ana lissafa ta daga sawun dokokin da aka wallafa.","Ƙasashe daidai suke: babu ƙarin maki saboda ƙasa, kuma kowace ƙuri'a ɗaya ce.","Ba a jefa wa kai ƙuri'a. Kafin shekara 18, nasara tana ba da laƙabi da lambobin yabo, ba kuɗi ba.","Ana iya ƙalubalantar sakamako. Wani mutum yana duba ƙalubalen."]},{"id":"argent","t":"Kuɗi","p":["Duk abin da ya shafi kuɗi an keɓe shi ga mutane masu shekara 18 zuwa sama.","NVCoins da aka saya ana amfani da su don ba da kyaututtuka. Ba a iya cire su.","Riba tana jira na lokacin tsaro kafin a iya cire ta. Ana nuna lokacin, kuɗaɗen sabis da adadin da ya rage kafin kowane cire kuɗi.","Don yaƙi da zamba, ana iya daskarar da riba ko cire kuɗi yayin da wani mutum ke duba shi. Daskarewa ba ƙwacewa ba ce: kuɗin na ku ne har sai wani mutum ya yanke hukunci, tare da dalili. Kuna iya ƙalubalantar wannan hukunci.","Hanyoyin biya sun dogara da ƙasarku. Ana iya buƙatar tabbatar da shaidar ku don cire kuɗi."]},{"id":"fin","t":"Dakatar ko goge asusu","p":["Kuna iya kashe asusunku ko goge shi a Saituna da sirri. Gogewa tana barin kwanaki 30 na tunani kafin ta zama ta ƙarshe.","Kafin ku tafi, kuna iya neman kwafin bayananku.","NEURAVID na iya dakatar ko rufe asusun da ya karya waɗannan sharuɗɗa, bisa dokokin kula, tare da damar ƙara."]},{"id":"responsabilite","t":"Alhakinmu","p":["Muna iya ƙoƙarinmu don NEURAVID ta yi aiki da kyau kuma ta kasance lafiya. Ba za mu iya alƙawarin cewa ba za a taɓa samun katsewa ko kuskure ba.","Kowane mutum yana da alhakin abin da ya wallafa. Idan aka ba mu rahoton abin da aka hana, muna ɗaukar mataki.","Babu wani abu a cikin waɗannan sharuɗɗa da ke kwace muku haƙƙoƙin da dokar ƙasarku ke ba ku."]},{"id":"changements","t":"Canje-canjen waɗannan sharuɗɗa","p":["Kowace siga tana da lamba da kwanan wata.","Idan waɗannan sharuɗɗa suka canza, za mu nuna muku taƙaitaccen abin da ya canza kuma mu nemi ku sake amincewa da su.","Idan ba ku amince da sabuwar siga ba, kuna iya neman kwafin bayananku kuma ku goge asusunku."]},{"id":"loi","t":"Dokar da ake bi da tuntuɓa","p":["Waɗannan sharuɗɗa suna ƙarƙashin dokar da ake bi a hedkwatar TENAGON GROUP, LLC, a Amurka, ba tare da hana ku kariyar da dokar ƙasar da kuke zaune ke ba ku ba.","Waɗannan sharuɗɗa suna cikin harsuna da yawa. Idan akwai bambanci, sigar Faransanci ce ake bi.","Don kowace tambaya: contact@neuravid.com."]}]},"confidentialite":{"titre":"Manufar sirri","chapeau":"Wannan manufa tana bayyana bayanan da NEURAVID ke amfani da su, dalilin hakan, abin da ke zama a wayarku, da yadda kuke ci gaba da iko.","changements":["Sigar farko ta wannan rubutu."],"sections":[{"id":"responsable","t":"Wa ke da alhaki","p":["TENAGON GROUP, LLC, kamfanin da aka kafa a Amurka, ne ke sarrafa bayananku don gudanar da NEURAVID.","Don rubuto mana: contact@neuravid.com."]},{"id":"donnees","t":"Bayanan da muke amfani da su, da dalili","p":["• Asusunku (laƙabi, suna, hanyar shiga, harshe, ƙasa): don ƙirƙirar asusunku da kare shi.","• Ranar haihuwarku: don aiwatar da shekarun NEURAVID da kare ƙananan yara.","• Ƙasarku da harsunanku: don nuna muku bidiyo cikin harsunanku da ƙalubalen ƙasarku.","• Abubuwanku (bidiyo, sauti, sharhi, saƙonni): don wallafa su ko isar da su, bisa zaɓinku.","• Alamun kallonku (ɓangaren da kuka kalla, bidiyon da kuka tsallake ko kuka sake kallo, martaninku): don ba ku shawarar bidiyo. Kuna iya daina adana tarihinku kuma ku goge shi.","• HVS: gudummawarku da ra'ayoyin da kuka samu, don lissafa makin kowace gudummawa.","• Ingancin kunnawa a Iris, mai kunna bidiyo: tare da alamun kallo, wayar tana aika lokacin kafin hoton farko da adadin katsewa. Ana amfani da waɗannan lambobi ne kawai don sa ido da inganta sabis. Ba sa taɓa shiga bayanin martabarku ko shawarwarinku.","• «Taimaka wa mai gabatarwa» a Le Direct: matakin sauti da ingancin hanyar sadarwa da wayarku ke karɓa ana aika su ne kawai idan kun kunna (a kashe yake tun farko, a cikin «Inganci»). Ba a taɓa aika sauti ko hoto ba.","• Wurin da kuke: sai idan kun ba da izini, kuma ana zagaye shi a wayar zuwa unguwa ko gari kafin a aika. Kafin shekara 18, gari kawai.","• Kuɗi (daga shekara 18): mu'amalolinku da matakin tabbatar da shaidarku. Ba ma adana lambar katin shaidarku ko hotonsa.","• Tsaro: na'urorinku da aka haɗa da shigarku na baya-bayan nan. Don yaƙi da zamba, ana mayar da adireshin hanyar sadarwa da na'urar zuwa sawu kafin a adana su.","• Rahotanninku da hukunce-hukuncen kula: don kare al'umma da ba da damar ƙara."]},{"id":"telephone","t":"Abin da ke zama a wayarku","p":["Kyamara, kwalliya, bin fuska da cire hayaniyar baya ana lissafa su a wayarku. Ba a aika waɗannan hotuna da ma'auni.","Daftarorinku, ɗaukar hotunanku da wurarenku suna zama a wayarku muddin ba ku wallafa ba."]},{"id":"accord","t":"Abin da ke zuwa sabar sai da izininku","p":["Wasu ayyuka masu nauyi ana yin su a sabarmu: daidaita bidiyo, ƙara girma, ƙirƙirar rubutun ƙasa ta atomatik, fassarar murya, samar da tasiri. NEURAVID tana neman izininku kafin aika komai.","Ga tasirin da aka samar daga jimla, jimlar kawai ake aikawa: babu hoto babu sauti.","Rubutu ta murya da umarnin murya suna amfani da sabis na gane murya na wayarku. Wannan sabis na iya aika muryarku zuwa ga mai ba da sabis ɗinsa. Allon yana gargaɗar ku kafin hakan."]},{"id":"mineurs","t":"Kare ƙananan yara","p":["Daga shekara 13 zuwa 17, waɗannan kariyoyi suna aiki kuma ba za a iya cire su ba:","• asusun na sirri ne;","• wasu ba za su iya sauke bidiyon ba;","• ba a nuna gari kuma ba a ba da shawarar asusun ga baƙi;","• ana ajiye saƙonnin baƙi a gefe;","• babu tallace-tallace na musamman;","• babu kiran waya da asusun ƙaramin yaro, kuma babu kuɗi.","Babban mutum da ke rubuta wa ƙananan yara da yawa da bai sani ba, wani mutum daga ƙungiyar kula yana duba shi.","Iyaye na iya raka matashi da lamba. Suna ganin lokacin da aka kashe da kariyoyi, ba saƙonni ko abin da matashin ke kallo ba."]},{"id":"conservation","t":"Tsawon lokacin da muke adana bayananku","p":["• Asusunku: muddin yana nan. Bayan neman gogewa, kwanaki 30 na tunani, sannan gogewa cikin kwanaki 90 masu biyowa, har da ajiyar kwafi.","• Tarihin kallonku: har sai kun goge shi ko kun daina adana shi. Alamomin da ba a san mai su ba da ke hana ƙidaya kallo ɗaya sau biyu ana goge su bayan kwanaki 30.","• Rahotanni da hukunce-hukuncen kula: shekara 1 bayan hukunci, ko fiye idan doka ta buƙata.","• Shaidar amincewarku da waɗannan rubuce-rubuce: muddin asusunku yana nan, sannan shekara 5.","• Mu'amalolin kuɗi: lokacin da dokar lissafin kuɗi ta buƙata.","• Sawun tsaro: watanni 12.","• Wurin da aka raba: ana goge shi idan rabawar ta ƙare."]},{"id":"droits","t":"Haƙƙoƙinku","p":["A kowane lokaci, kuna iya:","• ganin bayananku kuma ku nemi kwafi;","• gyara bayananku;","• goge tarihinku ko goge asusunku;","• ƙin shawarwari da tallace-tallace na musamman;","• janye izinin da kuka bayar.","Duk wannan ana yi ne a Saituna da sirri, a sashen «Bayanaina». Kuna iya rubutawa zuwa contact@neuravid.com. Muna amsawa cikin kwanaki 30.","Kuna iya kuma tuntuɓar hukumar kare bayanai ta ƙasarku."]},{"id":"securite","t":"Tsaro","p":["Musayar bayanai tsakanin manhajar da sabarmu tana bi ta hanyoyin sadarwa masu ɓoye.","Ana rubuta hukunce-hukuncen kula a cikin rajista da aka kare daga canji.","Babu tsarin da ya cika. Idan bayanan da suka shafe ku suka fita, za mu sanar da ku kamar yadda doka ta tanada."]},{"id":"transferts","t":"Tura bayanai zuwa wasu ƙasashe","p":["TENAGON GROUP, LLC tana Amurka. Ana iya sarrafa bayananku a wata ƙasa dabam da taku, ciki har da Amurka, tare da kariyoyin da doka ta buƙata."]},{"id":"vente","t":"Ba ma sayar da bayananku","p":["Ba ma sayar da bayananku na sirri.","Masu ba da sabis da ke taimaka mana (ajiya, biya, tabbatar da shaida) suna karɓar abin da ake buƙata ne kawai don aikinsu."]},{"id":"contact","t":"Canje-canje da tuntuɓa","p":["Idan wannan manufa ta canza, za mu nuna muku abin da ya canza kuma mu nemi ku sake karanta ta.","Idan akwai bambanci tsakanin harsuna, sigar Faransanci ce ake bi.","Don kowace tambaya: contact@neuravid.com."]}]},"regles":{"titre":"Dokokin al'umma","chapeau":"NEURAVID tana haɗa mutane daga ko'ina a duniya. Waɗannan dokoki suna kare kowa. Suna aiki a ko'ina: bidiyo, kai tsaye, sharhi, saƙonni da ƙalubale.","changements":["Sigar farko ta wannan rubutu."],"sections":[{"id":"respect","t":"Girmamawa","p":["Ku girmama mutane, al'adunsu, harsunansu da imaninsu. Ku soki aiki, ba mutum ba."]},{"id":"harcelement","t":"Babu cin zarafi","p":["Babu barazana, zagi akai-akai, wulaƙanci, izgili na ƙungiya ko yaɗa bayanan sirri na wani."]},{"id":"haine","t":"Babu ƙiyayya","p":["Babu kai wa mutum ko ƙungiya hari saboda asalinsu, ƙasarsu, addininsu, jinsinsu, nakasarsu ko wani ɓangare na shaidarsu."]},{"id":"violence","t":"Babu tashin hankali ko haɗari","p":["Babu kira zuwa tashin hankali, babu ƙalubale masu haɗari, babu ƙarfafa cutar da kai.","Idan wani yana cikin haɗari, ku fara kiran ma'aikatan agajin gaggawa na ƙasarku, sannan ku ba da rahoton abin."]},{"id":"sexuel","t":"Babu abubuwan jima'i","p":["Babu tsiraici ko abubuwan jima'i.","Duk abin da ke sanya ƙaramin yaro cikin abubuwan jima'i ko jefa shi cikin haɗari an hana shi, ba tare da togiya ba. Ana ɓoye abin nan take, ana duba asusun da fifiko kuma ana iya rufe shi, kuma ana kai rahoton abin da ya faru ga hukumomi idan doka ta tanada."]},{"id":"arnaques","t":"Babu zamba","p":["Babu alƙawuran kuɗi na ƙarya, gasar ƙarya, neman kalmomin sirri ko lambobi, ko sayarwa ta yaudara."]},{"id":"engagement","t":"Babu hulɗa ta ƙarya","p":["Babu na'urori masu aiki da kansu, ƙuri'un da aka saya, asusu da yawa don jefa ƙuri'a, ko kyaututtuka masu zagayawa don ƙara lambobi."]},{"id":"usurpation","t":"Babu yin kamar wani","p":["Kada ku yi kamar wani mutum ne, wata alama ko NEURAVID. Kada ku yi amfani da hoton wani a matsayin naku."]},{"id":"verite","t":"Gaskiya","p":["Abin da aka gyara ko aka ƙirƙira ta na'ura dole ne ya ci gaba da alamarsa. Kada ku gabatar da shi a matsayin na gaske.","Kada ku sa mutum na gaske ya faɗi ko ya yi abin da bai faɗa ko bai yi ba, ba tare da izininsa ba."]},{"id":"defis","t":"Ƙalubale na adalci","p":["Ku bi dokokin da aka wallafa na kowane ƙalubale. Kada ku jefa wa kanku ƙuri'a. Kada ku yi magudi a cikin shiga. Ku girmama aikin wasu, masu nasara da waɗanda suka sha kaye."]},{"id":"manquement","t":"Abin da ke faruwa idan aka karya dokoki","p":["Gwargwadon tsananin lamarin: ƙarin tabbatarwa, ɓoye ko cire abu, taƙaitawa, dakatarwa, korewa.","Taƙaitawa, dakatarwa da korewa mutum ne ke yanke su, kuma ana bayyana kowane hukunci."]},{"id":"signaler","t":"Yadda ake ba da rahoto","p":["Ku taɓa «Ba da rahoto» a kan bidiyo, kai tsaye, saƙo ko bayanin martaba, sannan ku zaɓi dalili.","Mutumin da aka ba da rahotonsa ba ya sanin wanda ya ba da rahoton."]},{"id":"recours","t":"Yadda ake shigar da ƙara","p":["Idan kuna ganin hukunci kuskure ne, ku ƙalubalance shi cikin kwanaki 30 daga «Hukunce-hukuncena da ƙararrakina» a cikin L'Empreinte, ko da «Ƙalubalanci».","Wani mutum dabam da wanda ya yanke hukunci ne ke duba ƙararku."]}]}}</script>
<script type="application/json" id="nvDocs-yo">{"cgu":{"titre":"Àwọn òfin gbogbogbò ìlò","chapeau":"Àwọn òfin yìí ṣàlàyé ìlànà NEURAVID: ohun tí ẹ lè ṣe níbí, ohun tí àwa ń ṣe, àti ohun tí ó ń ṣẹlẹ̀ bí ìṣòro bá wà. A kọ wọ́n ní gbólóhùn tí ó rọrùn.","changements":["Ẹ̀dà àkọ́kọ́ ọ̀rọ̀ yìí."],"sections":[{"id":"editeur","t":"Ta ni wá","p":["NEURAVID jẹ́ iṣẹ́ ti TENAGON GROUP, LLC, ilé-iṣẹ́ tí a dá sílẹ̀ ní Amẹ́ríkà.","Nínú àwọn òfin yìí, «àwa» túmọ̀ sí NEURAVID àti TENAGON GROUP, LLC. «Ẹ̀yin» túmọ̀ sí ẹni tí ó ń lo NEURAVID.","Láti kọ̀wé sí wa: contact@neuravid.com."]},{"id":"acceptation","t":"Gbígba àwọn òfin yìí","p":["Láti ṣẹ̀dá àkọọ́lẹ̀, ẹ gbọ́dọ̀ gba àwọn òfin yìí, ka Ìlànà àṣírí, kí ẹ sì gba Òfin àwùjọ. Àdéhùn mẹ́ta ọ̀tọ̀ọ̀tọ̀ ni wọ́n.","Bí ọ̀kan nínú àwọn ọ̀rọ̀ yìí bá yí padà, a ó fi ohun tí ó yí padà hàn yín, a ó sì ní kí ẹ tún gbà á kí ẹ tó tẹ̀síwájú.","A ń tọ́jú àkọsílẹ̀ àdéhùn kọ̀ọ̀kan: ọ̀rọ̀ náà, ẹ̀dà rẹ̀, ọjọ́ àti èdè tí a fi hàn."]},{"id":"ages","t":"Ọjọ́-orí","p":["Kò sí àkọọ́lẹ̀ NEURAVID kí ẹni tó pé ọmọ ọdún 13.","• Láti ọmọ ọdún 13: lílo NEURAVID, wíwo àti ṣíṣe fídíò, wíwo ìgbóhùnsáfẹ́fẹ́ tààrà àti kíkọ nínú ìjíròrò rẹ̀, kíkópa nínú àwọn ìpèníjà.","• Láti ọmọ ọdún 16: darí ìgbóhùnsáfẹ́fẹ́ tààrà, gòkè sí orí ìtàgé nínú ìgbóhùnsáfẹ́fẹ́ tààrà, ṣíṣẹ̀dá pọ̀ pẹ̀lú àwọn olùṣẹ̀dá mìíràn.","• Láti ọmọ ọdún 18: owó (ẹ̀bùn tí a sanwó fún, ríra, èrè àti gbígba owó jáde), Miss & Master, ìpàdé Love Universe àti ìpè Palabre.","Ìgbóhùnsáfẹ́fẹ́ tààrà tí a sàmì sí «fún àgbàlagbà» ni a ń fi hàn láti ọmọ ọdún 16 nìkan.","Láti ọmọ ọdún 13 sí 17, àwọn ààbò àfikún ń ṣiṣẹ́. A ṣàlàyé wọn nínú Ìlànà àṣírí.","Ọjọ́-orí tí ẹ sọ gbọ́dọ̀ jẹ́ òótọ́. NEURAVID lè ní kí ẹ fìdí rẹ̀ múlẹ̀. Bí ọjọ́-orí tí ẹ sọ bá jẹ́ irọ́, a lè dín àǹfààní sí àwọn iṣẹ́ kan kù."]},{"id":"compte","t":"Àkọọ́lẹ̀ yín àti ààbò rẹ̀","p":["Ẹ fún wa ní ìsọfúnni tí ó péye, kí ẹ sì máa ṣe àtúnṣe rẹ̀.","Ẹ pa ọ̀rọ̀ aṣínà yín mọ́ ní àṣírí. Ẹ tan ìfìdímúlẹ̀ onígbésẹ̀ méjì nígbà tí a bá fi lọ̀ yín.","Bí ẹ bá rò pé ẹnìkan ń lo àkọọ́lẹ̀ yín, ẹ yí ọ̀rọ̀ aṣínà padà kí ẹ sì sọ fún wa lẹ́sẹ̀kẹsẹ̀.","Ẹ̀yin ni ẹ ń dáhùn fún ohun tí a fi àkọọ́lẹ̀ yín ṣe, àyàfi bí ẹnìkan bá lò ó láìsí àṣẹ yín."]},{"id":"contenus","t":"Àwọn àkóónú yín","p":["Ẹ̀yin ṣì ni òǹkọ̀wé ohun tí ẹ gbé jáde: fídíò, ohùn, fọ́tò, ọ̀rọ̀.","Kí NEURAVID lè ṣiṣẹ́, ẹ fún wa ní ẹ̀tọ́, lọ́fẹ̀ẹ́ àti fún gbogbo àgbáyé, láti tọ́jú, ṣàdàkọ, fi hàn àti tan àwọn àkóónú yín kálẹ̀, àti láti ṣàtúnṣe wọn ní ọ̀nà ìmọ̀-ẹ̀rọ (ìrísí, dídára, àkọlé ìsàlẹ̀). Ẹ̀tọ́ yìí dópin nígbà tí ẹ bá pa àkóónú rẹ́, lẹ́yìn àkókò ìmọ̀-ẹ̀rọ tí ó yẹ, àyàfi bí òfin bá pàṣẹ fún wa láti tọ́jú rẹ̀.","Àwọn ẹlòmíràn lè tún lo ohùn yín tàbí ṣe duo pẹ̀lú fídíò yín kìkì bí ètò yín bá gbà á láàyè.","Àkóónú tí a ṣàtúnṣe tàbí tí ẹ̀rọ ṣẹ̀dá (ohùn tí ẹ̀rọ ṣe, ìyípadà ohùn sí èdè mìíràn, ẹ̀yìn ìran onídíjítà, avatar, nǹkan tí a pa rẹ́, àtúnṣe láti sáfà) ni a ń fi hàn àwọn olùwò gẹ́gẹ́ bí «àkóónú tí a ṣàtúnṣe». Ẹ má ṣe fi àmì yìí pamọ́.","Ohùn ara yín nìkan ni ẹ lè yí padà tàbí fara wé, pẹ̀lú àṣẹ yín.","Fún orin, ẹ gbọ́dọ̀ ní ẹ̀tọ́ láti lo ohùn kọ̀ọ̀kan. Ohùn tí ó wá láti inú fóònù yín ń béèrè pé kí ẹ fìdí èyí múlẹ̀ kí ẹ tó gbé e jáde. Àwọn ohùn Le Griot wá pẹ̀lú àwọn òfin ìlò wọn."]},{"id":"interdits","t":"Ohun tí a kà léèwọ̀","p":["Òfin àwùjọ jẹ́ apá kan àwọn òfin yìí. A kà á léèwọ̀ ní pàtàkì:","• láti fi àwọn ọmọdé sínú ewu, lò wọ́n nílòkulò tàbí fà wọ́n sínú ọ̀rọ̀ ìbálòpọ̀;","• láti fòòró, dẹ́rùbà, ru ìkórìíra tàbí ìwà ipá sókè;","• láti gbé àkóónú ìbálòpọ̀ tàbí èyí tí kò bófin mu jáde;","• láti lu jìbìtì, tanni jẹ nípa owó tàbí ta iṣẹ́ èké;","• láti ṣe ìkópa èké: rọ́bọ́ọ̀tì, ìbò tí a rà, àkọọ́lẹ̀ púpọ̀, ẹ̀bùn tí ń yípo;","• láti ṣe bí ẹni pé ẹ jẹ́ ẹlòmíràn;","• láti yẹ ààbò NEURAVID sílẹ̀ tàbí kó ìsọfúnni àwọn ẹlòmíràn jọ."]},{"id":"moderation","t":"Ìṣàkóso àkóónú","p":["Asà NEURAVID ń dá àwọn àmì jìbìtì tàbí ewu mọ̀ fúnra rẹ̀. Òun nìkan, kò lè ṣe ju bíbéèrè ìfìdímúlẹ̀ àfikún lọ.","Àkóónú tí a jábọ̀ gẹ́gẹ́ bí ewu fún ẹ̀mí tàbí ìlòkulò àwọn ọmọdé ni a ń fi pamọ́ lẹ́sẹ̀kẹsẹ̀, títí ẹnìkan yóò fi yẹ̀ ẹ́ wò.","Ìjìyà ń lọ ní ìpele: ìfìdímúlẹ̀ àfikún, ìdíwọ́, ìdádúró, ìlé jáde. Ènìyàn ni ó máa ń pinnu ìdíwọ́, ìdádúró àti ìlé jáde nígbà gbogbo. Ènìyàn kejì gbọ́dọ̀ fìdí ìlé jáde múlẹ̀.","A ń ṣàlàyé ìpinnu kọ̀ọ̀kan fún yín pẹ̀lú ìdí rẹ̀."]},{"id":"recours","t":"Ẹ̀bẹ̀ àtúnyẹ̀wò","p":["Ẹ lè tako ìpinnu ìṣàkóso láàárín ọjọ́ 30, ẹ̀ẹ̀kan fún ìpinnu kọ̀ọ̀kan, láti «Àwọn ìpinnu àti ẹ̀bẹ̀ mi» nínú L'Empreinte, tàbí pẹ̀lú «Tako».","Ènìyàn mìíràn yàtọ̀ sí ẹni tí ó pinnu ni ó ń yẹ ẹ̀bẹ̀ yín wò.","Bí a bá gba ẹ̀bẹ̀ yín, a ó fagi lé ìpinnu náà, àkóónú yín yóò sì tún hàn."]},{"id":"hvs","t":"HVS","p":["HVS ń wọn iye ìkópa kan: iṣẹ́ ọnà, ìkópa, ọ̀rọ̀ ìwòye tí ó wúlò, ìrànlọ́wọ́, ìjábọ̀ tí a fìdí rẹ̀ múlẹ̀. Kò jẹ́ wọn iye ènìyàn rárá.","NEURAVID kò fi HVS to ènìyàn lẹ́sẹẹsẹ: kò sí àpapọ̀ fún ènìyàn, kò sí ààrin, kò sí ipò.","Àmì kọ̀ọ̀kan ṣeé ṣàlàyé: ó ń fi àwọn apá rẹ̀ hàn, àwọn nọ́ńbà tí a lò àti ẹ̀dà ìlànà ìṣirò.","Òǹkọ̀wé ìkópa kan lè tako àmì rẹ̀. Ènìyàn kan ń yẹ ẹ̀bẹ̀ náà wò ó sì ń ṣàlàyé ìdí ìpinnu rẹ̀."]},{"id":"defis","t":"Àwọn ìpèníjà àti ìdíje","p":["Ìpèníjà kọ̀ọ̀kan ní ìlànà tí a gbé jáde kí ó tó bẹ̀rẹ̀: àwọn ọjọ́, àwọn òṣùwọ̀n, bí a ṣe ń dìbò àti bí a ṣe ń yanjú ọ̀ràn ọ̀gbọ̀ọ̀gba.","Nígbà tí ìtẹ̀tẹ́ bá yanjú ọ̀gbọ̀ọ̀gba, ó ṣeé fìdí múlẹ̀: a ń ṣírò rẹ̀ láti inú àmì ìdánimọ̀ onídíjítà ti ìlànà tí a gbé jáde.","Àwọn orílẹ̀-èdè dọ́gba: kò sí àfikún nítorí orílẹ̀-èdè, ìbò kọ̀ọ̀kan sì jẹ́ ẹyọ kan.","Ẹnìkan kò lè dìbò fún ara rẹ̀. Kí ẹni tó pé ọmọ ọdún 18, ìṣẹ́gun ń fúnni ní orúkọ oyè àti bààjì, kì í ṣe owó rárá.","Èsì lè jẹ́ títako. Ènìyàn kan ń yẹ àtakò náà wò."]},{"id":"argent","t":"Owó","p":["Gbogbo ohun tí ó jẹ mọ́ owó jẹ́ ti àwọn ènìyàn ọmọ ọdún 18 sókè nìkan.","NVCoins tí a rà ni a fi ń fúnni ní ẹ̀bùn. A kò lè gbà wọ́n jáde gẹ́gẹ́ bí owó.","Èrè máa ń dúró fún àkókò ààbò kí ó tó ṣeé gbà jáde. A ń fi àkókò náà, owó iṣẹ́ àti iye tí ó kù hàn kí ẹ tó gba owó jáde nígbàkúùgbà.","Láti gbógun ti jìbìtì, a lè dí èrè tàbí gbígba owó jáde dúró nígbà tí ẹnìkan ń yẹ̀ ẹ́ wò. Dídíwọ́ kì í ṣe gbígbà mọ́ni lọ́wọ́ rárá: owó náà ṣì jẹ́ tiyín títí ènìyàn kan yóò fi pinnu, pẹ̀lú ìdí. Ẹ lè tako ìpinnu yìí.","Àwọn ọ̀nà ìsanwó dá lórí orílẹ̀-èdè yín. A lè béèrè ìfìdímúlẹ̀ ìdánimọ̀ láti gba owó jáde."]},{"id":"fin","t":"Dídá àkọọ́lẹ̀ dúró tàbí pípa á rẹ́","p":["Ẹ lè pa àkọọ́lẹ̀ yín (ní ìgbà díẹ̀) tàbí pa á rẹ́ nínú Ètò àti àṣírí. Pípa rẹ́ ń fi ọjọ́ 30 sílẹ̀ fún ìrònú kí ó tó di àṣepé.","Kí ẹ tó lọ, ẹ lè béèrè ẹ̀dà ìsọfúnni yín.","NEURAVID lè dá àkọọ́lẹ̀ tí ó rú àwọn òfin yìí dúró tàbí tì í, gẹ́gẹ́ bí ìlànà ìṣàkóso, pẹ̀lú ẹ̀tọ́ ẹ̀bẹ̀ àtúnyẹ̀wò."]},{"id":"responsabilite","t":"Ojúṣe wa","p":["A ń ṣe gbogbo ohun tí a lè ṣe kí NEURAVID lè ṣiṣẹ́ dáadáa kí ó sì wà láìléwu. A kò lè ṣèlérí pé kò ní sí ìdádúró tàbí àṣìṣe láé.","Ẹnìkọ̀ọ̀kan ni ó ń dáhùn fún ohun tí ó gbé jáde. Nígbà tí a bá jábọ̀ àkóónú tí a kà léèwọ̀ fún wa, a ń gbé ìgbésẹ̀.","Kò sí ohunkóhun nínú àwọn òfin yìí tí ó gba ẹ̀tọ́ tí òfin orílẹ̀-èdè yín fún yín lọ́wọ́ yín."]},{"id":"changements","t":"Àwọn àyípadà àwọn òfin yìí","p":["Ẹ̀dà kọ̀ọ̀kan ní nọ́ńbà àti ọjọ́.","Nígbà tí àwọn òfin yìí bá yí padà, a ó fi àkópọ̀ ohun tí ó yí padà hàn yín, a ó sì ní kí ẹ tún gbà wọ́n.","Bí ẹ kò bá gba ẹ̀dà tuntun, ẹ lè béèrè ẹ̀dà ìsọfúnni yín kí ẹ sì pa àkọọ́lẹ̀ yín rẹ́."]},{"id":"loi","t":"Òfin tí ó ń ṣiṣẹ́ àti ìkànsí","p":["Òfin tí ó ń ṣiṣẹ́ níbi olú-ilé-iṣẹ́ TENAGON GROUP, LLC, ní Amẹ́ríkà, ni ó ń darí àwọn òfin yìí, láìgba ààbò tí òfin orílẹ̀-èdè tí ẹ ń gbé fún yín lọ́wọ́ yín.","Àwọn òfin yìí wà ní èdè púpọ̀. Bí ìyàtọ̀ bá wà, ẹ̀dà Faransé ni ó fẹsẹ̀ múlẹ̀.","Fún ìbéèrè èyíkéyìí: contact@neuravid.com."]}]},"confidentialite":{"titre":"Ìlànà àṣírí","chapeau":"Ìlànà yìí ṣàlàyé ìsọfúnni tí NEURAVID ń lò, ìdí rẹ̀, ohun tí ó ń wà lórí fóònù yín, àti bí ẹ ṣe ń ní àkóso.","changements":["Ẹ̀dà àkọ́kọ́ ọ̀rọ̀ yìí."],"sections":[{"id":"responsable","t":"Ta ni ó ń dáhùn","p":["TENAGON GROUP, LLC, ilé-iṣẹ́ tí a dá sílẹ̀ ní Amẹ́ríkà, ni ó ń ṣe àmúlò ìsọfúnni yín láti mú NEURAVID ṣiṣẹ́.","Láti kọ̀wé sí wa: contact@neuravid.com."]},{"id":"donnees","t":"Ìsọfúnni tí a ń lò, àti ìdí rẹ̀","p":["• Àkọọ́lẹ̀ yín (orúkọ ìnagijẹ, orúkọ, ọ̀nà ìwọlé, èdè, orílẹ̀-èdè): láti ṣẹ̀dá àkọọ́lẹ̀ yín àti láti dáàbò bò ó.","• Ọjọ́ ìbí yín: láti lo àwọn òfin ọjọ́-orí NEURAVID àti láti dáàbò bo àwọn ọmọdé.","• Orílẹ̀-èdè àti àwọn èdè yín: láti fi fídíò ní èdè yín àti àwọn ìpèníjà orílẹ̀-èdè yín hàn yín.","• Àwọn àkóónú yín (fídíò, ohùn, ọ̀rọ̀ ìwòye, ìfiránṣẹ́): láti gbé wọn jáde tàbí fi wọ́n ránṣẹ́, gẹ́gẹ́ bí yíyàn yín.","• Àwọn àmì wíwò yín (apá tí ẹ wò, fídíò tí ẹ fò tàbí tí ẹ tún wò, ìhùwàsí yín): láti dámọ̀ràn fídíò fún yín. Ẹ lè dẹ́kun títọ́jú ìtàn wíwò yín kí ẹ sì pa á rẹ́.","• HVS: àwọn ìkópa yín àti èrò tí ẹ gbà, láti ṣírò àmì ìkópa kọ̀ọ̀kan.","• Dídára ìṣeré nínú Iris, ẹ̀rọ ìṣeré: pẹ̀lú àwọn àmì wíwò, fóònù tún ń fi àkókò kí àwòrán àkọ́kọ́ tó hàn àti iye ìdádúró ránṣẹ́. Àwọn nọ́ńbà yìí wà fún ṣíṣe àbójútó àti mímú iṣẹ́ dára sí i nìkan. Wọn kò jẹ́ wọ inú àkọsílẹ̀ ẹni yín tàbí àwọn ìdámọ̀ràn yín rárá.","• «Ran olùdarí lọ́wọ́» nínú Le Direct: ìpele ohùn àti dídára nẹ́tíwọ̀ọ̀kì tí fóònù yín ń gbà ni a ń fi ránṣẹ́ kìkì bí ẹ bá tàn án (ó wà ní pípa tẹ́lẹ̀, nínú «Dídára»). Kì í ṣe ohùn tàbí àwòrán rárá.","• Ibi tí ẹ wà: kìkì bí ẹ bá gbà á láàyè, a sì ń dín i kù lórí fóònù sí àdúgbò tàbí ìlú kí a tó fi ránṣẹ́. Kí ẹni tó pé ọmọ ọdún 18, ìlú nìkan.","• Owó (láti ọmọ ọdún 18): àwọn ìdúnàádúrà yín àti ìpele ìfìdímúlẹ̀ ìdánimọ̀ yín. A kò tọ́jú nọ́ńbà káàdì ìdánimọ̀ yín tàbí fọ́tò rẹ̀.","• Ààbò: àwọn ẹ̀rọ yín tí ó so pọ̀ àti àwọn ìwọlé yín láìpẹ́. Láti gbógun ti jìbìtì, a ń yí àdírẹ́sì nẹ́tíwọ̀ọ̀kì àti ẹ̀rọ padà sí àmì ìdánimọ̀ onídíjítà kí a tó tọ́jú wọn.","• Àwọn ìjábọ̀ yín àti ìpinnu ìṣàkóso: láti dáàbò bo àwùjọ àti láti gba ẹ̀bẹ̀ àtúnyẹ̀wò láàyè."]},{"id":"telephone","t":"Ohun tí ó ń wà lórí fóònù yín","p":["Kámẹ́rà, ẹwà, títẹ̀lé ojú àti yíyọ ariwo ẹ̀yìn kúrò ni a ń ṣírò lórí fóònù yín. A kò fi àwọn àwòrán àti ìwọ̀n yìí ránṣẹ́.","Àwọn àkọsílẹ̀ àkọ́kọ́ yín, àwọn ìgbàsílẹ̀ àti àwọn ìran yín ń wà lórí fóònù yín níwọ̀n ìgbà tí ẹ kò bá tí ì gbé wọn jáde."]},{"id":"accord","t":"Ohun tí ó ń lọ sí sáfà kìkì pẹ̀lú àṣẹ yín","p":["Àwọn iṣẹ́ tí ó wúwo kan ni a ń ṣe lórí sáfà wa: mímú fídíò dúró ṣinṣin, mímú un tóbi, ṣíṣe àkọlé ìsàlẹ̀ aládàáṣe, yíyí ohùn padà sí èdè mìíràn, ṣíṣẹ̀dá ipa àrà. NEURAVID ń béèrè àṣẹ yín kí ó tó fi ohunkóhun ránṣẹ́.","Fún ipa àrà tí a ṣẹ̀dá láti inú gbólóhùn kan, gbólóhùn náà nìkan ni ó ń lọ: kò sí àwòrán, kò sí ohùn.","Ìkọ̀wé pẹ̀lú ohùn àti àwọn àṣẹ ohùn ń lo iṣẹ́ ìdánimọ̀ ohùn fóònù yín. Iṣẹ́ yìí lè fi ohùn yín ránṣẹ́ sí olùpèsè rẹ̀. Ojú-ìbòjú ń kìlọ̀ fún yín ṣáájú."]},{"id":"mineurs","t":"Ààbò àwọn ọmọdé","p":["Láti ọmọ ọdún 13 sí 17, àwọn ààbò wọ̀nyí ń ṣiṣẹ́, a kò sì lè yọ wọ́n kúrò:","• àkọọ́lẹ̀ jẹ́ àṣírí;","• àwọn ẹlòmíràn kò lè gba fídíò sílẹ̀;","• a kò fi ìlú hàn, a kò sì dámọ̀ràn àkọọ́lẹ̀ fún àwọn àjèjì;","• a ń fi ìfiránṣẹ́ àwọn àjèjì sí ẹ̀gbẹ́ kan;","• kò sí ìpolówó àdáni;","• kò sí ìpè pẹ̀lú àkọọ́lẹ̀ ọmọdé, kò sì sí owó.","Àgbàlagbà tí ó ń kọ̀wé sí ọ̀pọ̀ ọmọdé tí kò mọ̀ ni ẹnìkan láti ẹgbẹ́ ìṣàkóso ń yẹ̀ wò.","Òbí kan lè bá ọ̀dọ́ kan rìn pẹ̀lú kóòdù. Ó ń rí àkókò tí a lò àti àwọn ààbò, kì í ṣe àwọn ìfiránṣẹ́ tàbí ohun tí ọ̀dọ́ náà ń wò rárá."]},{"id":"conservation","t":"Bí a ṣe ń tọ́jú ìsọfúnni yín pẹ́ tó","p":["• Àkọọ́lẹ̀ yín: níwọ̀n ìgbà tí ó bá wà. Lẹ́yìn ìbéèrè pípa rẹ́, ọjọ́ 30 fún ìrònú, lẹ́yìn náà pípa rẹ́ láàárín ọjọ́ 90 tí ó tẹ̀lé e, títí kan àwọn ẹ̀dà ìpamọ́.","• Ìtàn wíwò yín: títí ẹ ó fi pa á rẹ́ tàbí dẹ́kun títọ́jú rẹ̀. Àwọn àmì àìlórúkọ tí ó ń dènà kíka wíwò kan náà lẹ́ẹ̀mejì ni a ń pa rẹ́ lẹ́yìn ọjọ́ 30.","• Àwọn ìjábọ̀ àti ìpinnu ìṣàkóso: ọdún 1 lẹ́yìn ìpinnu, tàbí ju bẹ́ẹ̀ lọ bí òfin bá béèrè.","• Àkọsílẹ̀ àwọn àdéhùn yín sí àwọn ọ̀rọ̀ yìí: níwọ̀n ìgbà tí àkọọ́lẹ̀ yín bá wà, lẹ́yìn náà ọdún 5.","• Àwọn ìdúnàádúrà owó: àkókò tí òfin ìṣirò owó béèrè.","• Àwọn àmì ààbò onídíjítà: oṣù 12.","• Ibi tí a pín: a ń pa á rẹ́ nígbà tí pínpín bá parí."]},{"id":"droits","t":"Àwọn ẹ̀tọ́ yín","p":["Nígbàkúùgbà, ẹ lè:","• rí ìsọfúnni yín kí ẹ sì béèrè ẹ̀dà rẹ̀;","• ṣàtúnṣe ìsọfúnni yín;","• pa ìtàn yín rẹ́ tàbí pa àkọọ́lẹ̀ yín rẹ́;","• kọ àwọn ìdámọ̀ràn àti ìpolówó àdáni;","• yọ àṣẹ tí ẹ ti fún wa kúrò.","Gbogbo èyí ni a ń ṣe nínú Ètò àti àṣírí, ní apá «Ìsọfúnni mi». Ẹ tún lè kọ̀wé sí contact@neuravid.com. A ń dáhùn láàárín ọjọ́ 30.","Ẹ tún lè kàn sí àjọ ààbò ìsọfúnni orílẹ̀-èdè yín."]},{"id":"securite","t":"Ààbò","p":["Pàṣípààrọ̀ láàárín áàpù àti sáfà wa ń gba ìsopọ̀ tí a fi koodu dáàbò bò.","A ń kọ àwọn ìpinnu ìṣàkóso sínú ìwé àkọsílẹ̀ tí a dáàbò bò lọ́wọ́ àyípadà.","Kò sí ètò tí ó pé. Bí ìsọfúnni tí ó kàn yín bá jò síta, a ó sọ fún yín gẹ́gẹ́ bí òfin ṣe là á sílẹ̀."]},{"id":"transferts","t":"Gbígbé ìsọfúnni lọ sí orílẹ̀-èdè mìíràn","p":["TENAGON GROUP, LLC wà ní Amẹ́ríkà. A lè ṣe àmúlò ìsọfúnni yín ní orílẹ̀-èdè mìíràn yàtọ̀ sí tiyín, títí kan Amẹ́ríkà, pẹ̀lú àwọn ààbò tí òfin béèrè."]},{"id":"vente","t":"A kò ta ìsọfúnni yín","p":["A kò ta ìsọfúnni ti ara ẹni yín.","Àwọn olùpèsè iṣẹ́ tí ó ń ràn wá lọ́wọ́ (ìtọ́jú, ìsanwó, ìfìdímúlẹ̀ ìdánimọ̀) ń gba ohun tí ó pọndandan fún iṣẹ́ wọn nìkan."]},{"id":"contact","t":"Àwọn àyípadà àti ìkànsí","p":["Nígbà tí ìlànà yìí bá yí padà, a ó fi ohun tí ó yí padà hàn yín, a ó sì ní kí ẹ tún kà á.","Bí ìyàtọ̀ bá wà láàárín àwọn èdè, ẹ̀dà Faransé ni ó fẹsẹ̀ múlẹ̀.","Fún ìbéèrè èyíkéyìí: contact@neuravid.com."]}]},"regles":{"titre":"Òfin àwùjọ","chapeau":"NEURAVID ń kó àwọn ènìyàn láti gbogbo àgbáyé jọ. Àwọn òfin yìí ń dáàbò bo gbogbo ènìyàn. Wọ́n ń ṣiṣẹ́ níbi gbogbo: fídíò, ìgbóhùnsáfẹ́fẹ́ tààrà, ọ̀rọ̀ ìwòye, ìfiránṣẹ́ àti ìpèníjà.","changements":["Ẹ̀dà àkọ́kọ́ ọ̀rọ̀ yìí."],"sections":[{"id":"respect","t":"Ọ̀wọ̀","p":["Ẹ bọ̀wọ̀ fún àwọn ènìyàn, àṣà wọn, èdè wọn àti ìgbàgbọ́ wọn. Ẹ ṣe lámèyítọ́ iṣẹ́, kì í ṣe ènìyàn rárá."]},{"id":"harcelement","t":"Kò sí ìfòòró","p":["Kò sí ìdẹ́rùbà, èébú léraléra, ìtìjú, fífi ẹnìkan ṣe yẹ̀yẹ́ ní ẹgbẹ́, tàbí títan ìsọfúnni àṣírí ẹnìkan kálẹ̀."]},{"id":"haine","t":"Kò sí ìkórìíra","p":["Kò sí ìkọlù sí ènìyàn tàbí ẹgbẹ́ nítorí ìpilẹ̀ṣẹ̀ wọn, orílẹ̀-èdè wọn, ẹ̀sìn wọn, akọ tàbí abo, àìlera ara wọn tàbí apá mìíràn nínú ìdánimọ̀ wọn."]},{"id":"violence","t":"Kò sí ìwà ipá tàbí ewu","p":["Kò sí ìpè sí ìwà ipá, kò sí ìpèníjà eléwu, kò sí ìwúrí láti pa ara ẹni lára.","Bí ẹnìkan bá wà nínú ewu, ẹ kọ́kọ́ pe àwọn iṣẹ́ pàjáwìrì orílẹ̀-èdè yín, lẹ́yìn náà ẹ jábọ̀ àkóónú náà."]},{"id":"sexuel","t":"Kò sí àkóónú ìbálòpọ̀","p":["Kò sí ìhòòhò tàbí àkóónú ìbálòpọ̀.","Ohunkóhun tí ó fa ọmọdé sínú ọ̀rọ̀ ìbálòpọ̀ tàbí tí ó fi í sínú ewu jẹ́ èèwọ̀, láìsí àyàfi. A ń fi àkóónú náà pamọ́ lẹ́sẹ̀kẹsẹ̀, a ń yẹ àkọọ́lẹ̀ náà wò ní àkọ́kọ́ a sì lè tì í, a sì ń jábọ̀ ìṣẹ̀lẹ̀ náà fún àwọn aláṣẹ nígbà tí òfin bá là á sílẹ̀."]},{"id":"arnaques","t":"Kò sí jìbìtì","p":["Kò sí ìlérí owó èké, ìdíje èké, bíbéèrè ọ̀rọ̀ aṣínà tàbí kóòdù, tàbí títà ẹ̀tàn."]},{"id":"engagement","t":"Kò sí ìkópa èké","p":["Kò sí rọ́bọ́ọ̀tì, ìbò tí a rà, àkọọ́lẹ̀ púpọ̀ láti dìbò, tàbí ẹ̀bùn tí ń yípo láti mú nọ́ńbà ga."]},{"id":"usurpation","t":"Kò sí ṣíṣe bí ẹlòmíràn","p":["Ẹ má ṣe bí ẹni pé ẹ jẹ́ ẹlòmíràn, àmì-ìdánimọ̀ ọjà tàbí NEURAVID. Ẹ má lo fọ́tò ẹlòmíràn bí tiyín."]},{"id":"verite","t":"Òtítọ́","p":["Àkóónú tí a ṣàtúnṣe tàbí tí ẹ̀rọ ṣẹ̀dá gbọ́dọ̀ máa ní àmì rẹ̀. Ẹ má fi í hàn bí ohun gidi.","Ẹ má jẹ́ kí ènìyàn gidi sọ tàbí ṣe ohun tí kò sọ tàbí ṣe, láìsí àṣẹ rẹ̀."]},{"id":"defis","t":"Ìpèníjà tí ó tọ́","p":["Ẹ bọ̀wọ̀ fún ìlànà tí a gbé jáde fún ìpèníjà kọ̀ọ̀kan. Ẹ má dìbò fún ara yín. Ẹ má ṣe màgòmágó nínú ìkópa. Ẹ bọ̀wọ̀ fún iṣẹ́ àwọn ẹlòmíràn, àwọn tí ó borí àti àwọn tí kò borí."]},{"id":"manquement","t":"Ohun tí ó ń ṣẹlẹ̀ bí a bá rú òfin","p":["Gẹ́gẹ́ bí bí ó ti burú tó: ìfìdímúlẹ̀ àfikún, fífi àkóónú pamọ́ tàbí yíyọ ọ́ kúrò, ìdíwọ́, ìdádúró, ìlé jáde.","Ènìyàn ni ó ń pinnu ìdíwọ́, ìdádúró àti ìlé jáde, a sì ń ṣàlàyé ìpinnu kọ̀ọ̀kan."]},{"id":"signaler","t":"Bí a ṣe ń jábọ̀","p":["Ẹ tẹ «Jábọ̀» lórí fídíò, ìgbóhùnsáfẹ́fẹ́ tààrà, ìfiránṣẹ́ tàbí àkọsílẹ̀ ẹni, lẹ́yìn náà ẹ yan ìdí.","Ẹni tí a jábọ̀ kò mọ ẹni tí ó jábọ̀ òun."]},{"id":"recours","t":"Bí a ṣe ń bẹ̀bẹ̀ fún àtúnyẹ̀wò","p":["Bí ẹ bá rò pé ìpinnu kan jẹ́ àṣìṣe, ẹ tako ó láàárín ọjọ́ 30 láti «Àwọn ìpinnu àti ẹ̀bẹ̀ mi» nínú L'Empreinte, tàbí pẹ̀lú «Tako».","Ènìyàn mìíràn yàtọ̀ sí ẹni tí ó pinnu ni ó ń yẹ ẹ̀bẹ̀ yín wò."]}]}}</script>
<script type="application/json" id="nvDocs-wo">{"cgu":{"titre":"Sàrti jëfandikoo yu mag yi","chapeau":"Sàrt yii dañuy leeral sàrti NEURAVID: li nga mën a def fii, li nu def, ak li xew su jafe-jafe amee. Bind nañu leen ci kàddu yu yomb.","changements":["Sumb bu njëkk bu mbind mii."],"sections":[{"id":"editeur","t":"Ñan lanu","p":["NEURAVID ab liggéey la bu TENAGON GROUP, LLC, ab këru liggéey bu ñu sos ci Etaa-Sini.","Ci sàrt yii, «nun» mi ngi tekki NEURAVID ak TENAGON GROUP, LLC. «Yow» mi ngi tekki nit ki di jëfandikoo NEURAVID.","Ngir bindal nu: contact@neuravid.com."]},{"id":"acceptation","t":"Nangu sàrt yii","p":["Ngir sos ab kont, war nga nangu sàrt yii, jàng Sàrti sutura, te nangu Sàrti mbooloo mi. Ñetti ndigàle yu wuute lañu.","Su benn ci mbind yii soppikoo, dinanu la won li soppiku te ñaan la nga nanguwaat ko balaa ngay wéy.","Dañuy denc firnde bu ndigàle bu nekk: mbind mi, sumbam, bés bi ak làkk bi ñu ko wone."]},{"id":"ages","t":"Ati nit","p":["Amul kontu NEURAVID balaa 13 at.","• Li dale ci 13 at: jëfandikoo NEURAVID, seetaan ak sos wideyo, seetaan direct yi te bind ci seen waxtaan, bokk ci kaasi yi.","• Li dale ci 16 at: jiite benn direct, yéeg ci kaw dal bi ci benn direct, ànd ak yeneen sosukat ngir sos.","• Li dale ci 18 at: xaalis (may yu ñuy fey, jënd, xéewal ak génne xaalis), Miss & Master, gisoo yu Love Universe ak woote yu Palabre.","Direct yi ñu tegal màndarga «mag ñi rekk» dañuy feeñ rekk li dale ci 16 at.","Li dale ci 13 ba 17 at, aar yu gën a dëgër ñoo ciy dox. Leeral nañu leen ci Sàrti sutura.","At yi nga wax war nañu dëgg. NEURAVID mën na la ñaan nga wone dëggam. Su at yi nga wax dëggul, mën nañu wàññi sa yoon ci ay liggéey."]},{"id":"compte","t":"Sa kont ak kaaraangeem","p":["Joxeel xibaar yu dëggu te yeesal leen.","Denc sa baatu jàll ci sutura. Taal sàmm ci ñaari jéego bu ñu la ko jox.","Soo foogee ne kenn mi ngi jëfandikoo sa kont, soppil sa baatu jàll te xamal nu ci saa si.","Yow yaay tontu li ñu def ak sa kont, ba mu des ku ko jëfandikoo te nanguwoo ko."]},{"id":"contenus","t":"Li ngay siiwal","p":["Yaa des boroom li nga siiwal: wideyo, baat, nataal, mbind.","Ngir NEURAVID dox, dangay jox nu sañ-sañ, ci dara te ci àddina sépp, ngir denc, duppi, wone ak siiwal li nga siiwal, ak defar ko ci wàllu xarala (melo, baax, bind ci suuf). Sañ-sañ bii dafay jeex boo far li nga siiwal, ginnaaw diir bu xarala bi soxla, ba mu des yoon dafa nu sant nu denc ko.","Yeneen nit mënuñu jëfandikoowaat say baat walla def duo ak say wideyo, ba mu des say réglage nangu nañu ko.","Li ñu soppi walla li masin sos (baat bu masin sos, soppi baat ci beneen làkk, ginnaaw bu masin, avatar, lu ñu far, defar bu serveur bi) dañu koy won seetaankat yi ni «lu ñu soppi». Bul nëbb màndarga mii.","Sa baat rekk nga mën a soppi walla roy, ak sa ndigàle.","Ci wàllu woy, war nga am sañ-sañu jëfandikoo baat bu nekk. Baat bu jóge ci sa telefon dafay ñaan nga dëggal ko balaa ngay siiwal. Baati Le Griot dañuy ànd ak seeni sàrti jëfandikoo."]},{"id":"interdits","t":"Li ñu tere","p":["Sàrti mbooloo mi bokk nañu ci sàrt yii. Ñu tere ko rawatina:","• teg xale yi ci musiba, jëfandikoo leen ci lu bon walla dugal leen ci mbiru séy;","• sonal, gëdd, xiir ci mbañeel walla ci fitna;","• siiwal lu jëm ci mbiru séy walla lu yoon tere;","• nax, nax ci wàllu xaalis walla jaay liggéey yu dëggul;","• sos jàppandi bu dëggul: robot, baat yu ñu jënd, ay kont yu bari, may yuy wër ci benn mbiir;","• def ni yaa di keneen;","• moytu kaaraangeu NEURAVID walla dajale xibaari yeneen nit."]},{"id":"moderation","t":"Saytu","p":["Pakk bu NEURAVID dafay gis boppam ay màndargay naxe walla musiba. Moom rekk, mënul def lu dul ñaan ab seetlu bu ci kaw.","Lu ñu yëgle ni musiba ci dund walla ni jëfandikoo xale yi ci lu bon dañu koy nëbb ci saa si, ba nit seet ko.","Mbugal yi ay tolluwaay lañu: seetlu bu ci kaw, digal, taxawal, dàq. Digal, taxawal ak dàq, nit ñoo leen di dogal saa su nekk. Dàq, ñaareelu nit war na ko dëggal.","Dogal bu nekk dañu la koy leeral ak ab lu tax."]},{"id":"recours","t":"Woote ngir seetaat","p":["Mën nga xuloo ak ab dogalu saytu ci biir 30 fan, benn yoon ci dogal bu nekk, jóge ci «Samay dogal ak samay woote» ci L'Empreinte, walla ak «Xuloo».","Sa woote, nit ku dul ki dogal moo koy seet.","Su ñu nanguwee sa woote, dogal bi dafay neen te li nga siiwal di feeñaat."]},{"id":"hvs","t":"HVS","p":["HVS dafay natt njariñu ab ndimbal: ab liggéey, ab bokk, ab wax bu am njariñ, ab dimbali, ab yëgle bu ñu dëggal. Du natt mukk njariñu ab nit.","NEURAVID du toftale nit ñi ak HVS: amul mboolem ci nit, amul diggante, amul toftal.","Poñ bu nekk mën nañu ko leeral: dafay wone ay pàccam, limi yi ñu jëfandikoo ak sumbu fórmul bi.","Boroom ab ndimbal mën na xuloo ak poñam. Nit dafay seet woote bi te leeral lu tax mu dogal."]},{"id":"defis","t":"Kaasi yi ak joŋante yi","p":["Kaasi bu nekk am na ay sàrt yu ñu siiwal balaa muy tàmbali: bés yi, natt yi, ni ñuy wotee ak ni ñuy dogale ñu yem.","Bu ab tegtal-yoon dogalee ñu yem, mën nañu ko dëggal: dañu koy waññ jóge ci màndargay xarala bu sàrt yi ñu siiwal.","Réew yi yem nañu: amul yokk ngir réew, te baat bu nekk benn la.","Kenn du wotewu boppam. Balaa 18 at, ndam dafay jox ay tur ak ay màndarga, du mukk xaalis.","Mën nañu xuloo ak ab ngóób. Nit dafay seet xuloo bi."]},{"id":"argent","t":"Xaalis","p":["Lépp lu jëm ci xaalis, ñi am 18 at ak lu ko ëpp rekk lañu ko jagleel.","NVCoins yi ñu jënd, ngir may lañu. Mënuñu leen génne.","Xéewal dafay xaar diiru kaaraange balaa ñu koy mën a génne. Diir bi, peyu liggéey bi ak xaalis bi ciy des dañu leen di wone balaa génne bu nekk.","Ngir xeex naxe, mën nañu taxawal ab xéewal walla ab génne xaalis bu nit di ko seet. Taxawal du mukk nangu: xaalis bi sa bos la ba nit dogal, ak ab lu tax. Mën nga xuloo ak dogal boobu.","Anam yu ñuy feye dañu aju ci sa réew. Mën nañu laaj ab seetlu bu sa kàrt ngir génne xaalis."]},{"id":"fin","t":"Taxawal walla far ab kont","p":["Mën nga fey sa kont walla nga far ko ci Réglage yi ak sutura. Far bi dafay bàyyi 30 fan yu xalaat balaa muy dëgër.","Balaa ngay dem, mën nga ñaan ab duppi bu say xibaar.","NEURAVID mën na taxawal walla tëj ab kont bu tëggi sàrt yii, topp sàrti saytu bi, ak sañ-sañu woote."]},{"id":"responsabilite","t":"Sunu wareef","p":["Dañuy def sunu kem-kàttan ngir NEURAVID dox bu baax te des ci kaaraange. Mënunu dige ne dootul am mukk dog walla njuumte.","Nit ku nekk ay tontu li mu siiwal. Bu ñu nu yëglee lu ñu tere, dañuy jëf.","Dara ci sàrt yii du la jële sañ-sañ yi yoonu sa réew di la jox."]},{"id":"changements","t":"Coppite yu sàrt yii","p":["Sumb bu nekk am na ab nimero ak ab bés.","Bu sàrt yii soppikoo, dinanu la won ab tënk bu li soppiku te ñaan la nga nanguwaat leen.","Soo nanguwul ab sumb bu bees, mën nga ñaan ab duppi bu say xibaar te far sa kont."]},{"id":"loi","t":"Yoon wi ñuy topp ak jokkoo","p":["Sàrt yii, yoon wi ñuy topp ci kër gu mag gu TENAGON GROUP, LLC, ci Etaa-Sini, moo leen di yor, te du la jële aar bi yoonu réew mi nga dëkk di la jox.","Sàrt yii am nañu ci ay làkk yu bari. Su amee wuute, mbind mu farañse mi moo am doole.","Ngir benn laaj: contact@neuravid.com."]}]},"confidentialite":{"titre":"Sàrti sutura","chapeau":"Sàrt yii dañuy leeral xibaar yi NEURAVID di jëfandikoo, lu tax, li di des ci sa telefon, ak ni ngay des di ko yor.","changements":["Sumb bu njëkk bu mbind mii."],"sections":[{"id":"responsable","t":"Kan moo ciy tontu","p":["TENAGON GROUP, LLC, ab këru liggéey bu ñu sos ci Etaa-Sini, moo di liggéeye say xibaar ngir NEURAVID dox.","Ngir bindal nu: contact@neuravid.com."]},{"id":"donnees","t":"Xibaar yi nuy jëfandikoo, ak lu tax","p":["• Sa kont (sa tur ci NEURAVID, sa tur, ni ngay dugge, làkk, réew): ngir sos sa kont te aar ko.","• Sa bésu juddu: ngir topp atu NEURAVID te aar xale yi.","• Sa réew ak say làkk: ngir won la wideyo ci say làkk ak kaasi yu sa réew.","• Li nga siiwal (wideyo, baat, wax, bataaxal): ngir siiwal ko walla yóbbu ko, topp sa tànneef.","• Say màndargay seetaan (pàcc bi nga seetaan, wideyo bu nga jàll walla nga seetaanaat, say tontu): ngir digle la ay wideyo. Mën nga bàyyi denc sa jaar-jaar te far ko.","• HVS: say ndimbal ak xalaat yi nga jot, ngir waññ poñu ndimbal bu nekk.","• Baaxaayu wone gi ci Iris, wonekaay bi: ak màndargay seetaan yi, telefon bi dafay yónnee it diir bi balaa nataal bu njëkk bi feeñ ak limu dog yi. Limi yooyu ngir saytu ak gën a baaxal liggéey bi rekk lañu. Duñu mukk dugg ci sa profil walla ci say digle.","• «Dimbali jiitukat bi» ci Le Direct: kemu baat bi ak baaxaayu réseau bi sa telefon di jot, dañu leen di yónnee rekk soo ko taalee (dafa fey ci njëlbéen, ci «Baaxaay»). Du mukk baat bi walla nataal bi.","• Fi nga nekk: soo ko nanguwee rekk, te dañu koy wàññi ci telefon bi ba ci gox bi walla dëkk bi balaa ñuy yónnee. Balaa 18 at, dëkk bi rekk.","• Xaalis (li dale ci 18 at): say jënd-jaay ak tolluwaayu seetlu bu sa kàrt. Dunu denc nimerou sa kàrt walla nataalam.","• Kaaraange: say masin yu lëkkaloo ak say dugg yu mujj. Ngir xeex naxe, adresu réseau bi ak masin bi dañu leen di soppi ab màndargay xarala balaa ñuy denc.","• Say yëgle ak dogali saytu: ngir aar mbooloo mi te may ay woote."]},{"id":"telephone","t":"Li di des ci sa telefon","p":["Kamera bi, rafetal, topp xar mi ak far coow li ci ginnaaw, ci sa telefon lañu leen di waññe. Nataal yooyu ak natt yooyu, dunu leen yónnee.","Say bind-bindi, say jël ak say xew dañuy des ci sa telefon li feek siiwaloo."]},{"id":"accord","t":"Li di dem ci serveur bi ak sa ndigàle rekk","p":["Ay liggéey yu diis, ci sunuy serveur lañu leen di defe: dëgëral wideyo, mägal ko, sos bind ci suuf ci boppam, soppi baat ci beneen làkk, sos ab jëf. NEURAVID dafay ñaan sa ndigàle balaa muy yónnee dara.","Ci ab jëf bu ñu sos jóge ci benn kàddu, kàddu gi rekk mooy dem: amul nataal, amul baat.","Bind ak baat ak ndigal yu baat dañuy jëfandikoo liggéeyu xàmmee baat bu sa telefon. Liggéey boobu mën na yónnee sa baat ci ki koy jox. Ekraa bi dafay la artu balaa."]},{"id":"mineurs","t":"Aar xale yi","p":["Li dale ci 13 ba 17 at, aar yii ñoo ciy dox te mënuñu leen a far:","• kont bi sutura la;","• keneen mënul yeb wideyo yi;","• dëkk bi du feeñ te kont bi du digal ñu xamul;","• bataaxali ñu xamul dañu leen di teg ci wet;","• amul yëglekaay yu ñu tànnal kenn;","• amul woote ak ab kontu xale, te amul xaalis.","Mag mu bindal ay xale yu bari yu mu xamul, nit ci saytu bi dafay seet mbiram.","Waajur mën na ànd ak ab ndaw ak ab kod. Dafay gis diir bi mu jëfandikoo ak aar yi, du mukk gis bataaxal yi walla li ndaw li di seetaan."]},{"id":"conservation","t":"Ñaata diir lanuy denc say xibaar","p":["• Sa kont: li feek mu ngi fi. Ginnaaw ab laaj ngir far, 30 fan yu xalaat, ginnaaw ga far ko ci biir 90 fan yi topp, ba ci duppi yu ñu denc.","• Sa jaar-jaaru seetaan: ba nga far ko walla nga bàyyi denc ko. Màndarga yu amul tur yiy tere ñu waññ benn seetaan ñaari yoon, dañu leen di far ginnaaw 30 fan.","• Yëgle yi ak dogali saytu: 1 at ginnaaw dogal bi, walla lu ëpp su yoon laajee ko.","• Firndeu say ndigàle ci mbind yii: li feek sa kont mi ngi fi, ginnaaw ga 5 at.","• Jëf yu xaalis: diir bi yoonu limu xaalis laaj.","• Màndargay kaaraange: 12 weer.","• Fi nga nekk bu ñu séddoo: dañu koy far bu séddoo bi jeexee."]},{"id":"droits","t":"Say sañ-sañ","p":["Saa su la neexee, mën nga:","• gis say xibaar te ñaan ab duppi;","• defar say xibaar;","• far say jaar-jaar walla far sa kont;","• bañ digle yi ak yëglekaay yi ñu tànnal la;","• dindi ab ndigàle bu nga joxoon.","Lépp lii ci Réglage yi ak sutura lañu koy defe, ci pàcc bu «Samay xibaar». Mën nga it bind ci contact@neuravid.com. Dinanu tontu ci biir 30 fan.","Mën nga it jublu ci kurél gi yor aaru xibaar ci sa réew."]},{"id":"securite","t":"Kaaraange","p":["Waxtaan yi ci diggante appli bi ak sunuy serveur dañuy jaar ci ay lëkkalekaay yu ñu kàngal.","Dogali saytu yi dañu leen di bind ci ab téere bu ñu aar ci coppite.","Amul benn nos bu mat sëkk. Su xibaar yu la jëm rotee, dinanu la xamal ni ko yoon tëralee."]},{"id":"transferts","t":"Yóbbu xibaar ci yeneen réew","p":["TENAGON GROUP, LLC ci Etaa-Sini la nekk. Mën nañu liggéeye say xibaar ci réew mu dul sa bos, ci la Etaa-Sini bokk, ak aar yi yoon laaj."]},{"id":"vente","t":"Dunu jaay say xibaar","p":["Dunu jaay say xibaar yu sutura.","Ñi nuy dimbali (denc, fey, seetlu kàrt) dañuy jot rekk li seen liggéey soxla."]},{"id":"contact","t":"Coppite yi ak jokkoo","p":["Bu sàrt yii soppikoo, dinanu la won li soppiku te ñaan la nga jàngaat leen.","Su amee wuute ci diggante làkk yi, mbind mu farañse mi moo am doole.","Ngir benn laaj: contact@neuravid.com."]}]},"regles":{"titre":"Sàrti mbooloo mi","chapeau":"NEURAVID dafay boole nit ñu jóge ci àddina sépp. Sàrt yii dañuy aar ku nekk. Fépp lañuy dox: wideyo, direct, wax, bataaxal ak kaasi.","changements":["Sumb bu njëkk bu mbind mii."],"sections":[{"id":"respect","t":"Teggin","p":["Teggil nit ñi, seeni aada, seeni làkk ak seeni ngëm. Ñaaw ab liggéey, waaye bul ñaawal mukk ab nit."]},{"id":"harcelement","t":"Amul sonal","p":["Amul gëdd, saaga yuy delsi, toroxal, ñaawal kenn ci mbooloo walla siiwal xibaari sutura yu kenn."]},{"id":"haine","t":"Amul mbañeel","p":["Amul song nit walla mbooloo ndax fi mu jóge, réewam, diineem, góor walla jigéen, wàññeeku yaramam walla beneen pàcc ci ki mu doon."]},{"id":"violence","t":"Amul fitna walla musiba","p":["Amul woote ci fitna, amul kaasi yu am musiba, amul xiir ci gaañu sa bopp.","Su kenn nekkee ci musiba, njëkkal woo ndimbalu jamono ji ci sa réew, ginnaaw ga yëgle li ñu siiwal."]},{"id":"sexuel","t":"Amul lu jëm ci mbiru séy","p":["Amul neen walla lu jëm ci mbiru séy.","Lépp lu dugal ab xale ci mbiru séy walla teg ko ci musiba ñu tere ko, te amul benn bàyyi. Dañuy nëbb li ñu siiwal ci saa si, seet kont bi bu jëkk te mën nañu ko tëj, te yëgle xew-xew yi kilifa yi bu yoon tëralee ko."]},{"id":"arnaques","t":"Amul naxe","p":["Amul digey xaalis yu dëggul, joŋante yu dëggul, laaj baatu jàll walla kod, walla jaay bu naxe."]},{"id":"engagement","t":"Amul jàppandi bu dëggul","p":["Amul robot, baat yu ñu jënd, ay kont yu bari ngir wote, walla may yuy wër ci benn mbiir ngir yokk limi yi."]},{"id":"usurpation","t":"Amul def ni yaa di keneen","p":["Bul def ni yaa di keneen, ab màrk walla NEURAVID. Bul jëfandikoo nataalu keneen ni sa bos."]},{"id":"verite","t":"Dëgg","p":["Lu ñu soppi walla lu masin sos war na des ak màndargaam. Bul ko wone ni lu dëggu.","Bul waxloo walla defloo ab nit bu dëggu lu mu waxul walla defu ko, te nanguwul ko."]},{"id":"defis","t":"Kaasi yu jub","p":["Teggil sàrt yi ñu siiwal ci kaasi bu nekk. Bul wotewu sa bopp. Bul nax ci ab bokk. Teggil liggéeyu ñeneen ñi, ñi daan ak ñi ñu daan."]},{"id":"manquement","t":"Li xew su ñu tëggee sàrt yi","p":["Topp ni mu metite: seetlu bu ci kaw, nëbb walla dindi li ñu siiwal, digal, taxawal, dàq.","Digal, taxawal ak dàq, nit moo leen di dogal, te dogal bu nekk dañu koy leeral."]},{"id":"signaler","t":"Ni ñuy yëgle","p":["Bësal «Yëgle» ci ab wideyo, ab direct, ab bataaxal walla ab profil, ginnaaw ga tànn lu tax.","Ki ñu yëgle xamul kan moo ko yëgle."]},{"id":"recours","t":"Ni ñuy woote ngir seetaat","p":["Soo foogee ne ab dogal njuumte la, xuloo ak moom ci biir 30 fan jóge ci «Samay dogal ak samay woote» ci L'Empreinte, walla ak «Xuloo».","Nit ku dul ki dogal moo koy seet sa woote."]}]}}</script>
