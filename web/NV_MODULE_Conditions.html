<script type="application/json" id="nvDocs-bm">{"cgu":{"titre":"Baarakɛcogo sariya kunbabaw","chapeau":"Nin sariyaw bɛ NEURAVID ka sariyaw ɲɛfɔ: aw bɛ se ka min kɛ yan, an bɛ min kɛ, ani min bɛ kɛ ni gɛlɛya dɔ donna. U sɛbɛnna ni kumasen nɔgɔmanw ye.","changements":["Nin sɛbɛn ka bɔli fɔlɔ."],"sections":[{"id":"editeur","t":"An ye jɔn ye","p":["NEURAVID ye TENAGON GROUP, LLC ka baara dɔ ye, sosiyete min sigira Ameriki.","Nin sariyaw kɔnɔ, «an» kɔrɔ ye NEURAVID ani TENAGON GROUP, LLC ye. «Aw» kɔrɔ ye mɔgɔ min bɛ NEURAVID baara.","Ka sɛbɛn an ma: contact@neuravid.com."]},{"id":"acceptation","t":"Ka sɔn nin sariyaw ma","p":["Walasa ka jatebɔsɛbɛn dilan, aw ka kan ka sɔn nin sariyaw ma, ka Gundo marali politiki kalan, ani ka sɔn Jɛkulu sariyaw ma. Bɛnkan saba danfaralenw don.","Ni nin sɛbɛnw dɔ yɛlɛmana, an bɛ min yɛlɛmana o jira aw la ani ka aw deli aw ka sɔn a ma kokura sani aw ka taa ɲɛ.","An bɛ bɛnkan bɛɛ seereya mara: sɛbɛn yɛrɛ, a bɔli, don ani kan min na a jirala."]},{"id":"ages","t":"Sanw","p":["NEURAVID jatebɔsɛbɛn tɛ yen sani san 13.","• Ka bɔ san 13 na: ka NEURAVID baara, ka widewow lajɛ ani ka u dilan, ka sisan-yɛlɛmaw lajɛ ani ka sɛbɛn u ka baro kɔnɔ, ka sendon kunkɔrɔbɔw la.","• Ka bɔ san 16 na: ka sisan-yɛlɛma ɲɛminɛ, ka yɛlɛn dɔnkɛyɔrɔ kan sisan-yɛlɛma kɔnɔ, ka dilanni kɛ ni dilanbaga wɛrɛw ye.","• Ka bɔ san 18 na: wari (sarali bonyaw, sanniw, tɔnɔw ani wari bɔliw), Miss & Master, Love Universe ɲɔgɔnyew ani Palabre weleliw.","Sisan-yɛlɛma minnu taamasyɛnna ko «mɔgɔbabaw dama», olu bɛ jira ka bɔ san 16 na dɔrɔn.","Ka bɔ san 13 na ka se san 17 ma, lakanani barikamaw bɛ waleya. U ɲɛfɔlen bɛ Gundo marali politiki kɔnɔ.","Aw bɛ san min fɔ, o ka kan ka kɛ tiɲɛ ye. NEURAVID bɛ se k'a ɲini aw fɛ aw k'a sɛgɛsɛgɛ. Ni san fɔlen tɛ tiɲɛ ye, baara dɔw sɔrɔli bɛ se ka dan."]},{"id":"compte","t":"Aw ka jatebɔsɛbɛn ani a lakanani","p":["Kunnafoni tilennenw di ani k'u kuraya.","Aw ka gundo daɲɛ to gundo la. Sɛgɛsɛgɛli taamasen fila kɛ ni o dira aw ma.","Ni aw b'a miiri ko mɔgɔ dɔ bɛ aw ka jatebɔsɛbɛn baara, aw ka gundo daɲɛ yɛlɛma ani k'an ladɔnniya o yɔrɔnin bɛɛ.","Aw de ka jalaki ye min kɛra ni aw ka jatebɔsɛbɛn ye, fo ni mɔgɔ dɔ y'a baara aw ma sɔn min ma."]},{"id":"contenus","t":"Aw ka fɛnw","p":["Aw bɛ to aw ye fɛn minnu bɔ, olu tigi ye: widewow, kanw, ja, sɛbɛnw.","Walasa NEURAVID ka baara kɛ, aw bɛ sira di an ma, fu ani diɲɛ bɛɛ kɔnɔ, ka aw ka fɛnw mara, k'u kopi, k'u jira ani k'u jɛnsɛn, ani k'u labɛn fɛɛrɛ siratigɛ la (cogo, ɲɛtaa, sɛbɛnni duguma). Nin sira bɛ ban ni aw ye fɛn dɔ jɔsi, fɛɛrɛ waati ɲɛnama kɔfɛ, fo ni sariya b'a wajibiya an ma k'a mara.","Mɔgɔ wɛrɛw bɛ se ka aw ka kanw baara kokura walima ka duo kɛ ni aw ka widewow ye ni aw ka labɛnw y'a sira di dɔrɔn.","Fɛn yɛlɛmanen walima minɛn ye fɛn min dilan (kan minɛn ye min dilan, kan yɛlɛmani ka kɛ kan wɛrɛ ye, kɔfɛla minɛnmaw, avatar, fɛn jɔsilen, labɛnni sɛriwɛri fɛ) bɛ jira lajɛbagaw la ko «fɛn yɛlɛmanen». Kana nin taamasyɛn dogo.","Aw bɛ se ka aw yɛrɛ kan dɔrɔn yɛlɛma walima ka a ladege, ni aw sɔnna.","Dɔnkili ko la, aw ka kan ka sira sɔrɔ ka kan kelen-kelen bɛɛ baara. Kan min bɔra aw ka telefɔni la, o b'a ɲini aw fɛ aw k'a sɛmɛntiya sani aw k'a bɔ. Le Griot ka kanw bɛ na ni u baarakɛcogo sariyaw ye."]},{"id":"interdits","t":"Min bɛ tanna","p":["Jɛkulu sariyaw ye nin sariyaw yɔrɔ dɔ ye. A tanna kɛrɛnkɛrɛnnenya la:","• ka denmisɛnw bila farati la, k'u tɔɔrɔ walima k'u don cɛ ni muso ka kow la;","• ka mɔgɔ tɔɔrɔ, k'a bagabaga, ka mɔgɔw lawuli kɔniya walima fanga la;","• ka cɛ ni muso ka kow walima fɛn sariyantanw bɔ;","• ka mɔgɔ lafili, ka galon tigɛ wari ko la walima ka baara nkalonw feere;","• ka jɛ nkalon dilan: robow, kalata sannenw, jatebɔsɛbɛn caman, bonya minnu bɛ munumunu;","• ka a kɛ i ko i ye mɔgɔ wɛrɛ ye;","• ka NEURAVID ka lakanani tigɛ walima ka mɔgɔ wɛrɛw ka kunnafoniw lajɛ."]},{"id":"moderation","t":"Kɔlɔsili","p":["NEURAVID ka Kala bɛ lafilili walima farati taamasyɛnw ye a yɛrɛ ma. A kelen, a bɛ se ka sɛgɛsɛgɛli farikan dɔrɔn ɲini.","Fɛn min fɔra ko farati don ɲɛnamaya la walima ko denmisɛnw tɔɔrɔli don, o bɛ dogo o yɔrɔnin bɛɛ, fo mɔgɔ k'a lajɛ.","Ɲangiliw bɛ taa dɔɔnin dɔɔnin: sɛgɛsɛgɛli farikan, dancɛ, jɔli, gɛnni. Dancɛ, jɔli ani gɛnni, mɔgɔ de b'u latigɛ tuma bɛɛ. Gɛnni ka kan ka sɛmɛntiya mɔgɔ filanan fɛ.","Latigɛ bɛɛ bɛ ɲɛfɔ aw ye ni a sababu ye."]},{"id":"recours","t":"Sɛgɛsɛgɛli kokura ɲinini","p":["Aw bɛ se ka sɔsɔli kɛ kɔlɔsili latigɛ dɔ la tile 30 kɔnɔ, siɲɛ kelen latigɛ kelen o kelen na, ka bɔ «N ka latigɛw ani n ka ɲininiw» la L'Empreinte kɔnɔ, walima ni «Sɔsɔ» ye.","Mɔgɔ wɛrɛ min tɛ latigɛbaga ye, o de bɛ aw ka ɲinini lajɛ.","Ni aw ka ɲinini sɔnna, latigɛ bɛ jɔsi ani aw ka fɛn bɛ jira kokura."]},{"id":"hvs","t":"HVS","p":["HVS bɛ dɛmɛ dɔ nafa suman: baara dɔ, sendonni, hakilina nafama, dɛmɛ, kunnafoni sɛmɛntiyalen. A tɛ mɔgɔ nafa suman abada.","NEURAVID tɛ mɔgɔw bila ɲɔgɔn kɔ ni HVS ye: jateden si tɛ mɔgɔ kelen kelen ye, cɛmancɛ si tɛ, nɔɔrɔ si tɛ.","Jate bɛɛ bɛ se ka ɲɛfɔ: a bɛ a yɔrɔw jira, jateden minnu baarala ani formili bɔli.","Dɛmɛ tigi bɛ se ka sɔsɔli kɛ a ka jate la. Mɔgɔ dɔ bɛ ɲinini lajɛ ani a bɛ a ka latigɛ sababu fɔ."]},{"id":"defis","t":"Kunkɔrɔbɔw ani ɲɔgɔndanw","p":["Kunkɔrɔbɔ bɛɛ ka sariyaw bɛ bɔ sani a ka daminɛ: donw, sumanikɛlanw, kalata cogo ani cogo min na mɔgɔ kɛɲɛnenw bɛ fara ɲɔgɔn na.","Ni hakɛbɔ dɔ ye mɔgɔ kɛɲɛnenw faran ɲɔgɔn na, a bɛ se ka sɛgɛsɛgɛ: a jatera ka bɔ sariya bɔlenw ka taamasyɛn fɛɛrɛlama na.","Jamanaw bɛ kɛɲɛ: jamana kosɔn fara si tɛ, ani kalata bɛɛ ye kelen ye.","Mɔgɔ tɛ kalata kɛ a yɛrɛ ye. Sani san 18, se bɛ tɔgɔ ani taamasyɛnw di, wari tɛ abada.","Jaabi dɔ bɛ se ka sɔsɔ. Mɔgɔ dɔ bɛ sɔsɔli lajɛ."]},{"id":"argent","t":"Wari","p":["Fɛn o fɛn bɛ tali kɛ wari la, o latilenna mɔgɔ minnu sanji ye 18 ye walima ka tɛmɛ o kan.","NVCoins sannenw bɛ baara ka bonyaw di. U tɛ se ka bɔ ka kɛ wari ye.","Tɔnɔ bɛ to makɔnɔni na lakanani waati kɔnɔ sani a ka se ka bɔ. Waati, musakaw ani hakɛ min bɛ to, olu bɛ jira sani wari bɔli bɛɛ.","Walasa ka lafilili kɛlɛ, tɔnɔ walima wari bɔli dɔ bɛ se ka jɔ ka mɔgɔ dɔ to k'a lajɛ. Jɔli tɛ bɔsili ye abada: wari bɛ to aw ta ye fo mɔgɔ dɔ ka latigɛ ta, ni sababu ye. Aw bɛ se ka sɔsɔli kɛ o latigɛ la.","Sarali cogow bɛ bɔ aw ka jamana de la. Aw dannaya sɛgɛsɛgɛli bɛ se ka ɲini walasa ka wari bɔ."]},{"id":"fin","t":"Ka jatebɔsɛbɛn jɔ walima k'a jɔsi","p":["Aw bɛ se ka aw ka jatebɔsɛbɛn faga walima k'a jɔsi Labɛnw ani gundo marali kɔnɔ. Jɔsili bɛ tile 30 to miirili kama sani a ka kɛ laban ye.","Sani aw ka taa, aw bɛ se ka aw ka kunnafoniw kopi ɲini.","NEURAVID bɛ se ka jatebɔsɛbɛn min bɛ nin sariyaw tiɲɛ, o jɔ walima k'a datugu, ka kɔlɔsili sariyaw tugu, ni sɛgɛsɛgɛli kokura ɲinini sira ye."]},{"id":"responsabilite","t":"An ka jalaki","p":["An bɛ an seko bɛɛ kɛ walasa NEURAVID ka baara kɛ ka ɲɛ ani ka to lakanani na. An tɛ se ka layidu ta ko tigɛli walima fili si tɛna kɛ abada.","Mɔgɔ bɛɛ ye a ka fɛn bɔlenw jalakitigi ye. Ni fɛn tanlen dɔ fɔra an ye, an bɛ wale kɛ.","Foyi tɛ nin sariyaw kɔnɔ min bɛ aw ka jamana sariya ka josariyaw bɔsi aw la."]},{"id":"changements","t":"Nin sariyaw yɛlɛmaniw","p":["Bɔli bɛɛ bɛ ni nimɔrɔ ani don ye.","Ni nin sariyaw yɛlɛmana, an bɛ min yɛlɛmana o kuma surun jira aw la ani ka aw deli aw ka sɔn u ma kokura.","Ni aw ma sɔn bɔli kura ma, aw bɛ se ka aw ka kunnafoniw kopi ɲini ani ka aw ka jatebɔsɛbɛn jɔsi."]},{"id":"loi","t":"Sariya min bɛ waleya ani kumaɲɔgɔnya","p":["Nin sariyaw bɛ tali kɛ sariya la min bɛ waleya TENAGON GROUP, LLC sigiyɔrɔ la, Ameriki, k'a sɔrɔ a ma lakanani bɔsi aw la min bɛ aw sigi jamana sariya fɛ.","Nin sariyaw bɛ kan caman na. Ni danfara dɔ bɛ yen, tubabukan sɛbɛn de bɛ jate.","Ɲininkali o ɲininkali: contact@neuravid.com."]}]},"confidentialite":{"titre":"Gundo marali politiki","chapeau":"Nin politiki bɛ kunnafoni minnu NEURAVID bɛ baara, olu ɲɛfɔ, a kun, min bɛ to aw ka telefɔni kan, ani cogo min na aw bɛ to kuntigiya la.","changements":["Nin sɛbɛn ka bɔli fɔlɔ."],"sections":[{"id":"responsable","t":"Jɔn ye jalakitigi ye","p":["TENAGON GROUP, LLC, sosiyete min sigira Ameriki, o de bɛ aw ka kunnafoniw baara walasa NEURAVID ka baara kɛ.","Ka sɛbɛn an ma: contact@neuravid.com."]},{"id":"donnees","t":"Kunnafoni minnu an bɛ baara, ani a kun","p":["• Aw ka jatebɔsɛbɛn (tɔgɔ dɔnnen, tɔgɔ, donni cogo, kan, jamana): ka aw ka jatebɔsɛbɛn dilan ani k'a lakana.","• Aw bangedon: ka NEURAVID ka sanw sariya waleya ani ka denmisɛnw lakana.","• Aw ka jamana ani aw ka kanw: ka widewow jira aw la aw ka kanw na ani aw ka jamana ka kunkɔrɔbɔw.","• Aw ka fɛnw (widewow, kanw, hakilinaw, cikanw): k'u bɔ walima k'u lase, ka da aw ka sugandiw kan.","• Aw ka lajɛli taamasyɛnw (yɔrɔ min lajɛra, widewo min tɛmɛna walima min lajɛra kokura, aw ka jaabiw): ka widewow laɲini aw ye. Aw bɛ se ka aw ka lajɛli tariku marali dabila ani k'a jɔsi.","• HVS: aw ka dɛmɛw ani hakilina minnu sɔrɔla, ka dɛmɛ kelen-kelen bɛɛ jate sɔrɔ.","• Fɔli ɲɛtaa Iris kɔnɔ, widewo fɔlan: ni lajɛli taamasyɛnw ye, telefɔni bɛ waati min bɛ tɛmɛ sani ja fɔlɔ ka bɔ ani tigɛliw hakɛ fana ci. O jatedenw bɛ baara dɔrɔn ka baara kɔlɔsi ani k'a ɲɛ. U tɛ don aw ka jatebɔsɛbɛn walima aw ka laɲiniliw la abada.","• «Ɲɛminɛbaga dɛmɛ» Le Direct kɔnɔ: kan hakɛ ani rezo ɲɛtaa min bɛ se aw ka telefɔni ma, olu bɛ ci dɔrɔn ni aw y'a mana (a fagalen don ka bɔ a daminɛ na, «Ɲɛtaa» kɔnɔ). Kan walima ja tɛ ci abada.","• Aw yɔrɔ: ni aw y'a sira di dɔrɔn, ani a bɛ dɔgɔya telefɔni kan ka se kin walima dugu ma sani a ka ci. Sani san 18, dugu dɔrɔn.","• Wari (ka bɔ san 18 na): aw ka jago kɛcogo ani aw dannaya sɛgɛsɛgɛli hakɛ. An tɛ aw ka dannayasɛbɛn nimɔrɔ mara, a ja fana tɛ.","• Lakanani: aw ka minɛn tugulenw ani aw ka donni kɔsɛninw. Walasa ka lafilili kɛlɛ, rezo adrɛsi ani minɛn bɛ yɛlɛma ka kɛ taamasyɛn fɛɛrɛlama ye sani u ka mara.","• Aw ka kunnafonidiw ani kɔlɔsili latigɛw: ka jɛkulu lakana ani ka sira di sɛgɛsɛgɛli kokura ɲininiw ma."]},{"id":"telephone","t":"Min bɛ to aw ka telefɔni kan","p":["Kamera, cɛɲɛ, ɲɛda tugu ani kɔfɛ mankan bɔli bɛ jate aw ka telefɔni kan. O jaw ni o sumanniw tɛ ci.","Aw ka sɛbɛn fɔlɔw, aw ka minɛniw ani aw ka sinsinw bɛ to aw ka telefɔni kan fo aw k'u bɔ."]},{"id":"accord","t":"Min bɛ taa sɛriwɛri la aw sɔnni dɔrɔn na","p":["Baara girinman dɔw bɛ kɛ an ka sɛriwɛriw kan: ka widewo sabati, k'a bonya, ka sɛbɛnni duguma dilan a yɛrɛ ma, ka kan yɛlɛma ka kɛ kan wɛrɛ ye, ka nɛgɛnɛgɛ dɔ dilan. NEURAVID bɛ aw sɔnni ɲini sani a ka foyi ci.","Nɛgɛnɛgɛ min dilanna kumasen dɔ la, kumasen dɔrɔn de bɛ ci: ja si tɛ, kan si tɛ.","Kan ni sɛbɛnni ani kan ni cikanw bɛ aw ka telefɔni ka kan dɔnni baara de baara. O baara bɛ se ka aw kan ci a dibaga ma. Ɛkaran bɛ aw lasɔmi ka kɔn o ɲɛ."]},{"id":"mineurs","t":"Denmisɛnw lakanani","p":["Ka bɔ san 13 na ka se san 17 ma, nin lakananiw bɛ waleya ani u tɛ se ka bɔ:","• jatebɔsɛbɛn ye gundo ye;","• mɔgɔ wɛrɛw tɛ se ka widewow jigin;","• dugu tɛ jira ani jatebɔsɛbɛn tɛ laɲini lonanw ye;","• lonanw ka cikanw bɛ bila kɛrɛfɛ;","• kɛnɛyafɔli kɛrɛnkɛrɛnnenw tɛ;","• weleli tɛ kɛ ni denmisɛn jatebɔsɛbɛn ye, ani wari tɛ.","Mɔgɔba min bɛ sɛbɛn denmisɛn caman ma a tɛ minnu dɔn, kɔlɔsili jɛkulu mɔgɔ dɔ b'a ka ko lajɛ.","Wolobaga dɔ bɛ se ka kamalennin walima npogotigininin dɔ tugu ni kode ye. A bɛ waati minna ani lakananiw ye, a tɛ cikanw walima denmisɛn bɛ min lajɛ, olu ye abada."]},{"id":"conservation","t":"An bɛ aw ka kunnafoniw mara waati jumɛn","p":["• Aw ka jatebɔsɛbɛn: ni a bɛ yen tuma o tuma. Jɔsili ɲinini kɔfɛ, tile 30 miirili kama, o kɔ k'a jɔsi tile 90 nataw kɔnɔ, kopi maralenw fana.","• Aw ka lajɛli tariku: fo aw k'a jɔsi walima ka a marali dabila. Taamasyɛn tɔgɔntanw minnu bɛ lajɛli kelen jateli siɲɛ fila bali, olu bɛ jɔsi tile 30 kɔfɛ.","• Kunnafonidiw ani kɔlɔsili latigɛw: san 1 latigɛ kɔfɛ, walima ka tɛmɛ o kan ni sariya y'a ɲini.","• Aw ka bɛnkanw seereya nin sɛbɛnw kan: ni aw ka jatebɔsɛbɛn bɛ yen tuma o tuma, o kɔ san 5.","• Wari baaraw: waati min jatebɔ sariya b'a ɲini.","• Lakanani taamasyɛnw: kalo 12.","• Yɔrɔ tilalen: a bɛ jɔsi ni tilali banna."]},{"id":"droits","t":"Aw josariyaw","p":["Waati o waati, aw bɛ se ka:","• aw ka kunnafoniw lajɛ ani k'u kopi ɲini;","• aw ka kunnafoniw latilen;","• aw ka tarikuw jɔsi walima ka aw ka jatebɔsɛbɛn jɔsi;","• laɲiniliw ani kɛnɛyafɔli kɛrɛnkɛrɛnnenw ban;","• sɔnni dɔ bɔ aw tun ye min di.","O bɛɛ bɛ kɛ Labɛnw ani gundo marali kɔnɔ, «N ka kunnafoniw» yɔrɔ la. Aw bɛ se ka sɛbɛn fana contact@neuravid.com ma. An bɛ jaabi di tile 30 kɔnɔ.","Aw bɛ se ka taa fana aw ka jamana ka kunnafoni lakanani kuntigiya fɛ."]},{"id":"securite","t":"Lakanani","p":["Aplikasiyɔn ni an ka sɛriwɛriw cɛ kumaɲɔgɔnyaw bɛ tɛmɛ siraw fɛ minnu gundo datugulen don.","Kɔlɔsili latigɛw bɛ sɛbɛn gafe dɔ kɔnɔ min lakanana yɛlɛmali ma.","Sigicogo si dafalen tɛ. Ni kunnafoni minnu bɛ aw ko la, olu bɔra kɛnɛ kan, an bɛ aw ladɔnniya i ko sariya b'a fɔ cogo min na."]},{"id":"transferts","t":"Kunnafoniw taali jamana wɛrɛw la","p":["TENAGON GROUP, LLC bɛ Ameriki. Aw ka kunnafoniw bɛ se ka baara jamana wɛrɛ la min tɛ aw ta ye, Ameriki fana, ni lakanani minnu sariya b'a ɲini."]},{"id":"vente","t":"An tɛ aw ka kunnafoniw feere","p":["An tɛ aw ka kunnafoni kɛrɛnkɛrɛnnenw feere.","Baarakɛla minnu bɛ an dɛmɛ (marali, sarali, dannaya sɛgɛsɛgɛli), olu bɛ min sɔrɔ, o ye u ka baara ka kan ni min ye dɔrɔn."]},{"id":"contact","t":"Yɛlɛmaniw ani kumaɲɔgɔnya","p":["Ni nin politiki yɛlɛmana, an bɛ min yɛlɛmana o jira aw la ani ka aw deli aw k'a kalan kokura.","Ni danfara bɛ kanw cɛ, tubabukan sɛbɛn de bɛ jate.","Ɲininkali o ɲininkali: contact@neuravid.com."]}]},"regles":{"titre":"Jɛkulu sariyaw","chapeau":"NEURAVID bɛ mɔgɔw lajɛ ka bɔ diɲɛ fan bɛɛ fɛ. Nin sariyaw bɛ mɔgɔ bɛɛ lakana. U bɛ waleya yɔrɔ bɛɛ: widewow, sisan-yɛlɛmaw, hakilinaw, cikanw ani kunkɔrɔbɔw.","changements":["Nin sɛbɛn ka bɔli fɔlɔ."],"sections":[{"id":"respect","t":"Bonya","p":["Mɔgɔw bonya, u ka laadalakow, u ka kanw ani u ka dannayaw. Baara kɔrɔfɔ, nka kana mɔgɔ kɔrɔfɔ abada."]},{"id":"harcelement","t":"Tɔɔrɔli tɛ","p":["Bagabagali tɛ, nanbaraw ka segin, maloyali, mɔgɔ tulo cɛli jɛkulu la walima mɔgɔ ka gundo kunnafoniw jɛnsɛnni."]},{"id":"haine","t":"Kɔniya tɛ","p":["Binkani tɛ mɔgɔ walima jɛkulu kan u bɔyɔrɔ, u ka jamana, u ka diina, u cɛya walima u musoya, u ka fiɲɛ walima u yɛrɛ yɔrɔ wɛrɛ kosɔn."]},{"id":"violence","t":"Fanga ni farati tɛ","p":["Weleli tɛ fanga kama, kunkɔrɔbɔ faratimaw tɛ, ka mɔgɔ jija a ka a yɛrɛ tɔɔrɔ tɛ.","Ni mɔgɔ dɔ bɛ farati la, aw ka aw ka jamana ka teliyala dɛmɛbagaw wele fɔlɔ, o kɔ ka fɛn in fɔ."]},{"id":"sexuel","t":"Cɛ ni muso ka kow tɛ","p":["Farilakolon walima cɛ ni muso ka kow tɛ.","Fɛn o fɛn bɛ denmisɛn don cɛ ni muso ka kow la walima k'a bila farati la, o tanna, ka a sɔrɔ danfara si tɛ. Fɛn in bɛ dogo o yɔrɔnin bɛɛ, jatebɔsɛbɛn bɛ lajɛ fɔlɔ ani a bɛ se ka datugu, ani kow bɛ fɔ kuntigiw ye ni sariya y'o fɔ."]},{"id":"arnaques","t":"Lafilili tɛ","p":["Wari layidu nkalonw tɛ, ɲɔgɔndan nkalonw tɛ, gundo daɲɛ walima kode ɲinini tɛ, walima feereli lafililenw."]},{"id":"engagement","t":"Jɛ nkalon tɛ","p":["Robow tɛ, kalata sannenw tɛ, jatebɔsɛbɛn caman kalata kama tɛ, walima bonya minnu bɛ munumunu ka jatedenw caya."]},{"id":"usurpation","t":"Ka a kɛ i ko i ye mɔgɔ wɛrɛ ye tɛ","p":["Kana a kɛ i ko aw ye mɔgɔ wɛrɛ ye, taamasyɛn dɔ walima NEURAVID. Kana mɔgɔ wɛrɛ ja baara i ko aw ta don."]},{"id":"verite","t":"Tiɲɛ","p":["Fɛn yɛlɛmanen walima minɛn ye fɛn min dilan, o ka kan ka to ni a taamasyɛn ye. Kana a jira i ko tiɲɛ don.","Kana mɔgɔ lakika dɔ lafɔ walima k'a lakɛ a ma min fɔ walima a ma min kɛ, ni a ma sɔn."]},{"id":"defis","t":"Kunkɔrɔbɔ tilennenw","p":["Kunkɔrɔbɔ bɛɛ ka sariya bɔlenw bonya. Kana kalata kɛ aw yɛrɛ ye. Kana nanbara kɛ sendonni dɔ la. Mɔgɔ wɛrɛw ka baara bonya, sebagaw ani minnu ma se."]},{"id":"manquement","t":"Min bɛ kɛ ni sariya tiɲɛna","p":["Ka kɛɲɛ ni a juguya ye: sɛgɛsɛgɛli farikan, fɛn dogoli walima a bɔli, dancɛ, jɔli, gɛnni.","Dancɛ, jɔli ani gɛnni, mɔgɔ de b'u latigɛ, ani latigɛ bɛɛ bɛ ɲɛfɔ."]},{"id":"signaler","t":"Kunnafoni di cogo","p":["«Kunnafoni di» digi widewo, sisan-yɛlɛma, cikan walima jatebɔsɛbɛn kan, o kɔ ka sababu sugandi.","Mɔgɔ min ko fɔra, o tɛ a dɔn mɔgɔ min y'a ko fɔ."]},{"id":"recours","t":"Sɛgɛsɛgɛli kokura ɲini cogo","p":["Ni aw b'a miiri ko latigɛ dɔ ye fili ye, aw ka sɔsɔli kɛ a la tile 30 kɔnɔ ka bɔ «N ka latigɛw ani n ka ɲininiw» la L'Empreinte kɔnɔ, walima ni «Sɔsɔ» ye.","Mɔgɔ wɛrɛ min tɛ latigɛbaga ye, o de bɛ aw ka ɲinini lajɛ."]}]}}</script>
<script type="application/json" id="nvDocs-ln">{"cgu":{"titre":"Mibeko minene ya kosalela","chapeau":"Mibeko oyo ezali kolimbola mibeko ya NEURAVID: oyo okoki kosala awa, oyo biso tosalaka, mpe oyo esalemaka soki likambo moko ebimi. Ekomami na maloba ya pɛtɛɛ.","changements":["Version ya liboso ya mokanda oyo."],"sections":[{"id":"editeur","t":"Biso tozali banani","p":["NEURAVID ezali mosala ya TENAGON GROUP, LLC, kompanyi oyo ebandaki na Ameriki.","Na mibeko oyo, «biso» elingi koloba NEURAVID mpe TENAGON GROUP, LLC. «Yo» elingi koloba moto oyo azali kosalela NEURAVID.","Mpo na kokomela biso: contact@neuravid.com."]},{"id":"acceptation","t":"Kondima mibeko oyo","p":["Mpo na kosala compte, osengeli kondima mibeko oyo, kotánga Politique ya sekele mpe kondima Mibeko ya lisanga. Ezali bondimi misato ekeseni.","Soki moko ya mikanda oyo ebongwani, tokolakisa yo oyo ebongwani mpe tokosɛnga yo ondima yango lisusu liboso ya kokoba.","Tobombaka elembo ya bondimi nyonso: mokanda, version na yango, mokolo mpe lokota oyo emonisamaki."]},{"id":"ages","t":"Mibu","p":["Compte ya NEURAVID ezali te liboso ya mbula 13.","• Banda mbula 13: kosalela NEURAVID, kotala mpe kosala bavideo, kotala ba direct mpe kokoma na lisolo na yango, kosangana na ba défi.","• Banda mbula 16: kokamba direct, komata na estrade na direct, kosala elongo na bakeli mosusu.","• Banda mbula 18: mbongo (makabo ya kofuta, bosombi, matomba mpe kobimisa mbongo), Miss & Master, bokutani ya Love Universe mpe ba appel ya Palabre.","Ba direct oyo ezali na elembo «bato minene» emonisamaka kaka banda mbula 16.","Banda mbula 13 kino 17, libateli makasi esalaka. Elimbolami na Politique ya sekele.","Mbula oyo olobi esengeli kozala ya solo. NEURAVID ekoki kosɛnga yo otalisa yango. Soki mbula oyo olobi ezali lokuta, nzela ya kosalela misala mosusu ekoki kokatama."]},{"id":"compte","t":"Compte na yo mpe libateli na yango","p":["Pesá ba sango ya solo mpe bongisá yango ntango nyonso.","Bombá mot de passe na yo na sekele. Fungolá bondimisi na makambo mibale soki bapesi yo yango.","Soki okanisi ete moto moko azali kosalela compte na yo, bongolá mot de passe mpe yebisá biso nokinoki.","Ozali na mokumba ya oyo esalemi na compte na yo, longola se soki moto moko asaleli yango kozanga ndingisa na yo."]},{"id":"contenus","t":"Makambo oyo otiaka","p":["Otikali mokeli ya oyo otiaka: bavideo, makɛlɛlɛ, bafoto, mikanda.","Mpo NEURAVID esala, opesi biso lotomo, ofele mpe na mokili mobimba, ya kobomba, kozwa kopi, kolakisa mpe kopanza makambo na yo, mpe kobongisa yango na ndenge ya tekiniki (formats, bolamu, mikanda na nse). Lotomo oyo esilaka soki olongoli likambo, nsima ya ntango ya tekiniki oyo esengeli, longola se soki mobeko etindi biso tobomba yango.","Bato mosusu bakoki kosalela lisusu makɛlɛlɛ na yo to kosala duo na bavideo na yo kaka soki ba réglage na yo endimi.","Likambo oyo ebongisami to oyo masini esali (mongongo oyo masini esali, kobongola mongongo na lokota mosusu, décor ya masini, avatar, eloko oyo elongolami, kobongisa na serveur) emonisamaka na batali lokola «likambo ebongisami». Kobombá elembo yango te.","Okoki kobongola to komekola kaka mongongo na yo moko, na ndingisa na yo.","Mpo na miziki, osengeli kozala na lotomo ya kosalela mongongo nyonso. Mongongo oyo euti na telefone na yo esɛngaka yo ondimisa yango liboso ya kotia. Makɛlɛlɛ ya Le Griot eyaka elongo na mibeko na yango ya kosalela."]},{"id":"interdits","t":"Oyo epekisami","p":["Mibeko ya lisanga ezali eteni ya mibeko oyo. Epekisami mingimingi:","• kotia bana na likama, kosalela bango mabe to kokɔtisa bango na makambo ya pite;","• konyokola, kobangisa, kolendisa koyina to mobulu;","• kotia makambo ya pite to oyo mobeko epekisi;","• kokosa bato, kokosa na makambo ya mbongo to koteka misala ya lokuta;","• kosala bosangani ya lokuta: ba robot, ba vote oyo basombi, ba compte mingi, makabo oyo ezali kobaluka na zongazonga;","• kokómisa yo lokola moto mosusu;","• koleka libateli ya NEURAVID to kosangisa ba sango ya bato mosusu."]},{"id":"moderation","t":"Bokɛngi","p":["Nguba ya NEURAVID emonaka yango moko bilembo ya bokosi to ya likama. Yango moko, ekoki kaka kosɛnga bondimisi ya kobakisa.","Likambo oyo bayebisi ete ezali likama mpo na bomoi to kosalela bana mabe ebombamaka nokinoki, kino moto akotala yango.","Bitumbu ezali na mitango: bondimisi ya kobakisa, kokatela nzela, kotelemisa, kobengana. Kokatela nzela, kotelemisa mpe kobengana ekatamaka ntango nyonso na moto. Kobengana esengeli kondimisama na moto ya mibale.","Mokano nyonso elimbolamaka na yo elongo na ntina na yango."]},{"id":"recours","t":"Kosɛnga botali lisusu","p":["Okoki kotɛmɛla mokano ya bokɛngi na kati ya mikolo 30, mbala moko mpo na mokano mokomoko, uta na «Mikano mpe masɛngi na ngai» na L'Empreinte, to na «Kotɛmɛla».","Moto mosusu, kasi te oyo akataki mokano, nde atalaka lisɛngi na yo.","Soki bandimi lisɛngi na yo, mokano elongolami mpe likambo na yo emonani lisusu."]},{"id":"hvs","t":"HVS","p":["HVS emekaka motuya ya lisalisi moko: mosala, bosangani, likanisi ya ntina, lisalisi, liyebisi oyo endimisami. Ememekaka ata mokolo moko te motuya ya moto.","NEURAVID etyaka bato na molɔngɔ te na HVS: motango mobimba mpo na moto te, kati-kati te, esika te.","Point nyonso ekoki kolimbolama: emonisaka biteni na yango, mituka oyo basaleli mpe version ya formule.","Mokeli ya lisalisi akoki kotɛmɛla point na yango. Moto moko atalaka lisɛngi mpe alimbolaka ntina ya mokano na ye."]},{"id":"defis","t":"Ba défi mpe bitumba","p":["Défi nyonso ezali na mibeko oyo etiamaka liboso ebanda: mikolo, bilembo ya kotalela, ndenge ya kopona mpe ndenge ya kokabola bato oyo bakokani.","Ntango tombola ekaboli bato oyo bakokani, ekoki kotalelama: etangami uta na elembo ya tekiniki ya mibeko oyo etiami.","Bikolo ekokani: bakisi mpo na ekolo ezali te, mpe vote nyonso ezali moko.","Moto amiponaka ye moko te. Liboso ya mbula 18, elonga epesaka bankombo mpe ba badge, mbongo ata mokolo moko te.","Litomba ekoki kotɛmɛlama. Moto moko atalaka botɛmɛli yango."]},{"id":"argent","t":"Mbongo","p":["Nyonso oyo etali mbongo ezali kaka mpo na bato ya mbula 18 mpe koleka.","Ba NVCoins oyo osombi esalelamaka mpo na kopesa makabo. Ekoki kobima te lokola mbongo.","Litomba etikalaka kozela na ntango ya libateli liboso ekoka kobima. Ntango, ba frais mpe mbongo oyo etikali emonisamaka liboso ya kobimisa mbongo nyonso.","Mpo na kobunda na bokosi, litomba to kobimisa mbongo ekoki kotelemisama ntango moto azali kotala yango. Kotelemisa ezali ata mokolo moko te kobotola: mbongo etikali ya yo kino moto akozwa mokano, na ntina. Okoki kotɛmɛla mokano yango.","Ndenge ya kofuta etaleli ekolo na yo. Bakoki kosɛnga botalisi ya identité mpo na kobimisa mbongo."]},{"id":"fin","t":"Kotelemisa to kolongola compte","p":["Okoki kokanga compte na yo to kolongola yango na Ba réglage mpe sekele. Kolongola etikaka mikolo 30 ya kokanisa liboso ekoma ya nsuka.","Liboso ya kokende, okoki kosɛnga kopi ya ba sango na yo.","NEURAVID ekoki kotelemisa to kokanga compte oyo ebuki mibeko oyo, kolanda mibeko ya bokɛngi, elongo na lotomo ya kosɛnga botali lisusu."]},{"id":"responsabilite","t":"Mokumba na biso","p":["Tosalaka makasi na biso nyonso mpo NEURAVID esala malamu mpe etikala na libateli. Tokoki kolaka te ete kokatana to libunga ekozala ata mokolo moko te.","Moto nyonso azali na mokumba ya oyo atiaka. Soki bayebisi biso likambo oyo epekisami, tosalaka.","Eloko moko te na mibeko oyo ezali kolongola yo makoki oyo mobeko ya ekolo na yo epesi yo."]},{"id":"changements","t":"Mbongwana ya mibeko oyo","p":["Version nyonso ezali na nimero mpe mokolo.","Soki mibeko oyo ebongwani, tokolakisa yo bokuse ya oyo ebongwani mpe tokosɛnga yo ondima yango lisusu.","Soki ondimi te version ya sika, okoki kosɛnga kopi ya ba sango na yo mpe kolongola compte na yo."]},{"id":"loi","t":"Mobeko oyo esalaka mpe boyokani","p":["Mibeko oyo etambwisamaka na mobeko oyo esalaka na esika ya bokonzi ya TENAGON GROUP, LLC, na Ameriki, kozanga kolongola yo libateli oyo mobeko ya ekolo oyo ofandaka epesi yo.","Mibeko oyo ezali na nkota mingi. Soki bokeseni ezali, mokanda ya Lifalansé nde ezali na nguya.","Mpo na motuna nyonso: contact@neuravid.com."]}]},"confidentialite":{"titre":"Politique ya sekele","chapeau":"Politique oyo elimbolaka ba sango oyo NEURAVID esalelaka, ntina na yango, oyo etikalaka na telefone na yo, mpe ndenge otikalaka mokonzi.","changements":["Version ya liboso ya mokanda oyo."],"sections":[{"id":"responsable","t":"Nani azali na mokumba","p":["Ba sango na yo esalelamaka na TENAGON GROUP, LLC, kompanyi oyo ebandaki na Ameriki, mpo na kosalisa NEURAVID.","Mpo na kokomela biso: contact@neuravid.com."]},{"id":"donnees","t":"Ba sango oyo tosalelaka, mpe ntina na yango","p":["• Compte na yo (nkombo ya NEURAVID, nkombo, ndenge ya kokɔta, lokota, ekolo): mpo na kosala compte na yo mpe kobatela yango.","• Mokolo na yo ya mbotama: mpo na kotosa mibeko ya mibu ya NEURAVID mpe kobatela bana.","• Ekolo na yo mpe nkota na yo: mpo na kolakisa yo bavideo na nkota na yo mpe ba défi ya ekolo na yo.","• Makambo na yo (bavideo, makɛlɛlɛ, makanisi, bansango): mpo na kotia yango to kotinda yango, kolanda maponi na yo.","• Bilembo na yo ya kotala (eteni otali, video oleki to otali lisusu, makanisi na yo): mpo na kolakisa yo bavideo. Okoki kotika kobomba lisolo na yo ya kotala mpe kolongola yango.","• HVS: masalisi na yo mpe makanisi oyo ozwi, mpo na kotanga point ya lisalisi mokomoko.","• Bolamu ya kotala na Iris, lecteur: elongo na bilembo ya kotala, telefone etindaka mpe ntango liboso ya elilingi ya liboso mpe motango ya kokatana. Mituka yango esalelamaka kaka mpo na kokɛngɛla mpe kobongisa mosala. Ekɔtaka ata mokolo moko te na profil na yo to na batoli na yo.","• «Kosalisa mokambi» na Le Direct: bozito ya makɛlɛlɛ mpe bolamu ya réseau oyo telefone na yo ezwaka etindamaka kaka soki ofungoli yango (ekangami na ebandeli, na «Bolamu»). Mongongo to elilingi ata mokolo moko te.","• Esika ozali: kaka soki opesi ndingisa, mpe ekitisamaka na telefone kino na quartier to engumba liboso ya kotindama. Liboso ya mbula 18, kaka engumba.","• Mbongo (banda mbula 18): mombongo na yo mpe ndelo ya botalisi ya identité na yo. Tobombaka te nimero ya kalati na yo ya identité to foto na yango.","• Libateli: masini na yo oyo ekangami mpe bokɔti na yo ya sika. Mpo na kobunda na bokosi, adresse ya réseau mpe masini ebongolamaka elembo ya tekiniki liboso ya kobombama.","• Mayebisi na yo mpe mikano ya bokɛngi: mpo na kobatela lisanga mpe kopesa nzela na masɛngi ya botali lisusu."]},{"id":"telephone","t":"Oyo etikalaka na telefone na yo","p":["Kamera, kitoko, kolanda elongi mpe kolongola makɛlɛlɛ ya nsima etangamaka na telefone na yo. Bililingi mpe bomeki yango etindamaka te.","Ba brouillon na yo, ba prise na yo mpe ba scène na yo etikalaka na telefone na yo soki otii yango naino te."]},{"id":"accord","t":"Oyo ekendeke na serveur kaka na ndingisa na yo","p":["Misala mosusu ya kilo esalemaka na ba serveur na biso: kosembola video, kokolisa yango, kosala mikanda na nse yango moko, kobongola mongongo na lokota mosusu, kosala effet. NEURAVID esɛngaka ndingisa na yo liboso ya kotinda eloko nyonso.","Mpo na effet oyo esalemi uta na lokasa moko ya maloba, kaka maloba yango nde etindamaka: elilingi te, makɛlɛlɛ te.","Kokoma na mongongo mpe mitindo ya mongongo esalelaka mosala ya koyeba mongongo ya telefone na yo. Mosala yango ekoki kotinda mongongo na yo epai ya mopesi na yango. Ekrán ekebisaka yo liboso."]},{"id":"mineurs","t":"Libateli ya bana","p":["Banda mbula 13 kino 17, libateli oyo esalaka mpe ekoki kolongolama te:","• compte ezali ya sekele;","• bato mosusu bakoki kozwa bavideo te;","• engumba emonisamaka te mpe compte etindamaka te epai ya bato bayebani te;","• bansango ya bato bayebani te etiamaka pembeni;","• piblisite oyo eponami mpo na yo te;","• ba appel na compte ya mwana te, mpe mbongo te.","Mokóló oyo azali kokomela bana mingi oyo ayebi te atalelamaka na moto moko ya ekipi ya bokɛngi.","Moboti akoki kolanda elenge moko na code. Amonaka ntango esaleli mpe libateli, kasi ata mokolo moko te bansango to oyo elenge azali kotala."]},{"id":"conservation","t":"Tobombaka ba sango na yo ntango boni","p":["• Compte na yo: tango nyonso ezali. Nsima ya kosɛnga kolongola, mikolo 30 ya kokanisa, sima kolongola na kati ya mikolo 90 oyo elandi, ata ba kopi ya libateli.","• Lisolo na yo ya kotala: kino okolongola yango to okotika kobomba yango. Bilembo oyo ezangi nkombo oyo epekisaka kotanga botali moko mbala mibale elongolamaka nsima ya mikolo 30.","• Mayebisi mpe mikano ya bokɛngi: mbula 1 nsima ya mokano, to koleka soki mobeko esɛngi.","• Elembo ya bondimi na yo na mikanda oyo: tango nyonso compte na yo ezali, sima mibu 5.","• Misala ya mbongo: ntango oyo mobeko ya botangi mbongo esɛngi.","• Bilembo ya libateli: sanza 12.","• Esika oyo okaboli: elongolamaka ntango bokaboli esili."]},{"id":"droits","t":"Makoki na yo","p":["Ntango nyonso, okoki:","• komona ba sango na yo mpe kosɛnga kopi;","• kobongisa ba sango na yo;","• kolongola masolo na yo to kolongola compte na yo;","• koboya batoli mpe ba piblisite oyo eponami mpo na yo;","• kolongola ndingisa oyo opesaki.","Nyonso wana esalemaka na Ba réglage mpe sekele, na eteni «Ba sango na ngai». Okoki mpe kokomela contact@neuravid.com. Toyanolaka na kati ya mikolo 30.","Okoki mpe kokende epai ya bokonzi ya libateli ya ba sango ya ekolo na yo."]},{"id":"securite","t":"Libateli","p":["Bosolo kati ya application mpe ba serveur na biso eleka na ba connexion oyo ebombami na sekele.","Mikano ya bokɛngi ekomamaka na buku moko oyo ebatelami mpo ebongwana te.","Système moko te ezali ya kokoka. Soki ba sango oyo etali yo ebimi libanda, tokoyebisa yo ndenge mobeko elobi."]},{"id":"transferts","t":"Kotinda ba sango na bikolo mosusu","p":["TENAGON GROUP, LLC ezali na Ameriki. Ba sango na yo ekoki kosalelama na ekolo mosusu kasi te ya yo, ata Ameriki, elongo na libateli oyo mobeko esɛngi."]},{"id":"vente","t":"Totekaka ba sango na yo te","p":["Totekaka ba sango na yo ya moto moko te.","Bapesi misala oyo basalisaka biso (kobomba, kofuta, botalisi ya identité) bazwaka kaka oyo esengeli mpo na mosala na bango."]},{"id":"contact","t":"Mbongwana mpe boyokani","p":["Soki politique oyo ebongwani, tokolakisa yo oyo ebongwani mpe tokosɛnga yo otánga yango lisusu.","Soki bokeseni ezali kati ya nkota, mokanda ya Lifalansé nde ezali na nguya.","Mpo na motuna nyonso: contact@neuravid.com."]}]},"regles":{"titre":"Mibeko ya lisanga","chapeau":"NEURAVID esangisaka bato ya mokili mobimba. Mibeko oyo ebatelaka moto nyonso. Esalaka bisika nyonso: bavideo, ba direct, makanisi, bansango mpe ba défi.","changements":["Version ya liboso ya mokanda oyo."],"sections":[{"id":"respect","t":"Limemya","p":["Memyá bato, bonkoko na bango, nkota na bango mpe kondima na bango. Tyolá mosala, kasi moto ata mokolo moko te."]},{"id":"harcelement","t":"Konyokola te","p":["Kobangisa te, kofinga mbala na mbala te, koyokisa nsɔni te, kotyola moto na lisanga te, kopanza ba sango ya sekele ya moto te."]},{"id":"haine","t":"Koyina te","p":["Kobundisa moto to lisanga te mpo na esika auti, ekolo na ye, losambo na ye, mobali to mwasi, bolɛmbu ya nzoto na ye to eteni mosusu ya bomoto na ye."]},{"id":"violence","t":"Mobulu te mpe likama te","p":["Kobenga na mobulu te, ba défi ya likama te, kolendisa moto amizokisa te.","Soki moto azali na likama, benga liboso misala ya lisalisi ya nokinoki ya ekolo na yo, sima yebisá likambo yango."]},{"id":"sexuel","t":"Makambo ya pite te","p":["Bolumbu te mpe makambo ya pite te.","Nyonso oyo ekɔtisi mwana na makambo ya pite to etii ye na likama epekisami, ata moke te. Likambo ebombamaka nokinoki, compte etalelamaka liboso ya nyonso mpe ekoki kokangama, mpe makambo eyebisamaka na bakonzi ntango mobeko elobi yango."]},{"id":"arnaques","t":"Bokosi te","p":["Bilaka ya lokuta ya mbongo te, bitumba ya lokuta te, kosɛnga mot de passe to ba code te, to koteka na bokosi te."]},{"id":"engagement","t":"Bosangani ya lokuta te","p":["Ba robot te, ba vote oyo basombi te, ba compte mingi mpo na kopona te, to makabo oyo ezali kobaluka na zongazonga mpo na kobakisa mituka te."]},{"id":"usurpation","t":"Komikómisa moto mosusu te","p":["Komikómisa te moto mosusu, marque moko to NEURAVID. Kosalela te foto ya moto mosusu lokola ya yo."]},{"id":"verite","t":"Solo","p":["Likambo oyo ebongisami to oyo masini esali esengeli kotikala na elembo na yango. Kolakisa yango te lokola ya solo.","Kolobisa to kosalisa te moto ya solo oyo alobaki te to asalaki te, kozanga ndingisa na ye."]},{"id":"defis","t":"Ba défi ya sembo","p":["Tosá mibeko oyo etiami ya défi mokomoko. Komipona yo moko te. Kokosa te na bosangani. Kumisá mosala ya basusu, bato balongi mpe bato balongi te."]},{"id":"manquement","t":"Oyo esalemaka soki mibeko ebukani","p":["Kolanda bozito na yango: bondimisi ya kobakisa, kobomba to kolongola likambo, kokatela nzela, kotelemisa, kobengana.","Kokatela nzela, kotelemisa mpe kobengana ekatamaka na moto, mpe mokano nyonso elimbolamaka."]},{"id":"signaler","t":"Ndenge ya koyebisa","p":["Simbá «Koyebisa» na video, direct, nsango to profil, sima pona ntina.","Moto oyo bayebisi likambo na ye ayebaka te nani ayebisi."]},{"id":"recours","t":"Ndenge ya kosɛnga botali lisusu","p":["Soki okanisi ete mokano moko ezali libunga, tɛmɛlá yango na kati ya mikolo 30 uta na «Mikano mpe masɛngi na ngai» na L'Empreinte, to na «Kotɛmɛla».","Moto mosusu, kasi te oyo akataki mokano, nde atalaka lisɛngi na yo."]}]}}</script>

}

/* ── 3. l'accord : au serveur s'il l'annonce, sinon gardé sur le téléphone et rendu à l'application ── */
document.addEventListener('change', function(e){ var id = e.target && e.target.getAttribute && e.target.getAttribute('data-case'); if(!id || DOCS_IDS.indexOf(id) < 0) return;
  INS.coches[id] = !!e.target.checked; INS.erreur = ''; var c = e.target.closest('.case'); if(c) c.classList.toggle('ok', INS.coches[id]);

  emit('conditions_case', {doc:id, coche:INS.coches[id]}); });
function versionsCourantes(){ var v = {}; DOCS_IDS.forEach(function(id){ v[id] = versionDe(id); }); return v; }
function empreintesCourantes(){ var v = {}; DOCS_IDS.forEach(function(id){ v[id] = META.versions && META.versions[id] ? META.versions[id].empreinte || null : null; }); return v; }
function cleLocale(){ return 'nv_conditions_' + (compteActuel() || 'nouveau'); }
A.accepter = function(){
  if(INS.envoi) return; if(!toutCoche()){ INS.erreur = 'Cochez les trois cases pour continuer.'; return rendreEcranCourant(true); }
  var corps = {versions:versionsCourantes(), empreintes:empreintesCourantes(), langue:LANGUE_UI};
  if(INS.date) corps.dateNaissance = INS.date.iso;
  var r = {mode:VUE.mode, accepte:true, versions:corps.versions, empreintes:corps.empreintes, langue:LANGUE_UI, at:Date.now()};
  if(corps.dateNaissance){ r.dateNaissance = corps.dateNaissance; r.age = ageConnu(); r.tranche = tranche(r.age); }
  var fin = function(serveur){ r.serveur = serveur; INS.resultat = r; INS.envoi = false; ecrire(cleLocale(), r);
    try{ if(typeof window.NVConditionsFini === 'function') window.NVConditionsFini(JSON.parse(JSON.stringify(r))); }catch(e){ dbg(e); }

  INS.envoi = true; INS.erreur = ''; rendreEcranCourant(true);
  var g = GEN.n, k = INS.cle || (INS.cle = idem('acc'));
  envoyerJSON('POST', '/v1/comptes/acceptation', corps, k).then(function(o){ if(g !== GEN.n) return; o = o || {};
    fin({envoye:true, id:typeof o.id === 'string' ? o.id.slice(0, 80) : null, at:typeof o.at === 'number' ? o.at : null}); })
  .catch(function(e){ if(g !== GEN.n) return; INS.envoi = false; INS.cle = null;
    var code = e && e.corps && e.corps.erreur;

function htmlFini(){

A.lireDepuis = function(id){ if(DOCS_IDS.indexOf(id) < 0) return; VUE.retourDoc = {ecran:VUE.ecran, focus:id}; VUE.doc = id; VUE.q = ''; VUE.tdm = false; emit('conditions_doc', {doc:id, depuis:VUE.mode}); rendreEcranCourant(); window.scrollTo(0, 0); focusTitre(); };

/* ════════════════════════════════════════════════════════════════════
   LES ÉCRANS, L'ENTRÉE, L'INTERFACE PUBLIQUE

/* mode : lecture | inscription | accepter ; ecran : sommaire, doc (lecture) | date, accord, refus, fini (inscription) | nouvelle, date, fini (accepter) */

function titreEcran(){

}

document.addEventListener('click', function(e){

/* ── l'entrée : ?doc= / ?inscription=1 / ?accepter=1, le même dans le « # », ou le contexte nv_ctx_Conditions ── */
function contexte(){
  var o = {};

function oui(v){ return v === true || v === 1 || v === '1' || v === 'true' || v === 'oui'; }
function versionsAcceptees(o){ if(!o || typeof o !== 'object') return null; var r = {}, n = 0; DOCS_IDS.forEach(function(id){ var v = o[id]; if(typeof v === 'number' || typeof v === 'string' && /^\d{1,6}$/.test(v)){ r[id] = String(v); n++; } }); return n ? r : null; }

  VUE.doc = null; VUE.q = ''; VUE.retourDoc = null; VUE.entreeDirecte = false;

/* ── le serveur : ce qu'il annonce, puis (nouvelle version) les versions déjà acceptées ── */

demarrer();
})();

   2. Dans le lecteur plein écran des modules (NVLecteur), le menu « ⋯ » de chaque vidéo gagne « Ouvrir dans Iris ».
   3. Une vidéo qui joue ailleurs dans le module (hors NVLecteur) reçoit un bouton hexagonal « Ouvrir dans Iris »
