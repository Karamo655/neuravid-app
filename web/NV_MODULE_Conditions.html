:root{
  --encre:#F7F3FF; --brume:#CFC8EA; --gris:#A49CC4; --or:#FFC93D; --teal:#2EE6C5; --violet:#7B3BFF; --rose:#FF3D9A; --rouge:#FF5A76;
  --nv:linear-gradient(110deg,#2EE6C5 0%,#7B3BFF 52%,#FF3D9A 100%);
  --verre:rgba(18,11,42,.56); --verre2:rgba(255,255,255,.06); --fil:rgba(255,255,255,.14);
  --hx:polygon(50% 0,93.3% 25%,93.3% 75%,50% 100%,6.7% 75%,6.7% 25%);
  --hxp:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  --haut:env(safe-area-inset-top,0px); --basS:env(safe-area-inset-bottom,0px);
  --police:"Inter NV",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:#0A0620}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{margin:0;min-height:100vh;font:15px/1.5 var(--police);color:var(--encre);background:#0A0620;overflow-x:hidden;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(123,59,255,.28),transparent 60%),radial-gradient(80% 50% at 110% 30%,rgba(46,230,197,.10),transparent 60%);background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--or);outline-offset:3px;border-radius:10px}
[lang=nqo] body,.nko{font-family:"NKo",var(--police)}
[dir=rtl] .fleche{transform:scaleX(-1)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hx-btn{position:relative;flex:none;width:42px;height:46px;display:grid;place-items:center;clip-path:var(--hx);background:rgba(255,255,255,.12)}
.hx-btn::before{content:"";position:absolute;inset:1.5px;clip-path:var(--hx);background:rgba(10,6,28,.7)}
.hx-btn svg{position:relative;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tete{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--haut)) 16px 8px;background:linear-gradient(180deg,rgba(10,6,32,.97),rgba(10,6,32,.86));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(255,255,255,.07)}
.tete .titre{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.tete .titre b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-hx{flex:none;width:22px;height:25px;clip-path:var(--hx);background:var(--nv)}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(40px + var(--basS))}
h1{font-size:23px;line-height:1.2;margin:6px 0 6px;letter-spacing:-.01em}
h2{font-size:17px;margin:0}
p{margin:0 0 10px}
.petit{font-size:13px;color:var(--gris)}
.surtitre{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.surtitre::before{content:"";width:10px;height:11px;clip-path:var(--hx);background:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--nv);color:#fff;font-weight:800;font-size:15px;text-align:center;width:100%}
.btn.leger{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px var(--fil)}
.btn:disabled{background:rgba(255,255,255,.10);color:var(--gris);opacity:1}
.lien{color:var(--teal);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:32px}
/* le sommaire : trois textes */
.embleme{display:grid;place-items:center;margin:8px auto 14px;width:86px;height:96px;clip-path:var(--hx);background:var(--nv);animation:respire 5s ease-in-out infinite}
.embleme span{display:grid;place-items:center;width:80px;height:90px;clip-path:var(--hx);background:#140C33}
.embleme svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes respire{50%{transform:scale(1.04)}}
.intro{text-align:center;margin-bottom:16px}
.cartes{display:grid;gap:12px}
.carte{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;width:100%;padding:14px;border-radius:18px;background:var(--verre2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);text-align:start}
.carte:hover,.carte:focus-visible{box-shadow:inset 0 0 0 1px rgba(46,230,197,.55)}
.carte .ic{width:46px;height:52px;display:grid;place-items:center;clip-path:var(--hx);background:var(--c,#7B3BFF)}
.carte .ic svg{width:22px;height:22px;fill:none;stroke:#0A0620;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.carte b{display:block;font-size:16px;line-height:1.25}
.carte small{display:block;color:var(--gris);font-size:12.5px;margin:2px 0 6px}
.carte span.d{display:block;color:var(--brume);font-size:13.5px}
.carte .lire{display:inline-flex;align-items:center;gap:4px;margin-top:8px;color:var(--teal);font-weight:800;font-size:13.5px}
.langues-l{margin-top:22px;padding:14px;border-radius:16px;background:rgba(255,255,255,.04)}
.puces{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.puces button{min-height:38px;padding:0 13px;border-radius:19px;background:rgba(255,255,255,.08);font-size:13.5px;font-weight:650}
.puces button.on{background:var(--nv);color:#fff}
/* un texte */
.doc-tete{margin-bottom:12px}
.version{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--brume);padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.07)}
.chapeau{font-size:15.5px;color:var(--brume);margin-top:10px}
.cherche{position:relative;margin:12px 0}
.cherche input{width:100%;min-height:46px;padding:0 14px 0 40px;border-radius:14px;border:0;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--fil);font-size:15px}
[dir=rtl] .cherche input{padding:0 40px 0 14px}
.cherche svg{position:absolute;inset-inline-start:12px;top:13px;width:20px;height:20px;fill:none;stroke:var(--gris);stroke-width:2.2;stroke-linecap:round}
.cherche-n{min-height:20px;font-size:13px;color:var(--gris);margin:-4px 0 8px}
details.tdm{margin:0 0 14px;border-radius:16px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
details.tdm summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:0 14px;font-weight:800}
details.tdm summary::-webkit-details-marker{display:none}
details.tdm summary::after{content:"";width:9px;height:9px;border:solid var(--brume);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
details.tdm[open] summary::after{transform:rotate(225deg)}
.tdm ol{list-style:none;margin:0;padding:0 8px 10px}
.tdm li button{display:flex;gap:10px;align-items:center;width:100%;min-height:40px;padding:4px 6px;border-radius:10px;text-align:start;font-size:14px;color:var(--brume)}
.tdm li button:hover{background:rgba(255,255,255,.06)}
.num{flex:none;display:grid;place-items:center;width:28px;height:31px;clip-path:var(--hx);background:rgba(123,59,255,.45);font-size:12px;font-weight:800;color:#fff}
.texte section{padding:14px 0 6px;border-top:1px solid rgba(255,255,255,.07);scroll-margin-top:76px}
.texte section:first-child{border-top:0}
.texte h2{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.texte p,.texte li{font-size:15.5px;line-height:1.62;color:#ECE7FA}
.texte ul{margin:0 0 10px;padding-inline-start:4px;list-style:none}
.texte li{position:relative;padding-inline-start:20px;margin-bottom:6px}
.texte li::before{content:"";position:absolute;inset-inline-start:2px;top:.62em;width:8px;height:9px;clip-path:var(--hx);background:var(--teal)}
mark{background:rgba(255,201,61,.32);color:inherit;border-radius:3px;padding:0 1px}
.haut{margin-top:18px}
.foi{font-size:13px;color:var(--gris);margin-top:16px}
/* l'inscription */
.etape{animation:entre .35s ease both}
@keyframes entre{from{opacity:0;transform:translateY(8px)}}
.date{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:8px;margin:14px 0 6px}
.date label{display:grid;gap:4px;font-size:12.5px;color:var(--brume);font-weight:700;min-width:0}
.date select{width:100%;min-height:48px;padding:0 8px;border-radius:12px;border:0;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px var(--fil);font-size:15px;min-width:0}
.date select option{background:#140C33;color:#fff}
.erreur{min-height:22px;color:#FFB4C2;font-size:13.5px;font-weight:650;margin:4px 0 10px}
.grille-ages{display:grid;gap:8px;margin:12px 0 16px}
.palier{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:12px;border-radius:16px;background:rgba(255,255,255,.05)}
.palier .hx{width:34px;height:38px;display:grid;place-items:center;clip-path:var(--hx);background:rgba(255,255,255,.12);font-weight:900;font-size:13px}
.palier.ouvert .hx{background:var(--teal);color:#0A0620}
.palier b{display:block;font-size:14px}
.palier small{display:block;font-size:12px;color:var(--gris);margin-bottom:4px}
.palier ul{margin:0;padding:0;list-style:none}
.palier li{font-size:13.5px;color:var(--brume);padding:1px 0}
.palier:not(.ouvert) li{color:var(--gris)}
.protege{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(46,230,197,.10);box-shadow:inset 0 0 0 1px rgba(46,230,197,.3);font-size:13.5px;margin-bottom:14px}
.protege::before{content:"";flex:none;width:14px;height:16px;margin-top:2px;clip-path:var(--hx);background:var(--teal)}
.cases{display:grid;gap:10px;margin:8px 0 14px}
.case{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.case.ok{box-shadow:inset 0 0 0 1px rgba(46,230,197,.6);background:rgba(46,230,197,.07)}
.case input{appearance:none;-webkit-appearance:none;margin:0;width:30px;height:34px;clip-path:var(--hx);background:rgba(255,255,255,.18);display:grid;place-items:center;cursor:pointer;position:relative}
.case input::after{content:"";width:9px;height:15px;border:solid #0A0620;border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);transition:transform .15s;margin-top:-3px}
.case input:checked{background:var(--teal)}
.case input:checked::after{transform:rotate(45deg) scale(1)}
.case input:focus-visible{outline:none;background:var(--or)}
.case label{font-weight:700;font-size:14.5px;line-height:1.35;cursor:pointer}
.case label{display:block}
.case small{display:block;margin-top:2px}
.case .lien{display:block;text-align:start;font-size:13px;margin-top:2px}
.changes{margin:8px 0 0;padding:0;list-style:none}
.changes li{position:relative;padding-inline-start:18px;font-size:13.5px;color:var(--brume)}
.changes li::before{content:"";position:absolute;inset-inline-start:0;top:.5em;width:8px;height:9px;clip-path:var(--hx);background:var(--or)}
.fini{text-align:center;padding-top:20px}
.refus .embleme{background:linear-gradient(110deg,#FFC93D,#FF3D9A)}
.actions{display:grid;gap:10px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(18px + var(--basS));transform:translate(-50%,20px);opacity:0;z-index:60;max-width:min(92vw,520px);padding:11px 16px;border-radius:14px;background:#231648;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:14px;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.voile{position:fixed;inset:0;z-index:40;background:rgba(4,2,14,.6)}
.feuille{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;padding:16px 16px calc(20px + var(--basS));border-radius:24px 24px 0 0;background:#140C33;box-shadow:0 -20px 60px rgba(0,0,0,.5);max-width:760px;margin:0 auto}
.feuille .f-tete{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
@media (min-width:600px){h1{font-size:27px}.grille-ages{grid-template-columns:repeat(3,1fr)}.palier{grid-template-columns:1fr}}
</style>
</head>

<script type="application/json" id="nvDocs-fr">{"cgu":{"titre":"Conditions générales d'utilisation","chapeau":"Ces conditions expliquent les règles de NEURAVID : ce que vous pouvez y faire, ce que nous faisons, et ce qui se passe en cas de problème. Elles sont écrites en phrases simples.","changements":["Première version de ce texte."],"sections":[{"id":"editeur","t":"Qui nous sommes","p":["NEURAVID est un service de TENAGON GROUP, LLC, une société créée aux États-Unis.","Dans ces conditions, « nous » désigne NEURAVID et TENAGON GROUP, LLC. « Vous » désigne la personne qui utilise NEURAVID.","Pour nous écrire : contact@neuravid.com."]},{"id":"acceptation","t":"Accepter ces conditions","p":["Pour créer un compte, vous devez accepter ces conditions, lire la Politique de confidentialité et accepter les Règles de la communauté. Ce sont trois accords séparés.","Quand un de ces textes change, nous vous montrons ce qui change et nous vous demandons de l'accepter à nouveau avant de continuer.","Nous gardons la trace de chaque accord : le texte, sa version, la date et la langue d'affichage."]},{"id":"ages","t":"Les âges","p":["Il n'y a pas de compte NEURAVID avant 13 ans.","• Dès 13 ans : utiliser NEURAVID, regarder les vidéos et en créer, regarder les directs et écrire dans leur discussion, participer aux défis.","• Dès 16 ans : animer un direct, monter sur scène dans un direct, co-créer avec d'autres créateurs.","• Dès 18 ans : l'argent (cadeaux payants, achats, gains et retraits), Miss & Master, les rencontres de Love Universe et les appels de Palabre.","Les directs marqués « public averti » ne sont montrés qu'à partir de 16 ans.","De 13 à 17 ans, des protections renforcées s'appliquent. Elles sont décrites dans la Politique de confidentialité.","L'âge que vous déclarez doit être vrai. NEURAVID peut vous demander de le vérifier. Si l'âge déclaré est faux, l'accès à certaines fonctions peut être limité."]},{"id":"compte","t":"Votre compte et sa sécurité","p":["Donnez des informations exactes et tenez-les à jour.","Gardez votre mot de passe secret. Activez la validation en deux étapes quand elle vous est proposée.","Si vous pensez que quelqu'un utilise votre compte, changez votre mot de passe et prévenez-nous tout de suite.","Vous êtes responsable de ce qui est fait avec votre compte, sauf si quelqu'un l'a utilisé sans votre accord."]},{"id":"contenus","t":"Vos contenus","p":["Vous restez l'auteur de ce que vous publiez : vidéos, sons, photos, textes.","Pour faire fonctionner NEURAVID, vous nous donnez le droit, gratuit et pour le monde entier, d'héberger, de copier, d'afficher et de diffuser vos contenus, et de les adapter techniquement (formats, qualité, sous-titres). Ce droit s'arrête quand vous supprimez un contenu, après le délai technique nécessaire, sauf si la loi nous oblige à le garder.","D'autres personnes peuvent reprendre vos sons ou faire un duo avec vos vidéos seulement si vos réglages le permettent.","Un contenu modifié ou synthétique (voix générée, doublage, décor virtuel, avatar, objet effacé, retouche par le serveur) est signalé aux spectateurs comme « contenu modifié ». Ne cachez pas ce signalement.","Vous ne pouvez doubler ou imiter que votre propre voix, avec votre accord.","Pour la musique, vous devez avoir le droit d'utiliser chaque son. Un son venu de votre téléphone vous demande de le confirmer avant de publier. Les sons du Griot sont accompagnés de leurs conditions d'utilisation."]},{"id":"interdits","t":"Ce qui est interdit","p":["Les Règles de la communauté font partie de ces conditions. Il est interdit notamment :","• de mettre en danger, d'exploiter ou de sexualiser des mineurs ;","• de harceler, menacer, inciter à la haine ou à la violence ;","• de publier des contenus sexuels ou illégaux ;","• d'arnaquer, de tromper sur l'argent ou de vendre de faux services ;","• de fabriquer du faux engagement : robots, votes achetés, comptes multiples, cadeaux qui tournent en rond ;","• de se faire passer pour quelqu'un d'autre ;","• de contourner la sécurité de NEURAVID ou de collecter les données d'autres personnes."]},{"id":"moderation","t":"La modération","p":["Le Bouclier de NEURAVID repère automatiquement des signes de fraude ou de danger. Seul, il ne peut que demander une vérification supplémentaire.","Un contenu signalé comme un danger pour la vie ou comme une exploitation de mineurs est masqué tout de suite, en attendant l'examen d'une personne.","Les sanctions sont graduées : vérification supplémentaire, limitation, suspension, bannissement. La limitation, la suspension et le bannissement sont toujours décidés par une personne. Un bannissement doit être confirmé par une deuxième personne.","Chaque décision vous est expliquée par un motif."]},{"id":"recours","t":"Le recours","p":["Vous pouvez contester une décision de modération dans les 30 jours, une fois par décision, depuis « Mes décisions et recours » dans L'Empreinte, ou avec « Contester ».","Votre recours est examiné par une autre personne que celle qui a décidé.","Si votre recours est accepté, la décision est annulée et votre contenu redevient visible."]},{"id":"hvs","t":"Le HVS","p":["Le HVS mesure la valeur d'une contribution : une œuvre, une participation, un commentaire utile, une aide, un signalement vérifié. Il ne mesure jamais la valeur d'une personne.","NEURAVID ne fait aucun classement de personnes avec le HVS : ni total par personne, ni moyenne, ni rang.","Chaque score est explicable : il montre ses composantes, les nombres utilisés et la version de la formule.","L'auteur d'une contribution peut contester son score. Une personne examine le recours et motive sa décision."]},{"id":"defis","t":"Les défis et les compétitions","p":["Chaque défi a un règlement publié avant le début : les dates, les critères, la façon de voter et la façon de départager.","Quand un tirage départage une égalité, il est vérifiable : il est calculé à partir de l'empreinte du règlement publié.","Les nations sont à égalité : aucun bonus de nationalité, et chaque voix compte pour une.","On ne vote pas pour soi-même. Avant 18 ans, une victoire donne des titres et des badges, jamais d'argent.","Un résultat peut être contesté. Une personne examine la contestation."]},{"id":"argent","t":"L'argent","p":["Tout ce qui touche à l'argent est réservé aux personnes de 18 ans et plus.","Les NVCoins achetés servent à offrir des cadeaux. Ils ne se retirent pas.","Un gain reste en attente pendant un délai de sécurité avant de pouvoir être retiré. Le délai, les frais et le montant net sont affichés avant chaque retrait.","Pour lutter contre la fraude, un gain ou un retrait peut être gelé pendant qu'une personne l'examine. Un gel n'est jamais une confiscation : l'argent reste à vous tant qu'une personne n'a pas décidé, avec un motif. Vous pouvez contester cette décision.","Les moyens de paiement dépendent de votre pays. Une vérification d'identité peut être demandée pour retirer de l'argent."]},{"id":"fin","t":"Suspendre ou supprimer un compte","p":["Vous pouvez désactiver votre compte ou le supprimer dans Réglages et confidentialité. La suppression laisse 30 jours de réflexion avant d'être définitive.","Avant de partir, vous pouvez demander une copie de vos données.","NEURAVID peut suspendre ou fermer un compte qui enfreint ces conditions, selon les règles de la modération, avec un droit de recours."]},{"id":"responsabilite","t":"Notre responsabilité","p":["Nous faisons de notre mieux pour que NEURAVID fonctionne bien et reste sûr. Nous ne pouvons pas promettre qu'il n'y aura jamais d'interruption ni d'erreur.","Chaque personne est responsable de ce qu'elle publie. Quand on nous signale un contenu interdit, nous agissons.","Rien dans ces conditions ne vous retire les droits que vous donne la loi de votre pays."]},{"id":"changements","t":"Les changements de ces conditions","p":["Chaque version porte un numéro et une date.","Quand ces conditions changent, nous vous montrons un résumé de ce qui change et nous vous demandons de les accepter à nouveau.","Si vous n'acceptez pas une nouvelle version, vous pouvez demander une copie de vos données et supprimer votre compte."]},{"id":"loi","t":"La loi applicable et le contact","p":["Ces conditions sont régies par le droit applicable au siège de TENAGON GROUP, LLC, aux États-Unis, sans vous priver de la protection que vous donne la loi de votre pays de résidence.","Ces conditions existent en plusieurs langues. En cas de différence, la version française fait foi.","Pour toute question : contact@neuravid.com."]}]},"confidentialite":{"titre":"Politique de confidentialité","chapeau":"Cette politique explique quelles données NEURAVID utilise, pourquoi, ce qui reste sur votre téléphone, et comment vous gardez le contrôle.","changements":["Première version de ce texte."],"sections":[{"id":"responsable","t":"Qui est responsable","p":["Vos données sont traitées par TENAGON GROUP, LLC, une société créée aux États-Unis, pour faire fonctionner NEURAVID.","Pour nous écrire : contact@neuravid.com."]},{"id":"donnees","t":"Les données que nous utilisons, et pourquoi","p":["• Votre compte (pseudo, nom, moyen de connexion, langue, pays) : pour créer votre compte et le protéger.","• Votre date de naissance : pour appliquer les âges de NEURAVID et protéger les mineurs.","• Votre pays et vos langues : pour vous montrer des vidéos dans vos langues et les défis de votre pays.","• Vos contenus (vidéos, sons, commentaires, messages) : pour les publier ou les transmettre, selon vos choix.","• Vos signaux de lecture (la part regardée, une vidéo passée ou revue, vos réactions) : pour vous recommander des vidéos. Vous pouvez arrêter de garder votre historique et l'effacer.","• Le HVS : vos contributions et les avis reçus, pour calculer le score de chaque contribution.","• La qualité de la lecture dans Iris, le lecteur : avec les signaux de lecture, le téléphone envoie aussi le temps avant la première image et le nombre d'interruptions. Ces nombres servent seulement à surveiller et améliorer le service. Ils ne vont jamais dans votre profil ni dans vos recommandations.","• « Aider l'animateur » dans Le Direct : le niveau du son et la qualité du réseau que votre téléphone reçoit ne sont envoyés que si vous l'allumez (éteint par défaut, dans « La qualité »). Jamais le son ni l'image.","• Votre position : seulement si vous l'autorisez, et arrondie sur le téléphone au quartier ou à la ville avant d'être envoyée. Avant 18 ans, seulement la ville.","• L'argent (à partir de 18 ans) : vos opérations et le niveau de vérification de votre identité. Nous ne gardons ni le numéro de votre pièce d'identité ni sa photo.","• La sécurité : vos appareils connectés et vos connexions récentes. Pour lutter contre la fraude, l'adresse réseau et l'appareil sont transformés en empreinte avant d'être gardés.","• Vos signalements et les décisions de modération : pour protéger la communauté et permettre les recours."]},{"id":"telephone","t":"Ce qui reste sur votre téléphone","p":["La caméra, la beauté, le suivi du visage et le retrait du bruit de fond sont calculés sur votre téléphone. Ces images et ces mesures ne sont pas envoyées.","Vos brouillons, vos prises et vos scènes restent sur votre téléphone tant que vous ne publiez pas."]},{"id":"accord","t":"Ce qui part au serveur seulement avec votre accord","p":["Certains traitements lourds se font sur nos serveurs : stabiliser, agrandir, créer des sous-titres automatiques, doubler une voix, générer un effet. NEURAVID vous demande votre accord avant d'envoyer quoi que ce soit.","Pour un effet généré à partir d'une phrase, seule la phrase part : aucune image et aucun son.","La dictée et les commandes vocales utilisent le service de reconnaissance de votre téléphone. Ce service peut envoyer votre voix à son fournisseur. L'écran vous prévient avant."]},{"id":"mineurs","t":"La protection des mineurs","p":["De 13 à 17 ans, ces protections s'appliquent et ne peuvent pas être retirées :","• le compte est privé ;","• les vidéos ne peuvent pas être téléchargées par d'autres ;","• la ville n'est pas montrée et le compte n'est pas proposé à des inconnus ;","• les messages des inconnus sont mis de côté ;","• pas d'annonces personnalisées ;","• pas d'appels avec un compte mineur, et pas d'argent.","Un adulte qui écrit à plusieurs mineurs qu'il ne connaît pas est examiné par une personne de la modération.","Un parent peut accompagner un adolescent avec un code. Il voit le temps passé et les protections, jamais les messages ni ce que l'adolescent regarde."]},{"id":"conservation","t":"Combien de temps nous gardons vos données","p":["• Votre compte : tant qu'il existe. Après une demande de suppression, 30 jours de réflexion, puis effacement dans les 90 jours suivants, sauvegardes comprises.","• Votre historique de lecture : jusqu'à ce que vous l'effaciez ou arrêtiez de le garder. Les marques anonymes qui empêchent de compter deux fois une même vue sont effacées après 30 jours.","• Les signalements et les décisions de modération : 1 an après la décision, ou plus longtemps si la loi l'exige.","• La trace de vos accords à ces textes : tant que votre compte existe, puis 5 ans.","• Les opérations d'argent : la durée exigée par la loi comptable.","• Les empreintes de sécurité : 12 mois.","• Une position partagée : effacée quand le partage se termine."]},{"id":"droits","t":"Vos droits","p":["Vous pouvez à tout moment :","• voir vos données et en demander une copie ;","• corriger vos informations ;","• effacer vos historiques ou supprimer votre compte ;","• refuser les recommandations et les annonces personnalisées ;","• retirer un consentement que vous avez donné.","Tout cela se fait dans Réglages et confidentialité, rubrique « Mes données ». Vous pouvez aussi écrire à contact@neuravid.com. Nous répondons dans un délai de 30 jours.","Vous pouvez aussi vous adresser à l'autorité de protection des données de votre pays."]},{"id":"securite","t":"La sécurité","p":["Les échanges entre l'application et nos serveurs passent par des connexions chiffrées.","Les décisions de modération sont inscrites dans un journal protégé contre les modifications.","Aucun système n'est parfait. En cas de fuite de données qui vous concerne, nous vous prévenons comme la loi le prévoit."]},{"id":"transferts","t":"Les transferts vers d'autres pays","p":["TENAGON GROUP, LLC est aux États-Unis. Vos données peuvent être traitées dans un autre pays que le vôtre, dont les États-Unis, avec les protections exigées par la loi."]},{"id":"vente","t":"Nous ne vendons pas vos données","p":["Nous ne vendons pas vos données personnelles.","Les prestataires qui nous aident (hébergement, paiement, vérification d'identité) reçoivent seulement ce qui est nécessaire à leur mission."]},{"id":"contact","t":"Les changements et le contact","p":["Quand cette politique change, nous vous montrons ce qui change et nous vous demandons de la relire.","En cas de différence entre les langues, la version française fait foi.","Pour toute question : contact@neuravid.com."]}]},"regles":{"titre":"Règles de la communauté","chapeau":"NEURAVID rassemble des personnes du monde entier. Ces règles protègent chacun. Elles s'appliquent partout : vidéos, directs, commentaires, messages et défis.","changements":["Première version de ce texte."],"sections":[{"id":"respect","t":"Le respect","p":["Respectez les personnes, leurs cultures, leurs langues et leurs croyances. Critiquez une œuvre, jamais une personne."]},{"id":"harcelement","t":"Pas de harcèlement","p":["Pas de menaces, d'insultes répétées, d'humiliation, de moqueries en groupe ni de diffusion d'informations privées sur quelqu'un."]},{"id":"haine","t":"Pas de haine","p":["Pas d'attaque contre une personne ou un groupe pour son origine, sa nationalité, sa religion, son sexe, son handicap ou toute autre partie de son identité."]},{"id":"violence","t":"Pas de violence ni de danger","p":["Pas d'appel à la violence, pas de défis dangereux, pas d'encouragement à se faire du mal.","Si quelqu'un est en danger, appelez d'abord les secours de votre pays, puis signalez le contenu."]},{"id":"sexuel","t":"Pas de contenu sexuel","p":["Pas de nudité ni de contenu sexuel.","Tout ce qui sexualise ou met en danger un mineur est interdit, sans exception. Le contenu est masqué tout de suite, le compte est examiné en priorité et peut être fermé, et les faits sont signalés aux autorités quand la loi le prévoit."]},{"id":"arnaques","t":"Pas d'arnaques","p":["Pas de fausses promesses d'argent, de faux concours, de demandes de mots de passe ou de codes, ni de ventes trompeuses."]},{"id":"engagement","t":"Pas de faux engagement","p":["Pas de robots, de votes achetés, de comptes multiples pour voter, ni de cadeaux qui tournent en rond pour gonfler des chiffres."]},{"id":"usurpation","t":"Pas d'usurpation","p":["Ne vous faites pas passer pour une autre personne, une marque ou NEURAVID. N'utilisez pas la photo d'une autre personne comme la vôtre."]},{"id":"verite","t":"La vérité","p":["Un contenu modifié ou synthétique doit rester signalé comme tel. Ne le présentez pas comme réel.","Ne faites pas dire ou faire à une personne réelle ce qu'elle n'a pas dit ou fait, sans son accord."]},{"id":"defis","t":"Des défis loyaux","p":["Respectez le règlement publié de chaque défi. Ne votez pas pour vous-même. Ne trichez pas sur une participation. Saluez le travail des autres, gagnants comme perdants."]},{"id":"manquement","t":"Ce qui se passe en cas de manquement","p":["Selon la gravité : vérification supplémentaire, contenu masqué ou retiré, limitation, suspension, bannissement.","La limitation, la suspension et le bannissement sont décidés par une personne, et chaque décision est expliquée."]},{"id":"signaler","t":"Comment signaler","p":["Touchez « Signaler » sur une vidéo, un direct, un message ou un profil, puis choisissez la raison.","La personne signalée ne sait pas qui l'a signalée."]},{"id":"recours","t":"Comment faire un recours","p":["Si vous pensez qu'une décision est une erreur, contestez-la dans les 30 jours depuis « Mes décisions et recours » dans L'Empreinte, ou avec « Contester ».","Une autre personne que celle qui a décidé examine votre recours."]}]}}</script>
<script type="application/json" id="nvDocs-en">{"cgu":{"titre":"Terms of Service","chapeau":"These terms explain the rules of NEURAVID: what you can do here, what we do, and what happens if there is a problem. They are written in simple sentences.","changements":["First version of this text."],"sections":[{"id":"editeur","t":"Who we are","p":["NEURAVID is a service of TENAGON GROUP, LLC, a company formed in the United States.","In these terms, “we” means NEURAVID and TENAGON GROUP, LLC. “You” means the person using NEURAVID.","To write to us: contact@neuravid.com."]},{"id":"acceptation","t":"Accepting these terms","p":["To create an account, you must accept these terms, read the Privacy Policy and accept the Community Guidelines. These are three separate agreements.","When one of these texts changes, we show you what changes and ask you to accept it again before you continue.","We keep a record of each agreement: the text, its version, the date and the display language."]},{"id":"ages","t":"Ages","p":["There is no NEURAVID account before age 13.","• From 13: use NEURAVID, watch and create videos, watch lives and write in their chat, take part in challenges.","• From 16: host a live, go on stage in a live, co-create with other creators.","• From 18: money (paid gifts, purchases, earnings and withdrawals), Miss & Master, Love Universe dating and Palabre calls.","Lives marked “mature audience” are only shown from age 16.","From 13 to 17, stronger protections apply. They are described in the Privacy Policy.","The age you declare must be true. NEURAVID may ask you to verify it. If the declared age is false, access to some features may be limited."]},{"id":"compte","t":"Your account and its security","p":["Give accurate information and keep it up to date.","Keep your password secret. Turn on two-step verification when it is offered to you.","If you think someone is using your account, change your password and tell us right away.","You are responsible for what is done with your account, unless someone used it without your permission."]},{"id":"contenus","t":"Your content","p":["You remain the author of what you publish: videos, sounds, photos, texts.","To run NEURAVID, you give us the right, free of charge and worldwide, to host, copy, display and broadcast your content, and to adapt it technically (formats, quality, subtitles). This right ends when you delete a piece of content, after the necessary technical delay, unless the law requires us to keep it.","Other people can reuse your sounds or make a duet with your videos only if your settings allow it.","Modified or synthetic content (generated voice, dubbing, virtual background, avatar, erased object, server retouching) is shown to viewers as “modified content”. Do not hide this label.","You may only dub or imitate your own voice, with your consent.","For music, you must have the right to use each sound. A sound from your phone asks you to confirm this before publishing. Sounds from Le Griot come with their terms of use."]},{"id":"interdits","t":"What is forbidden","p":["The Community Guidelines are part of these terms. In particular, it is forbidden:","• to endanger, exploit or sexualise minors;","• to harass, threaten, or incite hatred or violence;","• to publish sexual or illegal content;","• to scam, deceive about money or sell fake services;","• to create fake engagement: bots, bought votes, multiple accounts, gifts going round in circles;","• to pretend to be someone else;","• to get around NEURAVID's security or collect other people's data."]},{"id":"moderation","t":"Moderation","p":["NEURAVID's Shield automatically detects signs of fraud or danger. On its own, it can only ask for an extra verification.","Content reported as a danger to life or as exploitation of minors is hidden at once, until a person reviews it.","Sanctions are graduated: extra verification, limitation, suspension, ban. Limitation, suspension and ban are always decided by a person. A ban must be confirmed by a second person.","Each decision is explained to you with a reason."]},{"id":"recours","t":"Appeals","p":["You can appeal a moderation decision within 30 days, once per decision, from “My decisions and appeals” in L'Empreinte, or with “Contest”.","Your appeal is reviewed by a different person from the one who decided.","If your appeal is accepted, the decision is cancelled and your content becomes visible again."]},{"id":"hvs","t":"The HVS","p":["The HVS measures the value of a contribution: a work, a participation, a helpful comment, help given, a verified report. It never measures the value of a person.","NEURAVID does not rank people with the HVS: no total per person, no average, no rank.","Each score can be explained: it shows its components, the numbers used and the version of the formula.","The author of a contribution can contest its score. A person reviews the appeal and gives the reasons for the decision."]},{"id":"defis","t":"Challenges and competitions","p":["Each challenge has rules published before it starts: the dates, the criteria, how voting works and how ties are broken.","When a draw breaks a tie, it can be checked: it is calculated from the fingerprint of the published rules.","Nations are equal: no nationality bonus, and every vote counts as one.","You cannot vote for yourself. Before 18, a win gives titles and badges, never money.","A result can be contested. A person reviews the contest."]},{"id":"argent","t":"Money","p":["Everything to do with money is reserved for people aged 18 and over.","NVCoins you buy are used to send gifts. They cannot be withdrawn.","Earnings stay pending for a security period before they can be withdrawn. The period, the fees and the net amount are shown before each withdrawal.","To fight fraud, an earning or a withdrawal may be frozen while a person reviews it. A freeze is never a confiscation: the money stays yours until a person has decided, with a reason. You can contest this decision.","Payment methods depend on your country. Identity verification may be required to withdraw money."]},{"id":"fin","t":"Suspending or deleting an account","p":["You can deactivate or delete your account in Settings and privacy. Deletion leaves 30 days to think it over before it is final.","Before you leave, you can request a copy of your data.","NEURAVID may suspend or close an account that breaks these terms, following the moderation rules, with a right of appeal."]},{"id":"responsabilite","t":"Our responsibility","p":["We do our best to keep NEURAVID working well and safe. We cannot promise there will never be an interruption or an error.","Each person is responsible for what they publish. When forbidden content is reported to us, we act.","Nothing in these terms takes away the rights that the law of your country gives you."]},{"id":"changements","t":"Changes to these terms","p":["Each version has a number and a date.","When these terms change, we show you a summary of what changes and ask you to accept them again.","If you do not accept a new version, you can request a copy of your data and delete your account."]},{"id":"loi","t":"Applicable law and contact","p":["These terms are governed by the law applicable at the registered office of TENAGON GROUP, LLC, in the United States, without depriving you of the protection given to you by the law of your country of residence.","These terms exist in several languages. If there is any difference, the French version prevails.","For any question: contact@neuravid.com."]}]},"confidentialite":{"titre":"Privacy Policy","chapeau":"This policy explains what data NEURAVID uses, why, what stays on your phone, and how you stay in control.","changements":["First version of this text."],"sections":[{"id":"responsable","t":"Who is responsible","p":["Your data is processed by TENAGON GROUP, LLC, a company formed in the United States, to run NEURAVID.","To write to us: contact@neuravid.com."]},{"id":"donnees","t":"The data we use, and why","p":["• Your account (username, name, sign-in method, language, country): to create your account and protect it.","• Your date of birth: to apply NEURAVID's age rules and protect minors.","• Your country and languages: to show you videos in your languages and the challenges of your country.","• Your content (videos, sounds, comments, messages): to publish or deliver it, according to your choices.","• Your viewing signals (how much you watched, a video skipped or replayed, your reactions): to recommend videos to you. You can stop keeping your history and delete it.","• The HVS: your contributions and the feedback received, to calculate the score of each contribution.","• Playback quality in Iris, the player: along with viewing signals, the phone also sends the time before the first image and the number of interruptions. These numbers are used only to monitor and improve the service. They never go into your profile or your recommendations.","• “Help the host” in Le Direct: the sound level and network quality your phone receives are sent only if you turn it on (off by default, in “Quality”). Never the sound or the image.","• Your location: only if you allow it, and rounded on the phone to the neighbourhood or the city before it is sent. Before 18, only the city.","• Money (from 18): your transactions and your identity verification level. We keep neither your ID document number nor its photo.","• Security: your connected devices and recent sign-ins. To fight fraud, the network address and the device are turned into a fingerprint before being kept.","• Your reports and moderation decisions: to protect the community and allow appeals."]},{"id":"telephone","t":"What stays on your phone","p":["The camera, beauty effects, face tracking and background noise removal are calculated on your phone. These images and measurements are not sent.","Your drafts, takes and scenes stay on your phone as long as you do not publish."]},{"id":"accord","t":"What goes to the server only with your consent","p":["Some heavy processing is done on our servers: stabilising, enlarging, creating automatic subtitles, dubbing a voice, generating an effect. NEURAVID asks for your consent before sending anything.","For an effect generated from a sentence, only the sentence is sent: no image and no sound.","Dictation and voice commands use your phone's recognition service. This service may send your voice to its provider. The screen warns you first."]},{"id":"mineurs","t":"Protecting minors","p":["From 13 to 17, these protections apply and cannot be removed:","• the account is private;","• videos cannot be downloaded by others;","• the city is not shown and the account is not suggested to strangers;","• messages from strangers are set aside;","• no personalised ads;","• no calls with a minor's account, and no money.","An adult who writes to several minors they do not know is reviewed by a member of the moderation team.","A parent can accompany a teenager with a code. They see the time spent and the protections, never the messages or what the teenager watches."]},{"id":"conservation","t":"How long we keep your data","p":["• Your account: as long as it exists. After a deletion request, 30 days to think it over, then deletion within the following 90 days, backups included.","• Your viewing history: until you delete it or stop keeping it. The anonymous marks that prevent counting the same view twice are deleted after 30 days.","• Reports and moderation decisions: 1 year after the decision, or longer if the law requires it.","• The record of your agreements to these texts: as long as your account exists, then 5 years.","• Money transactions: the period required by accounting law.","• Security fingerprints: 12 months.","• A shared location: deleted when the sharing ends."]},{"id":"droits","t":"Your rights","p":["At any time, you can:","• see your data and request a copy;","• correct your information;","• delete your history or delete your account;","• refuse personalised recommendations and ads;","• withdraw a consent you have given.","All this is done in Settings and privacy, under “My data”. You can also write to contact@neuravid.com. We reply within 30 days.","You can also contact the data protection authority of your country."]},{"id":"securite","t":"Security","p":["Exchanges between the app and our servers go through encrypted connections.","Moderation decisions are recorded in a log protected against changes.","No system is perfect. If there is a data breach that concerns you, we will inform you as the law requires."]},{"id":"transferts","t":"Transfers to other countries","p":["TENAGON GROUP, LLC is in the United States. Your data may be processed in a country other than yours, including the United States, with the protections required by law."]},{"id":"vente","t":"We do not sell your data","p":["We do not sell your personal data.","The providers who help us (hosting, payment, identity verification) receive only what is necessary for their task."]},{"id":"contact","t":"Changes and contact","p":["When this policy changes, we show you what changes and ask you to read it again.","If there is any difference between languages, the French version prevails.","For any question: contact@neuravid.com."]}]},"regles":{"titre":"Community Guidelines","chapeau":"NEURAVID brings together people from all over the world. These guidelines protect everyone. They apply everywhere: videos, lives, comments, messages and challenges.","changements":["First version of this text."],"sections":[{"id":"respect","t":"Respect","p":["Respect people, their cultures, their languages and their beliefs. Criticise a work, never a person."]},{"id":"harcelement","t":"No harassment","p":["No threats, repeated insults, humiliation, group mockery or sharing of someone's private information."]},{"id":"haine","t":"No hate","p":["No attacks on a person or a group because of their origin, nationality, religion, sex, disability or any other part of their identity."]},{"id":"violence","t":"No violence or danger","p":["No calls to violence, no dangerous challenges, no encouragement to self-harm.","If someone is in danger, first call the emergency services of your country, then report the content."]},{"id":"sexuel","t":"No sexual content","p":["No nudity or sexual content.","Anything that sexualises or endangers a minor is forbidden, without exception. The content is hidden at once, the account is reviewed as a priority and may be closed, and the facts are reported to the authorities when the law provides for it."]},{"id":"arnaques","t":"No scams","p":["No false promises of money, fake contests, requests for passwords or codes, or misleading sales."]},{"id":"engagement","t":"No fake engagement","p":["No bots, bought votes, multiple accounts to vote, or gifts going round in circles to inflate numbers."]},{"id":"usurpation","t":"No impersonation","p":["Do not pretend to be another person, a brand or NEURAVID. Do not use another person's photo as your own."]},{"id":"verite","t":"Truth","p":["Modified or synthetic content must stay labelled as such. Do not present it as real.","Do not make a real person say or do something they did not say or do, without their consent."]},{"id":"defis","t":"Fair challenges","p":["Follow the published rules of each challenge. Do not vote for yourself. Do not cheat on an entry. Respect the work of others, winners and losers alike."]},{"id":"manquement","t":"What happens if the rules are broken","p":["Depending on how serious it is: extra verification, content hidden or removed, limitation, suspension, ban.","Limitation, suspension and ban are decided by a person, and each decision is explained."]},{"id":"signaler","t":"How to report","p":["Tap “Report” on a video, a live, a message or a profile, then choose the reason.","The person reported does not know who reported them."]},{"id":"recours","t":"How to appeal","p":["If you think a decision is a mistake, contest it within 30 days from “My decisions and appeals” in L'Empreinte, or with “Contest”.","A different person from the one who decided reviews your appeal."]}]}}</script>
<script type="application/json" id="nvDocs-es">{"cgu":{"titre":"Condiciones generales de uso","chapeau":"Estas condiciones explican las reglas de NEURAVID: lo que usted puede hacer aquí, lo que hacemos nosotros y lo que ocurre si hay un problema. Están escritas en frases sencillas.","changements":["Primera versión de este texto."],"sections":[{"id":"editeur","t":"Quiénes somos","p":["NEURAVID es un servicio de TENAGON GROUP, LLC, una sociedad creada en los Estados Unidos.","En estas condiciones, «nosotros» significa NEURAVID y TENAGON GROUP, LLC. «Usted» significa la persona que utiliza NEURAVID.","Para escribirnos: contact@neuravid.com."]},{"id":"acceptation","t":"Aceptar estas condiciones","p":["Para crear una cuenta, debe aceptar estas condiciones, leer la Política de privacidad y aceptar las Normas de la comunidad. Son tres acuerdos separados.","Cuando uno de estos textos cambia, le mostramos lo que cambia y le pedimos que lo acepte de nuevo antes de continuar.","Guardamos la constancia de cada acuerdo: el texto, su versión, la fecha y el idioma en que se mostró."]},{"id":"ages","t":"Las edades","p":["No hay cuenta de NEURAVID antes de los 13 años.","• Desde los 13 años: usar NEURAVID, ver vídeos y crearlos, ver los directos y escribir en su chat, participar en los retos.","• Desde los 16 años: presentar un directo, subir al escenario en un directo, cocrear con otros creadores.","• Desde los 18 años: el dinero (regalos de pago, compras, ganancias y retiros), Miss & Master, las citas de Love Universe y las llamadas de Palabre.","Los directos marcados «público adulto» solo se muestran a partir de los 16 años.","De los 13 a los 17 años se aplican protecciones reforzadas. Se describen en la Política de privacidad.","La edad que declara debe ser verdadera. NEURAVID puede pedirle que la verifique. Si la edad declarada es falsa, el acceso a algunas funciones puede limitarse."]},{"id":"compte","t":"Su cuenta y su seguridad","p":["Dé información exacta y manténgala al día.","Mantenga su contraseña en secreto. Active la verificación en dos pasos cuando se le proponga.","Si cree que alguien usa su cuenta, cambie su contraseña y avísenos enseguida.","Usted es responsable de lo que se hace con su cuenta, salvo si alguien la usó sin su permiso."]},{"id":"contenus","t":"Sus contenidos","p":["Usted sigue siendo el autor de lo que publica: vídeos, sonidos, fotos, textos.","Para que NEURAVID funcione, nos da el derecho, gratuito y para todo el mundo, de alojar, copiar, mostrar y difundir sus contenidos, y de adaptarlos técnicamente (formatos, calidad, subtítulos). Este derecho termina cuando usted elimina un contenido, tras el plazo técnico necesario, salvo si la ley nos obliga a conservarlo.","Otras personas pueden reutilizar sus sonidos o hacer un dúo con sus vídeos solo si su configuración lo permite.","Un contenido modificado o sintético (voz generada, doblaje, decorado virtual, avatar, objeto borrado, retoque por el servidor) se indica a los espectadores como «contenido modificado». No oculte esta indicación.","Solo puede doblar o imitar su propia voz, con su consentimiento.","Para la música, debe tener derecho a usar cada sonido. Un sonido que viene de su teléfono le pide confirmarlo antes de publicar. Los sonidos de Le Griot vienen con sus condiciones de uso."]},{"id":"interdits","t":"Lo que está prohibido","p":["Las Normas de la comunidad forman parte de estas condiciones. Está prohibido en particular:","• poner en peligro, explotar o sexualizar a menores;","• acosar, amenazar, incitar al odio o a la violencia;","• publicar contenidos sexuales o ilegales;","• estafar, engañar sobre el dinero o vender servicios falsos;","• fabricar interacción falsa: robots, votos comprados, cuentas múltiples, regalos que dan vueltas en círculo;","• hacerse pasar por otra persona;","• eludir la seguridad de NEURAVID o recopilar los datos de otras personas."]},{"id":"moderation","t":"La moderación","p":["El Escudo de NEURAVID detecta automáticamente señales de fraude o de peligro. Por sí solo, solo puede pedir una verificación adicional.","Un contenido denunciado como peligro para la vida o como explotación de menores se oculta de inmediato, a la espera del examen de una persona.","Las sanciones son graduales: verificación adicional, limitación, suspensión, expulsión. La limitación, la suspensión y la expulsión siempre las decide una persona. Una expulsión debe confirmarla una segunda persona.","Cada decisión se le explica con un motivo."]},{"id":"recours","t":"El recurso","p":["Puede impugnar una decisión de moderación en un plazo de 30 días, una vez por decisión, desde «Mis decisiones y recursos» en L'Empreinte, o con «Impugnar».","Su recurso lo examina una persona distinta de la que decidió.","Si se acepta su recurso, la decisión se anula y su contenido vuelve a ser visible."]},{"id":"hvs","t":"El HVS","p":["El HVS mide el valor de una contribución: una obra, una participación, un comentario útil, una ayuda, una denuncia verificada. Nunca mide el valor de una persona.","NEURAVID no hace ninguna clasificación de personas con el HVS: ni total por persona, ni media, ni puesto.","Cada puntuación es explicable: muestra sus componentes, los números usados y la versión de la fórmula.","El autor de una contribución puede impugnar su puntuación. Una persona examina el recurso y motiva su decisión."]},{"id":"defis","t":"Los retos y las competiciones","p":["Cada reto tiene un reglamento publicado antes del inicio: las fechas, los criterios, la forma de votar y la forma de desempatar.","Cuando un sorteo desempata, es verificable: se calcula a partir de la huella del reglamento publicado.","Las naciones están en igualdad: ningún bono por nacionalidad, y cada voto cuenta como uno.","No se vota por uno mismo. Antes de los 18 años, una victoria da títulos e insignias, nunca dinero.","Un resultado puede impugnarse. Una persona examina la impugnación."]},{"id":"argent","t":"El dinero","p":["Todo lo que tiene que ver con el dinero está reservado a las personas de 18 años o más.","Los NVCoins comprados sirven para regalar. No se pueden retirar.","Una ganancia queda en espera durante un plazo de seguridad antes de poder retirarse. El plazo, las comisiones y el importe neto se muestran antes de cada retiro.","Para luchar contra el fraude, una ganancia o un retiro puede congelarse mientras una persona lo examina. Una congelación nunca es una confiscación: el dinero sigue siendo suyo mientras una persona no haya decidido, con un motivo. Puede impugnar esta decisión.","Los medios de pago dependen de su país. Puede pedirse una verificación de identidad para retirar dinero."]},{"id":"fin","t":"Suspender o eliminar una cuenta","p":["Puede desactivar su cuenta o eliminarla en Configuración y privacidad. La eliminación deja 30 días de reflexión antes de ser definitiva.","Antes de irse, puede pedir una copia de sus datos.","NEURAVID puede suspender o cerrar una cuenta que incumpla estas condiciones, según las reglas de la moderación, con derecho a recurso."]},{"id":"responsabilite","t":"Nuestra responsabilidad","p":["Hacemos todo lo posible para que NEURAVID funcione bien y siga siendo seguro. No podemos prometer que nunca habrá interrupciones ni errores.","Cada persona es responsable de lo que publica. Cuando se nos denuncia un contenido prohibido, actuamos.","Nada en estas condiciones le quita los derechos que le da la ley de su país."]},{"id":"changements","t":"Los cambios de estas condiciones","p":["Cada versión lleva un número y una fecha.","Cuando estas condiciones cambian, le mostramos un resumen de lo que cambia y le pedimos que las acepte de nuevo.","Si no acepta una nueva versión, puede pedir una copia de sus datos y eliminar su cuenta."]},{"id":"loi","t":"La ley aplicable y el contacto","p":["Estas condiciones se rigen por el derecho aplicable en la sede de TENAGON GROUP, LLC, en los Estados Unidos, sin privarle de la protección que le da la ley de su país de residencia.","Estas condiciones existen en varios idiomas. En caso de diferencia, prevalece la versión francesa.","Para cualquier pregunta: contact@neuravid.com."]}]},"confidentialite":{"titre":"Política de privacidad","chapeau":"Esta política explica qué datos utiliza NEURAVID, por qué, qué se queda en su teléfono y cómo mantiene usted el control.","changements":["Primera versión de este texto."],"sections":[{"id":"responsable","t":"Quién es responsable","p":["Sus datos los trata TENAGON GROUP, LLC, una sociedad creada en los Estados Unidos, para hacer funcionar NEURAVID.","Para escribirnos: contact@neuravid.com."]},{"id":"donnees","t":"Los datos que usamos y por qué","p":["• Su cuenta (seudónimo, nombre, medio de acceso, idioma, país): para crear su cuenta y protegerla.","• Su fecha de nacimiento: para aplicar las edades de NEURAVID y proteger a los menores.","• Su país y sus idiomas: para mostrarle vídeos en sus idiomas y los retos de su país.","• Sus contenidos (vídeos, sonidos, comentarios, mensajes): para publicarlos o transmitirlos, según sus elecciones.","• Sus señales de visionado (la parte vista, un vídeo saltado o vuelto a ver, sus reacciones): para recomendarle vídeos. Puede dejar de guardar su historial y borrarlo.","• El HVS: sus contribuciones y las opiniones recibidas, para calcular la puntuación de cada contribución.","• La calidad de reproducción en Iris, el reproductor: con las señales de visionado, el teléfono envía también el tiempo antes de la primera imagen y el número de cortes. Estos números solo sirven para supervisar y mejorar el servicio. Nunca van a su perfil ni a sus recomendaciones.","• «Ayudar al presentador» en Le Direct: el nivel del sonido y la calidad de la red que recibe su teléfono solo se envían si usted lo activa (desactivado por defecto, en «La calidad»). Nunca el sonido ni la imagen.","• Su ubicación: solo si la autoriza, y redondeada en el teléfono al barrio o a la ciudad antes de enviarse. Antes de los 18 años, solo la ciudad.","• El dinero (a partir de los 18 años): sus operaciones y el nivel de verificación de su identidad. No guardamos ni el número de su documento de identidad ni su foto.","• La seguridad: sus dispositivos conectados y sus inicios de sesión recientes. Para luchar contra el fraude, la dirección de red y el dispositivo se transforman en huella antes de guardarse.","• Sus denuncias y las decisiones de moderación: para proteger a la comunidad y permitir los recursos."]},{"id":"telephone","t":"Lo que se queda en su teléfono","p":["La cámara, la belleza, el seguimiento de la cara y la eliminación del ruido de fondo se calculan en su teléfono. Estas imágenes y medidas no se envían.","Sus borradores, tomas y escenas se quedan en su teléfono mientras no publique."]},{"id":"accord","t":"Lo que va al servidor solo con su consentimiento","p":["Algunos tratamientos pesados se hacen en nuestros servidores: estabilizar, ampliar, crear subtítulos automáticos, doblar una voz, generar un efecto. NEURAVID le pide su consentimiento antes de enviar nada.","Para un efecto generado a partir de una frase, solo se envía la frase: ninguna imagen y ningún sonido.","El dictado y los comandos de voz usan el servicio de reconocimiento de su teléfono. Este servicio puede enviar su voz a su proveedor. La pantalla le avisa antes."]},{"id":"mineurs","t":"La protección de los menores","p":["De los 13 a los 17 años, estas protecciones se aplican y no se pueden quitar:","• la cuenta es privada;","• los demás no pueden descargar los vídeos;","• la ciudad no se muestra y la cuenta no se propone a desconocidos;","• los mensajes de desconocidos se apartan;","• sin anuncios personalizados;","• sin llamadas con una cuenta menor, y sin dinero.","Un adulto que escribe a varios menores que no conoce es examinado por una persona de la moderación.","Un padre o una madre puede acompañar a un adolescente con un código. Ve el tiempo pasado y las protecciones, nunca los mensajes ni lo que el adolescente mira."]},{"id":"conservation","t":"Cuánto tiempo guardamos sus datos","p":["• Su cuenta: mientras exista. Tras una solicitud de eliminación, 30 días de reflexión y después borrado en los 90 días siguientes, copias de seguridad incluidas.","• Su historial de visionado: hasta que lo borre o deje de guardarlo. Las marcas anónimas que impiden contar dos veces la misma vista se borran a los 30 días.","• Las denuncias y las decisiones de moderación: 1 año después de la decisión, o más si la ley lo exige.","• La constancia de sus acuerdos a estos textos: mientras exista su cuenta, y después 5 años.","• Las operaciones de dinero: el plazo exigido por la ley contable.","• Las huellas de seguridad: 12 meses.","• Una ubicación compartida: se borra cuando termina el uso compartido."]},{"id":"droits","t":"Sus derechos","p":["En cualquier momento puede:","• ver sus datos y pedir una copia;","• corregir su información;","• borrar sus historiales o eliminar su cuenta;","• rechazar las recomendaciones y los anuncios personalizados;","• retirar un consentimiento que haya dado.","Todo esto se hace en Configuración y privacidad, apartado «Mis datos». También puede escribir a contact@neuravid.com. Respondemos en un plazo de 30 días.","También puede dirigirse a la autoridad de protección de datos de su país."]},{"id":"securite","t":"La seguridad","p":["Los intercambios entre la aplicación y nuestros servidores pasan por conexiones cifradas.","Las decisiones de moderación se inscriben en un registro protegido contra modificaciones.","Ningún sistema es perfecto. En caso de fuga de datos que le afecte, se lo comunicaremos como prevé la ley."]},{"id":"transferts","t":"Las transferencias a otros países","p":["TENAGON GROUP, LLC está en los Estados Unidos. Sus datos pueden tratarse en un país distinto del suyo, entre ellos los Estados Unidos, con las protecciones exigidas por la ley."]},{"id":"vente","t":"No vendemos sus datos","p":["No vendemos sus datos personales.","Los proveedores que nos ayudan (alojamiento, pago, verificación de identidad) solo reciben lo necesario para su tarea."]},{"id":"contact","t":"Los cambios y el contacto","p":["Cuando esta política cambia, le mostramos lo que cambia y le pedimos que la vuelva a leer.","En caso de diferencia entre idiomas, prevalece la versión francesa.","Para cualquier pregunta: contact@neuravid.com."]}]},"regles":{"titre":"Normas de la comunidad","chapeau":"NEURAVID reúne a personas de todo el mundo. Estas normas protegen a cada uno. Se aplican en todas partes: vídeos, directos, comentarios, mensajes y retos.","changements":["Primera versión de este texto."],"sections":[{"id":"respect","t":"El respeto","p":["Respete a las personas, sus culturas, sus idiomas y sus creencias. Critique una obra, nunca a una persona."]},{"id":"harcelement","t":"Nada de acoso","p":["Nada de amenazas, insultos repetidos, humillaciones, burlas en grupo ni difusión de información privada sobre alguien."]},{"id":"haine","t":"Nada de odio","p":["Ningún ataque contra una persona o un grupo por su origen, su nacionalidad, su religión, su sexo, su discapacidad o cualquier otra parte de su identidad."]},{"id":"violence","t":"Nada de violencia ni de peligro","p":["Ningún llamamiento a la violencia, ningún reto peligroso, ningún estímulo para hacerse daño.","Si alguien está en peligro, llame primero a los servicios de emergencia de su país y después denuncie el contenido."]},{"id":"sexuel","t":"Nada de contenido sexual","p":["Nada de desnudos ni de contenido sexual.","Todo lo que sexualiza o pone en peligro a un menor está prohibido, sin excepción. El contenido se oculta de inmediato, la cuenta se examina con prioridad y puede cerrarse, y los hechos se comunican a las autoridades cuando la ley lo prevé."]},{"id":"arnaques","t":"Nada de estafas","p":["Nada de falsas promesas de dinero, concursos falsos, peticiones de contraseñas o códigos, ni ventas engañosas."]},{"id":"engagement","t":"Nada de interacción falsa","p":["Nada de robots, votos comprados, cuentas múltiples para votar, ni regalos que dan vueltas en círculo para inflar las cifras."]},{"id":"usurpation","t":"Nada de suplantación","p":["No se haga pasar por otra persona, una marca o NEURAVID. No use la foto de otra persona como si fuera suya."]},{"id":"verite","t":"La verdad","p":["Un contenido modificado o sintético debe seguir indicado como tal. No lo presente como real.","No haga decir o hacer a una persona real lo que no ha dicho o hecho, sin su consentimiento."]},{"id":"defis","t":"Retos leales","p":["Respete el reglamento publicado de cada reto. No vote por sí mismo. No haga trampa en una participación. Reconozca el trabajo de los demás, ganadores y perdedores."]},{"id":"manquement","t":"Lo que pasa en caso de incumplimiento","p":["Según la gravedad: verificación adicional, contenido ocultado o retirado, limitación, suspensión, expulsión.","La limitación, la suspensión y la expulsión las decide una persona, y cada decisión se explica."]},{"id":"signaler","t":"Cómo denunciar","p":["Toque «Denunciar» en un vídeo, un directo, un mensaje o un perfil y elija el motivo.","La persona denunciada no sabe quién la ha denunciado."]},{"id":"recours","t":"Cómo presentar un recurso","p":["Si cree que una decisión es un error, impúgnela en un plazo de 30 días desde «Mis decisiones y recursos» en L'Empreinte, o con «Impugnar».","Una persona distinta de la que decidió examina su recurso."]}]}}</script>
<script type="application/json" id="nvDocs-pt">{"cgu":{"titre":"Condições gerais de utilização","chapeau":"Estas condições explicam as regras da NEURAVID: o que pode fazer aqui, o que nós fazemos e o que acontece em caso de problema. Estão escritas em frases simples.","changements":["Primeira versão deste texto."],"sections":[{"id":"editeur","t":"Quem somos","p":["A NEURAVID é um serviço da TENAGON GROUP, LLC, uma sociedade criada nos Estados Unidos.","Nestas condições, «nós» designa a NEURAVID e a TENAGON GROUP, LLC. «Você» designa a pessoa que utiliza a NEURAVID.","Para nos escrever: contact@neuravid.com."]},{"id":"acceptation","t":"Aceitar estas condições","p":["Para criar uma conta, tem de aceitar estas condições, ler a Política de privacidade e aceitar as Regras da comunidade. São três acordos separados.","Quando um destes textos muda, mostramos-lhe o que muda e pedimos-lhe que o aceite novamente antes de continuar.","Guardamos o registo de cada acordo: o texto, a sua versão, a data e a língua de apresentação."]},{"id":"ages","t":"As idades","p":["Não há conta NEURAVID antes dos 13 anos.","• A partir dos 13 anos: utilizar a NEURAVID, ver e criar vídeos, ver os diretos e escrever na conversa, participar nos desafios.","• A partir dos 16 anos: apresentar um direto, subir ao palco num direto, cocriar com outros criadores.","• A partir dos 18 anos: o dinheiro (presentes pagos, compras, ganhos e levantamentos), Miss & Master, os encontros do Love Universe e as chamadas da Palabre.","Os diretos marcados «público adulto» só são mostrados a partir dos 16 anos.","Dos 13 aos 17 anos, aplicam-se proteções reforçadas. Estão descritas na Política de privacidade.","A idade que declara tem de ser verdadeira. A NEURAVID pode pedir-lhe que a verifique. Se a idade declarada for falsa, o acesso a algumas funções pode ser limitado."]},{"id":"compte","t":"A sua conta e a sua segurança","p":["Dê informações exatas e mantenha-as atualizadas.","Mantenha a sua palavra-passe secreta. Ative a verificação em dois passos quando lhe for proposta.","Se pensa que alguém utiliza a sua conta, mude a palavra-passe e avise-nos de imediato.","É responsável pelo que é feito com a sua conta, exceto se alguém a utilizou sem o seu acordo."]},{"id":"contenus","t":"Os seus conteúdos","p":["Continua a ser o autor do que publica: vídeos, sons, fotos, textos.","Para fazer funcionar a NEURAVID, dá-nos o direito, gratuito e para o mundo inteiro, de alojar, copiar, mostrar e difundir os seus conteúdos, e de os adaptar tecnicamente (formatos, qualidade, legendas). Este direito termina quando apaga um conteúdo, após o prazo técnico necessário, salvo se a lei nos obrigar a guardá-lo.","Outras pessoas só podem reutilizar os seus sons ou fazer um dueto com os seus vídeos se as suas definições o permitirem.","Um conteúdo modificado ou sintético (voz gerada, dobragem, cenário virtual, avatar, objeto apagado, retoque pelo servidor) é indicado aos espectadores como «conteúdo modificado». Não esconda esta indicação.","Só pode dobrar ou imitar a sua própria voz, com o seu consentimento.","Para a música, tem de ter o direito de utilizar cada som. Um som vindo do seu telemóvel pede-lhe que o confirme antes de publicar. Os sons do Le Griot vêm com as suas condições de utilização."]},{"id":"interdits","t":"O que é proibido","p":["As Regras da comunidade fazem parte destas condições. É proibido nomeadamente:","• pôr em perigo, explorar ou sexualizar menores;","• assediar, ameaçar, incitar ao ódio ou à violência;","• publicar conteúdos sexuais ou ilegais;","• burlar, enganar sobre dinheiro ou vender falsos serviços;","• fabricar falso envolvimento: robôs, votos comprados, contas múltiplas, presentes que andam em círculo;","• fazer-se passar por outra pessoa;","• contornar a segurança da NEURAVID ou recolher os dados de outras pessoas."]},{"id":"moderation","t":"A moderação","p":["O Escudo da NEURAVID deteta automaticamente sinais de fraude ou de perigo. Sozinho, só pode pedir uma verificação adicional.","Um conteúdo denunciado como perigo para a vida ou como exploração de menores é ocultado de imediato, à espera do exame de uma pessoa.","As sanções são graduais: verificação adicional, limitação, suspensão, banimento. A limitação, a suspensão e o banimento são sempre decididos por uma pessoa. Um banimento tem de ser confirmado por uma segunda pessoa.","Cada decisão é-lhe explicada com um motivo."]},{"id":"recours","t":"O recurso","p":["Pode contestar uma decisão de moderação no prazo de 30 dias, uma vez por decisão, a partir de «As minhas decisões e recursos» em L'Empreinte, ou com «Contestar».","O seu recurso é examinado por uma pessoa diferente da que decidiu.","Se o seu recurso for aceite, a decisão é anulada e o seu conteúdo volta a ficar visível."]},{"id":"hvs","t":"O HVS","p":["O HVS mede o valor de uma contribuição: uma obra, uma participação, um comentário útil, uma ajuda, uma denúncia verificada. Nunca mede o valor de uma pessoa.","A NEURAVID não faz nenhuma classificação de pessoas com o HVS: nem total por pessoa, nem média, nem posição.","Cada pontuação é explicável: mostra as suas componentes, os números utilizados e a versão da fórmula.","O autor de uma contribuição pode contestar a sua pontuação. Uma pessoa examina o recurso e fundamenta a decisão."]},{"id":"defis","t":"Os desafios e as competições","p":["Cada desafio tem um regulamento publicado antes do início: as datas, os critérios, a forma de votar e a forma de desempatar.","Quando um sorteio desempata, é verificável: é calculado a partir da impressão digital do regulamento publicado.","As nações estão em igualdade: nenhum bónus de nacionalidade, e cada voto conta como um.","Não se vota em si próprio. Antes dos 18 anos, uma vitória dá títulos e distintivos, nunca dinheiro.","Um resultado pode ser contestado. Uma pessoa examina a contestação."]},{"id":"argent","t":"O dinheiro","p":["Tudo o que envolve dinheiro está reservado às pessoas com 18 anos ou mais.","Os NVCoins comprados servem para oferecer presentes. Não podem ser levantados.","Um ganho fica em espera durante um prazo de segurança antes de poder ser levantado. O prazo, as taxas e o montante líquido são mostrados antes de cada levantamento.","Para combater a fraude, um ganho ou um levantamento pode ser congelado enquanto uma pessoa o examina. Um congelamento nunca é um confisco: o dinheiro continua a ser seu enquanto uma pessoa não tiver decidido, com um motivo. Pode contestar essa decisão.","Os meios de pagamento dependem do seu país. Pode ser pedida uma verificação de identidade para levantar dinheiro."]},{"id":"fin","t":"Suspender ou apagar uma conta","p":["Pode desativar a sua conta ou apagá-la em Definições e privacidade. O apagamento deixa 30 dias de reflexão antes de ser definitivo.","Antes de sair, pode pedir uma cópia dos seus dados.","A NEURAVID pode suspender ou fechar uma conta que viole estas condições, segundo as regras da moderação, com direito de recurso."]},{"id":"responsabilite","t":"A nossa responsabilidade","p":["Fazemos o nosso melhor para que a NEURAVID funcione bem e continue segura. Não podemos prometer que nunca haverá interrupções nem erros.","Cada pessoa é responsável pelo que publica. Quando nos denunciam um conteúdo proibido, agimos.","Nada nestas condições lhe retira os direitos que a lei do seu país lhe dá."]},{"id":"changements","t":"As alterações destas condições","p":["Cada versão tem um número e uma data.","Quando estas condições mudam, mostramos-lhe um resumo do que muda e pedimos-lhe que as aceite novamente.","Se não aceitar uma nova versão, pode pedir uma cópia dos seus dados e apagar a sua conta."]},{"id":"loi","t":"A lei aplicável e o contacto","p":["Estas condições regem-se pelo direito aplicável na sede da TENAGON GROUP, LLC, nos Estados Unidos, sem o privar da proteção que lhe dá a lei do seu país de residência.","Estas condições existem em várias línguas. Em caso de diferença, prevalece a versão francesa.","Para qualquer pergunta: contact@neuravid.com."]}]},"confidentialite":{"titre":"Política de privacidade","chapeau":"Esta política explica que dados a NEURAVID utiliza, porquê, o que fica no seu telemóvel e como mantém o controlo.","changements":["Primeira versão deste texto."],"sections":[{"id":"responsable","t":"Quem é responsável","p":["Os seus dados são tratados pela TENAGON GROUP, LLC, uma sociedade criada nos Estados Unidos, para fazer funcionar a NEURAVID.","Para nos escrever: contact@neuravid.com."]},{"id":"donnees","t":"Os dados que utilizamos, e porquê","p":["• A sua conta (pseudónimo, nome, meio de acesso, língua, país): para criar a sua conta e protegê-la.","• A sua data de nascimento: para aplicar as idades da NEURAVID e proteger os menores.","• O seu país e as suas línguas: para lhe mostrar vídeos nas suas línguas e os desafios do seu país.","• Os seus conteúdos (vídeos, sons, comentários, mensagens): para os publicar ou transmitir, segundo as suas escolhas.","• Os seus sinais de visualização (a parte vista, um vídeo saltado ou revisto, as suas reações): para lhe recomendar vídeos. Pode deixar de guardar o seu histórico e apagá-lo.","• O HVS: as suas contribuições e as opiniões recebidas, para calcular a pontuação de cada contribuição.","• A qualidade de leitura no Iris, o leitor: com os sinais de visualização, o telemóvel envia também o tempo antes da primeira imagem e o número de interrupções. Estes números servem apenas para vigiar e melhorar o serviço. Nunca vão para o seu perfil nem para as suas recomendações.","• «Ajudar o apresentador» no Le Direct: o nível do som e a qualidade da rede que o seu telemóvel recebe só são enviados se o ativar (desligado por predefinição, em «A qualidade»). Nunca o som nem a imagem.","• A sua localização: apenas se a autorizar, e arredondada no telemóvel ao bairro ou à cidade antes de ser enviada. Antes dos 18 anos, apenas a cidade.","• O dinheiro (a partir dos 18 anos): as suas operações e o nível de verificação da sua identidade. Não guardamos o número do seu documento de identidade nem a sua foto.","• A segurança: os seus dispositivos ligados e os seus inícios de sessão recentes. Para combater a fraude, o endereço de rede e o dispositivo são transformados em impressão digital antes de serem guardados.","• As suas denúncias e as decisões de moderação: para proteger a comunidade e permitir os recursos."]},{"id":"telephone","t":"O que fica no seu telemóvel","p":["A câmara, a beleza, o seguimento do rosto e a remoção do ruído de fundo são calculados no seu telemóvel. Estas imagens e medidas não são enviadas.","Os seus rascunhos, tomadas e cenas ficam no seu telemóvel enquanto não publicar."]},{"id":"accord","t":"O que vai para o servidor apenas com o seu acordo","p":["Alguns tratamentos pesados são feitos nos nossos servidores: estabilizar, ampliar, criar legendas automáticas, dobrar uma voz, gerar um efeito. A NEURAVID pede o seu acordo antes de enviar o que quer que seja.","Para um efeito gerado a partir de uma frase, só a frase é enviada: nenhuma imagem e nenhum som.","O ditado e os comandos de voz utilizam o serviço de reconhecimento do seu telemóvel. Este serviço pode enviar a sua voz ao seu fornecedor. O ecrã avisa-o antes."]},{"id":"mineurs","t":"A proteção dos menores","p":["Dos 13 aos 17 anos, estas proteções aplicam-se e não podem ser retiradas:","• a conta é privada;","• os vídeos não podem ser descarregados por outros;","• a cidade não é mostrada e a conta não é sugerida a desconhecidos;","• as mensagens de desconhecidos são postas de lado;","• sem anúncios personalizados;","• sem chamadas com uma conta de menor, e sem dinheiro.","Um adulto que escreve a vários menores que não conhece é examinado por uma pessoa da moderação.","Um pai ou uma mãe pode acompanhar um adolescente com um código. Vê o tempo passado e as proteções, nunca as mensagens nem o que o adolescente vê."]},{"id":"conservation","t":"Durante quanto tempo guardamos os seus dados","p":["• A sua conta: enquanto existir. Após um pedido de apagamento, 30 dias de reflexão e depois apagamento nos 90 dias seguintes, cópias de segurança incluídas.","• O seu histórico de visualização: até o apagar ou deixar de o guardar. As marcas anónimas que impedem contar duas vezes a mesma visualização são apagadas após 30 dias.","• As denúncias e as decisões de moderação: 1 ano após a decisão, ou mais se a lei o exigir.","• O registo dos seus acordos a estes textos: enquanto a sua conta existir, e depois 5 anos.","• As operações de dinheiro: o prazo exigido pela lei contabilística.","• As impressões digitais de segurança: 12 meses.","• Uma localização partilhada: apagada quando a partilha termina."]},{"id":"droits","t":"Os seus direitos","p":["Pode a qualquer momento:","• ver os seus dados e pedir uma cópia;","• corrigir as suas informações;","• apagar os seus históricos ou apagar a sua conta;","• recusar as recomendações e os anúncios personalizados;","• retirar um consentimento que tenha dado.","Tudo isto faz-se em Definições e privacidade, secção «Os meus dados». Também pode escrever para contact@neuravid.com. Respondemos no prazo de 30 dias.","Também pode dirigir-se à autoridade de proteção de dados do seu país."]},{"id":"securite","t":"A segurança","p":["As trocas entre a aplicação e os nossos servidores passam por ligações cifradas.","As decisões de moderação são inscritas num registo protegido contra alterações.","Nenhum sistema é perfeito. Em caso de fuga de dados que lhe diga respeito, avisamo-lo como a lei prevê."]},{"id":"transferts","t":"As transferências para outros países","p":["A TENAGON GROUP, LLC está nos Estados Unidos. Os seus dados podem ser tratados num país diferente do seu, incluindo os Estados Unidos, com as proteções exigidas pela lei."]},{"id":"vente","t":"Não vendemos os seus dados","p":["Não vendemos os seus dados pessoais.","Os prestadores que nos ajudam (alojamento, pagamento, verificação de identidade) recebem apenas o necessário à sua missão."]},{"id":"contact","t":"As alterações e o contacto","p":["Quando esta política muda, mostramos-lhe o que muda e pedimos-lhe que a releia.","Em caso de diferença entre as línguas, prevalece a versão francesa.","Para qualquer pergunta: contact@neuravid.com."]}]},"regles":{"titre":"Regras da comunidade","chapeau":"A NEURAVID reúne pessoas do mundo inteiro. Estas regras protegem cada um. Aplicam-se em todo o lado: vídeos, diretos, comentários, mensagens e desafios.","changements":["Primeira versão deste texto."],"sections":[{"id":"respect","t":"O respeito","p":["Respeite as pessoas, as suas culturas, as suas línguas e as suas crenças. Critique uma obra, nunca uma pessoa."]},{"id":"harcelement","t":"Nada de assédio","p":["Nada de ameaças, insultos repetidos, humilhações, troça em grupo nem divulgação de informações privadas sobre alguém."]},{"id":"haine","t":"Nada de ódio","p":["Nenhum ataque contra uma pessoa ou um grupo pela sua origem, nacionalidade, religião, sexo, deficiência ou qualquer outra parte da sua identidade."]},{"id":"violence","t":"Nada de violência nem de perigo","p":["Nenhum apelo à violência, nenhum desafio perigoso, nenhum incentivo a fazer mal a si próprio.","Se alguém estiver em perigo, ligue primeiro para os serviços de emergência do seu país e depois denuncie o conteúdo."]},{"id":"sexuel","t":"Nada de conteúdo sexual","p":["Nada de nudez nem de conteúdo sexual.","Tudo o que sexualiza ou põe em perigo um menor é proibido, sem exceção. O conteúdo é ocultado de imediato, a conta é examinada com prioridade e pode ser fechada, e os factos são comunicados às autoridades quando a lei o prevê."]},{"id":"arnaques","t":"Nada de burlas","p":["Nada de falsas promessas de dinheiro, falsos concursos, pedidos de palavras-passe ou códigos, nem vendas enganosas."]},{"id":"engagement","t":"Nada de falso envolvimento","p":["Nada de robôs, votos comprados, contas múltiplas para votar, nem presentes que andam em círculo para inflacionar números."]},{"id":"usurpation","t":"Nada de usurpação","p":["Não se faça p
