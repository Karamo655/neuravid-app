.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:.88rem;color:var(--brume)}
input,textarea{font:inherit;color:var(--craie);background:var(--alv);border:1px solid var(--trait);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.btn-or{background:linear-gradient(135deg,var(--or),#ff9f1c);color:#2a1a00;border:0;font-weight:800}


select.plein{width:100%;min-height:44px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;margin:0 0 10px}
.cats button{flex:0 0 auto;min-height:40px;font-size:.86rem;clip-path:var(--hex);border-radius:0;padding:4px 18px}
.cats button[aria-pressed="true"]{background:var(--or);color:#2a1a00;font-weight:800}
.cercle{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--trait)}
.cercle:first-of-type{border-top:0}
.hexd{width:54px;height:48px;clip-path:var(--hex);display:grid;place-items:center;text-align:center;font-size:.7rem;line-height:1.1;font-weight:800;background:linear-gradient(135deg,#6c2bd9,var(--rose));color:var(--craie)}
.hexd b{display:block;font-size:1rem}
.cercle h3{margin:0 0 3px;font-size:1rem}
.cercle h3 button{all:unset;cursor:pointer;color:var(--craie);font-weight:700}
.cercle h3 button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.puce.di{color:#fff;background:var(--rouge);border-color:var(--rouge)}
.puce.ad{color:var(--argent)}
.ainee{padding:10px 0;border-top:1px solid var(--trait)}
.ainee:first-of-type{border-top:0}
.ainee p{margin:4px 0}
.cases{display:flex;flex-wrap:wrap;gap:6px}
.cases label{display:flex;flex-direction:row;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--trait);border-radius:999px;color:var(--craie);min-height:40px}
.cases input{width:20px;min-height:20px;height:20px}
.question{display:grid;gap:6px;padding:8px 0;border-top:1px solid var(--trait)}
.question:first-child{border-top:0}
.question .actions{margin:0}
.vise{outline:2px solid var(--or);outline-offset:4px;border-radius:12px}
.astuce{margin:0 0 8px;padding:8px 10px;border-radius:10px;background:rgba(255,197,49,.1);border:1px solid rgba(255,197,49,.35)}
.retour{margin:0 0 10px}
.regle{font-size:.82rem;color:var(--brume);margin:6px 0 0}

/* ══ Identité de la nouveauté (17 nov. 2026, étape 3 du plan des 8 nouveautés) : ses couleurs, son bandeau, ses cartes ══ */
:root{--id1:#ffc531;--id2:#ff8a5c}
header{position:relative;padding-bottom:13px;margin-bottom:8px}
header::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--id1),var(--id2) 55%,transparent)}
[dir=rtl] header::after{background:linear-gradient(270deg,var(--id1),var(--id2) 55%,transparent)}
.hex{background:linear-gradient(135deg,var(--id1),var(--id2));box-shadow:0 0 18px color-mix(in srgb,var(--id1) 45%,transparent)}
h2::before{background:linear-gradient(135deg,var(--id1),var(--id2))}
section{background:linear-gradient(180deg,color-mix(in srgb,var(--id1) 8%,transparent),transparent 80px),var(--nuit2)}

/* le cercle des aînées : la date dans un hexagone chaud, le compte à rebours */
.hexd{background:linear-gradient(135deg,var(--id1),var(--id2));color:#2a1200}
.dans{display:inline-flex;align-items:center;gap:6px;margin:4px 0 0;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:800;color:var(--id1);background:color-mix(in srgb,var(--id1) 14%,transparent);border:1px solid color-mix(in srgb,var(--id1) 45%,transparent)}
.dans::before{content:"";width:9px;height:8px;clip-path:var(--hex);background:var(--id2)}
.dans.proche{color:#2a1200;background:linear-gradient(90deg,var(--id1),var(--id2));border-color:transparent}
.dans.proche::before{background:#2a1200}
.cats button[aria-pressed="true"]{background:linear-gradient(135deg,var(--id1),var(--id2));color:#2a1200}
/* « Le mot de l'aînée » (17 nov. 2026, étape 4) */
.mot{margin:10px 0 0;display:grid;gap:6px;justify-items:start}
.mot-v{width:min(220px,62vw);aspect-ratio:9/16;border-radius:14px;background:#000;display:block;box-shadow:0 0 0 2px color-mix(in srgb,var(--id1) 55%,transparent),0 0 24px color-mix(in srgb,var(--id2) 25%,transparent)}
.mot-apercu{display:grid;place-items:center;align-content:center;gap:10px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--id1) 35%,#000),#120a2a 70%);color:var(--or);font-size:.85rem}
.mot-hex{width:56px;height:50px;clip-path:var(--hex);background:linear-gradient(135deg,var(--id1),var(--id2))}
.mon-mot{border-color:color-mix(in srgb,var(--id1) 45%,transparent)}
.nv-cree{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:var(--or)}
.nv-cree i{width:11px;height:10px;clip-path:var(--hex);background:var(--or);display:inline-block}

<script>
/* ══ NV_CAMERA — EMBARQUÉ ════════════════════════════════════
   Embarqué, pas référencé : un module NEURAVID doit s'ouvrir
   seul depuis une URL file://, avec rien à côté. */
/* ═══════════════════════════════════════════════════════════════════
   NEURAVID — NV_CAMERA.js
   Le bouton « Filmer » d'un défi ouvre la caméra du Studio créatif.

   À embarquer dans les 16 modules de défi ET dans NV_MODULE_Create.html.

   ── POURQUOI ─────────────────────────────────────────────────────────
   Chaque défi a son propre enregistreur. Il fonctionne, il grave les
   filtres et le logo dans l'image — mais il s'arrête là. La caméra du
   Studio sait faire beaucoup plus, et elle existe déjà :

       double caméra (médaillon, haut/bas, gauche/droite)
       masques qui suivent le visage
       effets pluie, neige, étincelles
       filtres gravés dans l'image enregistrée
       photo, montage, galerie

   Une personne qui veut participer à un défi n'a aucune raison d'avoir
   moins d'outils que quelqu'un qui filme pour rien.

   ── LA DIFFICULTÉ RÉELLE ─────────────────────────────────────────────
   Le Studio est un AUTRE fichier. Changer de page perd tout : le
   contexte du défi, et surtout la vidéo elle-même — un Blob ne
   traverse pas une navigation.

   IndexedDB, si. C'est la seule voie, et Create s'en sert déjà pour
   son relais. On l'emprunte :

       1. le défi range son contexte et ouvre le Studio
       2. la personne filme avec tous les outils
       3. le Studio range la vidéo dans IndexedDB et revient au défi
       4. le défi la reprend et la présente comme sa propre prise

   ── CE QU'ON NE FAIT PAS ─────────────────────────────────────────────
   On ne copie pas la caméra du Studio dans les seize défis. Elle pèse
   plus de trois cents kilo-octets, et seize copies divergeraient au
   premier correctif — c'est exactement ce qui est arrivé à IA et Coach,
   qui affichaient deux scores différents pour la même vidéo.

   Et on ne supprime pas l'enregistreur existant : si le Studio est
   injoignable, il reprend la main. Une passerelle ne doit jamais
   devenir un point de rupture.
   ═══════════════════════════════════════════════════════════════════ */
(function (racine) {
  'use strict';
  if (racine.NVCamera) return;

  var BASE_DEFAUT = 'file:///android_asset/flutter_assets/assets/modules/';
  var CLE_CTX = 'nv_cam_ctx';
  var DB = 'nvcamera';
  var MAG = 'prises';

  function emit(type, charge) {
    try { if (typeof racine.NVemit === 'function') racine.NVemit(type, charge || {}); }
    catch (e) {}
  }
  function base() {
    var b = racine.NV_MODULES_BASE || BASE_DEFAUT;
    return b.slice(-1) === '/' ? b : b + '/';
  }

  /* ── LE COFFRE ────────────────────────────────────────────────────
     Une vidéo de quelques mégaoctets ne tient pas dans localStorage et
     ne survit pas à une navigation autrement. IndexedDB est le seul
     endroit où elle peut attendre. */
  function ouvrirBase() {
    return new Promise(function (res) {
      try { if (!racine.indexedDB) return res(null); } catch (e) { return res(null); }   /* stockage bloqué : l'accès lui-même peut lever une erreur */
      var r;
      try { r = racine.indexedDB.open(DB, 1); } catch (e) { return res(null); }
      r.onupgradeneeded = function () {
        try { r.result.createObjectStore(MAG); } catch (e) {}
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { res(null); };
      /* certains navigateurs ne répondent jamais (fichier ouvert en content://) */
      setTimeout(function () { res(null); }, 2000);
    });
  }
  function ranger(cle, valeur) {
    return ouvrirBase().then(function (db) {
      if (!db) return false;
      return new Promise(function (res) {
        try {
          var t = db.transaction(MAG, 'readwrite');
          t.objectStore(MAG).put(valeur, cle);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { res(false); };
        } catch (e) { res(false); }
      });
    });
  }
  function reprendre(cle) {
    return ouvrirBase().then(function (db) {
      if (!db) return null;
      return new Promise(function (res) {
        try {
          var t = db.transaction(MAG, 'readonly');
          var q = t.objectStore(MAG).get(cle);
          q.onsuccess = function () { res(q.result || null); };
          q.onerror = function () { res(null); };
        } catch (e) { res(null); }
      });
    });
  }
  function oublier(cle) {
    return ouvrirBase().then(function (db) {
      if (!db) return;
      try {
        var t = db.transaction(MAG, 'readwrite');
        t.objectStore(MAG).delete(cle);
      } catch (e) {}
    });
  }

  /* ── CÔTÉ DÉFI : partir vers le Studio ────────────────────────────── */
  function filmer(ctx) {
    ctx = ctx || {};
    ctx.module = ctx.module || racine.NV_MODULE_NAME || 'defi';
    ctx.quand = Date.now();
    /* La contrainte du défi voyage avec : le Studio doit savoir qu'une
       story flash s'arrête à sept secondes. Sans ça, la personne filme
       trente secondes et se fait refuser au retour. */
    try { racine.sessionStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    try { racine.localStorage.setItem(CLE_CTX, JSON.stringify(ctx)); } catch (e) {}
    emit('camera_open', ctx);

    /* Si le Studio est déjà dans cette page, on l'ouvre sans changer
       d'écran : c'est plus rapide et rien ne peut se perdre. */
    try {
      if (racine.NVStudio && typeof racine.NVStudio.open === 'function' &&
          typeof racine.NVStudio.tab === 'function') {
        racine.NVStudio.open(); racine.NVStudio.tab('video');
        return 'local';
      }
    } catch (e) {}
    try {
      if (racine.NVLien && typeof racine.NVLien.ouvrir === 'function') {
        racine.NVLien.ouvrir('NVCreate', ctx);
        return 'lien';
      }
    } catch (e) {}
    try {
      racine.location.href = base() + 'NV_MODULE_Create.html';
      return 'fichier';
    } catch (e) {}
    return 'aucun';   /* l'appelant reprend la main avec son propre enregistreur */
  }

  /* ── CÔTÉ STUDIO : d'où vient-on, et comment y retourner ──────────── */
  function contexte() {
    var t = null;
    try { t = racine.sessionStorage.getItem(CLE_CTX); } catch (e) {}
    if (!t) { try { t = racine.localStorage.getItem(CLE_CTX); } catch (e) {} }
    if (!t) return null;
    try {
      var c = JSON.parse(t);
      /* Un contexte vieux de plus d'une heure n'a plus de sens : la
         personne est passée à autre chose. On ne la renvoie pas dans un
         défi qu'elle a quitté. */
      if (!c || !c.quand || Date.now() - c.quand > 3600000) return null;
      return c;
    } catch (e) { return null; }
  }

  /* Le Studio appelle ceci quand la prise est terminée. */
  function rendre(blob, meta) {
    var c = contexte();
    if (!c) return Promise.resolve(false);
    var cle = 'prise_' + (c.module || 'defi') + '_' + (c.defi || 'x');
    return ranger(cle, {blob: blob, meta: meta || {}, ctx: c, at: Date.now()})
      .then(function (ok) {
        if (!ok) return false;
        emit('camera_done', {module: c.module, defi: c.defi || null,
                             secondes: (meta && meta.seconds) || null});

function dansTexte(iso){
  var d = new Date(iso).getTime(); if(!iso || isNaN(d)) return null;
  var m = Math.floor((d - Date.now()) / 60000); if(m < 0) return null;
  if(m < 1) return T('Commence dans un instant');
  if(m < 60) return T('Commence dans {0} min', m);
  if(m < 48 * 60) return T('Commence dans {0} h {1} min', Math.floor(m / 60), m % 60);
  return T('Commence dans {0} jours', Math.floor(m / 1440));
}
function dansHtml(x){
  if(x.etat !== 'programme') return '';
  var t = dansTexte(x.debut); if(!t) return '';
  var proche = new Date(x.debut).getTime() - Date.now() < 36e5;
  return '<p class="dans' + (proche ? ' proche' : '') + '" data-dans="' + esc(x.debut) + '">' + esc(t) + '</p>';
}
setInterval(function(){
  if(document.hidden) return;
  Array.prototype.forEach.call(document.querySelectorAll('[data-dans]'), function(e){
    var iso = e.getAttribute('data-dans'), t = dansTexte(iso);
    if(!t){ e.remove(); return; }
    if(e.textContent !== t) e.textContent = t;
    e.classList.toggle('proche', new Date(iso).getTime() - Date.now() < 36e5);
  });
}, 30000);
